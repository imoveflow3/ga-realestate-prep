<title>Georgia Real Estate Prep</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">

<a class="skip" href="#main">Skip to content</a>

<div class="shell">
  <aside class="side" id="side">
    <div class="side-head">
      <button class="wordmark" id="brand" title="Dashboard">
        <svg viewBox="0 0 512 512" aria-hidden="true" class="brandmark">
          <path d="M256 96 L432 236 L400 236 L400 404 L112 404 L112 236 L80 236 Z"
                fill="none" stroke="currentColor" stroke-width="34" stroke-linejoin="round"/>
        </svg>
        <span>Georgia Real Estate<small>Salesperson exam prep</small></span>
      </button>
      <button class="drawerclose" id="drawerClose" aria-label="Close menu">&times;</button>
    </div>

    <nav class="rail" aria-label="Sections">
      <div class="rail-in" id="rail">
        <p class="navgroup">Study</p>
        <button data-view="today" class="on" aria-current="page">Dashboard</button>
        <button data-view="plan" aria-current="false">Study plan</button>
        <button data-view="study" aria-current="false">Lessons</button>
        <button data-view="home" aria-current="false">Practice questions</button>
        <button data-view="dash" aria-current="false">Progress</button>

        <p class="navgroup">Practice tools</p>
        <button data-view="cards" aria-current="false">Flashcards</button>
        <button data-view="vocab" aria-current="false">Vocabulary</button>
        <button data-view="math" aria-current="false">Real estate math</button>
        <button data-view="weak" aria-current="false">Weak spots</button>
        <button data-view="notebook" aria-current="false">Notebook</button>
        <button data-view="saved" aria-current="false">Bookmarks</button>

        <p class="navgroup adminonly" hidden>Admin</p>
        <button data-view="admin" class="adminonly" hidden aria-current="false">Overview</button>
        <button data-view="users" class="adminonly" hidden aria-current="false">Users</button>

        <p class="navgroup">Account</p>
        <button data-view="setup" aria-current="false">Account settings</button>
        <button data-view="about" aria-current="false">About</button>
      </div>
    </nav>

    <div class="side-foot">
      <button class="iconbtn" id="themeBtn" title="Switch between light and dark">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="sun"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="moon"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
        <span id="themeLabel">Theme</span>
      </button>
      <button class="iconbtn" id="installBtn" hidden title="Install this app">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 20h16"/></svg>
        <span>Install</span>
      </button>
      <button class="iconbtn" id="shareBtn" title="Share this site">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 15V3m0 0 4 4m-4-4L8 7"/></svg>
        <span>Share</span>
      </button>
    </div>
  </aside>
  <div class="scrim" id="drawerScrim" hidden></div>

  <div class="col">
    <header class="hud">
      <div class="hud-in">
        <button class="menubtn" id="menuBtn" aria-label="Open menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <button class="btn" id="appBtn" hidden>Open the app</button>
        <div class="readouts" id="readouts"></div>
        <div class="profile" id="profile" hidden>
          <button class="profilebtn" id="profileBtn" aria-haspopup="menu"
                  aria-expanded="false">
            <span class="avatar" id="profileInitials">?</span>
            <span class="profilename" id="profileName">Account</span>
            <svg viewBox="0 0 24 24" aria-hidden="true" class="chev"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="profilemenu" id="profileMenu" role="menu" hidden></div>
        </div>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <section id="view-welcome" hidden></section>
      <section id="view-today"></section>
      <section id="view-dash" hidden></section>
      <section id="view-study" hidden></section>
      <section id="view-cards" hidden></section>
      <section id="view-vocab" hidden></section>
      <section id="view-home" hidden></section>
      <section id="view-notebook" hidden></section>
      <section id="view-saved" hidden></section>
      <section id="view-weak" hidden></section>
      <section id="view-math" hidden></section>
      <section id="view-quiz" hidden></section>
      <section id="view-result" hidden></section>
      <section id="view-plan" hidden></section>
      <section id="view-admin" hidden></section>
      <section id="view-users" hidden></section>
      <section id="view-setup" hidden></section>
      <section id="view-about" hidden></section>
    </main>

    <footer>
      <div class="footrow">
        <span id="bankcount"></span>
      </div>
      <div class="footrow footlinks">
        <button class="linkish" data-goto="about">About</button>
        <button class="linkish" data-goto="setup">Account settings</button>
        <a href="https://grec.state.ga.us" target="_blank" rel="noopener">GREC (official)</a>
        <span class="buildstamp">Updated __BUILD__</span>
      </div>
      <div class="footrow">
        <span>Practice material, not an official statement of Georgia law and not
          legal advice. Not affiliated with the Georgia Real Estate Commission or
          with any exam vendor. Verify current rules at grec.state.ga.us.</span>
      </div>
    </footer>
  </div>
</div>

<nav class="tabbar" id="tabbar" aria-label="Main">
  <button data-view="today">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    <span>Dashboard</span>
  </button>
  <button data-view="study">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5Z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5"/></svg>
    <span>Lessons</span>
  </button>
  <button data-view="home">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11.5 11 14l4.5-5"/><rect x="3.5" y="3.5" width="17" height="17" rx="3"/></svg>
    <span>Practice</span>
  </button>
  <button data-view="dash">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10m5 10V4m5 16v-7m5 7V8"/></svg>
    <span>Progress</span>
  </button>
  <button data-view="__more">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    <span>Menu</span>
  </button>
</nav>

<div class="sheet" id="moreSheet" hidden>
  <div class="sheet-scrim" id="sheetScrim"></div>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-label="More sections">
    <div class="sheet-grip"></div>
    <div class="sheet-list" id="sheetList"></div>
    <button class="btn ghost wide" id="sheetClose">Close</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
