<header class="hud">

    <div class="hudacts">
      <button class="btn" id="appBtn" hidden>Open the app</button>

        <span>Install</span>
      </button>
      <button class="iconbtn" id="shareBtn" title="Share this site">

        <span id="themeLabel">Theme</span>
      </button>
    </div>
  </div>
</header>
