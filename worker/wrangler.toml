# Cloudflare Worker: sales page in public/, the paid app behind the gate.
#
# First run:
#   npm  install -g wrangler
#   wrangler login
#   wrangler d1 create ga-prep
#     -> paste the database_id it prints into the [[d1_databases]] block below
#   wrangler d1 execute ga-prep --remote --file=./schema.sql
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put STRIPE_WEBHOOK_SECRET
#   wrangler secret put SESSION_SECRET      # any long random string
#   wrangler secret put RESEND_API_KEY      # optional: sign-in codes by email
#   wrangler deploy

name = "ga-prep"
main = "src/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true          # the Worker decides what is public
# An unknown path gets the site's own 404 page rather than a bare Cloudflare
# one, so a mistyped link still looks like somewhere you meant to be.
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "ga-prep"
database_id = "PASTE_YOUR_DATABASE_ID_HERE"

[vars]
PRICE_CENTS = "1900"
PRODUCT_NAME = "Georgia Real Estate Exam Prep"
SITE_URL = "https://ga-prep.YOUR-SUBDOMAIN.workers.dev"
FROM_EMAIL = "login@yourdomain.com"
