/* the preview banner: unmistakably not the live site */
.previewbar{
  background:var(--caution-soft); color:var(--ink);
  border:1px solid color-mix(in srgb, var(--caution) 35%, transparent);
  border-radius:var(--r-sm); padding:.7rem 1rem; margin-bottom:1rem;
  font-size:.92rem; line-height:1.5;
}
.previewbar b{color:var(--caution); letter-spacing:.02em}

/* ======================================================================
   The minimal front door: sign up, sign in, pay, and nothing else.
   ====================================================================== */
.gatewrap{display:grid; place-items:center; min-height:min(68vh, 34rem);
  padding:2rem 0 1rem}
.gatecard{
  width:100%; max-width:30rem; text-align:center; background:var(--panel);
  border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow-lift);
  padding:2.6rem 2rem 2.1rem; display:flex; flex-direction:column;
  align-items:center; gap:.85rem; position:relative; overflow:hidden;
}
.gatecard::before{content:""; position:absolute; inset:0 0 auto; height:3px;
  background:linear-gradient(90deg,var(--accent),var(--brass))}
.gatemark{width:3.2rem; height:3.2rem; color:var(--accent); margin-bottom:.1rem}
.gatemark svg{width:100%; height:100%}
.gatecard h1{font-size:1.85rem; line-height:1.12; max-width:16ch}
.gatecard h1 em{font-style:normal; color:var(--accent)}
.gatelede{font-size:.98rem; line-height:1.55; color:var(--ink-2); max-width:38ch}
.gateprice{display:flex; flex-direction:column; gap:.1rem; margin:.35rem 0 .1rem}
.gateprice .amount{font-family:var(--mono);
  font-variant-numeric:tabular-nums; font-size:2.9rem; font-weight:600;
  letter-spacing:-.04em; line-height:1}
.gateprice .once{font-size:.82rem; color:var(--ink-3)}
.gateacts{display:flex; flex-direction:column; gap:.55rem; width:100%;
  max-width:22rem; margin-top:.3rem}
.gateacts .btn{padding:.85rem 1.2rem; font-size:1.02rem; border-radius:var(--r-sm)}
.gatefine{font-size:.85rem; color:var(--ink-3); max-width:34ch; line-height:1.5}
.gatecard .gatenote{text-align:left; margin-bottom:.4rem}

/* The state screen: Start studying asks which state before the app opens. */
.statecard .statefield{width:100%; max-width:22rem; text-align:left; margin-top:.4rem}
.statecard select{width:100%; min-height:48px; padding:.6rem .8rem; font-size:1rem;
  background:var(--panel); color:var(--ink); border:1px solid var(--line-2);
  border-radius:var(--r-sm); cursor:pointer}
.statecard select:focus{outline:none; border-color:var(--accent);
  box-shadow:0 0 0 3px var(--glow)}
.statenote{margin:0; max-width:22rem; font-size:.84rem; line-height:1.5;
  color:var(--ink-2); text-align:left}
.statenote:empty{display:none}
.statecard .gateacts .btn{min-height:48px}
.statecard .btn:disabled{opacity:.45; cursor:not-allowed}
.statefactswrap:empty{display:none}
.statefactswrap{width:100%; max-width:22rem}
.statefacts{text-align:left; background:var(--panel-2); border:1px solid var(--line);
  border-radius:var(--r-sm); padding:.75rem .9rem .6rem}
.statefacts dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:.35rem .9rem}
.statefacts dt{font-size:.74rem; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
  color:var(--ink-3); padding-top:.12rem; white-space:nowrap}
.statefacts dd{margin:0; font-size:.88rem; line-height:1.4; color:var(--ink)}
.statefacts dd small{display:block; font-size:.76rem; color:var(--ink-3); margin-top:.1rem}
.statelinks{margin:.55rem 0 0; font-size:.78rem; color:var(--ink-3)}
.statelinks a{color:var(--accent)}
/* A tall fact card scrolls inside the screen, never off it: auto margins
   centre the card when it fits and let it start at the top when it does not
   (plain centring would push its top out of reach). */
body.onescreen .statewrap{overflow-y:auto; display:flex; flex-direction:column}
body.onescreen .statewrap .statecard{margin:auto; flex:0 0 auto}
.statecard{gap:.7rem}
.statecard h1{font-size:1.6rem}
/* On the state screen the small print takes its own strip under the card
   instead of floating over it, so it can never sit on top of Continue. */
body.onescreen:has(.statewrap) footer{position:static; flex:0 0 auto; max-width:none;
  padding:.5rem var(--s5) .6rem; border-top:1px solid var(--line); background:var(--bg)}
body.onescreen .statewrap{padding-bottom:1.2rem}
body.onescreen .statewrap{flex:1 1 auto; min-height:0; width:100%;
  padding:1rem var(--s5) 5rem}
@media (max-width:980px){
  body.onescreen .statewrap{padding:1rem .85rem}
}

/* The 3D study machine as the front page itself (home.js mountHero): the
   scene fills the first screen edge to edge and the card's words sit on it,
   left, with the machine framed into the right of the frame. On a phone the
   words come first and the machine follows in the same block. If three.js
   never arrives, mountHero drops .has3d and the plain card comes back. */
main:has(.gatewrap.has3d)>section{max-width:none}
.gatewrap.has3d{position:relative; isolation:isolate; overflow:hidden;
  margin:calc(-1 * var(--s6)) calc(-1 * var(--s5)) 0;
  min-height:calc(100svh - 57px); padding:var(--s7) clamp(1.5rem, 5vw, 4.5rem);
  display:grid; grid-template-columns:minmax(0,31rem); align-content:center;
  place-items:center start; border-bottom:1px solid var(--line);
  background:
    radial-gradient(60rem 36rem at 72% 42%, var(--accent-soft) 0%, transparent 70%),
    radial-gradient(40rem 24rem at 10% 100%, var(--brass-soft) 0%, transparent 70%),
    var(--bg)}
.gatewrap.has3d::after{content:""; position:absolute; inset:auto 0 0; height:3px;
  background:linear-gradient(90deg,var(--accent),var(--brass)); z-index:3}
/* The card stops being a card: no box, words straight on the scene. */
.gatewrap.has3d .gatecard{position:relative; z-index:2; max-width:31rem;
  text-align:left; align-items:flex-start; background:none; border:0;
  box-shadow:none; padding:0; overflow:visible}
.gatewrap.has3d .gatecard::before{display:none}
.gatewrap.has3d .gatecard h1{font-size:clamp(2.2rem, 3.6vw, 3.3rem);
  line-height:1.04; letter-spacing:-.02em; max-width:15ch}
.gatewrap.has3d .gatelede{font-size:clamp(1rem, 1.4vw, 1.14rem); max-width:40ch}
.gatewrap.has3d .gateacts{max-width:20rem}
.gatewrap.has3d .gatefine{max-width:40ch}
.gatewrap.has3d .preview{max-width:28rem}
.hero3d{position:absolute; inset:0; z-index:1}
.hero3d-scene{position:absolute; inset:0; opacity:0; transition:opacity .9s var(--ease)}
.hero3d.ready .hero3d-scene{opacity:1}
.hero3d-scene canvas{display:block; width:100%; height:100%; outline:none}
/* Zoom in or focus a station and the machine fills the frame; this fade keeps
   the words on the left readable over it. Wide screens only -- on a phone the
   words sit above the machine, not on it. */
@media (min-width:981px){
  .hero3d::after{content:""; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:linear-gradient(90deg,
      var(--bg) 0%,
      color-mix(in srgb, var(--bg) 82%, transparent) 26%,
      color-mix(in srgb, var(--bg) 35%, transparent) 40%,
      transparent 52%)}
}
/* Under the machine, centred on the part of the frame it occupies. */
.hero3d-steps{position:absolute; left:42%; right:0; bottom:1.6rem; z-index:2;
  display:flex; flex-wrap:wrap; justify-content:center; gap:.35rem; padding:0 1rem;
  opacity:0; transition:opacity .5s var(--ease) .2s}
.hero3d.ready .hero3d-steps{opacity:1}
.hero3d-step{flex:0 0 auto; display:inline-flex; align-items:center; gap:.4rem;
  font:500 .8rem/1 var(--ui); color:var(--ink-2); cursor:pointer;
  padding:.55rem .78rem; border-radius:var(--r-pill);
  border:1px solid var(--line);
  background:color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  transition:background .2s, color .2s, border-color .2s}
.hero3d-step .no{font:600 .68rem/1 var(--mono); color:var(--ink-3)}
.hero3d-step:hover{color:var(--ink); border-color:color-mix(in srgb, var(--accent) 40%, var(--line))}
.hero3d-step.live .no{color:var(--brass)}
.hero3d-step.live{border-color:color-mix(in srgb, var(--brass) 55%, var(--line))}
.hero3d-step[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink);
  border-color:var(--accent)}
.hero3d-step[aria-pressed="true"] .no{color:inherit; opacity:.75}
.hero3d-tip{position:absolute; z-index:3; pointer-events:none; max-width:14rem;
  padding:.6rem .75rem; border-radius:var(--r-sm); background:var(--panel);
  border:1px solid var(--line); box-shadow:var(--shadow-lift);
  opacity:0; transition:opacity .15s}
.hero3d-tip.on{opacity:1}
.hero3d-tip strong{display:block; font:600 .82rem/1.2 var(--ui); color:var(--ink);
  white-space:pre}
.hero3d-tip p{margin:.3rem 0 0; font-size:.78rem; line-height:1.45; color:var(--ink-2)}

/* Narrow: words, then the machine below them, still one block. */
@media (max-width:980px){
  .gatewrap.has3d{min-height:0; padding:var(--s6) var(--s5) 0; gap:var(--s4);
    grid-template-columns:minmax(0,1fr); place-items:start stretch}
  .gatewrap.has3d .gatecard{max-width:36rem}
  .hero3d{position:relative; inset:auto; height:clamp(20rem, 72vw, 30rem);
    margin:0 calc(-1 * var(--s5))}
  .hero3d-steps{left:0; bottom:1rem}
}
@media (max-width:860px){
  .gatewrap.has3d{margin:-1rem -.85rem 0; padding:1.6rem 1.1rem 0}
  .gatewrap.has3d .hero3d{margin:0 -1.1rem}
}
@media (max-width:560px){
  .hero3d-steps{flex-wrap:nowrap; justify-content:flex-start; overflow-x:auto;
    scrollbar-width:none; bottom:.7rem}
  .hero3d-steps::-webkit-scrollbar{display:none}
  .hero3d-step:first-child{margin-left:auto}
  .hero3d-step:last-child{margin-right:auto}
  /* thumb-sized: a 40px-tall target, not a 30px one */
  .hero3d-step{padding:.5rem .7rem; font-size:.78rem; min-height:40px}
}
@media (prefers-reduced-motion:reduce){
  .hero3d-scene, .hero3d-steps{transition:none}
}

/* One screen, no scrolling (body.onescreen, set by mountHero while it fits):
   the header, the scene and the small print share exactly the window. The
   machine's stage is the part that gives -- it takes whatever height the
   words leave. If the words alone will not fit, home.js drops the class and
   the page scrolls like any other rather than cutting anything off. */
body.onescreen{height:100vh; height:100svh; overflow:hidden;
  display:flex; flex-direction:column;
  /* the front door has no tab bar to clear, only the home indicator */
  padding-bottom:env(safe-area-inset-bottom)}
body.onescreen header.hud{flex:0 0 auto}
body.onescreen main{flex:1 1 auto; min-height:0; padding:0; display:flex}
body.onescreen main>section{flex:1 1 auto; min-height:0; gap:0}
body.onescreen .gatewrap.has3d{flex:1 1 auto; min-height:0; margin:0;
  padding-bottom:calc(var(--s7) + 2.5rem)}
/* The small print: GREC, the build date and the disclaimer, bottom left. */
body.onescreen footer{position:fixed; z-index:5; left:clamp(1.5rem, 5vw, 4.5rem);
  bottom:.85rem; max-width:min(31rem, 40vw); padding:0; gap:.15rem;
  font-size:.66rem; line-height:1.45; color:var(--ink-3)}
body.onescreen .footrow span{max-width:none}
body.onescreen .footlinks{gap:.75rem}
body.onescreen .buildstamp{font-size:.62rem}
/* Lock the window itself too, and stop a Mac trackpad's rubber-band bounce. */
html:has(body.onescreen){overflow:hidden; overscroll-behavior:none}
body.onescreen{overscroll-behavior:none}
body.onescreen .hero3d-scene canvas{cursor:grab}
body.onescreen .hero3d-scene canvas:active{cursor:grabbing}
/* Shorter laptop windows: shed the extras so the words never meet the small print. */
@media (max-height:780px) and (min-width:981px){
  body.onescreen .gatewrap.has3d .preview{display:none}
}
@media (max-height:620px) and (min-width:981px){
  body.onescreen .gatewrap.has3d .gatemark,
  body.onescreen .gatewrap.has3d .gatefine{display:none}
  body.onescreen .gatewrap.has3d{padding-top:var(--s5)}
  body.onescreen .gatewrap.has3d .gatecard h1{font-size:clamp(1.9rem, 3vw, 2.6rem)}
}
@media (max-width:980px){
  /* Words on top, machine filling the middle, small print at the foot. */
  body.onescreen .gatewrap.has3d{display:flex; flex-direction:column;
    align-items:stretch; padding:1.1rem var(--s5) 0; gap:.6rem}
  body.onescreen .gatewrap.has3d .gatecard{flex:0 0 auto; gap:.55rem}
  body.onescreen .gatewrap.has3d .hero3d{flex:1 1 auto; height:auto; min-height:9rem}
  body.onescreen .gatewrap.has3d .preview,
  body.onescreen .gatewrap.has3d .gatemark{display:none}
  body.onescreen .gatewrap.has3d .gatecard h1{font-size:clamp(1.65rem, 7.4vw, 2.4rem)}
  body.onescreen .gatewrap.has3d .gatelede{font-size:.92rem; line-height:1.45}
  body.onescreen .gatewrap.has3d .gateacts{max-width:none}
  body.onescreen .gatewrap.has3d .gatefine{font-size:.78rem}
  body.onescreen footer{position:static; flex:0 0 auto; max-width:none;
    padding:.5rem var(--s5) .6rem; font-size:.6rem; line-height:1.4;
    border-top:1px solid var(--line); background:var(--bg)}
  body.onescreen .buildstamp{font-size:.58rem}
  body.onescreen .gatewrap.has3d::after{display:none}
}
@media (max-width:860px){
  body.onescreen .gatewrap.has3d{padding:1rem 1.1rem 0}
  body.onescreen footer{padding:.45rem 1.1rem .55rem}
}

@media (max-width:860px){
  .gatewrap{min-height:auto; padding:1.2rem 0 .5rem}
  .gatecard{padding:2rem 1.25rem 1.7rem}
  .gatecard h1{font-size:1.6rem}
  .gateprice .amount{font-size:2.4rem}
}

/* ======================================================================
   Arriving and leaving.

   A refresh should look composed rather than like something dropped on the
   floor, and stepping into the app should read as one move, not two pages.
   ====================================================================== */

/* The wordmark is on both documents, so the browser can carry it across
   instead of redrawing it. Everything else cross-fades around it. */
header.hud .wordmark{view-transition-name:sitemark}

::view-transition-old(root),
::view-transition-new(root){animation-duration:.34s; animation-timing-function:var(--ease)}
::view-transition-old(sitemark),
::view-transition-new(sitemark){animation-duration:.34s}

/* Arrival. Content fades up while the header and rail stay put, so the join
   reads as one move. It sits on main, not body, because an animation on body
   would outrank the leaving transition below and the exit would never play. */
@keyframes arrive{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
main{animation:arrive .3s var(--ease) both}

/* Entrance. The card and the app's first view rise in rather than appearing. */
@keyframes pagein{
  from{opacity:0; transform:translateY(10px) scale(.994)}
  to{opacity:1; transform:none}
}
.gatecard{animation:pagein .44s var(--ease) both}
.gatewrap .gatecard{animation-delay:.02s}

/* Exit, for browsers with no cross-document transition: fade the page down
   before the navigation rather than letting it sit there looking stuck. */
body.leaving{
  opacity:0; transform:scale(.99);
  transition:opacity .2s var(--ease), transform .2s var(--ease);
}

@media (prefers-reduced-motion:reduce){
  @view-transition{navigation:none}
  main,.gatecard{animation:none}
  body.leaving{transition:none; opacity:1; transform:none}
}

/* ---- sign in with Google ---- */
.btn.gbtn{
  display:inline-flex; align-items:center; justify-content:center; gap:.65rem;
  background:var(--panel); color:var(--ink); border-color:var(--line-2);
  font-weight:600;
}
.btn.gbtn:hover:not(:disabled){background:var(--panel-2); border-color:var(--line-2);
  box-shadow:0 4px 14px -6px rgba(0,0,0,.35)}
/* Google's mark carries its own four colours as inline fills. Do not set
   fill on it -- an earlier `fill:inherit` here tinted the whole logo to the
   button's text colour, which is both wrong and against their brand rules. */
.gmark{width:1.15rem; height:1.15rem; flex:0 0 auto}

.whoami{
  font-family:var(--mono); font-size:.82rem; color:var(--ink-2);
  background:var(--panel-2); border:1px solid var(--line);
  border-radius:var(--r-pill); padding:.3rem .85rem; max-width:100%;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.gatecard .linkish{font-size:.86rem; color:var(--ink-3)}
.gatecard .linkish:hover{color:var(--accent)}

/* ---- sign up / log in ---- */
.gatepair{display:grid; grid-template-columns:1fr 1fr; gap:.55rem}
.gatepair .btn{width:100%}
.orline{display:flex; align-items:center; gap:.7rem; color:var(--ink-3);
  font-size:.8rem; margin:.15rem 0}
.orline::before,.orline::after{content:""; flex:1; height:1px; background:var(--line)}
.authnote{font-size:.87rem; color:var(--ink-3); line-height:1.45; margin-top:.6rem;
  min-height:1.2em}
.authnote.bad{color:var(--no)}
.sheet-card h2{margin-bottom:.1rem}
.sheet-card .sub{margin-bottom:.9rem}
.sheet-card label{margin-top:.7rem}
.sheet-card .muted{margin-top:.4rem; line-height:1.45}

/* ======================================================================
   The entrance. A splash, not a title sequence: the mark settles, the name
   appears, it lifts. Under a second, and skippable.
   ====================================================================== */

.intro{
  position:fixed; inset:0; z-index:100; background:var(--bg);
  display:grid; place-items:center; cursor:pointer;
}
.intro[hidden]{display:none !important}

.intro-mark{
  width:64px; height:64px; color:var(--accent);
  animation:markin .62s cubic-bezier(.22,.9,.24,1) both;
}
.intro-mark svg{width:100%; height:100%}
@keyframes markin{
  from{opacity:0; transform:scale(.88)}
  to{opacity:1; transform:none}
}
.intro-word{
  position:absolute; left:0; right:0; top:calc(50% + 58px); text-align:center;
  color:var(--ink-3); font-family:var(--ui); font-weight:500; font-size:.86rem;
  letter-spacing:.1em;
  opacity:0; animation:wordin .5s var(--ease) .26s both;
}
@keyframes wordin{from{opacity:0} to{opacity:.9}}

.intro.done{animation:introout .4s var(--ease) both; pointer-events:none}
@keyframes introout{from{opacity:1} to{opacity:0}}

body.intro-running main,
body.intro-running header.hud,
body.intro-running .side,
body.intro-running footer{opacity:0}
body.intro-done main,
body.intro-done header.hud,
body.intro-done footer{animation:settle .42s var(--ease) both}
@keyframes settle{from{opacity:0} to{opacity:1}}

/* Nobody who has asked for less motion gets flown through space. */
@media (prefers-reduced-motion:reduce){
  .intro{display:none !important}
  body.intro-running main,
  body.intro-running header.hud,
  body.intro-running .side,
  body.intro-running footer{opacity:1}
  body.intro-done main,
  body.intro-done header.hud,
  body.intro-done footer{animation:none}
}

/* ---- shell on small screens: drawer plus bottom bar ---- */
@media (max-width:1000px){
  .shell{display:block}
  .side{
    position:fixed; top:0; bottom:0; left:0; z-index:60; height:100dvh;
    transform:translateX(-100%); transition:transform .22s var(--ease);
    box-shadow:none;
  }
  body.drawer-open .side{transform:none; box-shadow:var(--shadow-lift)}
  body.drawer-open .scrim{display:block; position:fixed; inset:0; z-index:55;
    background:rgba(24,34,44,.38)}
  .drawerclose{display:block; background:none; border:0; font-size:1.6rem;
    line-height:1; color:var(--ink-3); cursor:pointer; padding:0 .2rem}
  .menubtn{
    display:inline-grid; place-items:center; width:38px; height:38px;
    background:none; border:1px solid var(--line); border-radius:var(--r-sm);
    color:var(--ink-2); cursor:pointer;
  }
  .menubtn svg{width:1.15rem; height:1.15rem; fill:none; stroke:currentColor;
    stroke-width:1.8; stroke-linecap:round}
  .hud-in{padding:var(--s2) var(--s4); gap:var(--s3)}
  main{padding:var(--s5) var(--s4) var(--s6); gap:var(--s4)}
  footer{padding:0 var(--s4) var(--s5)}
  body{padding-bottom:calc(58px + env(safe-area-inset-bottom))}
}

/* ======================================================================
   Shared components. One page header, one list row, one empty state, one
   bookmark control -- reused everywhere rather than restyled per page.
   ====================================================================== */

.pagehead{
  display:flex; align-items:flex-start; justify-content:space-between;
  gap:var(--s4); flex-wrap:wrap; padding-bottom:var(--s4);
  border-bottom:1px solid var(--line);
}
.ph-text{display:flex; flex-direction:column; gap:var(--s2); min-width:0}
.ph-sub{font-size:.95rem; line-height:1.6; color:var(--ink-2); max-width:60ch}
.ph-acts{display:flex; gap:var(--s2); flex-wrap:wrap; flex:0 0 auto}

.emptystate{
  display:flex; flex-direction:column; align-items:flex-start; gap:var(--s3);
  padding:var(--s5) 0;
}
.emptystate h3{font-size:1.05rem}
.emptystate p{font-size:.94rem; line-height:1.6; color:var(--ink-2); max-width:56ch}

/* a list of things to open: the shape most of this app should be */
.rowlist{display:flex; flex-direction:column}
.listrow{
  display:flex; align-items:center; justify-content:space-between; gap:var(--s4);
  padding:var(--s3) 0; border-bottom:1px solid var(--line); flex-wrap:wrap;
}
.listrow:last-child{border-bottom:0}
.lr-main{flex:1; min-width:min(100%,16rem)}
.lr-title{display:flex; align-items:center; gap:var(--s2); font-weight:600;
  font-size:.98rem; color:var(--ink)}
.lr-sub{font-size:.85rem; color:var(--ink-3); margin-top:2px; line-height:1.5}
.lr-acts{display:flex; gap:var(--s2); align-items:center; flex:0 0 auto}

.bookmark{
  display:inline-flex; align-items:center; gap:.35rem; background:none;
  border:1px solid var(--line-2); border-radius:var(--r-sm); cursor:pointer;
  color:var(--ink-3); font-family:var(--ui); font-size:.8rem; font-weight:500;
  padding:.3rem .55rem; min-height:32px;
  transition:color .12s var(--ease), border-color .12s var(--ease);
}
.bookmark svg{width:.95rem; height:.95rem}
.bookmark:hover{color:var(--accent); border-color:var(--accent)}
.bookmark.on{color:var(--accent); border-color:var(--accent); background:var(--accent-soft)}

/* breadcrumbs: where you are, said plainly */
.crumbs{display:flex; align-items:center; gap:var(--s2); font-size:.82rem;
  color:var(--ink-3); margin-bottom:var(--s1)}
.crumbs .linkish{font-size:.82rem; color:var(--ink-3); text-decoration:none}
.crumbs .linkish:hover{color:var(--accent); text-decoration:underline}
.crumbs .sep{color:var(--line-2)}

/* ---- the welcome card, restrained ---- */
.gatecard{
  max-width:34rem; text-align:left; align-items:flex-start; gap:var(--s3);
  padding:var(--s6) var(--s6) var(--s5); box-shadow:var(--shadow-lift);
}
.gatecard::before{display:none}
.gatemark{width:2.2rem; height:2.2rem; margin-bottom:var(--s1)}
.gatecard h1{font-size:1.6rem; line-height:1.25; max-width:26ch}
.gatelede{font-size:1rem; line-height:1.6; max-width:52ch; color:var(--ink-2)}
.gateacts{align-items:stretch; max-width:22rem; margin-top:var(--s2)}
.gateprice{align-items:flex-start; text-align:left}
.gateprice .amount{font-size:2rem}
.gatefine{text-align:left; max-width:46ch}

/* what you get: four lines, no cards */
.preview{
  list-style:none; margin:var(--s4) 0 0; padding:var(--s4) 0 0;
  border-top:1px solid var(--line); display:grid; gap:var(--s2); width:100%;
}
.preview li{display:flex; gap:var(--s2); align-items:baseline; font-size:.9rem}
.preview b{font-weight:600; color:var(--ink); min-width:9.5rem; flex:0 0 auto}
.preview span{color:var(--ink-3); line-height:1.5}
@media (max-width:560px){
  .gatecard{padding:var(--s5) var(--s4)}
  .preview li{flex-direction:column; gap:1px}
  .preview b{min-width:0}
}

/* ======================================================================
   The authentication page. One card, two tabs, visible labels, and every
   error sitting under the field it belongs to.
   ====================================================================== */

.authwrap{display:grid; place-items:center; min-height:min(72vh,40rem); padding:var(--s5) 0}
.authcard{
  width:100%; max-width:27rem; background:var(--panel);
  border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow-lift); padding:var(--s6) var(--s5) var(--s5);
  display:flex; flex-direction:column; gap:var(--s3);
}
.authcard .gatemark{width:2rem; height:2rem; color:var(--accent); margin:0 0 var(--s1)}
.authcard h1{font-size:1.35rem}

.authtabs{display:grid; grid-template-columns:1fr 1fr; gap:2px; padding:3px;
  background:var(--panel-2); border:1px solid var(--line); border-radius:var(--r-sm)}
.authtab{
  font-family:var(--ui); font-size:.9rem; font-weight:600; padding:.5rem;
  background:none; border:0; border-radius:var(--r-xs); color:var(--ink-3);
  cursor:pointer; transition:background .14s var(--ease), color .14s var(--ease);
}
.authtab:hover{color:var(--ink)}
.authtab.on{background:var(--panel); color:var(--accent); box-shadow:var(--shadow)}

.authform{display:flex; flex-direction:column; gap:var(--s3)}
.field{display:flex; flex-direction:column; gap:.3rem}
.field label{margin:0; text-transform:none; letter-spacing:0; font-size:.85rem;
  font-weight:600; color:var(--ink)}
.inputwrap{position:relative; display:flex}
.inputwrap input{flex:1; padding:.6rem .7rem; font-size:.95rem; min-height:44px}
.field.bad input{border-color:var(--no)}
.field.bad input:focus{box-shadow:0 0 0 3px rgba(163,43,51,.16)}
.fieldhint{font-size:.8rem; color:var(--ink-3); line-height:1.45}
.fielderr{font-size:.82rem; color:var(--no); line-height:1.45; font-weight:500}

.peek{
  position:absolute; right:4px; top:50%; transform:translateY(-50%);
  background:none; border:0; color:var(--ink-3); font-family:var(--ui);
  font-size:.78rem; font-weight:600; cursor:pointer; padding:.35rem .5rem;
  border-radius:var(--r-xs); min-height:34px;
}
.peek:hover{color:var(--accent); background:var(--panel-2)}

.checkfield{margin-top:var(--s1)}
.checkline{display:flex; align-items:flex-start; gap:.6rem; cursor:pointer;
  font-size:.88rem; font-weight:400; line-height:1.5; color:var(--ink-2);
  text-transform:none; letter-spacing:0}
.checkline input{width:1.05rem; height:1.05rem; margin-top:.15rem; flex:0 0 auto}
.checkline a{color:var(--accent)}

.authbanner{
  border-radius:var(--r-sm); padding:.7rem .85rem; font-size:.88rem; line-height:1.5;
  border:1px solid var(--line); background:var(--panel-2);
  display:flex; flex-direction:column; gap:var(--s2); align-items:flex-start;
}
.authbanner.good{border-color:color-mix(in srgb,var(--ok) 40%,transparent);
  background:var(--ok-soft); color:var(--ink)}
.authbanner.warn{border-color:color-mix(in srgb,var(--caution) 45%,transparent);
  background:var(--caution-soft); color:var(--ink)}
.authbanner.bad{border-color:color-mix(in srgb,var(--no) 40%,transparent);
  background:var(--no-soft); color:var(--ink)}
.authform .linkish{align-self:flex-start; font-size:.85rem}

@media (max-width:560px){
  .authwrap{min-height:auto; padding:var(--s4) 0}
  .authcard{padding:var(--s5) var(--s4) var(--s4); max-width:none}
}

/* verification status, shown as a state not a decoration */
.statuspill{
  font-family:var(--ui); font-size:.72rem; font-weight:600; letter-spacing:.02em;
  padding:.2rem .6rem; border-radius:var(--r-pill); white-space:nowrap;
  border:1px solid transparent;
}
.statuspill.ok{background:var(--ok-soft); color:var(--ok);
  border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.statuspill.warn{background:var(--caution-soft); color:var(--caution);
  border-color:color-mix(in srgb,var(--caution) 35%,transparent)}

/* ======================================================================
   The profile control, and the admin surfaces behind it.
   ====================================================================== */

.profile{position:relative; margin-left:var(--s3); flex:0 0 auto}
.profilebtn{
  display:flex; align-items:center; gap:var(--s2); background:none;
  border:1px solid var(--line); border-radius:var(--r-pill);
  padding:.28rem .6rem .28rem .3rem; cursor:pointer; color:var(--ink);
  font-family:var(--ui); font-size:.88rem; font-weight:500; min-height:38px;
  transition:border-color .14s var(--ease), background .14s var(--ease);
}
.profilebtn:hover{border-color:var(--line-2); background:var(--panel-2)}
.avatar{
  width:28px; height:28px; border-radius:50%; flex:0 0 auto; display:grid;
  place-items:center; background:var(--accent); color:var(--accent-ink);
  font-size:.74rem; font-weight:700; letter-spacing:.02em;
}
.profilename{max-width:10rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.profilebtn .chev{width:1rem; height:1rem; fill:none; stroke:currentColor;
  stroke-width:2; stroke-linecap:round; stroke-linejoin:round; color:var(--ink-3)}

.profilemenu{
  position:absolute; right:0; top:calc(100% + 6px); z-index:40; min-width:15rem;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow-lift); padding:var(--s2); display:flex;
  flex-direction:column; gap:1px;
}
.profilemenu[hidden]{display:none}
.pm-head{padding:var(--s2) var(--s2) var(--s3); border-bottom:1px solid var(--line);
  margin-bottom:var(--s1); display:flex; flex-direction:column; gap:.2rem}
.pm-name{font-weight:600; font-size:.94rem}
.pm-email{font-family:var(--mono); font-size:.76rem; color:var(--ink-3);
  overflow:hidden; text-overflow:ellipsis}
.pm-role{margin-top:.35rem; align-self:flex-start}
.profilemenu button{
  text-align:left; background:none; border:0; border-radius:var(--r-sm);
  padding:.45rem var(--s2); font-family:var(--ui); font-size:.9rem;
  color:var(--ink-2); cursor:pointer;
}
.profilemenu button:hover{background:var(--panel-2); color:var(--ink)}
.profilemenu button.danger{color:var(--no)}

/* admin tables */
.adminstats{display:grid; gap:var(--s3); grid-template-columns:repeat(auto-fit,minmax(9rem,1fr))}
.astat{background:var(--panel-2); border:1px solid var(--line); border-radius:var(--r-sm);
  padding:var(--s3) var(--s4)}
.astat .n{font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:1.7rem; font-weight:600; line-height:1.1; letter-spacing:-.02em}
.astat .l{font-size:.78rem; color:var(--ink-3); margin-top:.15rem}
.usertable td.who{min-width:12rem}
.usertable .uemail{font-family:var(--mono); font-size:.78rem; color:var(--ink-3)}
.searchrow{display:flex; gap:var(--s2); align-items:center; flex-wrap:wrap}
.searchrow input{max-width:20rem}

@media (max-width:1000px){
  .profilename,.profilebtn .chev{display:none}
  .profilebtn{padding:.28rem; border-radius:50%}
  .profilemenu{right:0; min-width:14rem}
}

/* ---- account settings: the folded-away, rarely-wanted controls -------
   Changing a password and deleting an account are both things people do
   once. They are collapsed so they do not crowd the page, and the
   destructive one is coloured so it cannot be mistaken for the others. */
.acctfold{
  margin-top:var(--s4); border:1px solid var(--line);
  border-radius:var(--r); background:var(--panel-2);
}
.acctfold>summary{
  cursor:pointer; padding:var(--s3) var(--s4);
  font-weight:600; color:var(--ink); list-style:none;
  display:flex; align-items:center; gap:var(--s2);
}
.acctfold>summary::-webkit-details-marker{display:none}
.acctfold>summary::before{
  content:""; width:.5rem; height:.5rem; flex:none;
  border-right:2px solid var(--ink-3); border-bottom:2px solid var(--ink-3);
  transform:rotate(-45deg); transition:transform .15s ease;
}
.acctfold[open]>summary::before{transform:rotate(45deg)}
.acctfold>summary:hover{color:var(--accent)}
.acctfold>summary:focus-visible{
  outline:2px solid var(--accent); outline-offset:-2px; border-radius:var(--r);
}
.acctfold>div{padding:0 var(--s4) var(--s4)}
.acctrule{border:0; border-top:1px solid var(--line); margin:var(--s5) 0 var(--s4)}
.acctdanger{
  font-family:var(--display); font-size:1.05rem; margin:0 0 var(--s2);
  color:#8c2f22;
}
button.btn.danger{
  background:#8c2f22; border-color:#8c2f22; color:#fff;
}
button.btn.danger:hover:not(:disabled){background:#73271c; border-color:#73271c}
@media (prefers-color-scheme:dark){
  :root[data-theme="auto"] .acctdanger{color:#f0a496}
  :root[data-theme="auto"] button.btn.danger{
    background:#a8402f; border-color:#a8402f;
  }
}
:root[data-theme="dark"] .acctdanger{color:#f0a496}
:root[data-theme="dark"] button.btn.danger{background:#a8402f; border-color:#a8402f}

/* ---- lesson contents and the step from one lesson to the next --------
   A lesson runs long. The contents list turns it into something you can
   navigate, and the pair of steps at the bottom means reading straight
   through never goes back out to an index. */
.toc{
  margin-top:var(--s4); padding-top:var(--s4);
  border-top:1px solid var(--line);
}
.toclabel{
  font-size:.72rem; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-3); margin-bottom:var(--s2);
}
.toclist{
  margin:0; padding:0; list-style:none;
  display:grid; gap:var(--s1) var(--s4);
  grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
  counter-reset:toc;
}
.toclist li{counter-increment:toc}
.toclist a{
  display:block; padding:var(--s1) 0; color:var(--ink-2);
  text-decoration:none; font-size:.92rem; line-height:1.35;
}
.toclist a::before{
  content:counter(toc) ". "; color:var(--ink-3); font-variant-numeric:tabular-nums;
}
.toclist a:hover{color:var(--accent); text-decoration:underline}
.toclist a:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.lessonnav{
  display:grid; gap:var(--s3); margin-top:var(--s4);
  grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));
}
.lessonstep{
  display:flex; flex-direction:column; gap:var(--s1);
  padding:var(--s3) var(--s4); text-align:left;
  background:var(--panel); border:1px solid var(--line);
  border-radius:var(--r); cursor:pointer; font:inherit; color:inherit;
}
.lessonstep:hover{border-color:var(--accent); background:var(--panel-2)}
.lessonstep:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.lessonstep.next{text-align:right}
.ls-dir{
  font-size:.72rem; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-3);
}
.ls-name{font-family:var(--display); font-size:1.02rem; color:var(--ink); line-height:1.3}

/* ---- flagging a question to come back to ----------------------------- */
.qtoprow{
  display:flex; align-items:center; justify-content:space-between;
  gap:var(--s3); margin-bottom:var(--s2);
}
.flagbtn{
  display:inline-flex; align-items:center; gap:var(--s1); flex:none;
  padding:.3rem .55rem; font:inherit; font-size:.78rem;
  color:var(--ink-3); background:transparent; cursor:pointer;
  border:1px solid var(--line); border-radius:var(--r-sm);
}
.flagbtn:hover{color:var(--accent); border-color:var(--accent)}
.flagbtn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.flagbtn.on{
  color:#8a5a00; border-color:#d9a441; background:#fdf4e0;
}
.flagbtn.on svg{fill:#d9a441}
@media (prefers-color-scheme:dark){
  :root[data-theme="auto"] .flagbtn.on{
    color:#f0c777; border-color:#8a6a2a; background:#2b2416;
  }
}
:root[data-theme="dark"] .flagbtn.on{
  color:#f0c777; border-color:#8a6a2a; background:#2b2416;
}

/* ---- the study plan as a route, not a pile of homework ---------------
   One rail down the left, a marker per week, and the week you are in
   picked out so "am I behind?" is answered by looking rather than
   counting. */
.timeline{position:relative; padding-left:var(--s5)}
.timeline::before{
  content:""; position:absolute; left:7px; top:12px; bottom:12px;
  width:2px; background:var(--line); border-radius:1px;
}
.tl-item{position:relative; margin-bottom:var(--s4)}
.tl-dot{
  position:absolute; left:calc(-1 * var(--s5) + 1px); top:1.45rem;
  width:13px; height:13px; border-radius:50%;
  background:var(--panel); border:2px solid var(--line-2);
}
.tl-item.past .tl-dot{background:var(--line-2); border-color:var(--line-2)}
.tl-item.now .tl-dot{
  background:var(--accent); border-color:var(--accent);
  box-shadow:0 0 0 4px var(--accent-soft);
}
.tl-item.now{border-color:var(--accent)}
.tl-item.past{opacity:.72}
.tl-head{
  display:flex; align-items:center; gap:var(--s3);
  flex-wrap:wrap; margin-bottom:var(--s1);
}
.tl-head h3{margin:0}
@media (max-width:560px){
  .timeline{padding-left:var(--s4)}
  .timeline::before{left:5px}
  .tl-dot{left:calc(-1 * var(--s4) + 0px); width:11px; height:11px}
}

/* ---- "where you stand", at the top of Progress -----------------------
   Two portions, scored separately, each against the same 75% line. The
   mark on the bar is the pass mark, so clearing it is something you see
   rather than something you work out. */
.standgrid{
  display:grid; gap:var(--s5); margin-top:var(--s3);
  grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));
}
.sc-top{display:flex; align-items:baseline; gap:var(--s2); margin-bottom:var(--s1)}
.sc-name{font-family:var(--display); font-size:1.05rem; color:var(--ink)}
.sc-of{font-size:.78rem; color:var(--ink-3)}
.sc-val{
  font-family:var(--mono); font-size:2rem; line-height:1.1;
  font-variant-numeric:tabular-nums; margin-bottom:var(--s2);
}
.sc-val.ok{color:var(--accent)}
.sc-val.low{color:#8c2f22}
.sc-val.none{color:var(--ink-3); font-size:1.1rem}
.sc-track{
  /* No overflow:hidden -- the pass mark deliberately stands proud of the
     track, and clipping it hid the only thing the bar is there to show. */
  position:relative; height:9px; border-radius:5px; background:var(--line);
}
.sc-fill{height:100%; border-radius:5px; background:var(--accent)}
.sc-fill.low{background:#b8503c}
.sc-fill.none{background:transparent}
.sc-mark{
  position:absolute; top:-4px; bottom:-4px; left:75%; width:2px;
  background:var(--ink-2); opacity:.8; border-radius:1px;
}
.sc-mark::after{
  content:"75%"; position:absolute; left:50%; top:calc(100% + 3px);
  transform:translateX(-50%);
  font-size:.64rem; color:var(--ink-3); white-space:nowrap;
}
.sc-note{margin-top:var(--s5); font-size:.85rem; color:var(--ink-2); line-height:1.4}
.standverdict{
  margin:var(--s5) 0 0; padding-top:var(--s4);
  border-top:1px solid var(--line); color:var(--ink-2); line-height:1.55;
}
@media (prefers-color-scheme:dark){
  :root[data-theme="auto"] .sc-val.low{color:#f0a496}
  :root[data-theme="auto"] .sc-fill.low{background:#a8402f}
}
:root[data-theme="dark"] .sc-val.low{color:#f0a496}
:root[data-theme="dark"] .sc-fill.low{background:#a8402f}

/* ---- a link that is really a button ----------------------------------
   The 404 page's "go home" control is an anchor, because it navigates.
   Every .btn rule is scoped to button elements, so it was rendering as
   a bare underlined link in the middle of a card. */
a.btn{
  display:inline-flex; align-items:center; justify-content:center;
  font-family:var(--ui); font-size:.95rem; font-weight:600;
  letter-spacing:.07em; text-transform:uppercase;
  padding:.5rem 1rem; border-radius:var(--r);
  border:1px solid var(--accent); background:var(--accent);
  color:var(--accent-ink); text-decoration:none;
}
a.btn:hover{filter:brightness(1.08); text-decoration:none}
a.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* The app's "Your exam" card: the student's state, official figures only. */
.stateexam .cardhead .linkish{margin-left:auto; font-size:.82rem}
.stategrid{margin:.2rem 0 .4rem; display:grid; grid-template-columns:auto 1fr; gap:.35rem 1rem}
.stategrid dt{font-size:.74rem; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
  color:var(--ink-3); padding-top:.15rem; white-space:nowrap}
.stategrid dd{margin:0; font-size:.92rem; color:var(--ink)}
.stategrid dd small{display:block; font-size:.78rem; color:var(--ink-3)}
.stateexam .muted a{color:var(--accent)}

/* ======================================================================
   Plans on the payment step: weekly, monthly, yearly, and "contact us".
   ====================================================================== */
.authwrap.planwrap .authcard.plancardwrap{max-width:68rem; width:100%}
.plangrid{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:1rem;
  margin:.6rem 0 .2rem; text-align:left}
.plancard{position:relative; display:flex; flex-direction:column; gap:.55rem;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:1.5rem 1.1rem 1.1rem; transition:box-shadow .2s, border-color .2s, transform .2s}
.plancard:hover{box-shadow:var(--shadow-lift);
  border-color:color-mix(in srgb, var(--accent) 35%, var(--line))}
.plancard.featured{border-color:var(--accent);
  box-shadow:0 0 0 1px var(--accent), var(--shadow-lift)}
@media (min-width:1101px){ .plancard.featured{transform:scale(1.03)} }
.planbadge{position:absolute; top:-.7rem; left:50%; transform:translateX(-50%);
  white-space:nowrap; font:600 .72rem/1 var(--ui); letter-spacing:.02em;
  padding:.38rem .7rem; border-radius:var(--r-pill);
  background:var(--accent); color:var(--accent-ink)}
.planicon{width:2.4rem; height:2.4rem; border-radius:.7rem; display:grid; place-items:center;
  background:var(--accent-soft); color:var(--accent)}
.planicon svg{width:1.3rem; height:1.3rem; fill:none; stroke:currentColor;
  stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.plancard h3{margin:.15rem 0 0; font-size:1.15rem}
.plandesc{margin:0; font-size:.86rem; line-height:1.45; color:var(--ink-2); min-height:2.5em}
.planprice{display:flex; align-items:baseline; gap:.35rem; margin:.2rem 0 .3rem}
.planprice .amount{font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:2rem; font-weight:600; letter-spacing:-.03em; line-height:1}
.planprice .amount.talk{font-family:var(--ui); font-size:1.35rem; letter-spacing:-.01em}
.planprice .per{font-size:.85rem; color:var(--ink-3)}
.plancard .btn{min-height:44px; text-align:center; text-decoration:none;
  display:inline-flex; align-items:center; justify-content:center}

.plancard a.btn.ghost{background:var(--panel); color:var(--accent);

   wide screen pushed these single cards over to the left-hand side. */
main:has(.authwrap)>section,

.authwrap, .statewrap{width:100%; justify-items:center}

.affcard{max-width:34rem}

.affcopy{display:flex; flex-direction:column; gap:.3rem; width:100%}

  background:var(--panel-2); border:1px dashed var(--line-2); color:var(--ink)}

.affbox .btn{flex:0 0 auto; min-width:5.2rem}
.affearn{width:100%; display:flex; flex-direction:column; gap:.4rem}
.affearngrid{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:.6rem}
.affearngrid div{display:flex; flex-direction:column; gap:.15rem; padding:.7rem .8rem;

.affearngrid b{font-size:.92rem}
.affearngrid span{font-size:.82rem; color:var(--ink-2)}
.affideas, .affwhy{width:100%; display:flex; flex-direction:column; gap:.65rem;

.affideas h2, .affwhy h2{font-size:1.1rem; margin:0}
.affidea b{display:block; font-size:.95rem}
.affidea p{margin:.15rem 0 0; font-size:.88rem; line-height:1.5; color:var(--ink-2)}

  background:var(--accent-soft); color:var(--accent); font-weight:600; font-size:.88rem}
.reffirst{margin:-.2rem 0 .2rem; font-size:.84rem; font-weight:600; color:var(--accent)}
.affform{width:100%; max-width:22rem; text-align:left}

nd 28 of 40 state (70%)","regulator":"Tennessee Real Estate Commission","regulator_url":"https://www.tn.gov/commerce/regboards/trec.html","src":"https://test-takers.psiexams.com/api/content/bulletin/509","state":40,"vendor":"PSI"},"TX":{"fee":58,"hours":180,"license":"Sales agent","national":80,"pass":"56 of 80 national and 28 of 40 state (70%)","regulator":"Texas Real Estate Commission","regulator_url":"https://www.trec.texas.gov/","src":"https://www.pearsonvue.com/content/dam/VUE/vue/en/documents/publications/094400.pdf","state":40,"vendor":"Pearson VUE"},"UT":{"hours":120,"national":80,"regulator":"Utah Division of Real Estate","regulator_url":"https://commerce.utah.gov/realestate/","src":"https://commerce.utah.gov/realestate/real-estate/licensing/sales-agent/","vendor":"Pearson VUE"},"VA":{"fee":60,"hours":60,"minutes":150,"national":80,"pass":"56 of 80 national and 30 of 40 state","regulator":"Virginia Real Estate Board (DPOR)","regulator_url":"https://www.dpor.virginia.gov/Boards/Real-Estate","src":"https://test-takers.psiexams.com/api/content/bulletin/466","state":40,"vendor":"PSI"},"VT":{"fee":113,"hours":40,"national":100,"note":"The state portion is given by the Vermont Office of Professional Regulation as part of the application","pass":"70 on the national portion","regulator":"Vermont Office of Professional Regulation","regulator_url":"https://sos.vermont.gov/real-estate-brokers-salespersons/","src":"https://test-takers.psiexams.com/api/content/bulletin/5036","vendor":"PSI (national) + Vermont OPR (state)"},"WA":{"hours":90,"license":"Broker (Washington's entry-level license)","minutes":240,"national":100,"pass":"70 (scaled), each portion","regulator":"Washington Department of Licensing","regulator_url":"https://dol.wa.gov/professional-licenses/real-estate-brokers","src":"https://test-takers.psiexams.com/api/content/bulletin/5054","state":30,"vendor":"PSI"},"WI":{"fee":65,"hours":72,"national":0,"note":"One combined 140-question exam","pass":"75 (scaled)","regulator":"Wisconsin Department of Safety and Professional Services","regulator_url":"https://dsps.wi.gov/Pages/Professions/RESalesperson/Default.aspx","single":true,"src":"https://www.pearsonvue.com/content/dam/VUE/vue/en/documents/publications/095000.pdf","state":140,"vendor":"Pearson VUE"},"WV":{"fee":118,"fee_note":"$59 national + $59 state","hours":90,"minutes":210,"national":80,"regulator":"West Virginia Real Estate Commission","regulator_url":"https://rec.wv.gov/","src":"https://www.pearsonvue.com/content/dam/VUE/vue/en/documents/publications/094900.pdf","state":50,"vendor":"Pearson VUE"},"WY":{"hours":54,"national":80,"pass":"75 (scaled)","regulator":"Wyoming Real Estate Commission","regulator_url":"https://realestate.wyo.gov/","src":"https://www.pearsonvue.com/content/dam/VUE/vue/en/documents/publications/095100.pdf","state":40,"vendor":"Pearson VUE"}},"page":"welcome","preview":true,"layout":"minimal"};</script>
<script>/* The sales page. Carries no question bank -- three sample questions and the
   blueprint counts, nothing a buyer is paying for. */
'use strict';

function $(id){ return document.getElementById(id); }
function el(t, c, x){
  var n = document.createElement(t);
  if (c) n.className = c;
  if (x !== undefined && x !== null) n.textContent = x;
  return n;
}
function money(cents){
  return '$' + (cents % 100 === 0 ? (cents / 100) : (cents / 100).toFixed(2));
}

var TOAST_T = null;
function toast(msg){
  var t = $('toast');
  t.textContent = msg; t.hidden = false;
  if (TOAST_T) clearTimeout(TOAST_T);
  TOAST_T = setTimeout(function(){ t.hidden = true; }, 3400);
}

/* ---- theme, same three states as the app ---- */
var THEME_KEY = 'ga-prep-theme', THEMES = ['auto', 'light', 'dark'];
function systemDark(){
  try { return matchMedia('(prefers-color-scheme: dark)').matches; } catch(e){ return false; }
}
function readTheme(){
  var t; try { t = localStorage.getItem(THEME_KEY); } catch(e){ t = null; }
  return THEMES.indexOf(t) >= 0 ? t : 'light';
}
function applyTheme(mode){
  var root = document.documentElement;
  /* Always set: with no attribute the page is light, so a first visit (and
     the first paint, before this runs) is light whatever the system says. */
  root.setAttribute('data-theme', mode);
  var resolved = (mode === 'auto') ? (systemDark() ? 'dark' : 'light') : mode;
  var b = $('themeBtn');
  if (b){ b.setAttribute('data-shown', resolved);
          $('themeLabel').textContent = mode.charAt(0).toUpperCase() + mode.slice(1); }
}

/* ---------------------------------------------------------- the entrance */
/* A short, quiet opening: the mark settles, the name appears, and it is gone
   inside a second. It used to be a two-and-a-half second flight through a
   corridor of houses and books, which was striking the first time and a toll
   every time after. What is left reads as an app opening, not a title
   sequence, and it never stands between anyone and the login form.

   Same three rules as before: never twice in a session, never on the way back
   from Google or Stripe, and any key or tap ends it. */

var INTRO_KEY = 'ga-prep-intro';
var INTRO_MS = 900;

function introWanted(){
  if (HOME.preview) return false;
  try {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return false;
  } catch(e){}
  var q = new URLSearchParams(location.search);
  if (q.get('auth') || q.get('checkout') || q.get('pay') || q.get('gate')) return false;
  try {
    if (sessionStorage.getItem(INTRO_KEY)) return false;
    sessionStorage.setItem(INTRO_KEY, '1');
  } catch(e){ /* private window: play it once and move on */ }
  return true;
}

function buildIntro(){
  var wrap = el('div', 'intro');
  wrap.id = 'intro';
  wrap.setAttribute('aria-hidden', 'true');
  var mark = el('div', 'intro-mark');
  mark.innerHTML = '<svg viewBox="0 0 512 512" aria-hidden="true">' +
    '<path d="M256 96 L432 236 L400 236 L400 404 L112 404 L112 236 L80 236 Z" ' +
    'fill="none" stroke="currentColor" stroke-width="26" stroke-linejoin="round"/></svg>';
  wrap.appendChild(mark);
  wrap.appendChild(el('div', 'intro-word', 'Real Estate'));
  return wrap;
}

function playIntro(){
  if (!introWanted()){ document.body.classList.add('intro-done'); return; }

  var wrap = buildIntro();
  document.body.classList.add('intro-running');
  document.body.appendChild(wrap);

  var finished = false;
  function finish(){
    if (finished) return;
    finished = true;
    clearTimeout(timer);
    document.removeEventListener('keydown', finish, true);
    wrap.classList.add('done');
    document.body.classList.remove('intro-running');
    document.body.classList.add('intro-done');
    setTimeout(function(){ if (wrap.parentNode) wrap.parentNode.removeChild(wrap); }, 420);
  }

  var timer = setTimeout(finish, INTRO_MS);
  wrap.addEventListener('click', finish);
  wrap.addEventListener('touchstart', finish, {passive: true});
  document.addEventListener('keydown', finish, true);
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'hidden') finish();
  });
}

/* ------------------------------------------------------------- buying */
var BUYING = false;
/* Start Stripe checkout for one plan. With no plan (old buttons), go and
   pick one first. */
function refCode(){
  var c = null;
  try { c = localStorage.getItem(REF_KEY); } catch(e){}
  return /^[A-Z0-9]{3,24}$/.test(c || '') ? c : '';
}

function buy(plan){
  if (HOME.preview){
    toast('Preview only \u2014 payments are not connected until this is deployed.');
    return;
  }
  if (typeof plan !== 'string' || !plan){ location.href = '/auth?pay=1'; return; }
  if (BUYING) return;
  BUYING = true;
  toast('Opening secure checkout…');
  fetch('/api/checkout', {
    method: 'POST', credentials: 'same-origin',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({plan: plan, code: refCode() || null})
  }).then(function(r){ return r.json(); })
    .then(function(d){
      if (d.url){ location.href = d.url; return; }
      if (d.signin){ location.href = d.signin; return; }
      BUYING = false;
      toast(d.error || 'Could not start checkout. Try again shortly.');
    })['catch'](function(){
      BUYING = false;
      toast('Could not reach the payment service.');
    });
}

/* "$9 a week": the cheapest plan, for the line under the button. */
function fromPrice(){
  var best = null;
  (HOME.plans || []).forEach(function(p){
    if (p.cents && (!best || p.cents < best.cents)) best = p;
  });
  return best ? money(best.cents) + ' a ' + best.per : money(HOME.price);
}

/* Stripe's own page for cancelling, switching plan or changing the card. */
function manageSubscription(){
  toast('Opening your subscription…');
  fetch('/api/billing', {method: 'POST', credentials: 'same-origin'})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.url){ location.href = d.url; return; }
      toast(d.error || 'Could not open your subscription. Try again shortly.');
    })['catch'](function(){ toast('Could not reach the payment service.'); });
}

/* The plans, as cards: weekly, monthly, yearly and "contact us". Prices come
   from the build (HOME.plans); the server charges from its own copy. */
var PLAN_ICONS = {
  weekly:  '<path d="M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/>',
  monthly: '<path d="M4 19V9l8-5 8 5v10a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
  yearly:  '<path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/>',
  affiliate: '<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M17 8v6M14 11h6"/>'
};
/* What each plan costs over time, and what it saves against the others --
   worked out from the prices, so changing a price keeps every line true.
   A year is 52 weeks or 12 months. */
var PER_YEAR = {week: 52, month: 12, year: 1};
function planPoints(p){
  var plans = (HOME.plans || []).filter(function(x){ return x.cents && PER_YEAR[x.per]; });
  var yearly = function(x){ return x.cents * PER_YEAR[x.per]; };
  var cents = function(c){ return money(Math.round(c)); };
  var pts = [];
  var every = {week: 'every week', month: 'every month', year: 'once a year'}[p.per];
  pts.push('Billed ' + money(p.cents) + ' ' + every + ', all features included');
  if (p.per === 'week'){
    pts.push('About ' + cents(p.cents * 52 / 12) + ' a month if you keep it going');
    pts.push('Best for a final week of review before your test');
  } else if (p.per === 'month'){
    pts.push('Works out to about ' + cents(p.cents * 12 / 52) + ' a week');
    pts.push('Enough time for most people to finish the course');
  } else if (p.per === 'year'){
    pts.push('Works out to about ' + cents(p.cents / 12) + ' a month (' +
             cents(p.cents / 52) + ' a week)');
  }
  /* savings against every plan that costs more over a year, nearest first */
  plans.slice().sort(function(a, b){ return yearly(a) - yearly(b); }).forEach(function(o){
    if (o.id === p.id || yearly(o) <= yearly(p)) return;
    var save = yearly(o) - yearly(p);
    var pct = Math.round(save / yearly(o) * 100);
    if (p.per === 'month' && o.per === 'week'){
      pts.push('Save ' + cents(save / 12) + ' a month vs. weekly (' + pct + '% less)');
    } else {
      pts.push('Save ' + cents(save) + ' a year vs. ' + o.name.toLowerCase() +
               ' (' + pct + '% less)');
    }
  });
  if (p.per === 'year') pts.push('Room for a slower pace or a retake');
  pts.push('Cancel any time');
  return pts;
}
function planCards(){
  var grid = el('div', 'plangrid');
  (HOME.plans || []).forEach(function(p){
    var c = el('div', 'plancard' + (p.badge === 'Most popular' ? ' featured' : ''));
    if (p.badge) c.appendChild(el('div', 'planbadge', p.badge));
    var ic = el('div', 'planicon');
    ic.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + (PLAN_ICONS[p.id] || '') + '</svg>';
    c.appendChild(ic);
    c.appendChild(el('h3', null, p.name));
    c.appendChild(el('p', 'plandesc', p.desc));
    var btn;
    if (p.cents){
      var pr = el('div', 'planprice');
      pr.appendChild(el('span', 'amount', money(p.cents)));
      pr.appendChild(el('span', 'per', '/ ' + p.per));
      c.appendChild(pr);
      if (refCode() && REF.ok){
        var off = HOME.affiliate ? HOME.affiliate.discount : 40;
        c.appendChild(el('p', 'reffirst', 'First ' + p.per + ' ' +
          money(Math.round(p.cents * (100 - off) / 100)) + ' with your code'));
      }
      btn = el('button', 'btn wide' + (p.badge === 'Most popular' ? '' : ' ghost'),
               'Choose ' + p.name.toLowerCase());
      btn.disabled = BUYING || ME.canPay === false;
      btn.onclick = function(){ buy(p.id); };
    } else {
      var pr2 = el('div', 'planprice');
      pr2.appendChild(el('span', 'amount talk', 'Earn with us'));
      c.appendChild(pr2);
      btn = el('a', 'btn wide ghost', 'Join program');
      btn.href = '/#affiliate';
    }
    c.appendChild(btn);
    var ul = el('ul', 'planlist');
    (p.cents ? planPoints(p) : ['Refer students preparing for their exam',
                                'We email you the details when you apply']).forEach(function(t){
      ul.appendChild(el('li', null, t));
    });
    c.appendChild(ul);
    grid.appendChild(c);
  });
  return grid;
}

/* ------------------------------------------------------------ signing in */
var AUTH = {email: '', stage: 'email'};
var ME = {signedIn: false, paid: false, email: null, google: false};

var GOOGLE_G =
  '<svg viewBox="0 0 48 48" aria-hidden="true" class="gmark">' +
  '<path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-2.7-.4-3.9H24v7.1h12.1c-.2 1.8-1.6 4.5-4.5 6.3l-.1.3 6.5 5 .4.1c4.1-3.8 6.7-9.4 6.7-15z"/>' +
  '<path fill="#34A853" d="M24 46c5.9 0 10.9-1.9 14.5-5.3l-6.9-5.3c-1.8 1.3-4.3 2.2-7.6 2.2-5.8 0-10.7-3.8-12.5-9l-.3.1-6.7 5.2-.1.3C7.9 41.1 15.4 46 24 46z"/>' +
  '<path fill="#FBBC05" d="M11.5 28.6c-.5-1.4-.8-2.9-.8-4.6s.3-3.2.7-4.6v-.3l-6.8-5.3-.2.1C2.8 16.8 2 20.3 2 24s.8 7.2 2.4 10.1l7.1-5.5z"/>' +
  '<path fill="#EA4335" d="M24 10.4c4.1 0 6.9 1.8 8.5 3.3l6.2-6C34.9 4.2 29.9 2 24 2 15.4 2 7.9 6.9 4.4 13.9l7.1 5.5c1.8-5.2 6.7-9 12.5-9z"/>' +
  '</svg>';

function googleButton(label){
  var b = el('button', 'btn gbtn wide');
  b.innerHTML = GOOGLE_G;
  b.appendChild(el('span', null, label || 'Continue with Google'));
  b.onclick = function(){ location.href = '/api/auth/google'; };
  return b;
}

function signOut(){
  fetch('/api/logout', {method: 'POST', credentials: 'same-origin'})
    .then(function(){ location.href = '/'; })['catch'](function(){ location.href = '/'; });
}

function openAuth(stage){
  if (HOME.preview){
    toast('Preview only — accounts are not connected until this is deployed.');
    return;
  }
  AUTH.stage = stage || 'login';
  renderAuth();
  $('authSheet').hidden = false;
}
function closeAuth(){ $('authSheet').hidden = true; }

function field(parent, id, label, type, opts){
  var l = el('label', null, label); l.setAttribute('for', id);
  parent.appendChild(l);
  var i = el('input');
  i.type = type; i.id = id;
  Object.keys(opts || {}).forEach(function(k){ i[k] = opts[k]; });
  parent.appendChild(i);
  return i;
}

function post(url, body){
  return fetch(url, {
    method: 'POST', credentials: 'same-origin',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  }).then(function(r){ return r.json().then(function(d){ return {status: r.status, d: d}; }); });
}

/* Where somebody lands after authenticating: into the app if they have paid
   for it, back to the card to pay if they have not. */
function afterAuth(paid){
  location.href = paid ? '/app' : '/?pay=1';
}

function renderAuth(){
  var b = $('authBody');
  b.innerHTML = '';

  if (AUTH.stage === 'signup' || AUTH.stage === 'login'){
    var isNew = AUTH.stage === 'signup';
    b.appendChild(el('h2', null, isNew ? 'Create your account' : 'Log in'));
    b.appendChild(el('p', 'sub', isNew
      ? 'Your progress, your notebook and your study plan are saved to this ' +
        'account, on every device you use.'
      : 'Welcome back. Everything you have done is waiting.'));

    if (ME.google){
      var g = googleButton(isNew ? 'Sign up with Google' : 'Continue with Google');
      g.classList.add('wide');
      b.appendChild(g);
      var div = el('div', 'orline');
      div.appendChild(el('span', null, 'or use an email address'));
      b.appendChild(div);
    }

    var email = field(b, 'authEmail', 'Email address', 'email',
                      {autocomplete: 'email', placeholder: 'you@example.com',
                       value: AUTH.email});
    var pw = field(b, 'authPassword', 'Password', 'password',
                   {autocomplete: isNew ? 'new-password' : 'current-password',
                    placeholder: ''});
    if (isNew){
      b.appendChild(el('p', 'muted',
        'Ten characters or more. Length beats symbols — a short password ' +
        'with punctuation in it is still a short password.'));
    }
    var note = el('div', 'authnote'); note.id = 'authNote';
    b.appendChild(note);

    var acts = el('div', 'wizacts'); acts.style.marginTop = '.9rem';
    var go = el('button', 'btn', isNew ? 'Create account' : 'Log in');
    function submit(){
      AUTH.email = email.value.trim();
      if (!AUTH.email){ note.textContent = 'Put your email in first.'; return; }
      if (!pw.value){ note.textContent = 'Put your password in.'; return; }
      go.disabled = true; note.className = 'authnote'; note.textContent = 'One moment…';
      post(isNew ? '/api/auth/signup' : '/api/auth/login',
           {email: AUTH.email, password: pw.value})
        .then(function(x){
          go.disabled = false;
          if (x.d.error){ note.className = 'authnote bad'; note.textContent = x.d.error; return; }
          afterAuth(x.d.entitled || x.d.paid);
        })['catch'](function(){
          go.disabled = false;
          note.className = 'authnote bad'; note.textContent = 'Network problem. Try again.';
        });
    }
    go.onclick = submit;
    pw.onkeydown = function(e){ if (e.key === 'Enter') submit(); };
    email.onkeydown = function(e){ if (e.key === 'Enter') pw.focus(); };
    acts.appendChild(go);
    var swap = el('button', 'btn ghost',
                  isNew ? 'I already have an account' : 'Create an account');
    swap.onclick = function(){ AUTH.stage = isNew ? 'login' : 'signup'; renderAuth(); };
    acts.appendChild(swap);
    b.appendChild(acts);
    setTimeout(function(){ (AUTH.email ? pw : email).focus(); }, 30);
    return;
  }

  /* The six-digit code, kept for anyone who cannot use either of the above. */
  if (AUTH.stage === 'code'){
    b.appendChild(el('h2', null, 'Check your email'));
    b.appendChild(el('p', 'sub',
      'If ' + AUTH.email + ' has access, a six-digit code is on its way. ' +
      'It expires in fifteen minutes.'));
    var code = field(b, 'authCode', 'Six-digit code', 'text',
                     {inputMode: 'numeric', autocomplete: 'one-time-code',
                      maxLength: 6, placeholder: '000000'});
    var note2 = el('div', 'authnote'); note2.id = 'authNote';
    b.appendChild(note2);
    var acts2 = el('div', 'wizacts'); acts2.style.marginTop = '.9rem';
    var ok = el('button', 'btn', 'Log in');
    ok.onclick = function(){
      ok.disabled = true; note2.textContent = 'Checking…';
      post('/api/login/verify', {email: AUTH.email, code: code.value.trim()})
        .then(function(x){
          ok.disabled = false;
          if (x.d.error){ note2.className = 'authnote bad'; note2.textContent = x.d.error; return; }
          location.href = '/app';
        })['catch'](function(){ ok.disabled = false; note2.textContent = 'Network problem.'; });
    };
    acts2.appendChild(ok);
    var back = el('button', 'btn ghost', 'Back');
    back.onclick = function(){ AUTH.stage = 'login'; renderAuth(); };
    acts2.appendChild(back);
    b.appendChild(acts2);
    setTimeout(function(){ code.focus(); }, 30);
  }
}

/* ====================================================================== */
/* The authentication page.                                               */
/*                                                                        */
/* Two tabs over one card. Every field has a visible label, its own error  */
/* line underneath, and keeps what was typed when a sibling fails -- the   */
/* thing that makes forms infuriating is being made to type it all again.  */
/* ====================================================================== */

var FORM = {tab: 'signup', values: {}, errors: {}, busy: false, notice: null};

function fieldRow(parent, opts){
  var wrap = el('div', 'field' + (FORM.errors[opts.name] ? ' bad' : ''));
  var lab = el('label', null, opts.label);
  lab.setAttribute('for', 'f_' + opts.name);
  wrap.appendChild(lab);

  var inputWrap = el('div', 'inputwrap');
  var i = el('input');
  i.id = 'f_' + opts.name;
  i.name = opts.name;
  i.type = opts.type || 'text';
  if (opts.autocomplete) i.autocomplete = opts.autocomplete;
  if (opts.inputMode) i.inputMode = opts.inputMode;
  if (opts.placeholder) i.placeholder = opts.placeholder;
  i.value = FORM.values[opts.name] || '';
  i.oninput = function(){ FORM.values[opts.name] = i.value; };
  if (FORM.errors[opts.name]){
    i.setAttribute('aria-invalid', 'true');
    i.setAttribute('aria-describedby', 'e_' + opts.name);
  }
  inputWrap.appendChild(i);

  /* Show/hide, so a long passphrase can be checked before it is submitted. */
  if (opts.type === 'password'){
    var eye = el('button', 'peek', 'Show');
    eye.type = 'button';
    eye.setAttribute('aria-label', 'Show password');
    eye.onclick = function(){
      var showing = i.type === 'text';
      i.type = showing ? 'password' : 'text';
      eye.textContent = showing ? 'Show' : 'Hide';
      eye.setAttribute('aria-label', (showing ? 'Show' : 'Hide') + ' password');
      i.focus();
    };
    inputWrap.appendChild(eye);
  }
  wrap.appendChild(inputWrap);

  if (opts.hint && !FORM.errors[opts.name]) wrap.appendChild(el('p', 'fieldhint', opts.hint));
  if (FORM.errors[opts.name]){
    var e = el('p', 'fielderr', FORM.errors[opts.name]);
    e.id = 'e_' + opts.name;
    wrap.appendChild(e);
  }
  parent.appendChild(wrap);
  return i;
}

function authNotice(kind, text, actionLabel, onAction){
  var n = el('div', 'authbanner ' + (kind || ''));
  n.appendChild(el('p', null, text));
  if (actionLabel){
    var b = el('button', 'btn mini', actionLabel);
    b.onclick = onAction;
    n.appendChild(b);
  }
  return n;
}

function submitForm(url, payload, onOk){
  if (FORM.busy) return;
  FORM.busy = true;
  FORM.errors = {};
  renderAuthPage();
  post(url, payload).then(function(x){
    FORM.busy = false;
    if (x.d.fields){ FORM.errors = x.d.fields; renderAuthPage(); focusFirstError(); return; }
    if (x.d.error){ FORM.notice = {kind: 'bad', text: x.d.error}; renderAuthPage(); return; }
    onOk(x.d);
  })['catch'](function(){
    FORM.busy = false;
    FORM.notice = {kind: 'bad', text: 'Could not reach the server. Try again.'};
    renderAuthPage();
  });
}

function focusFirstError(){
  var first = document.querySelector('.field.bad input');
  if (first) first.focus();
}

/* Where somebody lands the moment they are authenticated. Paid people go
   into the app. Everybody else stays exactly where they are: signing in and
   paying are two steps of one card, not two pages. */
function afterAuthed(d){
  var next = null;
  try { next = sessionStorage.getItem('ga-prep-after-auth');
        sessionStorage.removeItem('ga-prep-after-auth'); } catch(e){}
  if (next === 'affiliate'){ location.href = '/#affiliate'; return; }
  /* Sign up, then pay, then pick a state: the app sends anyone without a
     state to the picker on the way in, so paid people can go straight there. */
  if (d.entitled || d.paid) { location.href = '/app'; return; }
  ME.signedIn = true;
  if (FORM.values.email) ME.email = FORM.values.email;
  ME.verified = (d.verified !== false);
  if (typeof d.canPay === 'boolean') ME.canPay = d.canPay;
  /* Whether an address was actually confirmed by email is a fact about this
     deployment, not about the person. Carry it so the card can tell the
     truth about it. */
  PAY.justMade  = (d.created === true);
  PAY.emailSent = (d.emailSent === true);
  FORM.tab = 'pay';
  FORM.notice = null;
  FORM.errors = {};
  renderAuthPage();
  window.scrollTo(0, 0);
}

var PAY = {justMade: false, emailSent: false};

/* Whether this person may use the app, which is not the same question as
   whether they paid for it: the owner of the site has access without ever
   having bought it. The server decides and sends `entitled`; older
   deployments only send `paid`, so fall back to that. */
function hasAccess(){
  if (typeof ME.entitled === 'boolean') return ME.entitled;
  return !!ME.paid;
}

/* The second half of the one page: signed in, not paid yet, one button. */
function payStep(card, wrap, v){
  /* Just the plans: a heading and the four cards, nothing else to read.
     Renewal and refund terms are on Stripe's checkout page and in /terms. */
  document.title = 'Checkout \u2014 Real Estate Exam Prep';
  wrap.classList.add('planwrap');
  card.classList.add('plancardwrap');
  var mark = card.querySelector('.gatemark');
  if (mark) mark.remove();
  card.appendChild(el('h1', null, 'Choose your plan'));
  var code = refCode();
  if (code && REF.ok === null && !REF.checking){
    REF.checking = true;
    fetch('/api/affiliate/check?code=' + encodeURIComponent(code))
      .then(function(r){ return r.json(); })
      .then(function(d){ REF.ok = !!d.ok; })['catch'](function(){ REF.ok = false; })
      .then(function(){ REF.checking = false; renderAuthPage(); });
  }
  if (code && REF.ok){
    card.appendChild(el('div', 'refbanner', 'Code ' + code + ' applied \u2014 ' +
      (HOME.affiliate ? HOME.affiliate.discount : 40) + '% off your first payment'));
  }
  if (ME.canPay === false){
    /* A button that cannot take money is worse than no button. */
    card.appendChild(authNotice('warn',
      'Card payments are not connected on this site yet, so checkout cannot ' +
      'open. Nothing is wrong with your account \u2014 it is waiting for you.'));
  }
  card.appendChild(planCards());
  wrap.appendChild(card);
  v.appendChild(wrap);
}

function renderAuthPage(){
  var v = $('page');
  v.innerHTML = '';
  var q = new URLSearchParams(location.search);

  var wrap = el('div', 'authwrap');
  var card = el('div', 'authcard');

  var mark = el('div', 'gatemark');
  mark.innerHTML = '<svg viewBox="0 0 512 512" aria-hidden="true">' +
    '<path d="M256 96 L432 236 L400 236 L400 404 L112 404 L112 236 L80 236 Z" ' +
    'fill="none" stroke="currentColor" stroke-width="30" stroke-linejoin="round"/></svg>';
  card.appendChild(mark);

  /* things the server sent us back with */
  var said = {
    'ok': ['good', 'Your email is confirmed. You can log in.'],
    'bad': ['bad', 'That confirmation link is not valid or has expired. ' +
                   'Log in and we will send a new one.'],
    'needed': ['warn', 'Confirm your email address to carry on. ' +
                       'Check your inbox for the link.'],
    'sent': ['good', 'Account created. If a confirmation link reaches your ' +
                     'inbox it will secure the account; you can log in now ' +
                     'either way.']
  }[q.get('verify')];
  if (said) card.appendChild(authNotice(said[0], said[1]));
  if (q.get('gate')) card.appendChild(authNotice('warn',
    'That part of the site needs an account. Create one or log in below.'));
  if (FORM.notice) card.appendChild(authNotice(FORM.notice.kind, FORM.notice.text));

  if (q.get('reset')) return resetForm(card, wrap, v, q.get('reset'));
  if (FORM.tab === 'forgot') return forgotForm(card, wrap, v);
  /* Already signed in and unpaid, whether from a moment ago or a week ago:
     the till is this page. */
  if (ME.signedIn && hasAccess()){ location.href = '/app'; return; }
  if (FORM.tab === 'pay' || ME.signedIn) return payStep(card, wrap, v);

  /* ---- the two tabs ---- */
  var tabs = el('div', 'authtabs');
  tabs.setAttribute('role', 'tablist');
  [['signup', 'Create account'], ['login', 'Log in']].forEach(function(t){
    var b = el('button', 'authtab' + (FORM.tab === t[0] ? ' on' : ''), t[1]);
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', FORM.tab === t[0] ? 'true' : 'false');
    b.onclick = function(){ FORM.tab = t[0]; FORM.errors = {}; FORM.notice = null;
                            renderAuthPage(); };
    tabs.appendChild(b);
  });
  card.appendChild(tabs);

  if (ME.google){
    var g = googleButton(FORM.tab === 'signup' ? 'Sign up with Google'
                                               : 'Continue with Google');
    g.classList.add('wide');
    card.appendChild(g);
    var or = el('div', 'orline');
    or.appendChild(el('span', null, 'or use an email address'));
    card.appendChild(or);
  }

  var form = el('form', 'authform');
  form.noValidate = true;

  if (FORM.tab === 'signup'){
    fieldRow(form, {name: 'name', label: 'First name', type: 'text',
                    autocomplete: 'given-name', placeholder: 'First name'});
    fieldRow(form, {name: 'email', label: 'Email address', type: 'email',
                    autocomplete: 'email', placeholder: 'you@example.com'});
    fieldRow(form, {name: 'phone', label: 'Mobile number', type: 'tel',
                    autocomplete: 'tel', inputMode: 'tel',
                    placeholder: '(404) 555-0182',
                    hint: 'United States (+1). Used for account recovery.'});
    fieldRow(form, {name: 'password', label: 'Password', type: 'password',
                    autocomplete: 'new-password'});
    fieldRow(form, {name: 'password2', label: 'Confirm password', type: 'password',
                    autocomplete: 'new-password'});

    var termsWrap = el('div', 'field checkfield' + (FORM.errors.terms ? ' bad' : ''));
    var lab = el('label', 'checkline');
    var cb = el('input'); cb.type = 'checkbox'; cb.id = 'f_terms';
    cb.checked = !!FORM.values.terms;
    cb.onchange = function(){ FORM.values.terms = cb.checked; };
    lab.appendChild(cb);
    var txt = el('span');
    txt.appendChild(document.createTextNode('I agree to the '));
    var t1 = el('a', null, 'Terms of Service'); t1.href = '/terms'; t1.target = '_blank';
    txt.appendChild(t1);
    txt.appendChild(document.createTextNode(' and '));
    var t2 = el('a', null, 'Privacy Policy'); t2.href = '/privacy'; t2.target = '_blank';
    txt.appendChild(t2);
    txt.appendChild(document.createTextNode('.'));
    lab.appendChild(txt);
    termsWrap.appendChild(lab);
    if (FORM.errors.terms) termsWrap.appendChild(el('p', 'fielderr', FORM.errors.terms));
    form.appendChild(termsWrap);

    var go = el('button', 'btn wide', FORM.busy ? 'Creating your account…'
                                                : 'Create account');
    go.type = 'submit';
    go.disabled = FORM.busy;
    form.appendChild(go);
    form.onsubmit = function(e){
      e.preventDefault();
      submitForm('/api/auth/signup', {
        name: FORM.values.name, email: FORM.values.email, phone: FORM.values.phone,
        password: FORM.values.password, password2: FORM.values.password2,
        terms: !!FORM.values.terms
      }, afterAuthed);
    };
  } else {
    fieldRow(form, {name: 'email', label: 'Email address', type: 'email',
                    autocomplete: 'email', placeholder: 'you@example.com'});
    fieldRow(form, {name: 'password', label: 'Password', type: 'password',
                    autocomplete: 'current-password'});

    var forgot = el('button', 'linkish', 'Forgot your password?');
    forgot.type = 'button';
    forgot.onclick = function(){ FORM.tab = 'forgot'; FORM.errors = {};
                                 FORM.notice = null; renderAuthPage(); };
    form.appendChild(forgot);

    var go2 = el('button', 'btn wide', FORM.busy ? 'Signing in…' : 'Log in');
    go2.type = 'submit';
    go2.disabled = FORM.busy;
    form.appendChild(go2);
    form.onsubmit = function(e){
      e.preventDefault();
      submitForm('/api/auth/login',
                 {email: FORM.values.email, password: FORM.values.password},
                 afterAuthed);
    };
  }

  card.appendChild(form);
  wrap.appendChild(card);
  v.appendChild(wrap);
  setTimeout(focusFirstError, 30);
}

function forgotForm(card, wrap, v){
  card.appendChild(el('h1', null, 'Reset your password'));
  card.appendChild(el('p', 'gatelede',
    'Put in your email address and we will send you a link. It works for an hour.'));
  var form = el('form', 'authform');
  form.noValidate = true;
  fieldRow(form, {name: 'email', label: 'Email address', type: 'email',
                  autocomplete: 'email', placeholder: 'you@example.com'});
  var go = el('button', 'btn wide', FORM.busy ? 'Sending…' : 'Send the link');
  go.type = 'submit'; go.disabled = FORM.busy;
  form.appendChild(go);
  var back = el('button', 'linkish', 'Back to log in');
  back.type = 'button';
  back.onclick = function(){ FORM.tab = 'login'; FORM.notice = null; renderAuthPage(); };
  form.appendChild(back);
  form.onsubmit = function(e){
    e.preventDefault();
    submitForm('/api/auth/forgot', {email: FORM.values.email}, function(){
      /* The same answer whether or not that address is registered. */
      FORM.tab = 'login';
      FORM.notice = {kind: 'good', text: 'If that address has an account, a reset ' +
                                         'link is on its way. Check your inbox.'};
      renderAuthPage();
    });
  };
  card.appendChild(form);
  wrap.appendChild(card);
  v.appendChild(wrap);
}

function resetForm(card, wrap, v, token){
  card.appendChild(el('h1', null, 'Choose a new password'));
  var form = el('form', 'authform');
  form.noValidate = true;
  fieldRow(form, {name: 'password', label: 'New password', type: 'password',
                  autocomplete: 'new-password'});
  fieldRow(form, {name: 'password2', label: 'Confirm new password', type: 'password',
                  autocomplete: 'new-password'});
  var go = el('button', 'btn wide', FORM.busy ? 'Saving…' : 'Save and sign in');
  go.type = 'submit'; go.disabled = FORM.busy;
  form.appendChild(go);
  form.onsubmit = function(e){
    e.preventDefault();
    submitForm('/api/auth/reset', {token: token, password: FORM.values.password,
                                   password2: FORM.values.password2}, afterAuthed);
  };
  card.appendChild(form);
  wrap.appendChild(card);
  v.appendChild(wrap);
}

}

function lsec(eyebrow, title, blurb){

/* The exam at a glance for one state, from greprep/states.json. Only what an
   official source states; anything it does not is left out, never guessed. */
function stateFacts(code){
  var f = (HOME.states || {})[code];
  if (!f) return null;
  var box = el('div', 'statefacts');
  var dl = el('dl');
  function row(k, v, sub){
    if (v === undefined || v === null || v === '') return;
    var dt = el('dt', null, k), dd = el('dd');
    if (typeof v === 'string') dd.textContent = v; else dd.appendChild(v);
    if (sub) dd.appendChild(el('small', null, sub));
    dl.appendChild(dt); dl.appendChild(dd);
  }
  var exam = f.single ? ('One ' + f.state + '-question exam')
    : (f.national && f.state) ? (f.national + ' national + ' + f.state + ' state questions')
    : f.national ? (f.national + ' national questions') : null;
  row('The exam', exam || f.note, (exam && f.note && !f.single) ? f.note : null);
  row('To pass', f.pass || 'See the official handbook');
  if (f.minutes) {
    var h = Math.floor(f.minutes / 60), m = f.minutes % 60;
    row('Time', (h ? h + ' hr' : '') + (h && m ? ' ' : '') + (m ? m + ' min' : ''));
  }
  row('Course first', f.hours ? f.hours + ' hours' : null, f.hours_note);
  row('Given by', f.vendor);
  if (f.license) row('License', f.license);
  if (f.fee) row('Exam fee', '$' + f.fee, f.fee_note || null);
  box.appendChild(dl);
  var links = el('p', 'statelinks');
  var a1 = el('a', null, f.regulator); a1.href = f.regulator_url;
  a1.target = '_blank'; a1.rel = 'noopener';
  var a2 = el('a', null, 'official source'); a2.href = f.src;
  a2.target = '_blank'; a2.rel = 'noopener';
  links.appendChild(a1);
  links.appendChild(document.createTextNode(' \u00b7 '));
  links.appendChild(a2);
  box.appendChild(links);
  return box;
}
