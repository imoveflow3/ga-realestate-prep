],"h":"How agency is created and ended","l":["Express - written or spoken agreement. Written is required in Georgia.","Implied - created by CONDUCT that leads someone to reasonably believe they are represented. This is the accidental-agency trap.","Ratification - approving an unauthorised act after the fact.","Estoppel - a party is barred from denying an agency their conduct created.","Termination: expiration, completion, mutual agreement, revocation, renunciation, death or incapacity of either party, destruction of the property, or bankruptcy. A client simply refusing an offer does NOT end the agency."]},{"check":[{"answer":0,"choices":["Special agent","General agent","Universal agent"],"q":"A listing broker is usually a:","why":"Narrow authority for one transaction."},{"answer":0,"choices":["General agent","Special agent","Subagent"],"q":"A property manager is usually a:","why":"Ongoing authority across a range of matters."}],"h":"Scope of authority","l":["Special agent - narrow authority for one transaction. The typical listing broker.","General agent - ongoing authority in a range of matters. A property manager.","Universal agent - may act in all matters, usually under power of attorney."]},{"check":[{"answer":0,"choices":["Honesty and disclosure of known material defects","Full fiduciary duties","Confidentiality"],"q":"A customer is owed:","why":"Advocacy and advice belong to clients."},{"answer":0,"choices":["The seller","The buyer","Both equally"],"q":"A subagent owes fiduciary duties to:","why":"A subagent works through the listing broker."}],"h":"Who is who","l":["Client / principal - the represented party, owed full duties.","Customer - unrepresented; owed honesty, fair dealing, and disclosure of known material defects. NOT owed advice, advocacy, or confidentiality.","Subagent - works through the listing broker and owes duties to the SELLER, even while driving the buyer around all day.","Dual agent - represents both sides in the same transaction. Duties shrink to neutrality; requires informed written consent from both. Illegal in some states.","Designated agent - one licensee assigned to each side within the same firm."]},{"check":[{"answer":0,"choices":["Commingling","Conversion","Novation"],"q":"Mixing client funds with the broker's own money is:","why":"Spending them is conversion - worse."},{"answer":0,"choices":["Puffing","Misrepresentation","Fraud"],"q":"'The best view in town' is:","why":"Exaggerated opinion is puffing; a false statement of fact is not."}],"h":"Where licensees get into trouble","l":["Puffing vs. misrepresentation - exaggerated opinion ('best view in town') is puffing. A false statement of MATERIAL FACT is misrepresentation.","Confidentiality never covers a known material DEFECT. You may decline to state a seller's motivation; you may not lie about the roof.","Commingling - mixing client funds with the broker's own. CONVERSION is spending them - far worse.","Failure to present all offers. Every offer goes to the seller, including ones you dislike or that pay you less.","Undisclosed personal interest - a family or financial stake in a party must be disclosed in writing before the offer is considered.","Letting an unlicensed assistant discuss terms, negotiate, or hold an open house unaccompanied."]},{"check":[{"answer":0,"choices":["Ready, willing and able on the seller's terms","Pre-approved by any lender","Merely interested"],"q":"Commission is classically earned when the broker produces a buyer who is:","why":"Under most listings it is earned then, even if the seller refuses to close."},{"answer":0,"choices":["Arbitration or the courts","The licensing commission","The MLS board"],"q":"A dispute between two brokers over procuring cause is decided by:","why":"Commissions are not a licence-law matter."}],"h":"When commission is earned","p":["Classically, when the broker produces a buyer who is READY, WILLING, AND ABLE on the seller's stated terms. Under most modern listing agreements it is earned at that moment even if the seller then refuses to close. PROCURING CAUSE - the uninterrupted chain of events that produced the buyer - decides disputes between brokers, and is settled by arbitration or the courts, not the licensing commission."]}],"summary":"Agency is about whose interests you are legally bound to advance. A CLIENT gets fiduciary-level duties; a CUSTOMER gets honesty and disclosure of known material defects. Most agency questions are really asking which one the person is.","topic":"national/agency","traps":["Confidentiality and accounting survive termination. Loyalty, obedience, disclosure and care do not.","A subagent works with the buyer but owes duties to the SELLER.","Refusing an offer does not terminate the agency.","Commingling is mixing; conversion is spending. Know which the question describes."],"vocab":[["Agency","A relationship where one person acts for another with authority."],["Principal / client","The represented party, owed full duties."],["Customer","An unrepresented party owed honesty and material-defect disclosure."],["Fiduciary","One who holds a position of trust and must act in another's interest."],["OLD CAR","Obedience, Loyalty, Disclosure, Confidentiality, Accounting, Reasonable care."],["Express agency","Agency created by explicit written or spoken agreement."],["Implied agency","Agency created accidentally by conduct."],["Ratification","Approving an unauthorised act after it occurred."],["Estoppel","Being barred from denying an agency your conduct created."],["Special agent","Limited authority for a single transaction."],["General agent","Ongoing authority across a range of matters."],["Universal agent","Authority to act in all matters, typically by power of attorney."],["Subagent","An agent working through the listing broker, owing duties to the seller."],["Dual agent","A broker representing both parties in one transaction."],["Designated agent","A licensee assigned to represent one client exclusively within a firm."],["Puffing","Exaggerated opinion that is not a statement of fact."],["Misrepresentation","A false statement of material fact."],["Commingling","Mixing client trust funds with the broker's own funds."],["Conversion","Spending or using client trust funds."],["Procuring cause","The uninterrupted effort that produced a ready, willing and able buyer."],["Ready, willing and able","A buyer prepared to purchase on the seller's terms."]]},"national/contracts":{"blurb":"Formation, contingencies, breach and remedies, assignment.","counts_on_exam":true,"exam_questions":13,"examples":[{"k":"No contract on the original terms. The buyer may accept the late acceptance as a fresh offer, or walk away.","s":"The offer says acceptance must be RECEIVED by 5pm Friday. The seller signs at 3pm Friday but the acceptance is not delivered until Saturday morning.","t":"Signed in time, delivered too late","w":["Acceptance is effective on COMMUNICATION, not on signature.","Nothing was communicated before the deadline, so the offer lapsed.","The late acceptance is legally a new offer."]},{"k":"The buyer prevails and recovers the earnest money.","s":"The contract is contingent on financing at no more than 6.5%. The buyer is approved at 6.75% and terminates. The seller cries bad faith.","t":"Contingencies are read literally","w":["The parties fixed a number, and 6.75% does not meet it.","Courts enforce the stated term; materiality is not re-argued afterwards.","The buyer only needed to apply in good faith, which one genuine application meets."]},{"k":"Only a novation - substituting the party with the seller's consent - would release the original buyer.","s":"A buyer assigns her purchase contract to a third party. The contract is silent on assignment; the seller objects.","t":"Assignment does not free you","w":["Real estate contracts are assignable unless they say otherwise.","The assignment is valid over the seller's objection.","But the original buyer remains SECONDARILY liable."]}],"ga":["Georgia measures deadlines from the BINDING AGREEMENT DATE - the date acceptance is communicated to the offeror.","Georgia's standard DUE DILIGENCE period lets the buyer terminate for any reason and recover the earnest money. After it expires the buyer's exits narrow sharply.","A Georgia licensee may fill in blanks on approved preprinted forms. Drafting original clauses is the unauthorised practice of law.","Handwritten or typed special stipulations PREVAIL over conflicting preprinted text."],"label":"Contracts","portion":"national","sections":[{"check":[{"answer":0,"choices":["Earnest money","Consideration","Lawful object"],"q":"Which is NOT required for a valid contract?","why":"A promise for a promise is consideration enough."},{"answer":0,"choices":["In writing and signed by the party to be charged","Notarised","Recorded"],"q":"The Statute of Frauds requires a real estate contract to be:","why":"Writing and signature - not notarisation."}],"h":"The four essentials","l":["Competent parties - legal age and sound mind.","Mutual assent - a valid offer and an acceptance that mirrors it.","Consideration - something of value each way. A promise for a promise is enough, so earnest money is NOT what makes a contract valid.","Lawful object - a legal purpose.","For real estate, add the STATUTE OF FRAUDS: it must be in writing and signed by the party to be charged. Leases of a year or less are commonly exempt."]},{"check":[{"answer":0,"choices":["Voidable by the minor","Void","Voidable by the adult"],"q":"A minor's contract is:","why":"The adult party remains bound."},{"answer":0,"choices":["Void","Voidable","Unenforceable"],"q":"A contract for an illegal purpose is:","why":"It was never a contract at all."}],"h":"Valid, void, voidable, unenforceable","l":["VALID - meets all requirements and binds both.","VOID - never a contract at all (illegal purpose).","VOIDABLE - one party may disaffirm: a minor's contract (voidable by the MINOR, the adult stays bound), or one induced by fraud, duress, menace, undue influence, or mistake.","UNENFORCEABLE - looks valid but a court will not enforce it, e.g. an oral land contract barred by the Statute of Frauds."]},{"check":[{"answer":0,"choices":["Communicated to the offeror","Signed by the offeree","Notarised"],"q":"Acceptance is effective when:","why":"Signing alone is not acceptance."},{"answer":0,"choices":["Counteroffer","Conditional acceptance","Valid contract"],"q":"Changing one term in an offer creates a:","why":"A counteroffer rejects and replaces the original."}],"h":"Offer and acceptance","l":["Acceptance is effective when COMMUNICATED to the offeror. Signing alone is not acceptance.","MIRROR-IMAGE RULE - any change to terms is a COUNTEROFFER, which REJECTS the original and makes the former offeree the new offeror.","An offer terminates by: revocation before acceptance, rejection, counteroffer, lapse of the stated time, death or incapacity, or destruction of the property.","Private intent is irrelevant. Telling a friend you will probably accept changes nothing."]},{"check":[{"answer":0,"choices":["Unilateral contract","Bilateral contract","Executed contract"],"q":"An option is the classic example of a:","why":"The optionee need not buy; the optionor must sell if they do."},{"answer":0,"choices":["Executory","Executed","Void"],"q":"A contract signed but not yet closed is:","why":"Executed means fully performed."}],"h":"Contract classifications","l":["Bilateral - a promise for a promise. The typical purchase contract.","Unilateral - a promise for an ACT. An OPTION is the classic example: the seller must sell if the optionee exercises, but the optionee need not buy.","Executory - signed but not yet fully performed (between contract and closing).","Executed - fully performed by both. Careful: 'executed' also loosely means 'signed' in everyday speech, and the exam exploits that."]},{"check":[{"answer":0,"choices":["No","Yes, it is close enough","Only with seller consent"],"q":"A contingency for financing at no more than 6.5% is satisfied by approval at 6.75%?","why":"Courts enforce the number the parties wrote."},{"answer":0,"choices":["Condition precedent","Condition subsequent","Covenant"],"q":"A contingency is a:","why":"The duty to perform does not arise until it is met or waived."}],"h":"Contingencies","p":["A contingency is a condition precedent - the duty to perform does not arise until it is satisfied or waived. Read them exactly as written: an approval at 6.75% does not satisfy a contingency for financing at no more than 6.5%. The buyer must still apply in good faith."]},{"check":[{"answer":0,"choices":["Specific performance","Rescission","Reformation"],"q":"A court ordering the actual transfer of the property is:","why":"Available because land is legally unique."},{"answer":0,"choices":["Reformation","Rescission","Novation"],"q":"Correcting a wrong parcel number both parties agree was a typo is:","why":"The court rewrites the document to match true intent."}],"h":"Breach and remedies","l":["Specific performance - a court orders the actual transfer. Available because every parcel of land is legally unique.","Liquidated damages - the parties agree in advance what the loss is, usually the earnest money. Enforceable only if it is a reasonable pre-estimate; if it is so large it functions as a penalty, courts void it.","Compensatory damages - actual proven loss.","Rescission - unwind the contract and restore both parties to their prior position.","Reformation - a court REWRITES the document to reflect what the parties actually agreed, used for scrivener's errors like a wrong parcel number."]},{"check":[{"answer":0,"choices":["Secondarily liable","Fully released","Primarily liable"],"q":"After assigning a purchase contract, the original buyer is:","why":"Only a novation releases them."},{"answer":0,"choices":["Assignable unless they say otherwise","Never assignable","Assignable only with seller consent"],"q":"Real estate purchase contracts are:","why":"Silence means assignable."}],"h":"Assignment and novation","l":["ASSIGNMENT transfers RIGHTS. Real estate purchase contracts are assignable unless they say otherwise. The assignor stays SECONDARILY liable.","NOVATION substitutes a new party with everyone's consent and RELEASES the original. Only novation ends liability."]},{"check":[{"answer":0,"choices":["Legal title","Possession","Equitable title"],"q":"In a land contract the seller keeps:","why":"The buyer takes possession and equitable title."},{"answer":0,"choices":["Lets you match an offer the owner receives","Sets a price and forces a sale","Is the same as an option"],"q":"A right of first refusal:","why":"It is weaker than an option - no fixed price, no forced sale."}],"h":"Special contract forms","l":["Option - the optionee buys the RIGHT to decide, for option consideration that is usually nonrefundable. Once paid it is binding and not revocable; a recorded option binds later buyers with notice.","Land contract / contract for deed - the seller keeps LEGAL title while the buyer takes possession and EQUITABLE title, paying over time.","Lease option - a lease plus a right to buy.","Right of first refusal - the right to match an offer the owner receives; weaker than an option because it does not set a price or force a sale."]},{"check":[{"answer":0,"choices":["Performance within a reasonable time","No delay at all","A 30-day extension automatically"],"q":"Without a 'time is of the essence' clause, courts allow:","why":"The clause is what makes dates strict."},{"answer":0,"choices":["Seller","Buyer","Insurer"],"q":"Under the Uniform Vendor and Purchaser Risk Act, risk of loss before closing is on the:","why":"The older doctrine of equitable conversion put it on the buyer."}],"h":"Time and risk","l":["'Time is of the essence' turns stated dates into hard deadlines. Without it, courts allow performance within a REASONABLE time.","Equitable conversion (older rule) put risk of loss on the BUYER from signing. The Uniform Vendor and Purchaser Risk Act reverses that, leaving risk with the SELLER until title or possession passes."]}],"summary":"Contracts is the biggest block on the national exam (13 questions). Nearly every question reduces to one of three things: was a contract formed, what happens when someone does not perform, and can the deal be handed to someone else.","topic":"national/contracts","traps":["Earnest money is not consideration and not required for validity.","A minor's contract is voidable BY THE MINOR; the adult remains bound.","'Executed' means fully performed in exam language, not merely signed.","Assignment transfers rights but keeps you liable. Novation is the release."],"vocab":[["Statute of Frauds","Requires real estate contracts to be in writing and signed."],["Mutual assent","A valid offer met by a matching acceptance."],["Consideration","Something of value exchanged by each party."],["Void","Never a contract at all."],["Voidable","Valid until the protected party disaffirms."],["Unenforceable","Apparently valid but a court will not enforce it."],["Mirror-image rule","Acceptance must match the offer exactly or it is a counteroffer."],["Counteroffer","A response changing terms; rejects and replaces the original offer."],["Bilateral contract","A promise exchanged for a promise."],["Unilateral contract","A promise exchanged for an act."],["Executory","Signed but not yet fully performed."],["Executed","Fully performed by both parties."],["Contingency","A condition that must be met before performance is due."],["Condition precedent","A condition that must occur before a duty arises."],["Specific performance","A court order compelling the actual transfer."],["Liquidated damages","An amount agreed in advance as the measure of loss."],["Rescission","Unwinding a contract and restoring the parties."],["Reformation","Court correction of a document to reflect true intent."],["Assignment","Transfer of contract rights; assignor stays secondarily liable."],["Novation","Substituting a party and releasing the original."],["Option","A paid right to buy on set terms within a set time."],["Optionor / optionee","The one who must sell / the one who may buy."],["Land contract","Seller keeps legal title; buyer holds equitable title and possession."],["Equitable title","The buyer's interest after contracting but before closing."],["Right of first refusal","The right to match an offer the owner receives."],["Earnest money","A good-faith deposit; evidence of intent, not what makes the contract valid."],["Time is of the essence","A clause making stated dates strictly binding."],["Equitable conversion","The doctrine placing risk of loss on the buyer at signing."]]},"national/disclosures":{"blurb":"Material facts, latent defects, lead paint, environmental hazards.","counts_on_exam":true,"exam_questions":6,"examples":[{"k":"Disclose it. Silence here is the classic post-closing lawsuit.","s":"A seller fixed a chronic basement leak two years ago and it has not recurred. They ask whether it goes on the disclosure.","t":"Repaired, but still disclose","w":["Water intrusion history affects value, insurability, and recurrence risk.","That makes it material even though it is currently fixed.","Disclosing the problem AND the repair protects the seller."]},{"k":"Property facts are disclosable. Protected characteristics of people are not.","s":"A buyer asks whether a nearby group home houses people with disabilities.","t":"A question you should not answer","w":["Handicap is a protected class.","Answering, even truthfully and helpfully, facilitates steering.","Decline, and point the buyer to public sources they can research."]}],"ga":["Georgia expressly protects licensees from liability for NOT disclosing that a property was the site of a death, homicide, suicide, or felony.","Under BRRETA the duty runs to adverse material facts ACTUALLY KNOWN - there is no duty to inspect or investigate. But the duty runs to customers as well as clients.","The seller completes Georgia's property disclosure statement from personal knowledge. A licensee should never fill it in for them."],"label":"Property condition & disclosures","portion":"national","sections":[{"check":[{"answer":0,"choices":["Latent","Patent","Stigmatic"],"q":"A hidden defect not discoverable by ordinary inspection is:","why":"Known latent defects must be disclosed."},{"answer":0,"choices":["Still material and must be disclosed","No longer material once repaired","Disclosable only if asked"],"q":"A basement leak repaired two years ago is:","why":"History bears on recurrence and insurability."}],"h":"Material facts and defects","l":["Material fact - anything affecting value, desirability, or the decision to buy.","LATENT defect - hidden, not discoverable by ordinary inspection. Known latent defects MUST be disclosed, because the buyer cannot find them.","PATENT defect - obvious on reasonable inspection.","A past problem that was repaired is still material - a history of flooding bears on recurrence and insurability. Disclose the problem AND the repair.","No duty to DISCOVER, but no licence to IGNORE. A visible red flag you actually observe must be passed on."]},{"check":[{"answer":0,"choices":["Decline - handicap is a protected class","Answer truthfully","Answer only in writing"],"q":"A buyer asks whether a former occupant had AIDS. You:","why":"Disclosing it would itself be discriminatory."},{"answer":0,"choices":["Decline and refer them to public data","Describe it accurately","Give your impression"],"q":"A buyer asks about the racial makeup of a neighbourhood. You should:","why":"Answering steers, however well intentioned."}],"h":"What must NOT be disclosed","l":["A former occupant's HIV/AIDS status or other disability - handicap is protected.","The racial, religious, or ethnic makeup of a neighbourhood - answering steers.","Refer buyers to public data sources they can research themselves."],"p":["Facts about occupants that touch a protected class are off limits, because disclosing them facilitates discrimination:"]},{"check":[{"answer":0,"choices":["Events rather than physical condition","Structural defects","Environmental hazards"],"q":"Stigma arises from:","why":"A death, crime, or rumour - not condition."},{"answer":0,"choices":["Not volunteering the information","Denying it if asked","Both"],"q":"Georgia's protection covers:","why":"Nondisclosure is protected; an affirmative lie is not."}],"h":"Stigmatized property","p":["Stigma comes from events - a death, a crime, a rumour - not physical condition. Most states, including Georgia, do NOT require disclosure and expressly protect licensees from liability for staying silent. But protection covers NONDISCLOSURE, not an affirmative lie. If asked directly, decline rather than deny."]},{"check":[{"answer":0,"choices":["1978","1988","1968"],"q":"The lead rule applies to housing built before:","why":"Pre-1978 target housing."},{"answer":0,"choices":["Disclose known hazards and allow a 10-day test window","Test the property","Remove any lead paint"],"q":"The seller must:","why":"Sellers are never required to test."}],"h":"Lead-based paint (federal, applies everywhere)","l":["Applies to target housing built BEFORE 1978.","Seller must disclose known lead hazards and provide any records.","Buyer gets the EPA pamphlet and a 10-DAY opportunity to test.","The seller is never required to TEST. 'No knowledge' is a valid answer on the form."]},{"check":[{"answer":0,"choices":["Friable","Painted","Encapsulated"],"q":"Asbestos is most dangerous when it is:","why":"Friable means it crumbles and releases fibres."},{"answer":0,"choices":["Strict, joint and several, and retroactive","Limited to the polluter","Limited to commercial owners"],"q":"CERCLA liability is:","why":"An innocent current owner can be liable."}],"h":"Environmental hazards","l":["Radon - naturally occurring radioactive gas entering through foundation cracks; second leading cause of lung cancer. Fixed with sub-slab depressurisation.","Asbestos - dangerous when FRIABLE (crumbles and releases fibres). Often best ENCAPSULATED rather than removed, since bad removal increases exposure.","Lead - paint in pre-1978 housing, and older service pipes.","Underground storage tanks - leak into soil and groundwater.","Mould, formaldehyde, groundwater contamination, brownfields.","CERCLA / Superfund - liability is STRICT, JOINT AND SEVERAL, and RETROACTIVE. A current owner can be liable without fault. The INNOCENT LANDOWNER defence requires appropriate due diligence, such as a Phase I, BEFORE buying.","Phase I ESA - records, interviews, site visit, non-invasive. Phase II involves sampling and testing, and only follows if Phase I finds a concern."]},{"check":[{"answer":0,"choices":["Before or at the time of the offer","At closing","After inspection"],"q":"Seller disclosure should reach the buyer:","why":"Late delivery usually gives a right to rescind."},{"answer":0,"choices":["Records, interviews and a site visit","Soil sampling","Remediation"],"q":"A Phase I environmental assessment involves:","why":"Sampling is Phase II, and only if Phase I finds a concern."}],"h":"Timing","p":["Disclosure must reach the buyer early enough to weigh it before committing - normally before or at the time of the offer. Delivery after a binding contract typically gives the buyer a right to rescind."]}],"summary":"The rule is simple and the exceptions are what get tested: disclose known material facts about the PROPERTY; never disclose facts about the PEOPLE. Agents are not inspectors and have no duty to hunt for defects, but they cannot ignore what they see or repeat what they know to be false.","topic":"national/disclosures","traps":["External and stigma facts feel similar but are opposite: physical condition must be disclosed, stigma generally need not.","Nondisclosure protection never licenses an affirmative lie.","CERCLA liability can attach to an innocent current owner - fault is not required."],"vocab":[["Material fact","Anything affecting value, desirability, or the decision to buy."],["Latent defect","A hidden defect not discoverable by ordinary inspection."],["Patent defect","An obvious defect visible on reasonable inspection."],["Stigmatized property","Property made undesirable by events rather than condition."],["Caveat emptor","'Let the buyer beware' - largely displaced by disclosure duties."],["Target housing","Residential property built before 1978, covered by the lead rule."],["Friable","Able to be crumbled by hand, releasing fibres into the air."],["Encapsulation","Sealing a hazard in place instead of removing it."],["Radon","A naturally occurring radioactive gas that enters through the foundation."],["CERCLA","Superfund; imposes strict, joint and several, retroactive cleanup liability."],["Innocent landowner defence","A CERCLA defence requiring pre-purchase due diligence."],["Phase I ESA","A non-invasive environmental review of records and site conditions."],["Phase II ESA","Sampling and testing that follows a concerning Phase I."],["Brownfield","A property whose redevelopment is complicated by contamination."],["Fraudulent concealment","Actively hiding a known material defect."]]},"national/financing":{"blurb":"Loan types, points, amortization, TRID/RESPA, qualifying ratios.","counts_on_exam":true,"exam_questions":10,"examples":[{"k":"The seller-borrower owes the deficiency. Had the buyer ASSUMED, both would be liable - buyer primarily, seller secondarily - unless a novation released the seller.","s":"A buyer takes title 'subject to' the seller's existing loan, then defaults. Foreclosure leaves a $40,000 shortfall.","t":"Who owes the deficiency?","w":["'Subject to' means the buyer never promised to pay the note.","The buyer's only exposure was losing the property, which has happened.","The ORIGINAL borrower's promise is still outstanding."]},{"k":"Buy the points only if you will hold the loan longer than about four years.","s":"6.5% with no points, or 6.0% with 2 points on a $300,000 loan.","t":"Do the points pay for themselves?","w":["Points cost 2% x $300,000 = $6,000.","Rate saving is 0.5% x $300,000 = $1,500 in the first year.","$6,000 / $1,500 = 4 years to break even."]},{"k":"The buyer must cover the $10,000 gap on top of the normal down payment, and without a contingency has no automatic right to walk.","s":"Contract price $310,000; appraisal comes in at $300,000; the loan is 80% LTV. There is no appraisal contingency.","t":"The appraisal gap","w":["The lender lends on the LESSER figure: 80% x $300,000 = $240,000.","The buyer still owes the contract price of $310,000.","$310,000 - $240,000 = $70,000 due in cash."]}],"ga":["Georgia uses a SECURITY DEED, which conveys legal title to the lender until the debt is paid. That is why Georgia foreclosures are NONJUDICIAL under a power of sale.","Georgia foreclosure: notice to the borrower plus advertisement in the county legal organ, customarily four weeks, then a public sale on the courthouse steps on the FIRST TUESDAY of the month."],"label":"Financing","portion":"national","sections":[{"check":[{"answer":0,"choices":["The promissory note","The security deed","The deed of trust"],"q":"Which document is the borrower's promise to repay?","why":"The note is the debt; the security instrument pledges the collateral."},{"answer":0,"choices":["Security deed","Mortgage","Deed of trust"],"q":"Georgia's security instrument is a:","why":"A security deed passes legal title to the lender until payoff."}],"h":"The two documents","l":["Promissory note - the borrower's personal promise to repay. This is the debt.","Security instrument - pledges the property as collateral. A MORTGAGE creates a lien in most states. A DEED OF TRUST adds a third party, the TRUSTEE, who holds title for the lender and can sell without a lawsuit. GEORGIA uses a SECURITY DEED (deed to secure debt), which passes legal title to the lender until payoff.","Mortgagor = borrower. Mortgagee = lender. The '-or' gives, the '-ee' receives."]},{"check":[{"answer":0,"choices":["Alienation","Acceleration","Defeasance"],"q":"Which clause is triggered by a TRANSFER rather than a default?","why":"Alienation is the due-on-sale clause."},{"answer":0,"choices":["Defeasance","Subordination","Acceleration"],"q":"The clause requiring the lender to release the lien on payoff is:","why":"Defeasance defeats the lien when the debt is paid."}],"h":"Clauses you must recognise","l":["Acceleration - on DEFAULT the whole balance becomes due. A prerequisite to foreclosure.","Alienation (due-on-sale) - on TRANSFER the whole balance becomes due. Triggered by sale, not default.","Defeasance - requires the lender to release the lien when the debt is paid.","Subordination - voluntarily moves a lien to lower priority, so a construction lender can take first position.","Prepayment penalty - a charge for paying early.","Release (partial release) - in a blanket mortgage, frees individual lots as portions of the debt are paid."]},{"check":[{"answer":0,"choices":["Taking title subject to the loan","Assumption","Novation"],"q":"Which arrangement leaves the buyer with NO personal liability?","why":"'Subject to' means the buyer risks only the property."},{"answer":0,"choices":["Novation","Assumption","Acceleration"],"q":"What releases the original borrower from liability?","why":"Only a novation substitutes the party and releases the original."}],"h":"Taking over an existing loan","l":["ASSUMPTION - the buyer becomes PRIMARILY liable; the seller stays SECONDARILY liable until the lender grants a release.","NOVATION - the lender substitutes the new borrower and RELEASES the original. Only a novation frees the seller.","'SUBJECT TO' - the buyer takes title but accepts NO personal liability. On default the buyer loses the property; the ORIGINAL borrower still owes any deficiency."]},{"check":[{"answer":0,"choices":["Partially amortized","Fully amortized","A term loan"],"q":"A loan with level payments that leaves a balloon is:","why":"Fully amortized retires the debt by maturity; a term loan is interest only."},{"answer":0,"choices":["Shrinks","Grows","Stays the same"],"q":"In an amortized loan, over time the interest portion of each payment:","why":"As principal is repaid, interest on the balance falls."}],"h":"Amortization","l":["Fully amortized - level payments retire principal and interest by maturity.","Partially amortized - level payments leave a BALLOON at the end.","Term (straight) loan - interest only, principal due at the end.","In an amortized loan the INTEREST portion shrinks and the principal portion grows with each payment. Interest for one month = balance x annual rate / 12."]},{"check":[{"answer":0,"choices":["Loan amount","Sale price","Appraised value"],"q":"One discount point equals 1% of the:","why":"Always the loan. This is the most common math error."},{"answer":0,"choices":["The lesser of price and appraised value","The sale price always","The appraised value always"],"q":"LTV is based on:","why":"Lenders lend on the lower figure."}],"h":"Points, yield, and LTV","l":["One discount point = 1% of the LOAN AMOUNT, never the sale price.","Points are prepaid interest that raise the lender's YIELD, letting the borrower take a lower note rate. Roughly 8 points move the yield about 1%.","Origination fee compensates the lender for making the loan; also a % of the loan.","LTV = loan / value, where value is the LESSER of sale price and appraised value.","Conventional loans above 80% LTV require PMI, which protects the LENDER. FHA carries MIP instead; VA carries a funding fee and no monthly mortgage insurance."]},{"check":[{"answer":0,"choices":["The lender","The borrower","The seller"],"q":"PMI protects:","why":"Private mortgage insurance covers the lender's risk above 80% LTV."},{"answer":0,"choices":["Index plus margin","Index minus margin","The cap rate"],"q":"An ARM's interest rate equals:","why":"The margin is the lender's constant markup; the index moves."}],"h":"Loan programmes","l":["Conventional - not government backed. Conforming loans meet Fannie/Freddie limits.","FHA - insured by FHA, low down payment, MIP required.","VA - guaranteed for eligible veterans, no down payment, funding fee. Entitlement stays committed until the loan is paid or another veteran substitutes theirs.","ARM - rate = INDEX + MARGIN, adjusted periodically with periodic and lifetime caps. The margin is the lender's constant markup; the index moves with the market.","Purchase-money mortgage - seller financing taken back at the sale.","Blanket - covers multiple parcels, with a release clause.","Package - includes personal property.","Open-end - lets the borrower re-borrow up to a limit.","Wraparound - a new loan wrapped around an existing one the seller keeps paying.","Construction loan - short term, paid out in draws."]},{"check":[{"answer":0,"choices":["Buys existing loans from lenders","Originates loans to consumers","Sets federal interest rates"],"q":"The secondary mortgage market:","why":"It provides liquidity so lenders can lend again."},{"answer":0,"choices":["Primary market","Secondary market","Federal Reserve"],"q":"A consumer applying for a mortgage deals with the:","why":"Consumers never deal with the secondary market directly."}],"h":"The markets","p":["The PRIMARY market originates loans to consumers. The SECONDARY market - Fannie Mae, Freddie Mac, Ginnie Mae - BUYS existing loans, returning cash to lenders so they can lend again. Consumers never deal with the secondary market directly."]},{"check":[{"answer":0,"choices":["3 business days before consummation","3 business days after application","At the closing table"],"q":"The Closing Disclosure must be received:","why":"The Loan Estimate is the one tied to application."},{"answer":0,"choices":["Payment for the mere referral of settlement business","Charging an origination fee","Requiring a survey"],"q":"RESPA Section 8 prohibits:","why":"Fees for services actually performed are fine."}],"h":"Consumer protection law","l":["TILA / Regulation Z - discloses the cost of credit, including the APR, and governs trigger terms in advertising.","RESPA - governs settlement services. Section 8 bans paying or receiving anything of value for the mere REFERRAL of settlement business. Fees for services actually performed are fine.","TRID timing - Loan Estimate within 3 business days of APPLICATION; Closing Disclosure received at least 3 business days before CONSUMMATION.","Only three changes restart the 3-day CD clock: the APR becomes inaccurate beyond tolerance, the LOAN PRODUCT changes, or a PREPAYMENT PENALTY is added.","ECOA - bars discrimination in lending on race, colour, religion, national origin, sex, marital status, age, or receipt of public assistance. A denied applicant is entitled to SPECIFIC reasons, or notice of the right to request them within 60 days.","Usury laws cap the maximum lawful interest rate."]}],"summary":"Two documents do two jobs: the NOTE is the promise to repay, the SECURITY INSTRUMENT pledges the property. Everything else - clauses, loan types, disclosure rules - hangs off that split. Georgia uses a security deed rather than a mortgage.","topic":"national/financing","traps":["Points are a percentage of the LOAN, not the sale price. This is the single most common math error on the exam.","PMI protects the LENDER, never the borrower.","Assumption leaves the seller secondarily liable. Only NOVATION releases them.","Loan Estimate = 3 days after application. Closing Disclosure = 3 days before closing. Don't merge them."],"vocab":[["Promissory note","The borrower's written promise to repay the debt."],["Security deed","Georgia's instrument conveying title to the lender as security."],["Deed of trust","A three-party security instrument using a trustee."],["Mortgagor / mortgagee","Borrower / lender."],["Acceleration clause","Makes the entire balance due on default."],["Alienation clause","Due-on-sale; makes the balance due on transfer."],["Defeasance clause","Requires release of the lien when the debt is paid."],["Subordination","Voluntarily lowering a lien's priority."],["Assumption","Buyer takes over the loan and becomes primarily liable."],["Novation","Substituting a new party and releasing the original."],["Subject to","Taking title without personal liability on the loan."],["Deficiency judgment","A judgment for the shortfall after a foreclosure sale."],["Fully amortized loan","Level payments that retire the debt by maturity."],["Balloon payment","A large final payment on a partially amortized loan."],["Discount point","1% of the loan amount, paid to raise the lender's yield."],["Origination fee","A lender's charge for making the loan, as a % of the loan."],["Loan-to-value (LTV)","Loan divided by the lesser of price or appraised value."],["PMI","Private mortgage insurance on conventional loans above 80% LTV; protects the lender."],["MIP","FHA's mortgage insurance premium."],["Funding fee","The VA's one-time charge in place of mortgage insurance."],["Index and margin","An ARM's moving benchmark plus the lender's fixed markup."],["Purchase-money mortgage","Seller financing taken back at closing."],["Blanket mortgage","One loan covering several parcels, with a release clause."],["Wraparound mortgage","A new loan encompassing an existing one that stays in place."],["Primary market","Where loans are originated to consumers."],["Secondary market","Where existing loans are bought and sold, providing liquidity."],["Regulation Z","TILA's implementing rule; governs APR and credit advertising."],["RESPA","Governs settlement services and bans kickbacks for referrals."],["Loan Estimate","TRID disclosure due within 3 business days of application."],["Closing Disclosure","TRID form the borrower must receive 3 business days before closing."],["ECOA","Equal Credit Opportunity Act; bars discrimination in lending."],["Usury","Charging interest above the legal maximum."]]},"national/landuse":{"blurb":"Zoning, deed restrictions, eminent domain, police power, CC&Rs.","counts_on_exam":true,"exam_questions":5,"examples":[{"k":"The owner loses. A taking requires denial of ALL economically viable use, not a large loss of value.","s":"A city downzones an area. An owner's lot stays usable but is worth 40% less. The owner sues claiming a taking.","t":"Value loss is not a taking","w":["Ask the only question that matters: does ANY economically viable use remain?","It does - the lot is still usable, just less profitably.","Diminution in value alone, even substantial, is a cost of regulation."]},{"k":"Destruction, abandonment, and changing to a different nonconforming use are the three classic ways the protection is lost.","s":"A legal nonconforming gas station burns down. The owner wants to rebuild it exactly as it was.","t":"Losing nonconforming status","w":["Nonconforming rights exist to phase a use out, not preserve it forever.","Most ordinances end the status on destruction beyond a stated percentage.","Rebuilding therefore requires conforming to current zoning, or a variance."]}],"ga":["Georgia subdivisions are typically described by LOT AND BLOCK from a plat recorded with the clerk of superior court in the county where the land lies."],"label":"Land use controls","portion":"national","sections":[{"check":[{"answer":0,"choices":["Eminent domain","Police power","Escheat"],"q":"Which power requires the government to pay just compensation?","why":"Only eminent domain takes and must pay. Police power regulates for free."},{"answer":0,"choices":["Escheat","Eminent domain","Condemnation"],"q":"Property passing to the state when someone dies with no will and no heirs is:","why":"Escheat prevents land from being ownerless."}],"h":"The four public powers (PETE)","l":["Police power - regulate for health, safety, morals, and general welfare. Zoning, building codes, and environmental rules. NO compensation is paid.","Eminent domain - TAKE private property for public use. Just compensation IS required. The lawsuit that exercises it is CONDEMNATION.","Taxation - levy against property to fund government.","Escheat - property passes to the state when an owner dies with no will and no locatable heirs."]},{"check":[{"answer":0,"choices":["Variance","Special use permit","Rezoning"],"q":"An owner needs relief from a setback requirement. They seek a:","why":"A variance addresses a dimensional hardship."},{"answer":0,"choices":["Nonconforming use","Variance","Spot zoning"],"q":"A store that predates new residential zoning may continue as a:","why":"A lawful pre-existing use is grandfathered."}],"h":"Zoning and relief from it","l":["Comprehensive (master) plan - the long-range policy document. Zoning is the ordinance that IMPLEMENTS the plan parcel by parcel.","Nonconforming use - a lawful use that predates the new zoning may continue ('grandfathered'). It is usually LOST on destruction beyond a set percentage, on abandonment for a stated period, or on change to a different nonconforming use.","Variance - permission to deviate from a DIMENSIONAL requirement (setback, height) because strict compliance creates a unique hardship the owner did not cause.","Special use / conditional use permit - allows a listed USE that needs review, such as a church or a school in a residential zone.","Spot zoning - rezoning one parcel inconsistently with the plan for one owner's benefit. Generally invalid.","Downzoning - reducing permitted intensity across an area.","Buffer zone - a strip separating incompatible districts.","Setback - the required distance from a lot line to a structure."]},{"check":[{"answer":0,"choices":["Denies all economically viable use","Reduces value by more than a third","Changes the zoning classification"],"q":"A regulation becomes a taking when it:","why":"Loss of value alone, even large, is not a taking."},{"answer":0,"choices":["Inverse condemnation","Escheat","Quiet title"],"q":"An owner suing on the ground that a regulation went too far brings an action in:","why":"Inverse condemnation claims a regulatory taking."}],"h":"When regulation becomes a taking","p":["A regulation is a valid exercise of police power even if it reduces value. It becomes a TAKING requiring compensation only when it denies ALL economically viable use. An owner claiming a regulation went that far sues in INVERSE CONDEMNATION."]},{"check":[{"answer":0,"choices":["Any benefited lot owner or the HOA","The zoning board","The state commission"],"q":"Recorded subdivision covenants are enforced by:","why":"CC&Rs are private; government does not enforce them."},{"answer":0,"choices":["The more restrictive one","Zoning always","The covenant always"],"q":"Where a covenant and zoning conflict, which controls?","why":"The more restrictive requirement governs."}],"h":"Private controls","l":["CC&Rs / restrictive covenants - recorded private restrictions that RUN WITH THE LAND and bind later buyers. Any benefited owner (or the HOA) may enforce them, usually by injunction. Government does not enforce them.","Defences to enforcement: abandonment through widespread non-enforcement, and laches where delay has prejudiced the defendant.","Where a covenant and zoning conflict, the MORE RESTRICTIVE one controls."]},{"check":[{"answer":0,"choices":["Certificate of occupancy","Building permit","Variance"],"q":"The document confirming a building may lawfully be occupied is the:","why":"The permit starts the work; the certificate of occupancy ends it."},{"answer":0,"choices":["Major federal actions significantly affecting the environment","Every subdivision","Any home resale"],"q":"An Environmental Impact Statement is required for:","why":"NEPA applies to major FEDERAL actions."}],"h":"Codes, permits, and environmental review","l":["Building permit and inspections exist for public safety, not revenue. The CERTIFICATE OF OCCUPANCY at the end confirms lawful occupancy.","NEPA requires an Environmental Impact Statement for major FEDERAL actions significantly affecting the environment."]}],"summary":"Two systems restrict what an owner may do: PUBLIC controls imposed by government, and PRIVATE controls created by contract or deed. The most common exam error is mixing them up - zoning is public and enforced by the municipality, CC&Rs are private and enforced by owners or an HOA.","topic":"national/landuse","traps":["Eminent domain is the POWER; condemnation is the PROCEEDING.","A variance is for dimensional hardship; a special use permit is for a different type of use. Questions swap them constantly.","Zoning is public and enforced by government. CC&Rs are private and enforced by owners."],"vocab":[["Police power","Government's power to regulate land use for public welfare without paying."],["Eminent domain","The power to take private property for public use with just compensation."],["Condemnation","The legal proceeding that exercises eminent domain."],["Inverse condemnation","An owner's suit claiming regulation has effectively taken the property."],["Escheat","Transfer to the state when an owner dies with no will and no heirs."],["Comprehensive plan","The long-range policy guide that zoning implements."],["Nonconforming use","A lawful pre-existing use that does not meet current zoning."],["Variance","Permission to deviate from a dimensional zoning requirement on hardship grounds."],["Special use permit","Approval for a listed conditional use in a district."],["Spot zoning","Rezoning one parcel inconsistently with the plan; generally invalid."],["Downzoning","Reducing the permitted intensity of use across an area."],["Buffer zone","A transitional strip between incompatible zoning districts."],["Setback","The required distance between a lot line and a structure."],["CC&Rs","Covenants, conditions and restrictions - recorded private land use controls."],["Run with the land","A restriction or benefit that binds and passes to later owners."],["Certificate of occupancy","The document confirming a structure may lawfully be occupied."],["Environmental Impact Statement","The NEPA study required for major federal actions."],["Plat","A recorded subdivision map showing lots, blocks, and easements."]]},"national/math":{"blurb":"Commissions, prorations, LTV, points, area, appreciation.","counts_on_exam":true,"exam_questions":5,"examples":[{"k":"$7,869.40. The wrong answers are the totals from each earlier step - stopping early is the trap.","s":"$511,000 sale, 5.5% total commission. The listing brokerage keeps 40% and pays the rest to the co-op brokerage. The listing agent's split is 70% to the agent.","t":"Commission all the way down","w":["Total = $511,000 x 5.5% = $28,105","Listing brokerage = $28,105 x 40% = $11,242","Listing agent = $11,242 x 70% = $7,869.40"]},{"k":"Adding 7% to $480,000 gives $513,600 - always offered, always wrong.","s":"The seller wants to net $478,000 after $2,000 of costs and a 7% commission.","t":"Net to seller","w":["The seller must clear $478,000 + $2,000 = $480,000","That $480,000 is the 93% left after commission","Price = $480,000 / 0.93 = $516,129.03"]},{"k":"$940.67 as a seller DEBIT and buyer CREDIT, because the buyer will pay the whole bill later.","s":"Annual taxes $4,980, unpaid. Closing March 9, 360-day year, seller responsible through the day before closing.","t":"Unpaid tax proration","w":["Daily = $4,980 / 360 = $13.83","Seller's days = 2 full months x 30 + 8 = 68 days","Seller's share = $13.83 x 68 = $940.67"]}],"ga":["Georgia transfer tax is $1.00 per $1,000 of consideration - divide the price by 1,000.","Georgia property taxes become a lien on JANUARY 1, which is why closings prorate them."],"label":"Real estate math","portion":"national","sections":[{"check":[{"answer":0,"choices":["43,560 sq ft","5,280 sq ft","640 sq ft"],"q":"One acre equals:","why":"A mile is 5,280 FEET; a section is 640 ACRES."},{"answer":0,"choices":["640 acres","36 acres","43,560 acres"],"q":"One section equals:","why":"One square mile. A township is 36 sections."}],"h":"Conversions to memorise","l":["1 acre = 43,560 square feet","1 mile = 5,280 feet","1 section = 640 acres = 1 square mile","1 township = 36 sections","1 square yard = 9 square feet","Area of a rectangle = length x width. Triangle = 1/2 base x height."]},{"check":[{"answer":0,"choices":["Sale price","Loan amount","Appraised value"],"q":"Commission is a percentage of the:","why":"Points are on the loan; commission is on the price."},{"answer":0,"choices":["$9,000","$18,000","$4,500"],"q":"$300,000 sale at 6%, split 50/50 between two brokerages. Each brokerage gets:","why":"$18,000 total, halved."}],"h":"Commission","p":["Commission is always a percentage of the SALE price, then split - first between brokerages, then between each brokerage and its agent. Work outward one step at a time and do not stop at the total."]},{"check":[{"answer":0,"choices":["Loan","Sale price","Down payment"],"q":"Discount points are a percentage of the:","why":"The single most common math error on the exam."},{"answer":0,"choices":["Sale price","Loan","Assessed value"],"q":"Georgia transfer tax is a percentage of the:","why":"$1.00 per $1,000 of consideration."}],"h":"Percentage of loan vs. percentage of price","l":["Discount points and origination fees: percentage of the LOAN.","Commission and transfer tax: percentage of the SALE price.","LTV: loan divided by the LESSER of price and appraised value."]},{"check":[{"answer":0,"choices":["Divide by (100% - commission%)","Add the commission percentage","Multiply by the commission rate"],"q":"To find the price giving a target net after commission, you:","why":"Adding always understates the price."},{"answer":0,"choices":["$200,000","$199,500","$180,500"],"q":"Seller wants $190,000 net with a 5% commission. Price is:","why":"$190,000 / 0.95. Adding 5% gives $199,500 - the trap."}],"h":"Net to seller - divide, never add","p":["To find the price that produces a target net, add the seller's costs to the target, then DIVIDE by (100% - commission%). Adding the commission percentage back on always understates the price, because the commission is a percentage of the larger sale price, not of the net."]},{"check":[{"answer":0,"choices":["Seller debit and buyer credit","Seller credit and buyer debit","Debit to both"],"q":"Unpaid taxes at closing produce a:","why":"The buyer will pay the whole bill later."},{"answer":0,"choices":["The day before closing","Closing day","The day after closing"],"q":"The seller owns the property through:","why":"The buyer owns closing day forward."}],"h":"Prorations","l":["Work out the daily rate, count the days, assign them to the right party.","A 360-day banker's year (30-day months) is the exam default unless told otherwise.","The SELLER owns through the day BEFORE closing; the buyer owns closing day forward.","UNPAID item (taxes in arrears): the seller owes for their time -> seller DEBIT, buyer CREDIT.","PREPAID item (rent collected, insurance paid ahead): the seller already has the benefit -> seller CREDIT... except rent, where the seller HOLDS the buyer's cash, so seller DEBIT, buyer CREDIT.","Ask 'who has the money, and who will get the benefit?' and the direction follows."]},{"check":[{"answer":0,"choices":["Principal x annual rate / 12","Principal x annual rate","Principal / rate x 12"],"q":"One month's interest equals:","why":"Use the current balance."},{"answer":0,"choices":["$1,000","$12,000","$500"],"q":"$200,000 at 6% - one month's interest is:","why":"$12,000 / 12."}],"h":"Interest","p":["Interest for one month = principal x annual rate / 12. In an amortized loan the interest portion shrinks as principal is repaid, so 'interest on the NEXT payment' uses the CURRENT balance."]},{"check":[{"answer":0,"choices":["The new value each year","The original value each year","The average value"],"q":"Compound appreciation applies the rate to:","why":"Multiply by (1 + rate) once per year."},{"answer":0,"choices":["The same dollar amount off each year","A shrinking amount each year","A growing amount each year"],"q":"Straight-line depreciation takes:","why":"Basis divided by useful life."}],"h":"Appreciation and depreciation","l":["COMPOUND appreciation applies the rate to the NEW value each year: multiply by (1 + rate) once per year.","STRAIGHT-LINE depreciation takes the same dollar amount off the original basis every year: basis / useful life.","Simple (non-compound) growth multiplies the original by (1 + rate x years) - the classic wrong answer on a compound question."]},{"check":[{"answer":0,"choices":["Gross monthly income","Net monthly income","Annual income"],"q":"The front-end ratio compares housing expense to:","why":"Convert annual to monthly first."},{"answer":0,"choices":["All recurring monthly debt","Only the mortgage","Utilities"],"q":"The back-end ratio adds:","why":"Car loans, student loans, credit cards."}],"h":"Qualifying ratios","p":["Front-end ratio = housing expense (PITI) / gross monthly income. Back-end adds all recurring monthly debt. Convert annual income to monthly FIRST."]}],"summary":"Real estate math is arithmetic with vocabulary attached. Almost every mistake is choosing the wrong BASE - a percentage of the loan versus the price, or of the net versus the sale price. Identify the base first, then compute.","topic":"national/math","traps":["Points on the LOAN, commission on the PRICE. Mixing these is the top math error.","Net-to-seller is division, not addition.","Compound appreciation multiplies each year; simple growth does not.","Convert annual income to monthly before applying a qualifying ratio."],"vocab":[["Acre","43,560 square feet."],["Section","One square mile, 640 acres."],["Township","36 sections, six miles square."],["Front foot","A measure of frontage along a street or water."],["Basis","The original cost used to compute depreciation or gain."],["Straight-line depreciation","Equal annual deductions over a useful life."],["Proration","Dividing a shared expense between buyer and seller at closing."],["Banker's year","A 360-day year of twelve 30-day months."],["Debit","An amount a party owes at closing."],["Credit","An amount reducing what a party owes."],["Front-end ratio","Housing expense divided by gross monthly income."],["Back-end ratio","All recurring debt divided by gross monthly income."],["PITI","Principal, interest, taxes, and insurance."]]},"national/ownership":{"blurb":"Estates, tenancy, condos/co-ops, fixtures, water and air rights.","counts_on_exam":true,"exam_questions":8,"examples":[{"k":"Durational words (so long as, while, during, until) = determinable = automatic. Conditional words (but if, provided that, on condition that) = condition subsequent = the grantor must act.","s":"Ann conveys land 'to the city so long as it is used as a park.' The city later builds offices on it.","t":"Determinable fee vs. condition subsequent","w":["'So long as' is durational language, so this is a fee simple DETERMINABLE.","A determinable fee ends AUTOMATICALLY the moment the condition is broken.","Title reverts to Ann (or her heirs) with no lawsuit required."]},{"k":"The son receives nothing in this property. A will only passes what the person still owned at death.","s":"Two sisters own a lake house as joint tenants. One dies leaving a will giving 'all my real property' to her son.","t":"Survivorship beats a will","w":["Survivorship operates at the instant of death.","At that instant the deceased sister's interest disappears into the survivor's.","There is nothing left for the will to pass."]},{"k":"The tenant may remove it before the lease ends and must repair the damage. If they leave it past lease end, it can become the landlord's.","s":"A commercial tenant bolts refrigeration units to the floor of a leased space. The lease is silent. The lease ends.","t":"Is it a fixture?","w":["Bolting looks like annexation, which would normally make it a fixture.","But the tenant is COMMERCIAL and installed it to run the business.","That makes it a TRADE FIXTURE, which stays the tenant's personal property."]}],"ga":["Georgia does NOT recognise tenancy by the entirety. Married Georgians who want survivorship hold as joint tenants with right of survivorship, stated expressly in the deed.","A Georgia licensee who buys, sells, or leases property for their own account must disclose their licensed status in writing in the contract or lease, and must place any trust funds in an account approved by their broker."],"label":"Property ownership","portion":"national","sections":[{"check":[{"answer":0,"choices":["Exclude","Dispose","Encumber"],"q":"Which right lets an owner keep other people off the land?","why":"Exclude is the right to keep others out. Dispose is the right to sell or will it."},{"answer":0,"choices":["The bundle's rights can be separated and sold individually","Mineral rights were never part of ownership","Only fee simple defeasible allows it"],"q":"An owner sells the mineral rights but keeps the surface. This is possible because:","why":"The sticks in the bundle can be split off and conveyed on their own."}],"h":"The bundle of rights","l":["Dispose - sell, gift, will, or encumber it","Use - occupy and use it for any lawful purpose","Possess - occupy it and exclude others","Exclude - keep others off","Sell/transfer - convey title to someone else"],"p":["Ownership is not one right but several that can be separated and sold independently. Remember them as DUPES."]},{"check":[{"answer":0,"choices":["Fee simple determinable","Fee on condition subsequent","Life estate"],"q":"'To the city so long as it is used as a park' creates a:","why":"Durational words - so long as, while, until - create a determinable fee that ends automatically."},{"answer":0,"choices":["Pur autre vie","A reversion","A remainder"],"q":"A life estate measured by someone else's life is:","why":"Pur autre vie means 'for another's life'."}],"h":"Freehold estates: ownership without a fixed end","l":["Fee simple absolute - the whole bundle, no conditions, no time limit. The most complete ownership the law recognises.","Fee simple defeasible - ownership that can be LOST if a condition happens. A DETERMINABLE fee ends automatically the instant the condition occurs (the grantor holds a possibility of reverter). A fee on CONDITION SUBSEQUENT does not end automatically - the grantor must act on a right of re-entry.","Life estate - lasts for someone's lifetime. Measured by the holder's life, or by a third party's life (pur autre vie). When it ends, the property goes to the REMAINDERMAN, or back to the grantor as a REVERSION."],"p":["A freehold lasts for an indefinite time. The three you must know:"]},{"check":[{"answer":0,"choices":["Estate for years","Periodic estate","Estate at will"],"q":"A 60-day lease with fixed start and end dates is an:","why":"Fixed start and end makes it an estate for years, regardless of length."},{"answer":0,"choices":["Estate at sufferance","Estate at will","Periodic estate"],"q":"A tenant who stays after the lease ends without permission holds an:","why":"Sufferance: possession with no right, but entry was originally lawful."}],"h":"Leasehold estates: possession with an end date","l":["Estate for years - fixed start and end. Ends automatically; no notice needed. 'Years' is misleading: a 30-day lease with fixed dates is an estate for years.","Periodic estate - renews itself (month to month) until someone gives notice.","Estate at will - continues at the pleasure of both parties, endable any time.","Estate at sufferance - a holdover who stays without permission. Lowest estate: possession with no right, but entry was originally lawful so it is not trespass."],"p":["A leasehold gives possession, not ownership. The landlord keeps the LEASED FEE; the tenant holds the leasehold."]},{"check":[{"answer":0,"choices":["Tenancy in common","Joint tenancy","Tenancy by the entirety"],"q":"Which form has NO right of survivorship?","why":"Tenancy in common shares pass by will or inheritance."},{"answer":0,"choices":["Tenant in common","Joint tenant","Life tenant"],"q":"One joint tenant sells her share to a stranger. The buyer becomes a:","why":"Selling severs the unities as to that share; the buyer takes as a tenant in common."}],"h":"Co-ownership","l":["Tenancy in common - shares may be unequal, NO survivorship, each share passes by will or inheritance. The default when a deed says nothing.","Joint tenancy - equal shares with RIGHT OF SURVIVORSHIP. Requires the four unities: Possession, Interest, Time, Title (PITT). Selling a share severs the joint tenancy as to that share; the buyer becomes a tenant in common.","Tenancy by the entirety - joint tenancy between spouses that neither can sever alone. GEORGIA DOES NOT RECOGNISE IT.","Community property - a marital form used in nine states; Georgia is not one."],"p":["Ask two questions: is there a right of survivorship, and can one owner convey their share alone?"]},{"check":[{"answer":0,"choices":["Shares of stock plus a proprietary lease","The unit in fee simple","An undivided share of the land"],"q":"A cooperative resident owns:","why":"A co-op owner holds personal property - stock - not real property."},{"answer":0,"choices":["Assessments and usually voting weight","The unit's square footage","The property tax rate"],"q":"A condo owner's percentage of the common elements mainly determines:","why":"The percentage set in the declaration drives assessments and voting."}],"h":"Condominiums, cooperatives, and timeshares","l":["Condominium - you own your unit in fee simple, PLUS an undivided tenancy-in-common share of the common elements. That percentage, set in the declaration, drives your assessments and usually your voting weight, and cannot be sold separately from the unit.","Cooperative - a corporation owns the whole building. You own SHARES of stock plus a proprietary lease on your unit. You own personal property, not real property.","Timeshare estate - a deeded fractional real property interest. A right-to-use timeshare is only a contract right to occupy, which expires with the contract."]},{"check":[{"answer":0,"choices":["Intent","Method of annexation","Cost of the item"],"q":"Which test carries the most weight in deciding whether something is a fixture?","why":"MAI: method, adaptation, intent - and intent weighs heaviest."},{"answer":0,"choices":["A trade fixture the tenant may remove","A fixture that stays with the building","An emblement"],"q":"A restaurant tenant's bolted-down pizza oven is:","why":"Commercial tenants' business equipment stays their personal property."}],"h":"Fixtures","l":["Method of annexation - how firmly is it attached?","Adaptation - is it specially fitted to this property?","Intent - what did the person attaching it intend? Intent carries the most weight.","TRADE FIXTURES are the exception: items a COMMERCIAL TENANT installs to run their business stay the tenant's personal property and may be removed before the lease ends, with damage repaired. Left past lease end, they can be forfeited."],"p":["A fixture is personal property that has become part of the real estate, so it conveys with the property unless the contract excludes it. Courts weigh three things, remembered as MAI:"]},{"check":[{"answer":0,"choices":["Dominant tenement","Servient tenement","Licensed parcel"],"q":"The parcel that BENEFITS from an easement appurtenant is the:","why":"Dominant benefits; servient is burdened."},{"answer":0,"choices":["Easement in gross","Easement appurtenant","Encroachment"],"q":"A utility company's right to run a line across land is an:","why":"It benefits a company, not a parcel, so there is no dominant tenement."}],"h":"Encumbrances: other people's claims on your land","l":["Easement appurtenant - runs with the land and benefits an adjoining parcel. The benefited parcel is the DOMINANT tenement; the burdened one is the SERVIENT tenement. It passes automatically to later owners.","Easement in gross - benefits a person or company, not a parcel. No dominant tenement. Commercial ones (utilities) are assignable and survive a sale.","Easement by necessity - implied when a parcel is landlocked by the seller's own severance of the land.","Easement by prescription - acquired by long, open, hostile use.","Licence - mere permission to use land. Personal and revocable at any time.","Encroachment - an unauthorised physical intrusion, usually found by SURVEY.","Lien - a money claim against the property.","Deed restriction / CC&R - a private restriction enforceable by benefited owners."]},{"check":[{"answer":0,"choices":["Riparian","Littoral","Prior appropriation"],"q":"Rights along a flowing river are:","why":"Riparian = flowing water. Littoral = still water."},{"answer":0,"choices":["Littoral","Riparian","Percolating"],"q":"Rights along a lake are:","why":"Littoral attaches to static bodies: lakes, seas, ponds."}],"h":"Water and air rights","l":["Riparian rights - attach to FLOWING water (rivers, streams).","Littoral rights - attach to STILL water (lakes, seas, ponds).","Prior appropriation - the western doctrine where use is granted by permit regardless of whether you touch the water.","Air rights can be sold separately - that is how air-rights development works."]}],"summary":"Ownership is a bundle of separate rights, and almost every question here asks which sticks in the bundle a party actually holds. Work out three things for any scenario: how long the interest lasts, whether anything can cut it short, and who else has a claim on the same land.","topic":"national/ownership","traps":["'Estate for years' does not mean years. A 60-day lease with fixed dates is one.","The landlord holds the LEASED FEE; the tenant holds the leasehold. Questions try to flip these.","A condominium owner owns real property; a co-op shareholder owns personal property (stock plus a lease).","Every encroachment is an encumbrance, but not every encumbrance is physical."],"vocab":[["Fee simple absolute","Ownership with no conditions and no time limit; the complete bundle of rights."],["Defeasible fee","A fee that can be lost if a stated condition occurs."],["Possibility of reverter","The grantor's future interest after a determinable fee; takes effect automatically."],["Right of re-entry","The grantor's future interest after a fee on condition subsequent; must be exercised."],["Life estate","An interest lasting for a person's lifetime."],["Pur autre vie","A life estate measured by the life of someone other than the holder."],["Remainderman","The person who takes the property when a life estate ends."],["Reversion","The interest returning to the grantor when a lesser estate ends."],["Waste","A life tenant's failure to maintain, pay taxes, or preserve the property; the remainderman may sue now."],["Leased fee","The landlord's ownership interest, subject to the lease."],["Leasehold","The tenant's right of possession for a term."],["Estate at sufferance","Possession by a holdover tenant with no right to be there."],["Tenancy in common","Co-ownership with no survivorship; shares pass to heirs."],["Joint tenancy","Co-ownership with right of survivorship, requiring the four unities."],["Four unities (PITT)","Possession, Interest, Time, Title - all required for joint tenancy."],["Severance","Breaking a joint tenancy, usually by one owner conveying their share."],["Tenancy by the entirety","Marital joint tenancy neither spouse can sever alone. Not recognised in Georgia."],["Common elements","The parts of a condominium owned by all unit owners as tenants in common."],["Proprietary lease","The occupancy right a cooperative shareholder holds."],["Fixture","Personal property that has become part of the realty and conveys with it."],["Trade fixture","A commercial tenant's business equipment; remains personal property and is removable."],["Emblements","Annual crops, treated as the tenant-farmer's personal property."],["Chattel","Personal property."],["Encumbrance","Any claim, lien, easement, or restriction limiting the fee."],["Dominant tenement","The parcel benefited by an easement appurtenant."],["Servient tenement","The parcel burdened by an easement."],["Easement in gross","An easement benefiting a person or company rather than a parcel."],["Encroachment","A physical intrusion onto a neighbouring parcel."],["Licence","Revocable permission to use land; not an interest in land."],["Riparian rights","Water rights along flowing water."],["Littoral rights","Water rights along still water."]]},"national/practice":{"blurb":"Advertising, fair housing, antitrust, licensing, trust funds.","counts_on_exam":true,"exam_questions":10,"examples":[{"k":"Lawful company policy. What would make it illegal is evidence the firms coordinated with each other.","s":"A brokerage tells its agents never to quote below 5%. Competitors independently do the same.","t":"Company policy is not conspiracy","w":["Antitrust requires an AGREEMENT between competitors.","One firm setting its own rate is competition, not conspiracy.","Parallel behaviour alone is not proof of an agreement."]},{"k":"The landlord must show a substantial, legitimate business need that no less discriminatory rule would serve.","s":"A manager requires income of three times the rent. It statistically screens out a protected class at a much higher rate.","t":"Neutral rule, discriminatory effect","w":["The policy is facially neutral and applied to everyone.","But fair housing reaches EFFECTS, not just intent.","That is a disparate impact claim."]}],"ga":["Georgia permits net listings only under strict disclosure conditions.","Georgia advertising must identify the firm; a licensee may not appear to operate independently of their broker.","A Georgia salesperson may be paid ONLY by their affiliated broker."],"label":"Practice of real estate","portion":"national","sections":[{"check":[{"answer":0,"choices":["Source of income","Familial status","Handicap"],"q":"Which is NOT one of the seven federal protected classes?","why":"Some states and cities protect it, but not federal housing law."},{"answer":0,"choices":["Households with children under 18","Married couples only","Anyone over 55"],"q":"Familial status protects:","why":"Also pregnant people and those securing custody."}],"h":"Federal fair housing","l":["The SEVEN protected classes: race, colour, religion, sex, national origin, familial status, and handicap.","Familial status covers households with children under 18, pregnant people, and those securing custody. Exception: qualified housing for older persons (55+/62+).","Handicap includes HIV/AIDS. Landlords must allow reasonable MODIFICATIONS at the TENANT'S expense, and make reasonable ACCOMMODATIONS to rules at the LANDLORD'S expense (waiving a no-pets rule for an assistance animal - and no pet fee).","Source of income and marital status are NOT federally protected in housing, though some states and cities protect them.","The 1866 Civil Rights Act bars ALL racial discrimination with no exceptions."]},{"check":[{"answer":0,"choices":["Blockbusting","Steering","Redlining"],"q":"Telling owners a protected group is moving in to induce sales is:","why":"Illegal whether or not the claim is true."},{"answer":0,"choices":["Disparate impact","Puffing","Lawful in all cases"],"q":"A neutral policy that falls hardest on a protected class may be:","why":"Intent is not required for a violation."}],"h":"The named violations","l":["STEERING - channelling people toward or away from areas by protected class. It does not require saying anything negative; selectively providing information does it.","BLOCKBUSTING (panic peddling) - inducing sales by suggesting a protected group's entry will harm the neighbourhood. Illegal whether or not the claim is true.","REDLINING - a lender refusing or pricing loans by area demographics.","Discriminatory advertising - describe the PROPERTY, never the desired occupant.","DISPARATE IMPACT - a neutral policy that falls disproportionately on a protected class can violate the Act with NO intent to discriminate. The defence is a substantial, legitimate business need with no less discriminatory alternative."]},{"check":[{"answer":0,"choices":["HUD","The state licensing commission only","The MLS"],"q":"Federal fair housing complaints go to:","why":"The commission can also discipline the licence separately."},{"answer":0,"choices":["One year","30 days","Five years"],"q":"A HUD complaint is generally filed within:","why":"One year of the discriminatory act."}],"h":"Enforcement","p":["HUD handles federal complaints, generally filed within one year. A licensee's conduct can also independently cost them their licence through the state commission, and private suits are available."]},{"check":[{"answer":0,"choices":["Price fixing, a per se violation","Lawful if disclosed","Lawful if the MLS approves"],"q":"Two competing brokerages agreeing on a commission rate is:","why":"No defence and no disclosure cure."},{"answer":0,"choices":["Lawful company policy","Price fixing","A group boycott"],"q":"A single firm setting its own minimum rate is:","why":"Antitrust requires an agreement between competitors."}],"h":"Antitrust","l":["PRICE FIXING - competitors agreeing on commission rates. A per se violation: no defence, no disclosure cure. Commission is always negotiated between a broker and a client.","GROUP BOYCOTT - competitors conspiring to refuse to deal with someone.","MARKET ALLOCATION - dividing territories or customer types.","TIE-IN - conditioning one sale on the purchase of another product.","A SINGLE FIRM setting its own rate is lawful company policy, not conspiracy. Antitrust requires an AGREEMENT between competitors; parallel behaviour alone is not proof."]},{"check":[{"answer":0,"choices":["Exclusive right to sell","Exclusive agency","Open"],"q":"Under which listing is the broker paid no matter who sells?","why":"Exclusive agency lets the seller sell it themselves commission-free."},{"answer":0,"choices":["Keeps everything above the seller's stated price","Charges a flat fee","Splits with the buyer's broker"],"q":"A net listing is one where the broker:","why":"Heavily restricted; Georgia allows it only under strict disclosure."}],"h":"Listings and agreements","l":["OPEN - many brokers; the seller owes nothing if the seller finds the buyer.","EXCLUSIVE AGENCY - one broker, but the seller may still sell it themselves commission-free.","EXCLUSIVE RIGHT TO SELL - one broker paid no matter who sells. Most common.","NET LISTING - the broker keeps everything above a price the seller sets. Illegal in many states; Georgia permits it only under strict disclosure.","Buyer agency agreements mirror these structures."]},{"check":[{"answer":0,"choices":["Hold the funds and use interpleader","Release to whoever asked first","Split it evenly"],"q":"When buyer and seller both demand a disputed deposit, the broker should:","why":"Picking a side invites a conversion claim."},{"answer":0,"choices":["A separate trust or escrow account","The brokerage operating account","The agent's account"],"q":"Client funds belong in:","why":"Mixing is commingling."}],"h":"Trust funds","p":["Client money goes into a separate trust or escrow account, never the operating account. COMMINGLING is mixing; CONVERSION is spending. When buyer and seller both demand a disputed deposit, the broker must NOT pick a side - hold the funds and use interpleader or the state's prescribed procedure."]},{"check":[{"answer":0,"choices":["Discuss price or terms with a buyer","Schedule appointments","Prepare marketing for broker approval"],"q":"An unlicensed assistant may NOT:","why":"Anything involving negotiation or advice requires a licence."},{"answer":0,"choices":["There is an established business relationship or written consent","The call is before 9pm","They identify themselves"],"q":"Under the do-not-call rules a licensee may call a registered number if:","why":"FSBO and expired-listing calls are a common violation source."}],"h":"Advertising, licensing, supervision","l":["Advertising must identify the firm and must never mislead or imply a licensee operates independently of their broker. Claiming credit for another firm's sale is a misrepresentation.","Do-not-call rules: an established business relationship or express written consent is needed. FSBO and expired-listing calls are a common violation source.","Unlicensed assistants may do clerical and ministerial work - scheduling, preparing materials for approval, basic factual answers. They may NOT negotiate, solicit, discuss terms, or host an open house unaccompanied.","Independent contractor status: the broker controls RESULTS, not hours and methods, but must still supervise for licence-law compliance. The IRS safe harbour needs a licence, pay based on output, and a written IC agreement.","ADA Title III requires removing barriers in public accommodations where READILY ACHIEVABLE; new construction faces stricter standards."]}],"summary":"This block covers how you are allowed to run the business: fair housing, antitrust, advertising, trust funds, listings, and supervision. The recurring theme is that good intentions are no defence - conduct is judged by its effect.","topic":"national/practice","traps":["Source of income and marital status are not among the seven federal classes.","Occupancy limits by NUMBER of people can be lawful; limits by AGE of occupant are not.","Modification = physical = tenant pays. Accommodation = rules = landlord absorbs.","Intent is not required for a fair housing violation."],"vocab":[["Protected class","A group the law shields from housing discrimination."],["Familial status","Households with children under 18, pregnant people, those seeking custody."],["Reasonable modification","A physical change for a disabled tenant, at the tenant's expense."],["Reasonable accommodation","A change to rules or policies, at the provider's expense."],["Steering","Channelling buyers toward or away from areas by protected class."],["Blockbusting","Inducing panic selling by claims about a protected group moving in."],["Redlining","Ref
