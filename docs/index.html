using or pricing loans by neighbourhood demographics."],["Disparate impact","A neutral policy with a discriminatory effect; intent not required."],["Price fixing","Competitors agreeing on prices; a per se antitrust violation."],["Group boycott","Competitors agreeing to refuse to deal with someone."],["Market allocation","Competitors dividing territories or customers."],["Tie-in arrangement","Conditioning one transaction on another purchase."],["Open listing","Non-exclusive; seller owes nothing if they sell it themselves."],["Exclusive agency listing","One broker, but the seller may sell it themselves commission-free."],["Exclusive right to sell","One broker is paid regardless of who sells."],["Net listing","Broker keeps everything above the seller's stated net; heavily restricted."],["Commingling","Mixing trust funds with the broker's own money."],["Conversion","Using or spending trust funds."],["Interpleader","A court action letting a stakeholder deposit disputed funds for decision."],["Ministerial acts","Clerical, non-discretionary tasks an unlicensed assistant may do."],["Independent contractor","A licensee whose results, not methods, the broker directs."],["Readily achievable","The ADA standard for barrier removal: easily accomplishable."]]},"national/transfer":{"blurb":"Deeds, title insurance, recording, closing, adverse possession.","counts_on_exam":true,"exam_questions":8,"examples":[{"k":"If the Monday buyer had no notice (including no reason to see the possession), they win. If the possession was open and obvious, they lose. Notice decides it.","s":"A buyer records Monday. An earlier buyer of the same parcel, who had paid and moved in, records Wednesday. Race-notice state.","t":"Race-notice, decided by notice","w":["Race-notice protects a later buyer only if they took WITHOUT NOTICE and recorded first.","The Monday buyer did record first.","But the earlier buyer's open POSSESSION is constructive notice."]},{"k":"The seller must obtain and RECORD a release or satisfaction. A buyer cannot be forced to take title subject to an undischarged mortgage.","s":"A title commitment lists an unreleased 1978 mortgage as a Schedule B exception.","t":"Insurance does not clear a lien","w":["An EXCEPTION is exactly what the policy will NOT cover.","So buying insurance does not solve the problem.","Marketable title requires clearing the lien of record."]}],"ga":["Georgia records with the CLERK OF SUPERIOR COURT in the county where the land lies.","Georgia adverse possession: 20 years, or 7 years under colour of title.","Georgia real estate transfer tax is $1.00 per $1,000 of consideration, customarily paid by the SELLER and collected when the deed is recorded.","Georgia closings are supervised by a licensed ATTORNEY, who customarily represents the LENDER, not the buyer."],"label":"Transfer of title","portion":"national","sections":[{"check":[{"answer":0,"choices":["Delivery and acceptance","Recording","Notarisation"],"q":"Title actually passes on:","why":"Recording gives notice; it does not pass title."},{"answer":0,"choices":["The grantor only","Both grantor and grantee","The grantee only"],"q":"Who signs the deed?","why":"The grantee never signs."}],"h":"Requirements for a valid deed","l":["In writing, with a competent GRANTOR","A named, identifiable GRANTEE","Words of conveyance (the granting clause)","An adequate legal description","The grantor's SIGNATURE","DELIVERY to and ACCEPTANCE by the grantee - this is what actually passes title","Notarisation (acknowledgment) is needed to RECORD, not for validity. The grantee does not sign. Consideration need only be recited."]},{"check":[{"answer":0,"choices":["General warranty","Special warranty","Quitclaim"],"q":"Which deed offers the grantee the most protection?","why":"It warrants against defects through the entire chain."},{"answer":0,"choices":["Clear a cloud on title","Convey a new home","Transfer a mortgage"],"q":"A quitclaim deed is most often used to:","why":"It releases whatever interest the grantor may have."}],"h":"Types of deed, strongest to weakest","l":["GENERAL WARRANTY - warrants title against all defects through the ENTIRE chain, including before the grantor owned it. Strongest.","SPECIAL (limited) WARRANTY - warrants only against defects arising during the GRANTOR'S ownership.","BARGAIN AND SALE - implies the grantor holds title but gives no warranty.","QUITCLAIM - conveys whatever interest the grantor has, if any, with NO warranty. The tool for clearing clouds.","Special-purpose deeds: executor's, sheriff's, tax, gift, and trustee's deeds."]},{"check":[{"answer":0,"choices":["At delivery","On a later eviction","When the grantee resells"],"q":"The covenant of seisin is breached, if at all:","why":"It is a PRESENT covenant, so the clock starts at delivery."},{"answer":0,"choices":["Future covenant","Present covenant","Statutory warranty"],"q":"Quiet enjoyment is a:","why":"Future covenants are breached only on later disturbance."}],"h":"The covenants of title","l":["PRESENT covenants - breached at delivery if at all, so the clock starts then: seisin (the grantor owns and can convey), right to convey, and against encumbrances.","FUTURE covenants - breached only on a later disturbance: quiet enjoyment (undisturbed possession and defence against lawful claims), warranty forever, and further assurance (the grantor will sign whatever is later needed)."]},{"check":[{"answer":0,"choices":["Constructive notice to the world","Actual notice to the grantee","A guarantee of clear title"],"q":"Recording gives:","why":"Everyone is charged with knowledge whether they looked or not."},{"answer":0,"choices":["Took without notice AND recorded first","Recorded first","Took without notice"],"q":"Under a race-notice statute a later buyer wins only if they:","why":"Both conditions are required."}],"h":"Recording, notice, and priority","l":["Recording gives CONSTRUCTIVE notice - everyone is charged with knowledge whether or not they looked.","ACTUAL notice is what a person genuinely knows. Open POSSESSION by someone can itself be constructive notice, which defeats a later buyer who ignored it.","Race - first to record wins.","Notice - a later buyer without notice wins.","RACE-NOTICE - a later buyer wins only if they took WITHOUT NOTICE and recorded FIRST.","Generally, first in time, first in right - subject to those statutes. Property tax liens usually take priority over everything."]},{"check":[{"answer":0,"choices":["Something the policy will NOT cover","An extra covered item","A recording fee"],"q":"A Schedule B exception in a title commitment is:","why":"The word means the opposite of what it sounds like."},{"answer":0,"choices":["Defects that already existed when issued","Future fire loss","Declines in market value"],"q":"Title insurance protects against:","why":"It is retrospective, paid once."}],"h":"Title evidence","l":["Chain of title - the sequence of owners.","Abstract of title - the condensed written history of every recorded document.","Opinion of title - an attorney's interpretation of the abstract.","Title commitment - the insurer's promise to issue a policy, with Schedule B EXCEPTIONS listing what it will NOT cover.","Title insurance - protects against defects that ALREADY EXISTED when issued: forgery, undisclosed heirs, recording errors. Paid once. An OWNER'S policy covers the buyer; a LENDER'S policy covers only the lender.","Marketable title - title a reasonable buyer would accept. An unreleased mortgage of record must be cleared with a recorded release; insurance does not fix it.","Cloud on title - removed by a QUITCLAIM from the claimant, or a QUIET TITLE suit. A LIS PENDENS creates a cloud by giving notice of pending litigation."]},{"check":[{"answer":0,"choices":["7 years","20 years","10 years"],"q":"Georgia's adverse possession period under colour of title is:","why":"20 years without colour of title."},{"answer":0,"choices":["Avulsion","Accretion","Erosion"],"q":"Sudden loss or addition of land that does NOT move boundaries is:","why":"Gradual change moves boundaries; sudden change does not."}],"h":"Involuntary and non-sale transfers","l":["Adverse possession - open, notorious, hostile, actual, and continuous possession for the statutory period, plus any state-specific element. EVERY element is required. GEORGIA: 20 years, or 7 years under COLOUR OF TITLE.","Accretion - gradual gain of land by deposit (the new soil is alluvion). Erosion is gradual loss. AVULSION is sudden change and does NOT move boundaries. Reliction is land exposed by permanently receding water.","Death: TESTATE (with a will) - real property passes by DEVISE. INTESTATE - state succession law controls. Escheat if no will and no heirs.","Foreclosure, tax sale, eminent domain, and dedication."]},{"check":[{"answer":0,"choices":["Lot and block","Rectangular survey","Metes and bounds"],"q":"Which system is most common in Georgia subdivisions?","why":"Georgia does not use the rectangular survey system."},{"answer":0,"choices":["Return to the point of beginning","Reference a section number","Include the acreage"],"q":"A metes and bounds description must:","why":"It must close."}],"h":"Legal descriptions","l":["METES AND BOUNDS - distances and directions from a POINT OF BEGINNING; must return to it to close.","LOT AND BLOCK - references a recorded plat. The most common system in Georgia subdivisions.","RECTANGULAR (government) SURVEY - townships, ranges, and sections. A section is 1 square mile = 640 acres; a township is 36 sections. Georgia does NOT use it."]}],"summary":"Title passes on DELIVERY AND ACCEPTANCE of a valid deed. Recording is not required to make the deed good between the parties - it exists to give notice to everyone else and to settle priority when two people claim the same land.","topic":"national/transfer","traps":["Recording is not required for a deed to be valid between grantor and grantee.","The grantee never signs the deed.","A title EXCEPTION is uncovered, not covered. The word means the opposite of what it sounds.","Avulsion is sudden and does not move boundaries; accretion is gradual and does."],"vocab":[["Grantor / grantee","The one conveying / the one receiving."],["Granting clause","The words of conveyance in a deed."],["Delivery and acceptance","What actually transfers title."],["Acknowledgment","Notarisation; required to record, not for validity."],["General warranty deed","Warrants title against all defects through the whole chain."],["Special warranty deed","Warrants only against defects during the grantor's ownership."],["Quitclaim deed","Conveys whatever interest the grantor has, with no warranty."],["Covenant of seisin","The grantor's promise that they own and can convey."],["Covenant of quiet enjoyment","Promise of undisturbed possession and defence of title."],["Constructive notice","Legal notice given by recording; everyone is charged with it."],["Actual notice","Knowledge a person genuinely has."],["Race-notice statute","A later buyer prevails only if without notice AND recording first."],["Chain of title","The successive record of ownership."],["Abstract of title","A condensed history of all recorded documents."],["Title commitment","The insurer's promise to issue a policy, listing exceptions."],["Schedule B exception","A defect the title policy will not cover."],["Marketable title","Title free enough of defects that a reasonable buyer would accept it."],["Cloud on title","A claim or defect casting doubt on ownership."],["Quiet title action","A suit asking a court to settle ownership."],["Lis pendens","Recorded notice of pending litigation; creates a cloud."],["Adverse possession","Acquiring title by long, open, hostile possession."],["Colour of title","A written instrument that appears to convey title but is defective."],["Accretion / alluvion","Gradual addition of land by water / the deposited soil."],["Avulsion","Sudden loss or addition of land; boundaries do not change."],["Testate / intestate","Dying with a will / without one."],["Devise","A gift of real property by will."],["Metes and bounds","Description by distances and directions from a point of beginning."],["Lot and block","Description by reference to a recorded plat."],["Section","One square mile; 640 acres."]]},"national/valuation":{"blurb":"The three approaches to value, CMA, appraisal principles.","counts_on_exam":true,"exam_questions":7,"examples":[{"k":"$416,000. CIA: Comp Inferior, Add. Superior features come off.","s":"A comparable sold for $420,000. It has an extra half-bath worth $12,000, and its lot is inferior to the subject's by $8,000.","t":"Adjusting comparables in the right direction","w":["Adjust the COMP toward the subject, never the subject toward the comp.","Comp is SUPERIOR on the bath: subtract $12,000 -> $408,000.","Comp is INFERIOR on the lot: add $8,000 -> $416,000."]},{"k":"About $560,000. Skipping vacancy or expenses inflates the answer - which is exactly what the wrong choices will look like.","s":"A four-unit building rents for $1,400 per unit per month, vacancy is 5%, and operating expenses are $19,000 a year. Cap rate 8%.","t":"Cap rate value with a proper NOI","w":["Potential gross = 4 x $1,400 x 12 = $67,200","Less 5% vacancy ($3,360) = $63,840 effective gross","Less $19,000 expenses = $44,840 NOI","Value = NOI / rate = $44,840 / 0.08 = $560,500"]},{"k":"External obsolescence, incurable, deducted from the land - not the improvements.","s":"A house on a busy corner sells for less than identical houses mid-block.","t":"Which depreciation is it?","w":["The cause is outside the property line, so it is EXTERNAL obsolescence.","External obsolescence is always incurable - the owner cannot move the road.","Because a location penalty attaches to the site, it is charged against the LAND."]}],"ga":["A Georgia licensee preparing a CMA is giving a broker's pricing opinion. Presenting it as an appraisal, or implying appraiser credentials, is a licence-law problem."],"label":"Valuation & market analysis","portion":"national","sections":[{"check":[{"answer":0,"choices":["Market price","Market value","Assessed value"],"q":"What a property actually sold for is its:","why":"Price is the historical fact; value is an opinion."},{"answer":0,"choices":["The improvements only","Land and improvements","The assessed amount"],"q":"Insurable value covers:","why":"Land does not burn, so it is excluded."}],"h":"Value, price, and cost are three different things","l":["Market value - the most probable price in an arm's-length sale, with an informed buyer and seller, adequate exposure, and no duress. An OPINION.","Market price - what a property actually sold for. A historical FACT, which may reflect a distress sale.","Cost - what it took to build. Cost does not equal value.","Assessed value - the tax base, often a percentage of market value.","Insurable value - the improvements only, since land does not burn."]},{"check":[{"answer":0,"choices":["Transferability","Taxation","Title"],"q":"DUST stands for demand, utility, scarcity and:","why":"Transferability - title must be conveyable."},{"answer":0,"choices":["Transferability","Utility","Scarcity"],"q":"A property nobody can legally convey lacks:","why":"Without transferability there is no market value."}],"h":"The four characteristics of value (DUST)","l":["Demand - buyers who want it and can pay","Utility - it can satisfy a need","Scarcity - supply is limited","Transferability - title can be conveyed"]},{"check":[{"answer":0,"choices":["Progression","Regression","Conformity"],"q":"A modest house among mansions gains value. This is:","why":"Progression pulls the lesser property up."},{"answer":0,"choices":["Plottage","Assemblage","Contribution"],"q":"Combining two lots so the whole exceeds the parts creates:","why":"Assemblage is the act; plottage is the added value."}],"h":"Appraisal principles","l":["Substitution - value is capped by the cost of an equally desirable substitute. This underlies the whole sales comparison approach.","Highest and best use - the use that is legally permitted, physically possible, financially feasible, and maximally productive. Legality comes first; an illegal use is never highest and best.","Conformity - maximum value where properties are reasonably similar.","Progression - a modest property is pulled UP by superior neighbours.","Regression - a superior property is dragged DOWN by lesser neighbours.","Contribution - a component is worth what it ADDS to the whole, not what it cost.","Anticipation - value reflects expected future benefits.","Assemblage - combining parcels. PLOTTAGE is the extra value that results.","Supply and demand, and change - values move with the market and never sit still."]},{"check":[{"answer":0,"choices":["Cost approach","Income approach","Sales comparison approach"],"q":"Valuing a 40-year-old church relies most on the:","why":"Special-purpose property rarely sells and earns no rent."},{"answer":0,"choices":["Add to the comparable","Subtract from the comparable","Adjust the subject"],"q":"A comparable is INFERIOR to the subject. You:","why":"CIA - Comp Inferior, Add. Never adjust the subject."}],"h":"The three approaches","l":["SALES COMPARISON - compare recent similar sales. Best for houses and land. Always adjust the COMPARABLE, never the subject. Comp superior: SUBTRACT. Comp inferior: ADD. Memory hook CIA - Comp Inferior, Add.","COST - reproduction or replacement cost, LESS depreciation, PLUS land value. Best for new construction and special-purpose property (churches, schools, libraries) that rarely sells and produces no rent.","INCOME - convert income into value. Best for rentals and commercial. Use IRV: Income = Rate x Value, so Value = NOI / Rate."]},{"check":[{"answer":0,"choices":["Debt service","Property taxes","Management fees"],"q":"Which is NEVER an operating expense?","why":"Debt service comes out after NOI, not before."},{"answer":0,"choices":["Vacancy and collection loss","Operating expenses","Debt service"],"q":"Effective gross income is potential gross income less:","why":"Vacancy first, then expenses give NOI."}],"h":"Building NOI correctly","l":["Potential gross income (all units, fully rented)","minus vacancy and collection loss = EFFECTIVE GROSS INCOME","minus operating expenses = NET OPERATING INCOME","minus debt service = CASH FLOW","DEBT SERVICE IS NEVER AN OPERATING EXPENSE. Neither is depreciation or capital improvement. This is the single most common trap."],"p":["Nearly every income-approach mistake is a bad NOI. Work down the statement in order:"]},{"check":[{"answer":0,"choices":["External obsolescence","Functional obsolescence","Physical deterioration"],"q":"A new highway beside the house causes:","why":"The cause is outside the property line, so it is external and incurable."},{"answer":0,"choices":["Whether the cost is recovered in added value","Whether it can physically be fixed","The age of the building"],"q":"Curable vs. incurable is decided by:","why":"It is an economic test, not a physical one."}],"h":"Depreciation: three kinds","l":["Physical deterioration - wear, tear, and deferred maintenance. Often curable.","Functional obsolescence - a defect in the design or utility of the structure itself: one bathroom, a bedroom you walk through, an outdated layout.","External (economic) obsolescence - caused by something OUTSIDE the property line: a new highway, a failing neighbourhood. ALWAYS INCURABLE, because the owner cannot fix it. It is charged against the LAND.","Curable vs. incurable is an ECONOMIC test, not a physical one: an item is curable when the cost to fix it is recovered in added value."]},{"check":[{"answer":0,"choices":["A pricing opinion, not an appraisal","An appraisal requiring a licence","A statement of assessed value"],"q":"A broker's CMA is:","why":"It must never be presented as an appraisal."},{"answer":0,"choices":["A licensed or certified appraiser","Any licensed broker","The county assessor"],"q":"Who may perform an appraisal?","why":"Appraisals require appraiser credentials."}],"h":"CMA vs. appraisal vs. BPO","p":["A competitive market analysis is a broker's pricing opinion built from comparables to help set a list price. It is NOT an appraisal, must never be presented as one, and needs no appraiser licence. An appraisal is an independent opinion by a licensed or certified appraiser."]},{"check":[{"answer":0,"choices":["Weights the approaches by reliability","Averages the three values","Uses only the highest"],"q":"In reconciliation the appraiser:","why":"Averaging is always wrong."},{"answer":0,"choices":["A single value conclusion","Three separate opinions","A range with no conclusion"],"q":"Reconciliation produces:","why":"One conclusion, weighted by reliability."}],"h":"The appraisal process ends in reconciliation","p":["Reconciliation weighs each approach by how RELIABLE it is for that property, and states a single value conclusion. Averaging the three is always wrong."]}],"summary":"Value is an OPINION of the most probable price, not a fact. Three approaches exist, and the whole skill is picking the right one for the property type and then weighting them honestly. Appraisers never average the three.","topic":"national/valuation","traps":["Debt service is NEVER an operating expense when building NOI.","Cap rate and value move INVERSELY: a higher cap rate means a lower value.","Curability is about economics, not physics. If the fix costs more than it returns, it is incurable even though it is physically repairable.","Cost approach for a church or school; sales comparison for a house; income for a rental."],"vocab":[["Market value","The most probable price under normal, arm's-length conditions."],["Market price","The actual price a property sold for."],["Assessed value","The value used as the property tax base."],["Insurable value","The value of the improvements only."],["DUST","Demand, Utility, Scarcity, Transferability - the four elements of value."],["Substitution","Value is limited by the cost of an equally desirable alternative."],["Highest and best use","Legally permitted, physically possible, financially feasible, maximally productive."],["Conformity","Value is maximised where properties are similar."],["Progression","A lesser property gains value from superior neighbours."],["Regression","A superior property loses value among lesser neighbours."],["Contribution","A component is worth what it adds to the whole."],["Anticipation","Value based on expected future benefits."],["Assemblage","Combining adjacent parcels under one owner."],["Plottage","The added value created by assemblage."],["Comparable","A recently sold similar property used in the sales comparison approach."],["Reproduction cost","Cost to build an exact replica."],["Replacement cost","Cost to build equivalent utility with current materials."],["Potential gross income","Income if fully rented with no losses."],["Effective gross income","Potential gross income less vacancy and collection loss."],["Net operating income","Effective gross income less operating expenses, before debt service."],["Capitalization rate","The rate converting income to value; Value = NOI / Rate."],["Gross rent multiplier","Sale price divided by gross rent; a quick screening tool."],["Physical deterioration","Loss in value from wear and tear."],["Functional obsolescence","Loss in value from a defect in the structure's own design or utility."],["External obsolescence","Loss in value caused from outside the property; always incurable."],["Reconciliation","Weighting the approaches into one value conclusion."],["CMA","A broker's comparative pricing opinion; not an appraisal."]]}}},"practice_only":["comp/closing-math","comp/grec-deep","comp/situational","comp/vocabulary"],"difficulties":["harder","any","core","hard"],"harder_share":0.65};</script>
<script>/* Engine: storage, question selection, scoring, and the study planner.
   A port of greprep/{store,questions,scheduler}.py -- same rules, no server. */
'use strict';

var KEY = 'ga-prep-v1';
var EXAM = DATA.exam;                       // {national:80, georgia:52}
var TOTAL_Q = EXAM.national + EXAM.georgia;

var TOPIC = {};                             // key -> catalog row
DATA.topics.forEach(function(t){ TOPIC[t.key] = t; });
var ORDER = DATA.topics.map(function(t){ return t.key; });

function label(k){ return (TOPIC[k] || {}).label || k; }
function weight(k){ return (TOPIC[k] || {}).exam_questions || 1; }
function portionTopics(p){
  return ORDER.filter(function(k){ return TOPIC[k].portion === p; });
}
var PRACTICE_ONLY = {};
(DATA.practice_only || []).forEach(function(k){ PRACTICE_ONLY[k] = 1; });
var HARDER_SHARE = DATA.harder_share || 0.65;
var DIFFICULTIES = DATA.difficulties || ['harder','any','core','hard'];
var CLOSING_GENS = Object.keys(DATA.math).filter(function(k){ return DATA.math[k].closing; });
function countsOnExam(k){ return !PRACTICE_ONLY[k]; }

/* ------------------------------------------------------------- storage */
var EMPTY = {version:1, profile:{}, attempts:[], topics:{}, subs:{}, items:{}, generators:{}};

function load(){
  var raw;
  try { raw = localStorage.getItem(KEY); } catch(e){ raw = null; }
  if (!raw){
    var fresh = JSON.parse(JSON.stringify(EMPTY));
    // first run on this device: start from the exam settings baked in at build time
    fresh.profile = JSON.parse(JSON.stringify(DATA.profile_default || {}));
    return fresh;
  }
  var d;
  try { d = JSON.parse(raw); } catch(e){ return JSON.parse(JSON.stringify(EMPTY)); }
  Object.keys(EMPTY).forEach(function(k){
    if (d[k] === undefined) d[k] = JSON.parse(JSON.stringify(EMPTY[k]));
  });
  if (!d.profile || !d.profile.exam_date)
    d.profile = JSON.parse(JSON.stringify(DATA.profile_default || {}));
  return d;
}
function save(d){
  try { localStorage.setItem(KEY, JSON.stringify(d)); return true; }
  catch(e){
    alert('Could not save progress. If you are in a private window, browser ' +
          'storage may be blocked and your history will not persist.');
    return false;
  }
}

function bump(bucket, k, correct){
  var r = bucket[k] || (bucket[k] = {seen:0, correct:0, last:0});
  r.seen++; r.last = Date.now()/1000;
  if (correct) r.correct++;
  return r;
}

function recordAttempt(d, portion, mode, answers, elapsed, weakSpot){
  var perTopic = {}, correct = 0;
  answers.forEach(function(a){
    if (a.correct) correct++;
    var t = a.topic || 'unknown';
    var s = perTopic[t] || (perTopic[t] = {seen:0, correct:0});
    s.seen++; if (a.correct) s.correct++;
    bump(d.topics, t, a.correct);
    if (a.qid && a.qid.indexOf('math:') !== 0) bump(d.items, a.qid, a.correct);
    if (a.sub) bump(d.subs, a.sub, a.correct);
    if (a.generator) bump(d.generators, a.generator, a.correct);
  });
  var att = {
    id: Math.random().toString(16).slice(2, 14),
    portion: portion, mode: mode, weak_spot: !!weakSpot,
    at: Date.now()/1000, count: answers.length, correct: correct,
    pct: answers.length ? correct/answers.length : 0,
    seconds: Math.round(elapsed*10)/10,
    topics: perTopic
  };
  d.attempts.push(att);
  return att;
}

/* ------------------------------------------------------------- scoring */
function topicPriority(rec, w){
  var seen = rec ? (rec.seen||0) : 0;
  var corr = rec ? (rec.correct||0) : 0;
  var accuracy, confidence;
  if (!seen){ accuracy = 0.5; confidence = 0; }
  else { accuracy = corr/seen; confidence = Math.min(1, seen/12); }
  return (0.35 + 0.65*confidence) * (1-accuracy) * (1 + w/10);
}

function weakWeights(topicRecs, declared){
  var dec = {};
  (declared||[]).forEach(function(k){ dec[k] = 1; });
  var out = {};
  ORDER.forEach(function(k){
    var rec = (topicRecs||{})[k];
    var s = 0.05 + topicPriority(rec, weight(k));
    if (dec[k]) s += ((rec && rec.seen >= 10) ? 0.20 : 0.60);
    out[k] = s;
  });
  return out;
}

function allocate(weights, total){
  var keys = Object.keys(weights).filter(function(k){ return weights[k] > 0; });
  if (!keys.length) return {};
  var sum = 0; keys.forEach(function(k){ sum += weights[k]; });
  var out = {}, used = 0;
  keys.forEach(function(k){ out[k] = Math.floor(total*weights[k]/sum); used += out[k]; });
  keys.sort(function(a,b){ return weights[b]-weights[a]; });
  for (var i = 0; used < total; i++, used++) out[keys[i % keys.length]]++;
  return out;
}

function shuffle(a){
  for (var i = a.length-1; i > 0; i--){
    var j = Math.floor(Math.random()*(i+1)), t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ------------------------------------------------------------ selection */
function missedSet(d){
  var s = {};
  Object.keys(d.items||{}).forEach(function(id){
    var r = d.items[id];
    if (r.seen > r.correct) s[id] = 1;
  });
  return s;
}

function tier(rows, level){
  return rows.filter(function(r){ return (r.difficulty || 1) === level; });
}
function byDifficulty(rows, d){
  if (d === 'core') return tier(rows, 1).length ? tier(rows, 1) : rows;
  if (d === 'hard') return tier(rows, 2).length ? tier(rows, 2) : rows;
  return rows;
}
function order(rows, missed){
  return shuffle(rows.filter(function(r){ return missed[r.id]; }))
    .concat(shuffle(rows.filter(function(r){ return !missed[r.id]; })));
}
function pickFromTopic(pool, topic, n, missed, d){
  var rows = pool.filter(function(r){ return r.topic === topic; });
  if (!rows.length || n <= 0) return [];
  if (d === 'harder'){
    var wantHard = Math.round(n * HARDER_SHARE);
    var hard = order(tier(rows, 2), missed).slice(0, wantHard);
    var used = {};
    hard.forEach(function(r){ used[r.id] = 1; });
    var rest = order(rows.filter(function(r){ return !used[r.id]; }), missed);
    return hard.concat(rest).slice(0, n);
  }
  return order(byDifficulty(rows, d), missed).slice(0, n);
}

function mathPick(n, kinds){
  var pool = (kinds && kinds.length) ? kinds : Object.keys(DATA.math);
  var out = [], spin = shuffle(pool.slice());
  for (var i = 0; i < n; i++){
    if (!spin.length) spin = shuffle(pool.slice());
    var k = spin.pop(), set = DATA.math[k];
    if (!set || !set.q.length) continue;
    var j = Math.floor(Math.random()*set.q.length), row = set.q[j];
    out.push({
      id: 'math:'+k+':'+j,
      portion: set.closing ? 'comprehensive' : 'national',
      topic: set.closing ? 'comp/closing-math' : 'national/math',
      generator: k, q: row[0], choices: row[1], answer: row[2],
      steps: row[3], concept: set.concept, difficulty: 2,
      explain: 'Correct answer: '+row[1][row[2]]+'. '+set.concept
    });
  }
  return out;
}

function allRows(){
  var out = [];
  ['national','georgia','comprehensive'].forEach(function(p){
    out = out.concat(DATA.banks[p] || []);
  });
  return out;
}

function select(portion, count, opts){
  opts = opts || {};
  var d = opts.progress || load();
  var missed = missedSet(d);
  var diff = opts.difficulty || 'harder';
  if (DIFFICULTIES.indexOf(diff) < 0) diff = 'harder';

  if (opts.sub){
    // one "little topic": its own questions, then generated math for a math
    // subtopic, then the rest of the parent topic so the drill is full length
    var rows = allRows();
    var own = shuffle(rows.filter(function(r){ return r.sub === opts.sub; }));
    var out2 = own.slice(0, count);
    if (out2.length < count){
      var gens = Object.keys(DATA.math).filter(function(k){
        return opts.sub.slice(-(DATA.math[k].label.length + 1)) === '|' + DATA.math[k].label;
      });
      if (gens.length) out2 = out2.concat(mathPick(count - out2.length, gens));
    }
    if (out2.length < count){
      var parent = opts.sub.split('|')[0], have = {};
      out2.forEach(function(r){ have[r.id] = 1; });
      var rest = shuffle(rows.filter(function(r){
        return r.topic === parent && !have[r.id];
      }));
      out2 = out2.concat(rest.slice(0, count - out2.length));
    }
    return out2.slice(0, count);
  }

  if (portion === 'math'){
    var kinds = null;
    if (opts.topic && DATA.math[opts.topic]) kinds = [opts.topic];
    else if (opts.weak_spot){
      var scored = Object.keys(DATA.math).map(function(k){
        return {k:k, s:topicPriority(d.generators[k], 5)};
      }).sort(function(a,b){ return b.s-a.s; });
      kinds = scored.slice(0, Math.max(4, Math.ceil(scored.length/2)))
                    .map(function(x){ return x.k; });
    }
    return mathPick(count, kinds);
  }

  if (portion === 'mixed'){
    var nN = Math.round(count * EXAM.national / TOTAL_Q);
    return select('national', nN, opts).concat(select('georgia', count - nN, opts));
  }

  var pool = DATA.banks[portion] || [];
  if (opts.topic){
    var chosen = pickFromTopic(pool, opts.topic, count, missed, diff);
    if (opts.topic === 'national/math' && chosen.length < count)
      chosen = chosen.concat(mathPick(count - chosen.length, null));
    else if (opts.topic === 'comp/closing-math'){
      // blend written debit/credit items with generated arithmetic
      var keep = Math.max(1, Math.floor(count / 2));
      chosen = chosen.slice(0, keep).concat(mathPick(count - keep, CLOSING_GENS));
    }
    return chosen.slice(0, count);
  }

  var weights = {};
  if (opts.weak_spot){
    var all = weakWeights(d.topics, (d.profile||{}).declared_weak);
    portionTopics(portion).forEach(function(k){ weights[k] = all[k]; });
  } else {
    portionTopics(portion).forEach(function(k){ weights[k] = weight(k); });
  }

  var plan = allocate(weights, count), out = [];
  Object.keys(plan).forEach(function(t){
    var got = pickFromTopic(pool, t, plan[t], missed, diff);
    if (got.length < plan[t] && t === 'national/math')
      got = got.concat(mathPick(plan[t] - got.length, null));
    else if (got.length < plan[t] && t === 'comp/closing-math')
      got = got.concat(mathPick(plan[t] - got.length, CLOSING_GENS));
    out = out.concat(got);
  });

  if (out.length < count){
    var need = count - out.length;
    if (portion === 'national') out = out.concat(mathPick(need, null));
    else if (portion === 'comprehensive') out = out.concat(mathPick(need, CLOSING_GENS));
    else {
      var have = {}; out.forEach(function(r){ have[r.id] = 1; });
      out = out.concat(shuffle(pool.filter(function(r){ return !have[r.id]; })).slice(0, need));
    }
  }
  return shuffle(out).slice(0, count);
}

function mockExam(diff){
  // the comprehensive subtest is a drill, not a section of the real exam
  var o = {difficulty: diff};
  return select('national', EXAM.national, o).concat(select('georgia', EXAM.georgia, o));
}

/* -------------------------------------------------------------- reports */
function topicReport(d){
  return ORDER.map(function(k){
    var t = TOPIC[k], rec = d.topics[k];
    var seen = rec ? rec.seen : 0, corr = rec ? rec.correct : 0;
    return {topic:k, portion:t.portion, label:t.label, blurb:t.blurb,
            exam_questions:t.exam_questions, seen:seen, correct:corr,
            pct: seen ? corr/seen : null,
            priority: topicPriority(rec, t.exam_questions)};
  }).sort(function(a,b){ return b.priority - a.priority; });
}

function weakestReport(d, limit){
  var rows = topicReport(d);
  var attempted = rows.filter(function(r){ return r.seen >= 3; });
  var unseen = rows.filter(function(r){ return r.seen < 3; });
  attempted.sort(function(a, b){
    // weakest first, then by how much the topic is worth on the exam
    if (a.pct !== b.pct) return a.pct - b.pct;
    return b.exam_questions - a.exam_questions;
  });
  return {weak: attempted.slice(0, limit || 8), untested: unseen};
}

function portionStats(d){
  var out = {};
  ['national','georgia','comprehensive'].forEach(function(p){
    var rows = d.attempts.filter(function(a){ return a.portion === p; });
    if (!rows.length){ out[p] = {attempts:0, pct:null, recent_pct:null, trend:null}; return; }
    var tq = 0, tc = 0;
    rows.forEach(function(r){ tq += r.count; tc += r.correct; });
    var recent = rows.slice(-3), rq = 0, rc = 0;
    recent.forEach(function(r){ rq += r.count; rc += r.correct; });
    var trend = null;
    if (rows.length >= 2){
      var half = rows.slice(0, Math.max(1, Math.floor(rows.length/2))), hq = 0, hc = 0;
      half.forEach(function(r){ hq += r.count; hc += r.correct; });
      trend = (rc/(rq||1)) - (hc/(hq||1));
    }
    out[p] = {attempts:rows.length, questions:tq, pct:tc/(tq||1),
              recent_pct:rc/(rq||1), trend:trend, last:rows[rows.length-1].at};
  });
  return out;
}

function trendSeries(d){
  var s = {};
  d.attempts.forEach(function(a){
    Object.keys(a.topics||{}).forEach(function(t){
      var v = a.topics[t];
      if (!v.seen) return;
      (s[t] || (s[t] = [])).push({at:a.at, pct:v.correct/v.seen, seen:v.seen});
    });
  });
  return s;
}

function subReport(d, minSeen, limit){
  minSeen = minSeen || 2;
  var rows = [];
  Object.keys(d.subs || {}).forEach(function(key){
    var rec = d.subs[key];
    if (rec.seen < minSeen) return;
    var cut = key.indexOf('|');
    var topic = key.slice(0, cut), label = key.slice(cut + 1);
    var t = TOPIC[topic];
    if (!t) return;
    rows.push({sub: key, label: label, topic: topic, topic_label: t.label,
               portion: t.portion, exam_questions: t.exam_questions,
               counts_on_exam: countsOnExam(topic),
               seen: rec.seen, correct: rec.correct, pct: rec.correct / rec.seen});
  });
  rows.sort(function(a, b){
    if (a.pct !== b.pct) return a.pct - b.pct;
    return b.exam_questions - a.exam_questions;
  });
  return limit ? rows.slice(0, limit) : rows;
}

function generatorReport(d){
  return Object.keys(DATA.math).map(function(k){
    var rec = d.generators[k];
    var seen = rec ? rec.seen : 0, corr = rec ? rec.correct : 0;
    return {key:k, label:DATA.math[k].label, concept:DATA.math[k].concept,
            seen:seen, correct:corr, pct: seen ? corr/seen : null};
  }).sort(function(a,b){
    return (a.pct === null ? 0.5 : a.pct) - (b.pct === null ? 0.5 : b.pct);
  });
}

/* ------------------------------------------------- dashboard tables ---- */
function _sliceStats(rows){
  /* rows: [{seen, correct}] in attempt order -> totals, recent, trend */
  var qs = 0, corr = 0;
  rows.forEach(function(r){ qs += r.seen; corr += r.correct; });
  var recent = rows.slice(-3), rq = 0, rc = 0;
  recent.forEach(function(r){ rq += r.seen; rc += r.correct; });
  var trend = null;
  if (rows.length >= 2){
    var half = rows.slice(0, Math.max(1, Math.floor(rows.length / 2))), hq = 0, hc = 0;
    half.forEach(function(r){ hq += r.seen; hc += r.correct; });
    if (hq && rq) trend = (rc / rq) - (hc / hq);
  }
  return {sets: rows.length, qs: qs, correct: corr,
          pct: qs ? corr / qs : null,
          recent_pct: rq ? rc / rq : null,
          trend: trend};
}

function topicTable(d){
  /* one row per topic, in exam order, with per-attempt history folded in */
  var hist = {};
  d.attempts.forEach(function(a){
    Object.keys(a.topics || {}).forEach(function(t){
      var v = a.topics[t];
      if (!v.seen) return;
      (hist[t] || (hist[t] = [])).push(v);
    });
  });
  return ORDER.map(function(k){
    var t = TOPIC[k];
    var st = _sliceStats(hist[k] || []);
    st.topic = k; st.portion = t.portion; st.label = t.label;
    st.exam_questions = t.exam_questions;
    st.counts_on_exam = countsOnExam(k);
    return st;
  });
}

function sectionTable(d){
  /* one row per section, folding every attempt that belongs to it */
  var out = [];
  ['national', 'georgia', 'comprehensive'].forEach(function(p){
    var keys = {};
    portionTopics(p).forEach(function(k){ keys[k] = 1; });
    var rows = [];
    d.attempts.forEach(function(a){
      var seen = 0, corr = 0;
      Object.keys(a.topics || {}).forEach(function(t){
        if (!keys[t]) return;
        seen += a.topics[t].seen; corr += a.topics[t].correct;
      });
      if (seen) rows.push({seen: seen, correct: corr});
    });
    var st = _sliceStats(rows);
    st.portion = p;
    st.name = {national: 'National', georgia: 'Georgia state',
               comprehensive: 'Comprehensive'}[p];
    st.scored = (DATA.portions[p] || {}).scored || 0;
    out.push(st);
  });
  return out;
}

function headline(d){
  /* the readout strip: overall standing against the 75% pass mark */
  var all = [];
  d.attempts.forEach(function(a){
    var keys = {};
    portionTopics('national').concat(portionTopics('georgia'))
      .forEach(function(k){ keys[k] = 1; });
    var seen = 0, corr = 0;
    Object.keys(a.topics || {}).forEach(function(t){
      if (!keys[t]) return;
      seen += a.topics[t].seen; corr += a.topics[t].correct;
    });
    if (seen) all.push({seen: seen, correct: corr});
  });
  var overall = _sliceStats(all);
  var answered = 0;
  d.attempts.forEach(function(a){ answered += a.count; });
  var days = null;
  var exam = asDate((d.profile || {}).exam_date);
  if (exam){
    var t = new Date(); t.setHours(0, 0, 0, 0);
    days = Math.round((exam - t) / 86400000);
  }
  return {exam_pct: overall.recent_pct, sets: d.attempts.length,
          answered: answered, days_out: days,
          trend: overall.trend, passing: overall.recent_pct !== null
                                          && overall.recent_pct >= 0.75};
}

/* ---------------------------------------------------------------- plan */
function asDate(v){
  if (!v) return null;
  var p = String(v).slice(0,10).split('-');
  if (p.length !== 3) return null;
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  return isNaN(d) ? null : d;
}
function iso(d){
  return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
}
function addDays(d, n){ var x = new Date(d); x.setDate(x.getDate()+n); return x; }
function dayDiff(a, b){ return Math.round((a-b)/86400000); }

function phasePlan(n){
  if (n <= 1) return ['Drill & mock'];
  if (n === 2) return ['Weak-area drill','Mock exams & review'];
  if (n === 3) return ['Weak-area drill','Full coverage','Mock exams & review'];
  var build = Math.max(1, Math.round(n*0.45));
  var drill = Math.max(1, Math.round(n*0.35));
  var final_ = Math.max(1, n - build - drill);
  var out = [];
  for (var i=0;i<build;i++) out.push('Build coverage');
  for (i=0;i<drill;i++) out.push('Weak-area drill');
  for (i=0;i<final_;i++) out.push('Mock exams & review');
  return out.slice(0, n);
}

function why(r){
  if (r.pct !== null && r.seen >= 4)
    return 'you are at '+Math.round(r.pct*100)+'% here ('+r.seen+' questions), worth '+r.exam_questions+' on the exam';
  if (r.declared_weak) return 'you flagged this as a weak area; worth '+r.exam_questions+' on the exam';
  if (!r.seen) return 'no data yet -- worth '+r.exam_questions+' questions on the exam';
  return 'only '+r.seen+' questions attempted; worth '+r.exam_questions+' on the exam';
}

function ranked(d){
  var dec = {};
  ((d.profile||{}).declared_weak||[]).forEach(function(k){ dec[k]=1; });
  return ORDER.filter(countsOnExam).map(function(k){
    var t = TOPIC[k], rec = d.topics[k];
    var seen = rec ? rec.seen : 0, corr = rec ? rec.correct : 0;
    var s = topicPriority(rec, t.exam_questions);
    if (dec[k]) s += rec ? 0.20 : 0.45;
    return {topic:k, portion:t.portion, label:t.label, exam_questions:t.exam_questions,
            declared_weak:!!dec[k], seen:seen, pct: seen ? corr/seen : null, score:s};
  }).sort(function(a,b){ return b.score - a.score; });
}

function bufferPlan(days){
  if (days <= 0) return [];
  var out = ['Light review only -- no new material.'];
  if (days >= 2) out.push('One 132-question mock exam, timed, at your real exam time of day.');
  if (days >= 3) out.push('Re-read every explanation you missed on the last two mocks.');
  out.push('Day before: 20-question math sprint, then stop. Sleep beats cramming.');
  return out;
}

function buildPlan(d){
  var prof = d.profile || {};
  var exam = asDate(prof.exam_date);
  if (!exam) return {error:'Set an exam date to generate a schedule.'};
  var mastery = asDate(prof.mastery_date) || exam;
  if (mastery > exam) mastery = exam;
  var hours = prof.hours_per_week || 8;

  var today = new Date(); today.setHours(0,0,0,0);
  var daysExam = dayDiff(exam, today), daysMastery = dayDiff(mastery, today);
  var planDays = Math.max(1, daysMastery);
  var nWeeks = Math.max(1, Math.ceil(planDays/7));
  var phases = phasePlan(nWeeks);

  var all = ranked(d);
  var nat = all.filter(function(r){ return r.portion === 'national'; });
  var ga = all.filter(function(r){ return r.portion === 'georgia'; });
  var shareN = EXAM.national/TOTAL_Q;
  var nFocusN = Math.max(2, Math.round(3*shareN)+1);
  var nFocusG = Math.max(2, Math.round(3*(1-shareN))+1);

  var weeks = [], cursor = today, ni = 0, gi = 0;
  for (var i = 0; i < nWeeks; i++){
    var start = cursor, end = addDays(start, 6);
    if (end > mastery) end = mastery;
    var phase = phases[i], focus = [], tasks;
    if (phase === 'Mock exams & review'){
      focus = nat.slice(0,2).concat(ga.slice(0,2));
      tasks = ['Take one FULL mock exam (132 questions, National + Georgia).',
               'Review every miss and write the rule in your own words.',
               'Run Weak-spot mode twice on whatever the mock exposes.',
               'Do one 15-question math sprint daily.'];
    } else {
      for (var j = 0; j < nFocusN; j++) focus.push(nat[ni++ % nat.length]);
      for (j = 0; j < nFocusG; j++) focus.push(ga[gi++ % ga.length]);
      tasks = (phase === 'Weak-area drill')
        ? ['Weak-spot quiz, 20 questions, once per study day.',
           'Two 20-question topic quizzes on the focus topics below.',
           'Math practice mode: 10 problems daily, read every solution.']
        : ['One 20-question quiz per focus topic below.',
           'One 25-question National quiz to keep breadth.',
           'Math practice mode: 10 problems, 3x this week.'];
    }
    var wq = Math.round(hours*25);
    weeks.push({
      week:i+1, phase:phase, start:iso(start), end:iso(end),
      target_questions:wq,
      national_questions:Math.round(wq*shareN),
      georgia_questions:wq - Math.round(wq*shareN),
      focus: focus.map(function(r){
        return {topic:r.topic, label:r.label, portion:r.portion, why:why(r)};
      }),
      tasks: tasks
    });
    cursor = addDays(end, 1);
    if (cursor > mastery) break;
  }

  return {
    exam_date: iso(exam), mastery_date: iso(mastery),
    days_to_exam: daysExam, days_to_mastery: daysMastery,
    buffer_days: Math.max(0, dayDiff(exam, mastery)),
    weeks: weeks,
    weighting: {national:EXAM.national, georgia:EXAM.georgia},
    buffer_plan: bufferPlan(Math.max(0, dayDiff(exam, mastery)))
  };
}
</script>
<script>/* Views. Renders into the empty <section>s in the shell. */
'use strict';

var D = load();              // the whole progress record, kept in memory
var QUIZ = null, TICK = null, LAST = null;

function $(id){ return document.getElementById(id); }
function el(t, c, x){
  var n = document.createElement(t);
  if (c) n.className = c;
  if (x !== undefined && x !== null) n.textContent = x;
  return n;
}
function pct(x){ return (x === null || x === undefined) ? '--' : Math.round(x*100)+'%'; }
function band(p){ return (p===null||p===undefined) ? '' : (p<0.6?'low':(p<0.8?'mid':'high')); }
function mmss(s){ s = Math.max(0, Math.round(s)); return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2); }
function tagFor(portion){
  var cls = portion === 'georgia' ? ' ga' : (portion === 'comprehensive' ? ' comp' : '');
  var txt = portion === 'georgia' ? 'GA' : (portion === 'comprehensive' ? 'COMP' : 'NAT');
  return el('span', 'tag' + cls, txt);
}
function persist(){ save(D); }

/* -------------------------------------------------------------- routing */
var VIEWS = ['dash','study','home','math','weak','quiz','result','plan','setup'];
var STUDY_TOPIC = null;
function show(v){
  VIEWS.forEach(function(x){ var n = $('view-'+x); if (n) n.hidden = (x !== v); });
  document.querySelectorAll('#rail button').forEach(function(b){
    var on = b.dataset.view === v;
    b.classList.toggle('on', on);
    b.setAttribute('aria-current', on ? 'page' : 'false');
  });
  if (v === 'home') renderHome();
  if (v === 'study') renderStudy();
  if (v === 'math') renderMath();
  if (v === 'weak') renderWeak();
  if (v === 'dash') renderDash();
  if (v === 'plan') renderPlan();
  if (v === 'setup') renderSetup();
  window.scrollTo(0,0);
}
document.querySelectorAll('#rail button').forEach(function(b){
  b.onclick = function(){
    if (QUIZ && !confirm('Leave this quiz? It will not be scored.')) return;
    if (QUIZ){ stopTimer(); QUIZ = null; }
    show(b.dataset.view);
  };
});

function ro(key, value, note, hero){
  var d = el('div', 'ro' + (hero ? ' hero' : ''));
  d.appendChild(el('div', 'k', key));
  var v = el('div', 'v', value);
  if (note){
    var s2 = el('small', null, '\u00b7 ' + note);
    v.appendChild(s2);
  }
  d.appendChild(v);
  return d;
}

/* The status strip in the header: the five numbers worth seeing on every screen. */

  var hero = ro('Readiness', h.exam_pct === null ? '\u2014' : pct(h.exam_pct),

/* ----------------------------------------------------------------- quiz */
function startQuiz(opts){
  var qs = (opts.mode === 'exam') ? mockExam(opts.difficulty)
         : select(opts.portion, opts.count, {weak_spot:opts.weak_spot,
                                             topic:opts.topic, sub:opts.sub,
                                             progress:D,
                                             difficulty:opts.difficulty});
  if (!qs.length){ alert('No questions matched that selection.'); return; }
  LAST = opts;
  QUIZ = {qs:qs, i:0, correct:0, answers:new Array(qs.length),
          portion: (opts.mode === 'exam') ? 'mixed' : opts.portion,
          mode: opts.mode || (opts.topic ? 'topic' : 'quiz'),
          weak: !!opts.weak_spot, locked:false,
          limit: opts.timed === false ? 0 : qs.length*DATA.spq,
          started: Date.now(), qStart: Date.now()};
  $('view-quiz').innerHTML =
    '<div class="progressbar"><div id="qprog" style="width:0"></div></div>' +
    '<div class="qhead"><div><span class="tag" id="qtag"></span> ' +
      '<span class="tag hard" id="qhard" hidden>Hard</span> ' +
      '<span class="muted" id="qcount"></span></div>' +
      '<div class="timer" id="qtimer"></div></div>' +
    '<div class="card"><div class="eyebrow" id="qtopic"></div>' +
      '<div class="qtext" id="qtext"></div><div class="choices" id="qchoices"></div>' +
      '<div id="qfeedback"></div></div>' +
    '<div class="row"><div style="flex:0 0 auto">' +
      '<button class="btn" id="qnext" disabled>Next</button></div>' +
      '<div style="flex:0 0 auto"><button class="btn ghost" id="qquit">End &amp; score</button></div></div>';
  $('qnext').onclick = function(){
    if (QUIZ.i >= QUIZ.qs.length-1) return finish();
    QUIZ.i++; renderQuestion();
  };
  $('qquit').onclick = function(){
    if (confirm('End the quiz now and score what you have answered?')) finish();
  };
  show('quiz'); startTimer(); renderQuestion();
}

function startTimer(){
  stopTimer();
  if (!QUIZ.limit){ $('qtimer').textContent = ''; return; }
  TICK = setInterval(function(){
    if (!QUIZ) return stopTimer();
    var left = QUIZ.limit - (Date.now()-QUIZ.started)/1000;
    $('qtimer').textContent = mmss(left);
    $('qtimer').classList.toggle('warn', left < 120);
    if (left <= 0){ stopTimer(); alert('Time is up. Scoring what you have.'); finish(); }
  }, 500);
}
function stopTimer(){ if (TICK){ clearInterval(TICK); TICK = null; } }

function renderQuestion(){
  var q = QUIZ.qs[QUIZ.i];
  QUIZ.locked = false; QUIZ.qStart = Date.now();
  $('qprog').style.width = (QUIZ.i/QUIZ.qs.length*100)+'%';
  $('qcount').textContent = 'Question '+(QUIZ.i+1)+' of '+QUIZ.qs.length;
  var ga = q.portion === 'georgia', comp = q.portion === 'comprehensive';
  $('qtag').textContent = comp ? 'Comprehensive'
                        : (q.generator ? 'Math' : (ga ? 'Georgia' : 'National'));
  $('qtag').className = 'tag' + (ga ? ' ga' : (comp ? ' comp' : ''));
  $('qhard').hidden = ((q.difficulty || 1) !== 2);
  $('qtopic').textContent = label(q.topic);
  $('qtext').textContent = q.q;
  $('qfeedback').innerHTML = '';
  $('qnext').disabled = true;
  $('qnext').textContent = (QUIZ.i === QUIZ.qs.length-1) ? 'Finish' : 'Next';
  var box = $('qchoices'); box.innerHTML = '';
  q.choices.forEach(function(text, k){
    var b = el('button','choice');
    b.appendChild(el('span','k','ABCD'[k]));
    b.appendChild(el('span', null, text));
    b.onclick = function(){ answer(k); };
    box.appendChild(b);
  });
}

function answer(choice){
  if (QUIZ.locked) return;
  QUIZ.locked = true;
  var q = QUIZ.qs[QUIZ.i], correct = (choice === q.answer);
  if (correct) QUIZ.correct++;
  QUIZ.answers[QUIZ.i] = {qid:q.id, topic:q.topic, sub:q.sub||null,
                          generator:q.generator||null,
                          choice:choice, correct:correct,
                          seconds:(Date.now()-QUIZ.qStart)/1000};
  var btns = $('qchoices').children;
  for (var k = 0; k < btns.length; k++){
    btns[k].disabled = true;
    if (k === q.answer) btns[k].classList.add('correct');
    else if (k === choice) btns[k].classList.add('wrong');
  }
  var fb = el('div','feedback '+(correct?'ok':'no'));
  fb.appendChild(el('div','verdict', correct ? 'Correct' : 'Not quite'));
  if (!correct)
    fb.appendChild(el('div', null, 'Correct answer: '+'ABCD'[q.answer]+'. '+q.choices[q.answer]));
  if (q.steps && q.steps.length){
    var ol = el('ol','steps');
    q.steps.forEach(function(s){ ol.appendChild(el('li', null, s)); });
    fb.appendChild(ol);
  } else if (q.explain){
    fb.appendChild(el('div', null, q.explain));
  }
  if (q.concept){
    var c = el('div','concept');
    c.appendChild(el('b', null, 'Concept tested: '));
    c.appendChild(document.createTextNode(q.concept));
    fb.appendChild(c);
  }
  $('qfeedback').appendChild(fb);
  $('qnext').disabled = false;
  $('qnext').focus();
}

document.addEventListener('keydown', function(e){
  if (!QUIZ || $('view-quiz').hidden) return;
  var k = 'abcd'.indexOf((e.key||'').toLowerCase());
  if (k >= 0 && k < QUIZ.qs[QUIZ.i].choices.length && !QUIZ.locked){ answer(k); return; }
  if ((e.key === 'Enter' || e.key === ' ') && !$('qnext').disabled){
    e.preventDefault(); $('qnext').click();
  }
});

function finish(){
  stopTimer();
  var q = QUIZ; QUIZ = null;
  var answers = [];
  q.answers.forEach(function(a){ if (a) answers.push(a); });
  q.answers.forEach(function(a, i){
    if (!a){
      var x = q.qs[i];
      answers.push({qid:x.id, topic:x.topic, sub:x.sub||null,
                    generator:x.generator||null,
                    choice:null, correct:false, seconds:0});
    }
  });
  var att = recordAttempt(D, q.portion, q.mode, answers,
                          (Date.now()-q.started)/1000, q.weak);
  persist(); countdown();
  renderResult(att); show('result');
}

/* Build a text fragment, styling runs of capitals so they read as emphasis
   rather than shouting once the text is set in serif at reading size. */
var CAPS_RE = /\b[A-Z][A-Z&.''-]+(?:\s+[A-Z][A-Z&.''-]+)*\b/g;
function richText(text){
  var frag = document.createDocumentFragment();
  var last = 0, m;
  CAPS_RE.lastIndex = 0;
  while ((m = CAPS_RE.exec(text)) !== null){
    if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
    frag.appendChild(el('span', 'caps', m[0]));
    last = m.index + m[0].length;
  }
  if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
  return frag;
}
function richPara(cls, text){
  var n = el('p', cls);
  n.appendChild(richText(text));
  return n;
}

/* "Acceleration - on default the balance is due" reads far better as a bolded
   term followed by its explanation, so split the label out where there is one. */
function bulletItem(text){
  var li = el('li');
  var m = /^(.{2,48}?)\s+(?:--|-|–)\s+(.+)$/.exec(text);
  if (m && !/[.?!]$/.test(m[1])){
    li.appendChild(el('span', 'term', m[1]));
    li.appendChild(richText(m[2]));
  } else {
    li.appendChild(richText(text));
  }
  return li;
}

/* A short self-test after each section. Deliberately NOT recorded against your
   scores - these check that you took the reading in, and counting them would
   flatter the readiness number on the dashboard. */
function checkBlock(sec){
  var qs = sec.check || [];
  if (!qs.length) return null;
  var box = el('div', 'check');
  var head = el('div', 'checkhead');
  head.appendChild(el('span', null, 'Check yourself'));
  var score = el('span', 'checkscore', '0 / ' + qs.length);
  head.appendChild(score);
  box.appendChild(head);

  var answered = 0, right = 0;
  qs.forEach(function(q){
    var wrap = el('div', 'checkq');
    wrap.appendChild(el('p', 'cq', q.q));
    var opts = el('div', 'copts');
    var why = el('div', 'cwhy');
    why.hidden = true;
    q.choices.forEach(function(text, i){
      var b = el('button', 'copt', text);
      b.onclick = function(){
        var correct = (i === q.answer);
        answered++;
        if (correct) right++;
        score.textContent = right + ' / ' + qs.length;
        Array.prototype.forEach.call(opts.children, function(btn, j){
          btn.disabled = true;
          if (j === q.answer) btn.className = 'copt right';
          else if (j === i) btn.className = 'copt wrong';
        });
        why.className = 'cwhy ' + (correct ? 'ok' : 'no');
        why.innerHTML = '';
        why.appendChild(el('b', null, correct ? 'Correct' : 'Not quite'));
        why.appendChild(document.createTextNode(q.why));
        why.hidden = false;
      };
      opts.appendChild(b);
    });
    wrap.appendChild(opts);
    wrap.appendChild(why);
    box.appendChild(wrap);
  });
  return box;
}

function sparkline(points, w, h){
  var ns = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','0 0 '+w+' '+h);
  svg.setAttribute('width', w); svg.setAttribute('height', h);
  svg.setAttribute('class','spark'); svg.setAttribute('role','img');
  [0.5,0.75,1].forEach(function(y){
    var yy = h - y*(h-14) - 7;
    var ln = document.createElementNS(ns,'line');
    ln.setAttribute('x1',26); ln.setAttribute('x2',w);
    ln.setAttribute('y1',yy); ln.setAttribute('y2',yy);
    ln.setAttribute('class','gl');
    if (y === 0.75) ln.setAttribute('stroke-dasharray','3 3');
    svg.appendChild(ln);
    var tx = document.createElementNS(ns,'text');
    tx.setAttribute('x',0); tx.setAttribute('y',yy+3);
    tx.textContent = Math.round(y*100)+'%';
    svg.appendChild(tx);
  });
  if (points.length){
    var step = points.length > 1 ? (w-32)/(points.length-1) : 0;
    var d = points.map(function(p,i){
      return (i?'L':'M')+(28+i*step).toFixed(1)+' '+(h-p.pct*(h-14)-7).toFixed(1);
    }).join(' ');
    var path = document.createElementNS(ns,'path');
    path.setAttribute('d',d); path.setAttribute('fill','none');
    path.setAttribute('stroke','currentColor'); path.setAttribute('stroke-width','2');
    path.setAttribute('stroke-linejoin','round'); path.setAttribute('stroke-linecap','round');
    svg.appendChild(path);
    points.forEach(function(p,i){
      var c = document.createElementNS(ns,'circle');
      c.setAttribute('cx',28+i*step); c.setAttribute('cy',h-p.pct*(h-14)-7);
      c.setAttribute('r', i === points.length-1 ? 3.4 : 2.4);
      c.setAttribute('fill','currentColor');
      svg.appendChild(c);
    });
  }
  return svg;
}

  });
  head.appendChild(g); box.appendChild(head);

  p.weeks.forEach(function(w){
    var c = el('div','card'), wk = el('div','week');
    wk.appendChild(el('h3', null, 'Week '+w.week+' -- '+w.phase));
    wk.appendChild(el('div','when', w.start+' to '+w.end+'  |  target '+w.target_questions+
      ' questions ('+w.national_questions+' national, '+w.georgia_questions+' Georgia)'));
    var ul = el('ul');
    w.tasks.forEach(function(t){ ul.appendChild(el('li', null, t)); });
    wk.appendChild(ul);
    if (w.focus.length){
      var fl = el('div','focuslist');
      w.focus.forEach(function(f){
        var d = el('div','focus'), line = el('div');
        line.appendChild(el('b', null, f.label));
        line.appendChild(document.createTextNode(' '));
        line.appendChild(tagFor(f.portion));
        d.appendChild(line);
        d.appendChild(el('div','muted',f.why));
        fl.appendChild(d);
      });
      wk.appendChild(fl);
    }
    c.appendChild(wk); box.appendChild(c);
  });

  if (p.buffer_plan.length){
    var b = el('div','card');
    b.appendChild(el('h2',null,'Final '+p.buffer_days+' days before the exam'));
    var ul2 = el('ul');
    p.buffer_plan.forEach(function(t){ ul2.appendChild(el('li', null, t)); });
    b.appendChild(ul2); box.appendChild(b);
  }
}

/* ---------------------------------------------------------------- setup */
function renderSetup(){
  var v = $('view-setup');
  v.innerHTML =
    '<h1>Setup</h1><p class="sub">Your progress is stored in this browser only, so each ' +
    'device keeps its own history. Use export and import to move it between them.</p>' +
    '<div class="card"><h2>Move progress between devices</h2>' +
      '<p class="muted">Export copies your whole history as text. On the other device, ' +
      'paste it below and choose Import.</p>' +
      '<div class="row" style="margin-bottom:12px">' +
        '<div style="flex:0 0 auto"><button class="btn" id="doExport">Export to the box below</button></div>' +
        '<div style="flex:0 0 auto"><button class="btn ghost" id="doCopy">Copy to clipboard</button></div>' +
        '<div style="flex:0 0 auto"><button class="btn ghost" id="doImport">Import what is in the box</button></div>' +
      '</div>' +
      '<textarea id="ioBox" rows="7" spellcheck="false" placeholder="Exported progress appears here."></textarea>' +
      '<div class="muted" id="ioNote" style="margin-top:8px"></div></div>' +
    '<div class="card"><h2>Start over</h2>' +
      '<p class="muted">Clears every attempt and score. Your exam date and weak-area ' +
      'choices are kept.</p>' +
      '<button class="btn danger" id="doReset">Erase my history</button></div>' +
    '<div class="card"><h2>What is in here</h2><div id="bankBox"></div></div>';

  $('doExport').onclick = function(){
    $('ioBox').value = JSON.stringify(D);
    $('ioNote').textContent = 'Exported ' + D.attempts.length + ' attempts.';
  };
  $('doCopy').onclick = function(){
    if (!$('ioBox').value) $('ioBox').value = JSON.stringify(D);
    $('ioBox').select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch(e){ ok = false; }
    if (!ok && navigator.clipboard){
      navigator.clipboard.writeText($('ioBox').value).then(function(){
        $('ioNote').textContent = 'Copied.';
      });
      return;
    }
    $('ioNote').textContent = ok ? 'Copied.' : 'Could not copy -- select the text and copy manually.';
  };
  $('doImport').onclick = function(){
    var raw = $('ioBox').value.trim();
    if (!raw){ $('ioNote').textContent = 'Paste exported progress into the box first.'; return; }
    var d;
    try { d = JSON.parse(raw); }
    catch(e){ $('ioNote').textContent = 'That is not valid exported progress.'; return; }
    if (!d || !Array.isArray(d.attempts)){
      $('ioNote').textContent = 'That does not look like a progress export.'; return;
    }
    if (!confirm('Replace this device’s history with the imported one? ' +
                 'This device currently has ' + D.attempts.length + ' attempts.')) return;
    Object.keys(EMPTY).forEach(function(k){
      if (d[k] === undefined) d[k] = JSON.parse(JSON.stringify(EMPTY[k]));
    });
    D = d; persist(); countdown();
    $('ioNote').textContent = 'Imported ' + D.attempts.length + ' attempts.';
  };
  $('doReset').onclick = function(){
    if (!confirm('Erase all attempts and scores? This cannot be undone.')) return;
    D.attempts = []; D.topics = {}; D.subs = {}; D.items = {}; D.generators = {};
    persist(); renderSetup();
  };

  var mathN = 0;
  Object.keys(DATA.math).forEach(function(k){ mathN += DATA.math[k].q.length; });
  function count(k, hardOnly){
    var rows = DATA.banks[k] || [];
    return hardOnly ? rows.filter(function(r){ return r.difficulty === 2; }).length : rows.length;
  }
  var box = $('bankBox'), wrap = el('div','scroll'), t = el('table');
  t.innerHTML = '<tr><th>Bank</th><th class="num">Questions</th></tr>';
  [['National portion (' + count('national', true) + ' hard)', count('national')],
   ['Georgia portion (' + count('georgia', true) + ' hard)', count('georgia')],
   ['Comprehensive subtest (all hard)', count('comprehensive')],
   ['Math problems (' + Object.keys(DATA.math).length + ' types)', mathN],
   ['Attempts recorded on this device', D.attempts.length]].forEach(function(r){
    var tr = el('tr');
    tr.appendChild(el('td', null, r[0]));
    tr.appendChild(el('td','num', String(r[1])));
    t.appendChild(tr);
  });
  wrap.appendChild(t); box.appendChild(wrap);
}

/* ----------------------------------------------------------------- boot */
(function(){
  var mathN = 0;
  Object.keys(DATA.math).forEach(function(k){ mathN += DATA.math[k].q.length; });
  var written = 0, hard = 0;
  Object.keys(DATA.banks).forEach(function(k){
    written += DATA.banks[k].length;
    hard += DATA.banks[k].filter(function(r){ return r.difficulty === 2; }).length;
  });
  var vocabN = 0;
  Object.keys(DATA.study.topics).forEach(function(k){
    vocabN += DATA.study.topics[k].vocab.length;
  });
  $('bankcount').textContent = written + ' questions (' + hard + ' hard) + ' + mathN +
    ' math problems + study notes on ' + Object.keys(DATA.study.topics).length +
    ' topics (' + vocabN + ' terms)';
  countdown();
  show('home');
})();
</script>
