eering & blockbusting","topic":"georgia/fair-housing"},{"answer":0,"choices":["Permit the reasonable modification at the tenant's expense","Terminate the lease","Pay for and install it","Refuse if the lease bars changes"],"concept":"Modification vs. accommodation","difficulty":1,"explain":"Physical MODIFICATIONS are permitted at the tenant's expense, with possible restoration on move-out. Policy ACCOMMODATIONS, like waiving a no-pets rule for a service animal, are at the landlord's expense.","id":"geo-42db70a4","portion":"georgia","q":"A tenant with a disability asks to install a grab bar. Under fair housing law the landlord must:","sub":"georgia/fair-housing|Accommodations & modifications","subtopic":"Accommodations & modifications","topic":"georgia/fair-housing"},{"answer":2,"choices":["Religion","National origin","Marital status","Familial status"],"concept":"The seven federal protected classes","difficulty":1,"explain":"Race, color, religion, sex, national origin, familial status, and handicap. Marital status is protected by ECOA in LENDING and by some local ordinances, but is not one of the seven federal housing classes.","id":"geo-0379ccf7","portion":"georgia","q":"Which is NOT a protected class under the federal Fair Housing Act?","sub":"georgia/fair-housing|Protected classes","subtopic":"Protected classes","topic":"georgia/fair-housing"},{"answer":1,"choices":["GREC only","HUD, and GREC may also discipline the licensee","The MLS","The county tax office"],"concept":"Enforcement channels","difficulty":1,"explain":"HUD handles federal fair housing complaints (generally within one year), and a licensee's conduct can independently cost them their license through GREC discipline.","id":"geo-45081387","portion":"georgia","q":"A complaint of housing discrimination in Georgia may be filed with:","sub":"georgia/fair-housing|Unlawful instructions & enforcement","subtopic":"Unlawful instructions & enforcement","topic":"georgia/fair-housing"},{"answer":0,"choices":["Refuse and, if the seller persists, withdraw from the engagement","Refer the seller to another licensee","Comply, since the seller is the client","Comply but document it"],"concept":"Unlawful client instructions","difficulty":1,"explain":"The duty of obedience covers LAWFUL instructions only. Following the instruction makes the licensee personally liable, and referring the seller to a colleague simply spreads the violation.","id":"geo-f039cc11","portion":"georgia","q":"A seller instructs a Georgia licensee to reject offers from a particular ethnic group. The licensee should:","sub":"georgia/fair-housing|Unlawful instructions & enforcement","subtopic":"Unlawful instructions & enforcement","topic":"georgia/fair-housing"},{"answer":1,"choices":["Always a federal fair housing violation","Not a federal violation, though it may violate local law and can show disparate impact","Required by HUD","Permitted only for houses"],"concept":"Source of income and fair housing","difficulty":1,"explain":"Source of income is not one of the seven federal classes, so the phrase is not automatically a federal violation. Some Georgia local ordinances do protect it, and a blanket policy can still create disparate-impact exposure.","id":"geo-89d9e927","portion":"georgia","q":"An advertisement for a Georgia rental reading 'no Section 8' is:","sub":"georgia/fair-housing|Protected classes","subtopic":"Protected classes","topic":"georgia/fair-housing"},{"answer":3,"choices":["Converts automatically to inactive","Is fine if the licensee took CE instead","Renews normally at the four-year mark","Lapses -- the 25-hour course was due within the first year"],"concept":"The postlicense deadline is absolute","difficulty":2,"explain":"The 25-hour Sales Post-license Course is due within ONE year of original licensure and applies whether active or inactive, resident or nonresident. CE does not substitute for it. Missing the deadline costs the license.","id":"geo-d0f34702","portion":"georgia","q":"A Georgia salesperson licensed 14 months ago never took the postlicense course. The licensee's status is that the license:","sub":"georgia/license-law|Education requirements","subtopic":"Education requirements","topic":"georgia/license-law"},{"answer":1,"choices":["Award treble damages","Revoke or suspend the license, fine, and require education or accountant reports","Order the licensee to repay the $18,000","Garnish the licensee's commissions"],"concept":"GREC cannot order restitution","difficulty":2,"explain":"GREC's powers are reprimand, suspension, revocation, fines, required education, and required CPA reports on trust accounts. It has NO authority to compel repayment of a financial loss -- the consumer must sue civilly, and should not wait for the investigation to finish.","id":"geo-bd43e39c","portion":"georgia","q":"A consumer loses $18,000 because of a Georgia licensee's mishandling of funds and files a GREC complaint. The most GREC itself can do is:","sub":"georgia/license-law|GREC discipline & sanctions","subtopic":"GREC discipline & sanctions","topic":"georgia/license-law"},{"answer":2,"choices":["Must have five continuous years","Must first hold a Georgia salesperson license for three years","Satisfies the requirement, with a certified license history from Florida","Cannot qualify, since out-of-state experience does not count"],"concept":"Out-of-state experience counts in Georgia","difficulty":2,"explain":"Georgia requires three of the five years immediately preceding application in ACTIVE status, and active licensure in another state qualifies. The applicant must obtain a certified copy of license history and education from every state where they have held a license.","id":"geo-b5b7dcf6","portion":"georgia","q":"An applicant held an active Florida broker's license for four of the last five years and now applies for a Georgia broker's license. Regarding experience, the applicant:","sub":"georgia/license-law|Licensure & experience","subtopic":"Licensure & experience","topic":"georgia/license-law"},{"answer":2,"choices":["Needs a separate property management license","Must transfer the property to the brokerage","Must disclose licensed status in writing in the lease and use a broker-approved trust account","May act as an ordinary owner, since owners are exempt from licensure"],"concept":"Exceptions to licensure never apply to a licensee","difficulty":2,"explain":"O.C.G.A. 43-40-29(c) provides that none of the exceptions to licensure applies to a person who holds a license. Selling or leasing your own property means written disclosure of licensed status and placing any trust funds in an account approved by your broker.","id":"geo-48593a94","portion":"georgia","q":"A Georgia licensee owns a rental duplex personally and advertises it for lease. The licensee:","sub":"georgia/license-law|Licensee as principal","subtopic":"Licensee as principal","topic":"georgia/license-law"},{"answer":2,"choices":["A new hearing is scheduled","An automatic appeal to superior court","The decision became final after 30 days","The decision is void for lack of a hearing before the Commission"],"concept":"The 30-day window after an ALJ decision","difficulty":2,"explain":"If the respondent does not ask the Commission to review within 30 days of the ALJ's decision, it becomes final. The Commission also has 30 days to request review if IT disagrees. After that, the route is an appeal to the courts.","id":"geo-3996bce3","portion":"georgia","q":"An ALJ rules against a Georgia licensee. The licensee disagrees and does nothing for 35 days. The result is:","sub":"georgia/license-law|Investigations & hearings","subtopic":"Investigations & hearings","topic":"georgia/license-law"},{"answer":2,"choices":["Only if a consumer complains","Limited to a fine against the firm","Potential discipline for failure to supervise, in addition to the salesperson's violation","None, since the salesperson acted alone"],"concept":"Failure to supervise is its own violation","difficulty":2,"explain":"The qualifying broker answers to GREC for the firm's compliance, and inadequate supervision is an independent charge. GREC can act on its own motion, so a consumer complaint is not a prerequisite.","id":"geo-9534fcbc","portion":"georgia","q":"A qualifying broker discovers an affiliated salesperson has been advertising without naming the firm. The broker's exposure is:","sub":"georgia/license-law|Broker supervision & the firm","subtopic":"Broker supervision & the firm","topic":"georgia/license-law"},{"answer":0,"choices":["Violated the reporting requirement, often punished more harshly than the underlying offense","Acted properly, since disclosure occurs at renewal","An obligation only to notify the broker","No obligation, as the crime was unrelated"],"concept":"Reporting convictions to GREC","difficulty":2,"explain":"Convictions must be reported to the Commission, not saved for renewal. GREC treats concealment as a separate and often more serious matter than the conviction itself, because it goes to honesty and trustworthiness.","id":"geo-a3d94b59","portion":"georgia","q":"A licensee is convicted of a felony unrelated to real estate and does not report it, believing renewal is two years away. The licensee has:","sub":"georgia/license-law|GREC discipline & sanctions","subtopic":"GREC discipline & sanctions","topic":"georgia/license-law"},{"answer":0,"choices":["Has satisfied the requirement","Must complete 6 hours per year regardless","Must complete 36 hours total","Must complete 24 more hours"],"concept":"Georgia CE is per renewal period, not per year","difficulty":2,"explain":"The requirement is at least 24 hours of GREC-approved CE during each FOUR-YEAR renewal period. There is no annual minimum. National guides quoting 36 hours are describing a different state.","id":"geo-9ba56f68","portion":"georgia","q":"A Georgia licensee with license number above 100,000 completed 24 hours of CE in the first year of a four-year renewal period and none after. At renewal the licensee:","sub":"georgia/license-law|Education requirements","subtopic":"Education requirements","topic":"georgia/license-law"},{"answer":0,"choices":["Has no agency relationship, since BRRETA requires written authority, but has acted well outside the customer role","Is a dual agent","Is the buyer's agent by implication","Is a subagent of the seller automatically"],"concept":"Written engagement is required -- but conduct still matters","difficulty":2,"explain":"BRRETA defines agency as representation 'by the latter's WRITTEN authority,' so no engagement means no agency. That is exactly why the statute exists. But behaving like an agent invites a claim and confusion, which is why the InfoBase urges clarifying status early.","id":"geo-84542fba","portion":"georgia","q":"A Georgia buyer works with a licensee for weeks, and the licensee gives advice on price and negotiation. No written agreement is ever signed. Under BRRETA the licensee:","sub":"georgia/brreta|Creating the engagement","subtopic":"Creating the engagement","topic":"georgia/brreta"},{"answer":1,"choices":["Withdraw from the transaction","Keep it confidential -- a dual agent discloses adverse material facts, not information a client asked be kept confidential","Disclose it only if the buyer asks directly","Disclose the seller's bottom line, since dual agents disclose everything"],"concept":"The dual agent's two competing rules","difficulty":2,"explain":"A dual agent must disclose adverse MATERIAL FACTS actually known, but expressly not information made confidential by a client's request. A negotiating position is confidential, not a material fact. Balancing these is the practical difficulty of dual agency.","id":"geo-1a3c41df","portion":"georgia","q":"A Georgia seller asks her broker to keep confidential that she will accept $20,000 less. The broker later serves as a DUAL agent for both sides. The broker must:","sub":"georgia/brreta|Dual agency","subtopic":"Dual agency","topic":"georgia/brreta"},{"answer":0,"choices":["Expressly NOT deemed a dual agent, and neither is the firm or its other licensees","The agent of whichever client signed first","Required to withdraw from the transaction","A dual agent, because the firm represents both clients"],"concept":"Designated agency is not dual agency in Georgia","difficulty":2,"explain":"O.C.G.A. 10-6A-13(b) states that where designated agents are appointed, neither the broker, the broker's licensees, nor the firm is deemed a dual agent. The statute also removes imputed knowledge: the broker and each designated agent are treated as having only their own actual knowledge, and the broker may not reveal confidential information received from a designated agent or client.","id":"geo-e5e8ba8e","portion":"georgia","q":"A Georgia broker assigns one licensee to the buyer and another to the seller in the same deal. Under BRRETA the broker is:","sub":"georgia/brreta|Dual agency","subtopic":"Dual agency","topic":"georgia/brreta"},{"answer":0,"choices":["Still represents only the buyer -- compensation does not create agency","Becomes the seller's agent or subagent","Must disclose the payment as a conflict","Becomes a dual agent"],"concept":"Compensation and agency are independent under BRRETA","difficulty":2,"explain":"BRRETA is explicit that paying compensation does not by itself create a brokerage engagement; only an express written agreement does. This is heavily tested because the intuition runs the other way.","id":"geo-898fed27","portion":"georgia","q":"In a Georgia transaction the seller pays the buyer-broker's commission out of closing proceeds. This means the buyer-broker:","sub":"georgia/brreta|Creating the engagement","subtopic":"Creating the engagement","topic":"georgia/brreta"},{"answer":2,"choices":["Disclose the identity of those buyers","Obtain the other buyers' written consent","Advise of agency types available, known conflicting relationships, compensation and sharing, and confidentiality duties -- but need not reveal that other buyers are represented","Decline the new engagement"],"concept":"The four BRRETA pre-engagement disclosures and their limit","difficulty":2,"explain":"BRRETA lists four disclosures and then expressly EXCLUDES having to reveal that the broker represents other buyers or sellers in similar transactions. Competing clients are normal; naming them would breach confidentiality.","id":"geo-eeeacbae","portion":"georgia","q":"Before entering a brokerage engagement, a Georgia broker who already represents three other buyers looking in the same neighborhood must:","sub":"georgia/brreta|Required disclosures","subtopic":"Required disclosures","topic":"georgia/brreta"},{"answer":3,"choices":["Only the Commission can decide the claim","The client waived all duties by signing","Fiduciary duties never apply to brokers anywhere","BRRETA provides a broker is not deemed a fiduciary and owes reasonable care in the duties the statute and engagement specify"],"concept":"BRRETA narrowed broker liability","difficulty":2,"explain":"BRRETA states a broker 'shall not be deemed to have a fiduciary relationship with any party' and is responsible for exercising reasonable care in its specified duties. That statutory narrowing -- unless the parties agree otherwise in a signed writing -- is the heart of the Act.","id":"geo-2fac4f13","portion":"georgia","q":"A Georgia client sues a broker for breach of fiduciary duty, citing common-law agency standards. Under BRRETA the broker's best position is that:","sub":"georgia/brreta|Scope of duties under BRRETA","subtopic":"Scope of duties under BRRETA","topic":"georgia/brreta"},{"answer":3,"choices":["Automatically one year","Valid until either party cancels","Valid for commercial property only","A license law violation -- a definite date is required"],"concept":"Definite termination dates","difficulty":2,"explain":"GREC requires a definite expiration date in brokerage engagements, and automatic renewal clauses are prohibited. An open-ended agreement is a disciplinary matter for the broker, independent of whether the client is happy.","id":"geo-47fed133","portion":"georgia","q":"A brokerage engagement in Georgia is signed with no expiration date. This is:","sub":"georgia/brreta|Engagement duration & termination","subtopic":"Engagement duration & termination","topic":"georgia/brreta"},{"answer":2,"choices":["Do so if the check is under $5,000","Never do so under any circumstances","Do so only with clear written authority agreed to by all parties","Do so on the buyer's verbal request"],"concept":"Deviating from prompt deposit","difficulty":2,"explain":"Georgia requires prompt deposit into a non-interest-bearing trust account. Holding a check until acceptance, using an interest-bearing account, or accepting a postdated check all require clear WRITTEN authority from all parties -- not just the buyer's say-so.","id":"geo-92661673","portion":"georgia","q":"A Georgia buyer asks the broker to hold the earnest money check uncashed until the seller accepts. The broker may:","sub":"georgia/trust-accounts|Deposit timing","subtopic":"Deposit timing","topic":"georgia/trust-accounts"},{"answer":0,"choices":["Opened all trust accounts under an Employer Identification Number","Used a second bank","Notified clients of the risk","Kept balances under $250,000"],"concept":"EIN, not SSN, for trust accounts","difficulty":2,"explain":"The InfoBase recounts trust accounts seized by the IRS, awarded in a divorce, and attached by a bank -- the common thread being accounts opened under the broker's SSN. An EIN keeps the account identifiable as trust property rather than the broker's asset.","id":"geo-2f6be5e6","portion":"georgia","q":"A Georgia broker opened the firm's trust account using her Social Security Number. The IRS later levies it for her personal tax debt. The InfoBase's guidance is that the broker should have:","sub":"georgia/trust-accounts|Opening & registering the account","subtopic":"Opening & registering the account","topic":"georgia/trust-accounts"},{"answer":2,"choices":["Is fully protected by pass-through coverage","Has no exposure, as FDIC covers brokers separately","May be liable for the $10,000 if the client was not told which bank holds trust funds","Must reimburse the full $260,000"],"concept":"The limit of FDIC pass-through coverage","difficulty":2,"explain":"Pass-through treats each client as a separate owner, but the FDIC ADDS the client's other deposits at the same bank against the $250,000 cap. The InfoBase warns that a broker who failed to disclose the bank and this limitation may be liable for the uninsured excess.","id":"geo-052c454d","portion":"georgia","q":"A client already has $250,000 on deposit at the same bank holding the broker's trust account, and gives the broker a $10,000 earnest money deposit. If the bank fails, the broker:","sub":"georgia/trust-accounts|FDIC coverage","subtopic":"FDIC coverage","topic":"georgia/trust-accounts"},{"answer":1,"choices":["Obtain GREC approval for each transaction","Register the account with GREC, remain responsible for it, and obtain at least quarterly written reconciliations","Close the account and consolidate","Do nothing further, since the properties are the licensee's"],"concept":"Affiliate-held trust accounts","difficulty":2,"explain":"The broker registers the account with the Commission and stays responsible for it. The affiliate must provide at least QUARTERLY written reconciliation statements comparing total trust liability with the reconciled bank balance, and keep the same records a broker keeps.","id":"geo-68a1c025","portion":"georgia","q":"A Georgia broker lets an affiliated licensee maintain a trust account for the licensee's own rental properties. The broker must:","sub":"georgia/trust-accounts|Audits & reconciliation","subtopic":"Audits & reconciliation","topic":"georgia/trust-accounts"},{"answer":1,"choices":["Insist GREC obtain a subpoena","Request that GREC accept the CPA report instead, which GREC may accept at its discretion","Refuse the examination outright","Provide only bank statements"],"concept":"CPA certification in lieu of examination","difficulty":2,"explain":"GREC may examine trust accounts on reasonable request. The Commission MAY accept a CPA's certification of compliance instead, but that is discretionary -- the broker can request it, not demand it.","id":"geo-f206c14f","portion":"georgia","q":"GREC staff asks a Georgia broker to produce trust account records. The broker has a CPA's compliance certification on file. The broker may:","sub":"georgia/trust-accounts|Audits & reconciliation","subtopic":"Audits & reconciliation","topic":"georgia/trust-accounts"},{"answer":1,"choices":["Wednesday, splitting the difference","Thursday, when acceptance was communicated","Tuesday, when the seller signed","The date the contract is recorded"],"concept":"Georgia's binding agreement date","difficulty":2,"explain":"Georgia measures contract deadlines -- due diligence, financing, closing -- from the binding agreement date, which is when acceptance is communicated to the offeror. Getting this wrong shifts every subsequent deadline.","id":"geo-1952d812","portion":"georgia","q":"A Georgia seller signs a buyer's offer on Tuesday but the agent does not notify the buyer until Thursday. The binding agreement date is:","sub":"georgia/contracts|Binding agreement date","subtopic":"Binding agreement date","topic":"georgia/contracts"},{"answer":2,"choices":["May terminate only for inspection defects","Forfeits the earnest money for failing to state cause","Is generally entitled to the earnest money back","Must pay the seller's costs"],"concept":"What the due diligence period buys","difficulty":2,"explain":"Georgia's standard due diligence provision lets the buyer terminate for any reason or no reason within the window and recover the earnest money. That latitude is exactly why the period is negotiated hard -- once it expires, the buyer's exits narrow sharply.","id":"geo-4302c25c","portion":"georgia","q":"A Georgia buyer terminates during the due diligence period without stating a reason. Under a standard form the buyer:","sub":"georgia/contracts|Due diligence period","subtopic":"Due diligence period","topic":"georgia/contracts"},{"answer":1,"choices":["Give effect to the preprinted text","Give effect to the handwritten stipulation","Refer the matter to GREC","Void the whole contract for ambiguity"],"concept":"Specific terms beat boilerplate","difficulty":2,"explain":"Handwritten or typed additions reflect the parties' specific intent and prevail over standard preprinted terms. That is also why licensees must be careful: a poorly drafted stipulation controls the deal, and drafting original clauses edges into the unauthorized practice of law.","id":"geo-b20b6bb2","portion":"georgia","q":"A Georgia licensee adds a handwritten special stipulation that conflicts with the preprinted form language. A dispute arises. A court will MOST likely:","sub":"georgia/contracts|Drafting limits & special stipulations","subtopic":"Drafting limits & special stipulations","topic":"georgia/contracts"},{"answer":2,"choices":["Refuse to write the offer at all","Draft the clause, since filling in forms is permitted","Advise the buyer to have an attorney draft it","Copy a clause from another transaction"],"concept":"Where form-filling ends and law practice begins","difficulty":2,"explain":"Licensees may complete blanks on approved preprinted forms incident to a transaction they are handling. Composing an original financing clause is drafting a legal instrument -- the unauthorized practice of law, and a liability trap even when the clause happens to work.","id":"geo-932dc2a7","portion":"georgia","q":"A Georgia licensee, asked by a buyer to add a complex owner-financing clause, should:","sub":"georgia/contracts|Drafting limits & special stipulations","subtopic":"Drafting limits & special stipulations","topic":"georgia/contracts"},{"answer":3,"choices":["Valid only for commercial property","Enforceable if initialed","Enforceable for 90 days","Prohibited -- Georgia requires a definite expiration date"],"concept":"No automatic renewals","difficulty":2,"explain":"GREC requires listings and brokerage engagements in writing with a definite ending date, and automatic renewal clauses are not permitted. A broker cannot roll a listing forward indefinitely by default.","id":"geo-596b119f","portion":"georgia","q":"A Georgia listing agreement provides that it automatically renews monthly unless cancelled. This provision is:","sub":"georgia/contracts|Listing agreement rules","subtopic":"Listing agreement rules","topic":"georgia/contracts"},{"answer":3,"choices":["Must disclose only if the buyer has children","Must disclose it as a material fact","Must disclose it in the MLS","Generally need not disclose it, and Georgia protects against liability for that nondisclosure"],"concept":"Georgia's stigmatized-property protection","difficulty":2,"explain":"Georgia expressly shields licensees from liability for not disclosing that a property was the site of a death, homicide, suicide, or felony. Physical CONDITION defects are a different matter and must always be disclosed.","id":"geo-6a1e3c73","portion":"georgia","q":"A Georgia seller knows a murder occurred in the home three years ago. The buyer does not ask. The seller and licensee:","sub":"georgia/disclosures|Stigmatized property","subtopic":"Stigmatized property","topic":"georgia/disclosures"},{"answer":0,"choices":["Decline to answer and refer the buyer to other sources, since nondisclosure is protected but an affirmative lie is not","Deny it, since disclosure is not required","Answer fully, waiving the protection","Refuse to continue the showing"],"concept":"Nondisclosure is protected; lying is not","difficulty":2,"explain":"Georgia's protection covers NOT volunteering the information. It does not license an affirmative misstatement, which would be misrepresentation. Declining to answer keeps the licensee inside the protection.","id":"geo-36d469e0","portion":"georgia","q":"A Georgia buyer asks the listing agent directly whether anyone died in the house. The agent knows someone did. The safest response is:","sub":"georgia/disclosures|Stigmatized property","subtopic":"Stigmatized property","topic":"georgia/disclosures"},{"answer":0,"choices":["Adverse material facts actually known to the broker","All defects a competent inspector would find","Only defects listed on the seller's disclosure form","Nothing, if the buyer is a customer"],"concept":"No duty to discover in Georgia","difficulty":2,"explain":"BRRETA limits the obligation to adverse material facts ACTUALLY KNOWN. Brokers are not inspectors and need not investigate. But the duty runs to customers as well as clients, so 'the buyer is unrepresented' is never the answer.","id":"geo-a7bdd3e9","portion":"georgia","q":"Under BRRETA a Georgia broker's disclosure duty regarding property condition extends to:","sub":"georgia/disclosures|Adverse material facts","subtopic":"Adverse material facts","topic":"georgia/disclosures"},{"answer":2,"choices":["Answer the buyer's legal question personally","Let the attorney advise the buyer as a courtesy","Make clear the attorney represents the lender and the buyer may retain their own counsel","Postpone the closing"],"concept":"Who the Georgia closing attorney represents","difficulty":2,"explain":"Georgia requires an attorney to supervise the closing, and that attorney customarily represents the LENDER. Letting a buyer believe otherwise is a common and costly misunderstanding -- and the licensee must not supply the legal opinion instead.","id":"geo-eca90b42","portion":"georgia","q":"At a Georgia closing the buyer asks the closing attorney whether the contract's repair clause protects them. The attorney typically represents the lender. The licensee should:","sub":"georgia/procedures|Attorney closings","subtopic":"Attorney closings","topic":"georgia/procedures"},{"answer":1,"choices":["Ignored, since the bill has not arrived","Prorated, with the seller debited for their share","Paid entirely by the buyer","Paid entirely by the seller"],"concept":"Georgia tax liens attach January 1","difficulty":2,"explain":"The lien attaches January 1 and follows the property, so closings prorate. Because the taxes are unpaid, the seller is DEBITED for the portion covering their ownership and the buyer is credited, since the buyer will pay the full bill later.","id":"geo-4bfa10df","portion":"georgia","q":"A Georgia property sells on March 10. County taxes for the year became a lien on January 1 and are unpaid. At closing the taxes are:","sub":"georgia/procedures|Taxes & prorations","subtopic":"Taxes & prorations","topic":"georgia/procedures"},{"answer":1,"choices":["A judicial action in superior court","Advertisement in the county legal organ and a sale on the courthouse steps the first Tuesday of the month","Automatic transfer after 90 days","Repossession without notice"],"concept":"Georgia nonjudicial foreclosure","difficulty":2,"explain":"The security deed's power of sale permits nonjudicial foreclosure: notice to the borrower plus advertisement in the county legal organ, typically four weeks, then a public sale on the first Tuesday. This is why Georgia foreclosures move comparatively fast.","id":"geo-8cb2d30e","portion":"georgia","q":"A Georgia borrower defaults. The lender holds a security deed with a power of sale. Foreclosure will typically proceed by:","sub":"georgia/procedures|Security deeds & foreclosure","subtopic":"Security deeds & foreclosure","topic":"georgia/procedures"},{"answer":1,"choices":["Recognizes tenancy by the entirety for spouses","Does not recognize tenancy by the entirety; they may hold as joint tenants with right of survivorship","Requires tenancy in common for spouses","Requires a trust"],"concept":"Georgia abolished tenancy by the entirety","difficulty":2,"explain":"This is a frequent national-vs-Georgia contrast. Georgians achieve survivorship through joint tenancy with right of survivorship, expressly stated in the deed. A licensee should route the actual titling decision to an attorney.","id":"geo-63c83fa8","portion":"georgia","q":"A married Georgia couple wants title with automatic survivorship. The correct advice is that Georgia:","sub":"georgia/procedures|Georgia title & ownership rules","subtopic":"Georgia title & ownership rules","topic":"georgia/procedures"},{"answer":1,"choices":["Barred, because a defective deed defeats the claim","Complete, because 7 years applies under color of title","Limited to a prescriptive easement","Not ripe -- 20 years is required"],"concept":"Georgia's two adverse possession periods","difficulty":2,"explain":"Georgia requires 20 years without color of title, but only 7 years WITH color of title -- a written instrument that appears to convey title but is defective. Twelve years under a defective deed satisfies the shorter period.","id":"geo-4f67996c","portion":"georgia","q":"A Georgia parcel has been occupied openly and continuously by a neighbor for 12 years under a defective deed the neighbor believed valid. The neighbor's claim is:","sub":"georgia/procedures|Georgia title & ownership rules","subtopic":"Georgia title & ownership rules","topic":"georgia/procedures"},{"answer":2,"choices":["Comply, documenting that the seller directed it","Continue the listing but ignore the instruction quietly","Withdraw from the engagement","Refer the seller to a colleague"],"concept":"Unlawful instructions end the relationship","difficulty":2,"explain":"Obedience covers LAWFUL instructions only. Quietly ignoring the instruction leaves the agent working for a client who will discriminate; referring the seller to a colleague simply relocates the violation. Withdrawing is the clean answer.","id":"geo-f5061434","portion":"georgia","q":"A Georgia seller instructs the listing agent to reject offers from a protected class. The agent refuses; the seller insists. The agent's correct course is:","sub":"georgia/fair-housing|Unlawful instructions & enforcement","subtopic":"Unlawful instructions & enforcement","topic":"georgia/fair-housing"},{"answer":3,"choices":["Lawful for commercial property","Lawful if disclosed in the lease","Lawful, since it applies to everyone equally","Unlawful -- an assistance animal is not a pet and no pet fee may be charged"],"concept":"Assistance animals and reasonable accommodation","difficulty":2,"explain":"Waiving a pet policy for an assistance animal is a reasonable ACCOMMODATION, made at the housing provider's expense. Charging a pet fee or deposit defeats the accommodation. The tenant remains liable for actual damage the animal causes.","id":"geo-62081001","portion":"georgia","q":"A Georgia property manager charges a $300 non-refundable fee to tenants with assistance animals, applied uniformly. This is:","sub":"georgia/fair-housing|Accommodations & modifications","subtopic":"Accommodations & modifications","topic":"georgia/fair-housing"},{"answer":3,"choices":["Required by fair housing law","Fine, since the data is publicly available","A disclosure violation only","Steering, because selective delivery of information channels buyers by protected class"],"concept":"Steering by selective information","difficulty":2,"explain":"Steering does not require saying anything negative. Providing or withholding neighborhood information based on who is asking channels buyers just as effectively. The safe practice is a consistent policy for every buyer -- typically pointing everyone to the same public sources.","id":"geo-21edfab6","portion":"georgia","q":"A licensee provides school ratings and crime statistics only when buyers of a certain background ask. This practice is:","sub":"georgia/fair-housing|Steering & blockbusting","subtopic":"Steering & blockbusting","topic":"georgia/fair-housing"}],"comprehensive":[{"answer":1,"choices":["Encroachment","Encumbrance","Escheat","Estoppel"],"concept":"Encumbrance vs. encroachment","difficulty":2,"explain":"An ENCUMBRANCE is any claim, lien, restriction, or easement limiting the fee. An ENCROACHMENT is the specific case of a physical intrusion. All encroachments are encumbrances; not all encumbrances are physical.","id":"com-5d4b5380","portion":"comprehensive","q":"A charge or claim against property that does not prevent transfer but travels with it is an:","sub":"comp/vocabulary|Liens & encumbrances","subtopic":"Liens & encumbrances","topic":"comp/vocabulary"},{"answer":2,"choices":["Execution","Acknowledgment","Delivery and acceptance","Recording"],"concept":"Deed vocabulary in sequence","difficulty":2,"explain":"EXECUTION is signing; ACKNOWLEDGMENT is the notary's certification (needed to record); DELIVERY AND ACCEPTANCE is what actually passes title; RECORDING gives constructive notice. Only delivery and acceptance are essential between the parties.","id":"com-9b9593b0","portion":"comprehensive","q":"The written instrument that conveys title is a deed. The act that makes it effective is:","sub":"comp/vocabulary|Title & deed terms","subtopic":"Title & deed terms","topic":"comp/vocabulary"},{"answer":1,"choices":["A statutory lien","A general lien","A voluntary lien","A specific lien"],"concept":"Lien classifications are independent axes","difficulty":2,"explain":"Liens sort three ways at once: general vs. specific (scope), voluntary vs. involuntary (consent), statutory vs. equitable (source). A judgment lien is general, involuntary, and statutory. A mortgage is specific and voluntary.","id":"com-cff51bd6","portion":"comprehensive","q":"A lien that attaches to all of a debtor's property rather than one specific parcel is:","sub":"comp/vocabulary|Liens & encumbrances","subtopic":"Liens & encumbrances","topic":"comp/vocabulary"},{"answer":3,"choices":["Also a security deposit in every state","An escrow advance","A trade fixture","Prepaid rent, which is generally earned income to the landlord"],"concept":"Security deposit vs. prepaid rent","difficulty":2,"explain":"A security deposit remains the tenant's money held in trust against damage. PREPAID RENT is payment for a specific period and belongs to the landlord when received. Mislabeling one as the other is a common trust-account error.","id":"com-0d932e16","portion":"comprehensive","q":"Money a tenant pays that the landlord holds and may return is a security deposit. Rent paid for the final month in advance is:","sub":"comp/vocabulary|Practice terms","subtopic":"Practice terms","topic":"comp/vocabulary"},{"answer":1,"choices":["Right of reverter","Statutory right of redemption","Right of first refusal","Equitable right of redemption"],"concept":"Two redemption rights","difficulty":2,"explain":"The EQUITABLE right runs from default up to the moment of sale. The STATUTORY right, where a state grants one, runs for a period AFTER the sale. The dividing line is the sale itself.","id":"com-7d548a08","portion":"comprehensive","q":"The right of a defaulting borrower to reclaim property AFTER a foreclosure sale is:","sub":"comp/vocabulary|Financing terms","subtopic":"Financing terms","topic":"comp/vocabulary"},{"answer":3,"choices":["A chain of title","A certificate of title","A title commitment","An abstract of title"],"concept":"Title-evidence vocabulary","difficulty":2,"explain":"The ABSTRACT is the condensed history of all recorded instruments. The CHAIN OF TITLE is the ownership sequence within it. A COMMITMENT is the insurer's promise to issue a policy; an attorney's OPINION interprets the abstract.","id":"com-726d65a6","portion":"comprehensive","q":"A written summary of every recorded document affecting a parcel is:","sub":"comp/vocabulary|Title & deed terms","subtopic":"Title & deed terms","topic":"comp/vocabulary"},{"answer":0,"choices":["Separate property","Community property","Tenancy by the entirety","Homestead property"],"concept":"Community vs. separate property","difficulty":2,"explain":"Property owned before marriage, or received during marriage by gift or inheritance, stays SEPARATE. Community property is what the spouses acquire during marriage through effort. Georgia is not a community property state.","id":"com-ef53e6b7","portion":"comprehensive","q":"Property acquired by one spouse before marriage, in a community property state, is:","sub":"comp/vocabulary|Estates & tenancy terms","subtopic":"Estates & tenancy terms","topic":"comp/vocabulary"},{"answer":3,"choices":["Subordination","Acceleration","Alienation","Defeasance"],"concept":"Mortgage clauses that sound alike","difficulty":2,"explain":"DEFEASANCE defeats the lien on payment. ACCELERATION calls the balance on default; ALIENATION (due-on-sale) calls it on transfer; SUBORDINATION voluntarily moves a lien to a lower priority.","id":"com-9eaacb73","portion":"comprehensive","q":"The clause in a mortgage requiring the lender to release the lien when the debt is paid is:","sub":"comp/vocabulary|Financing terms","subtopic":"Financing terms","topic":"comp/vocabulary"},{"answer":2,"choices":["Estate at will","Estate at sufferance","Periodic estate","Estate for years"],"concept":"The four leasehold estates","difficulty":2,"explain":"A PERIODIC estate (month-to-month) renews automatically until notice. An ESTATE FOR YEARS has a fixed start and end and needs no notice. An ESTATE AT WILL ends at either party's pleasure; SUFFERANCE is a holdover without permission.","id":"com-eb43c30c","portion":"comprehensive","q":"An estate that continues indefinitely and renews automatically until notice is given is a:","sub":"comp/vocabulary|Estates & tenancy terms","subtopic":"Estates & tenancy terms","topic":"comp/vocabulary"},{"answer":2,"choices":["Anticipation","Substitution","Conformity","Contribution"],"concept":"Appraisal principles that are easily swapped","difficulty":2,"explain":"CONFORMITY: maximum value arises when properties are reasonably similar. CONTRIBUTION: a component is worth what it adds to the whole, not what it cost. SUBSTITUTION caps value at the cost of an equal alternative; ANTICIPATION values future benefits.","id":"com-baa996f4","portion":"comprehensive","q":"The appraisal principle that a property's value is influenced by the values of surrounding properties is:","sub":"comp/vocabulary|Valuation terms","subtopic":"Valuation terms","topic":"comp/vocabulary"},{"answer":1,"choices":["An emblement","A fixture","A chattel","A trade fixture"],"concept":"Real vs. personal property vocabulary","difficulty":2,"explain":"A FIXTURE is former personal property now part of the realty. A CHATTEL is personal property generally. EMBLEMENTS are annual crops, treated as personal property of the tenant who planted them. A TRADE FIXTURE stays the commercial tenant's property.","id":"com-640d0475","portion":"comprehensive","q":"Personal property permanently attached to real property becomes:","sub":"comp/vocabulary|Property & water terms","subtopic":"Property & water terms","topic":"comp/vocabulary"},{"answer":1,"choices":["Mortgage","Security deed","Deed of trust","Land contract"],"concept":"The two loan documents, Georgia edition","difficulty":2,"explain":"The NOTE is the promise to pay; the security instrument pledges the collateral. Georgia uses a SECURITY DEED (deed to secure debt), which transfers legal title to the lender until payoff -- unlike a mortgage, which creates only a lien.","id":"com-c9ca0d36","portion":"comprehensive","q":"The document a buyer signs promising to repay a loan is the note. The document pledging the property as security in Georgia is the:","sub":"comp/vocabulary|Financing terms","subtopic":"Financing terms","topic":"comp/vocabulary"},{"answer":3,"choices":["Satisfaction","Subrogation","Substitution","Subordination"],"concept":"The 'sub-' words","difficulty":2,"explain":"SUBORDINATION voluntarily lowers a lien's priority, commonly so a construction lender can take first position. SUBROGATION is one party stepping into another's legal claim, typical of insurers. SATISFACTION is the recorded proof a debt is paid.","id":"com-46cf6dbf","portion":"comprehensive","q":"A provision allowing a later-recorded lien to take priority over an earlier one is:","sub":"comp/vocabulary|Liens & encumbrances","subtopic":"Liens & encumbrances","topic":"comp/vocabulary"},{"answer":1,"choices":["Book value","Assessed value","Insurable value","Market value"],"concept":"The many kinds of value","difficulty":2,"explain":"ASSESSED value is the tax base, often a set percentage of market value. INSURABLE value covers the improvements only, since land does not burn. Confusing assessed with market value is a persistent exam trap.","id":"com-c0220954","portion":"comprehensive","q":"The measure of a property's value used to compute property taxes is:","sub":"comp/vocabulary|Valuation terms","subtopic":"Valuation terms","topic":"comp/vocabulary"},{"answer":1,"choices":["Estate at will","Estate at sufferance","Estate for years","Periodic estate"],"concept":"Holdover tenancy","difficulty":2,"explain":"SUFFERANCE is the lowest estate: possession without right, but not quite trespass because entry was originally lawful. If the landlord accepts rent, it typically converts to a periodic tenancy.","id":"com-eee2f4ad","portion":"comprehensive","q":"A tenant who remains after the lease ends, without the landlord's consent, holds an:","sub":"comp/vocabulary|Estates & tenancy terms","subtopic":"Estates & tenancy terms","topic":"comp/vocabulary"},{"answer":2,"choices":["Proximate cause","Efficient cause","Procuring cause","Ready cause"],"concept":"Procuring cause","difficulty":2,"explain":"PROCURING CAUSE is the uninterrupted chain of events by which a broker produced the buyer. It is the standard used to resolve commission disputes between brokers, usually through arbitration rather than the license law.","id":"com-0472722d","portion":"comprehensive","q":"Compensation paid to a broker who is the direct cause of a completed sale reflects:","sub":"comp/vocabulary|Practice terms","subtopic":"Practice terms","topic":"comp/vocabulary"},{"answer":3,"choices":["Purchase-money mortgage","Lease option","Wraparound mortgage","Land contract"],"concept":"Seller-financing arrangements","difficulty":2,"explain":"A LAND CONTRACT (contract for deed) splits title: seller keeps legal title, buyer holds equitable title and possession. A PURCHASE-MONEY MORTGAGE conveys title at closing with the seller taking back a lien. A LEASE OPTION is a lease plus a right to buy.","id":"com-f30b9d26","portion":"comprehensive","q":"An agreement where the seller retains legal title while the buyer takes possession and pays over time is a:","sub":"comp/vocabulary|Financing terms","subtopic":"Financing terms","topic":"comp/vocabulary"},{"answer":3,"choices":["Accretion","Avulsion","Reliction","Erosion"],"concept":"Four ways water changes land","difficulty":2,"explain":"EROSION is gradual loss; ACCRETION is gradual gain; AVULSION is sudden change, which does NOT alter boundaries; RELICTION is land exposed by permanently receding water.","id":"com-24042f61","portion":"comprehensive","q":"The gradual wearing away of land by water is:","sub":"comp/vocabulary|Property & water terms","subtopic":"Property & water terms","topic":"comp/vocabulary"},{"answer":1,"choices":["Escheat","Police power","Taxation","Eminent domain"],"concept":"PETE, the four public powers","difficulty":2,"explain":"Police power regulates without paying -- zoning, codes, environmental rules. Eminent domain TAKES and must pay. Escheat claims ownerless property; taxation funds government. Only eminent domain requires just compensation.","id":"com-6688848a","portion":"comprehensive","q":"A blanket term for the government's power to regulate land use for health and safety, without compensation, is:","sub":"comp/vocabulary|Property & water terms","subtopic":"Property & water terms","topic":"comp/vocabulary"},{"answer":2,"choices":["Effective gross income","Cash flow","Net operating income","Gross rent"],"concept":"The income statement in order","difficulty":2,"explain":"Potential gross, minus vacancy, equals EFFECTIVE GROSS. Minus operating expenses equals NET OPERATING INCOME. Minus debt service equals CASH FLOW. Debt service is never an operating expense -- a favorite trap in cap rate problems.","id":"com-ec391831","portion":"comprehensive","q":"The dollar amount by which a property's income exceeds operating expenses, before debt service, is:","sub":"comp/vocabulary|Valuation terms","subtopic":"Valuation terms","topic":"comp/vocabulary"},{"answer":1,"choices":["End the relationship immediately without explanation","Explain you cannot select or exclude areas on that basis, and continue on objective criteria","Show only areas matching the request without comment","Note the preference and screen listings accordingly"],"concept":"A client's discriminatory request does not bind you","difficulty":2,"explain":"Acting on the request is steering, whoever asked for it. The professional move is to state plainly that you select properties on objective criteria -- price, size, schools, commute -- and continue on that basis. Most buyers accept it.","id":"com-915c96d8","portion":"comprehensive","q":"You are showing a home. The buyer says, 'Before we go further -- I don't want to be in a neighborhood with too many immigrants.' You should:","sub":"comp/situational|Fair housing judgment calls","subtopic":"Fair housing judgment calls","topic":"comp/situational"},{"answer":3,"choices":["Present both without comment, since price is the seller's decision","Advise the seller to counter both","Present only the offer you consider stronger","Present both, with your assessment of each offer's strength and risk"],"concept":"Presenting offers plus giving advice","difficulty":2,"explain":"All offers get presented -- but a client is owed advice, not just paperwork. Highlighting financing risk is exactly the value of representation. Presenting without comment under-serves the client; withholding an offer breaches outright.","id":"com-b2d26e37","portion":"comprehensive","q":"Your seller client receives two offers. One is $5,000 higher but from a buyer whose lender you know to be unreliable. You should:","sub":"comp/situational|Client vs. customer conduct","subtopic":"Client vs. customer conduct","topic":"comp/situational"},{"answer":2,"choices":["Stay quiet, since the closing attorney prepared the figures","Sign and request a correction later","Raise it immediately, before anyone signs","Mention it to your client afterward"],"concept":"Speak up before the signatures","difficulty":2,"explain":"Reasonable care obliges you to flag a known error while it can still be fixed cheaply. Deference to the attorney is not a defense when you personally know the number is wrong, and post-closing corrections are far harder to obtain.","id":"com-ed57dcb7","portion":"comprehensive","q":"At the closing table you notice the settlement statement omits a $1,200 repair credit the parties agreed to. Nobody else has caught it. You should:","sub":"comp/situational|Disclosure & concealment","subtopic":"Disclosure & concealment","topic":"comp/situational"},{"answer":0,"choices":["Disclose the payment, or better, provide several names and take no fee","Recommend someone else and keep the arrangement","Let the buyer find their own inspector","Recommend them, since you know their work"],"concept":"Referral fees and undisclosed compensation","difficulty":2,"explain":"Undisclosed compensation for a referral is a conflict, and in a federally related mortgage transaction a referral fee for settlement services violates RESPA Section 8 outright. Offering several names and declining the fee removes the problem.","id":"com-ba45ba1c","portion":"comprehensive","q":"A buyer client asks you to recommend an inspector. You have a regular referral who pays you $50 per referral. You should:","sub":"comp/situational|Conflicts & compensation","subtopic":"Conflicts & compensation","topic":"comp/situational"},{"answer":2,"choices":["Complete the form yourself with the information","Comply -- the disclosure is the seller's document","Explain it must be disclosed, and end the engagement if the seller refuses","Leave it off but tell buyers verbally"],"concept":"You cannot participate in concealment","difficulty":2,"explain":"A known defect affecting a major system is material. You never complete the seller's form for them, and you cannot market a property while knowing the disclosure is false. If the seller will not correct it, withdraw.","id":"com-43f34db0","portion":"comprehensive","q":"Your seller tells you the HVAC failed last winter and was patched, then says, 'Don't put that on the disclosure.' You should:","sub":"comp/situational|Disclosure & concealment","subtopic":"Disclosure & concealment","topic":"comp/situational"},{"answer":1,"choices":["Hold it, since the buyer asked","Deposit it promptly unless all parties give written authority to hold it","Return the check and ask for cash","Deposit it and let it bounce"],"concept":"Prompt deposit and written authority","difficulty":2,"explain":"Trust funds go in promptly. Any deviation -- holding a check, a postdated check, an interest-bearing account -- needs clear written authority agreed to by ALL parties, not just the buyer, because the seller has an interest in the deposit too.","id":"com-b30f6348","portion":"comprehensive","q":"You receive an earnest money check made out to your brokerage. The buyer asks you to hold it until Friday when their paycheck clears. You should:","sub":"comp/situational|Trust funds & accounting","subtopic":"Trust funds & accounting","topic":"comp/situational"},{"answer":1,"choices":["Share only an approximate figure","Share it, since a closed sale price is public information","Share it only with the seller's permission","Not disclose it, as it is confidential"],"concept":"What confidentiality actually covers","difficulty":2,"explain":"Confidentiality protects your client's motivations, finances, and negotiating position -- not facts already public. A recorded sale price is public record. Refusing to state public information is not a duty, just unhelpfulness.","id":"com-e70db283","portion":"comprehensive","q":"A past client calls asking what their neighbor's house sold for. The sale was your listing and the price is in the MLS and public records. You may:","sub":"comp/situational|Confidentiality & dual agency","subtopic":"Confidentiality & dual agency","topic":"comp/situational"},{"answer":3,"choices":["Tell the seller's agent privately","Withdraw from the transaction","Continue, since the relationship is not yours","Raise it with your broker and ensure the relationship is disclosed to the seller"],"concept":"Firm-level conflicts still need disclosure","difficulty":2,"explain":"A material relationship between the firm and a party must be disclosed to the other side's principal, regardless of which licensee holds it. Going around your broker to the other agent is not the channel; raising it internally and getting proper disclosure is.","id":"com-8a4b5f84","portion":"comprehensive","q":"Mid-transaction you realize the buyer you are representing is your broker's brother-in-law, and you were not told. You should:","sub":"comp/situational|Conflicts & compensation","subtopic":"Conflicts & compensation","topic":"comp/situational"},{"answer":1,"choices":["Suggest a smaller amount","Refuse -- this is loan fraud if concealed from the lender","Write it, since the parties agreed","Write it and disclose it only if asked"],"concept":"Silent second / inflated price schemes","difficulty":2,"explain":"Inflating price to extract cash without the lender's knowledge is mortgage fraud, and the licensee who writes it participates. The transaction can be structured legitimately only if every term is fully disclosed to the lender.","id":"com-5712780c","portion":"comprehensive","q":"A buyer asks you to write an offer $20,000 above the contract price with a $20,000 'decorating allowance' back at closing, so they can borrow more. You should:","sub":"comp/situational|Disclosure & concealment","subtopic":"Disclosure & concealment","topic":"comp/situational"},{"answer":0,"choices":["Decline, explaining you cannot reveal either side's confidential position","Tell the seller only after an offer is signed","Tell the seller, who is also your client","Hint at it without stating the number"],"concept":"The dual agent's neutrality","difficulty":2,"explain":"As a dual agent you hold both sides' confidences and may reveal neither. Hinting is the same disclosure by another route. This is exactly the limitation both parties acknowledged when they consented in writing.","id":"com-e90dc434","portion":"comprehensive","q":"You are a dual agent. The buyer tells you privately they would pay $15,000 more. The seller asks you what the buyer's ceiling is. You should:","sub":"comp/situational|Confidentiality & dual agency","subtopic":"Confidentiality & dual agency","topic":"comp/situational"},{"answer":2,"choices":["Refuse to speak with them further","Give them your honest opinion","Explain you represent the seller and cannot advise them on price, and suggest they get their own representation","Advise them to offer full price"],"concept":"Customers get honesty, not advice","difficulty":2,"explain":"Advising a customer on negotiating strategy against your own client breaches loyalty and can create accidental agency. Telling them to offer full price is self-serving pressure. Clarify your role and point them toward representation.","id":"com-3d3eb452","portion":"comprehensive","q":"An unrepresented buyer at your listing asks, 'Do you think I should offer less than asking?' You represent the seller. You should:","sub":"comp/situational|Client vs. customer conduct","subtopic":"Client vs. customer conduct","topic":"comp/situational"},{"answer":2,"choices":["Quietly reimburse the $400 without explanation","Wait to see if anyone raises it","Tell your client promptly and work to correct it","Say nothing, since the closing is final"],"concept":"Accounting survives closing","difficulty":2,"explain":"The duty to account does not end at the closing table. Disclosing your own error is uncomfortable but it is the duty, and errors-and-omissions coverage exists for exactly this. Silent reimbursement hides the error from the person entitled to know.","id":"com-7be27755","portion":"comprehensive","q":"You discover after closing that you miscalculated a proration and your client overpaid $400. Nobody has noticed. You should:","sub":"comp/situational|Trust funds & accounting","subtopic":"Trust funds & accounting","topic":"comp/situational"},{"answer":3,"choices":["They may refuse, since it alters the unit","They must install it themselves","They may charge a higher deposit","This is a reasonable modification the tenant may make at their own expense"],"concept":"Modification vs. accommodation, applied","difficulty":2,"explain":"A physical change is a MODIFICATION, permitted at the tenant's expense with possible restoration on move-out. Had the request been to waive a policy -- a no-pets rule for a service animal -- it would be an ACCOMMODATION at the landlord's expense.","id":"com-3fd0c48e","portion":"comprehensive","q":"A tenant applicant with a visual impairment asks whether they may install a doorbell light signal at their own expense. You should tell the landlord:","sub":"comp/situational|Fair housing judgment calls","subtopic":"Fair housing judgment calls","topic":"comp/situational"},{"answer":1,"choices":["Terminate the listing","Present current comparable sales and days-on-market data and discuss options","Advertise more aggressively at your own cost","Reduce your commission to compensate"],"concept":"Advice grounded in evidence","difficulty":2,"explain":"Bring data, not opinion or concession. Comparables and market absorption reframe the conversation around the market rather than blame, and give the seller a real basis to decide between a price change, staging, or waiting.","id":"com-073a656c","portion":"comprehensive","q":"Your listing has been on the market 90 days with no offers. The seller refuses to lower the price and blames your marketing. The most professional response is:","sub":"comp/situational|Client vs. customer conduct","subtopic":"Client vs. customer conduct","topic":"comp/situational"},{"answer":2,"choices":["Lend it but say nothing","Suggest they use a colleague's instead","Refuse and inform your broker -- practising on an expired license is unlicensed activity","Lend it, as a courtesy"],"concept":"Unlicensed activity implicates the firm","difficulty":2,"explain":"Practising on an expired license is unlicensed activity, and helping conceal it exposes you and the broker. The broker must know, because supervision failures are charged against the firm as well as the individual.","id":"com-cd9d106e","portion":"comprehensive","q":"A licensee in your office asks you to hold their pocket card while they meet a client, because theirs expired last week. You should:","sub":"comp/situational|Supervision & licensure","subtopic":"Supervision & licensure","topic":"comp/situational"},{"answer":2,"choices":["Say nothing, since the buyer chose to waive","Order an inspection anyway","Document your recommendation to inspect in writing, and disclose what you actually observe","Refuse to write the offer"],"concept":"Waiver does not erase your duty","difficulty":2,"explain":"The buyer may waive an inspection; you may not waive disclosure of what you actually know or see. Putting your recommendation in writing protects the buyer's decision-making and your own position if the roof fails later.","id":"com-878660c7","portion":"comprehensive","q":"A buyer waives the inspection to win a bidding war. You believe the roof is near the end of its life. You should:","sub":"comp/situational|Disclosure & concealment","subtopic":"Disclosure & concealment","topic":"comp/situational"},{"answer":2,"choices":["75-hour prelicense, then 24 hours CE annually","60-hour prelicense, then 30-hour postlicense, then 36 hours CE per 4 years","75-hour prelicense, then 25-hour postlicense within one year, then 24 hours CE per 4 years","25-hour prelicense, then 75-hour postlicense, then 24 hours CE per 4 years"],"concept":"The three education stages","difficulty":2,"explain":"75 hours before licensure; 25 hours of postlicense inside the first year; then at least 24 hours of CE per four-year renewal period. The 75/25 numbers are frequently transposed, and the CE figure is often misquoted as 36.","id":"com-4379b0cd","portion":"comprehensive","q":"Georgia's education requirements, in order for a salesperson, are:","sub":"comp/grec-deep|Education & licensure detail","subtopic":"Education & licensure detail","topic":"comp/grec-deep"},{"answer":3,"choices":["The accounts be consolidated into one","Each account be interest-bearing","Only the earnest money account be registered","Each account be bank-designated as trust and registered with the Commission, with the broker holding signatory power"],"concept":"Multiple trust accounts","difficulty":2,"explain":"Brokers must have at least one and may have more. Every one must be designated as a trust or escrow account by the BANK, registered with GREC on Commission forms, and carry the broker's signatory power.","id":"com-0fc9e99d","portion":"comprehensive","q":"A Georgia broker maintains three trust accounts: earnest money, rents, and security deposits. GREC requires that:","sub":"comp/grec-deep|Trust account rules","subtopic":"Trust account rules","topic":"comp/grec-deep"},{"answer":2,"choices":["At the next renewal","Verbally to an investigator","In writing, on Commission forms, when the change occurs","Only if the account number changes"],"concept":"Trust account change notifications","difficulty":2,"explain":"Written notice on Commission forms is required when the bank changes, the account name or number changes, the bank changes names, or the account closes. A letter satisfies the requirement, but it must be in writing.","id":"com-b939f102","portion":"comprehensive","q":"A Georgia broker changes banks. The broker must notify GREC:","sub":"comp/grec-deep|Trust account rules","subtopic":"Trust account rules","topic":"comp/grec-deep"},{"answer":2,"choices":["Only on a sworn written complaint from a transaction party","Only at the request of the Attorney General","On a sworn written request from anyone, or on the Commission's own motion","Only after a civil judgment"],"concept":"Who can start a GREC case","difficulty":2,"explain":"Anyone may file a sworn written request, and the Commission may also act on its own motion -- so an audit finding or a news report can start a case with no complainant at all. The licensee is notified that they are under investigation.","id":"com-e2f363b0","portion":"comprehensive","q":"GREC may initiate an investigation:","sub":"comp/grec-deep|GREC process & powers","subtopic":"GREC process & powers","topic":"comp/grec-deep"},{"answer":1,"choices":["Only the sanction","Findings of fact, conclusions of law, and a sanction, with no hearing held","A hearing date","The amount of consumer restitution"],"concept":"What a consent settlement contains","difficulty":2,"explain":"The respondent and Commission agree on specific findings of fact, conclusions of law, and a sanction, and no hearing is held. Restitution is never part of it, because GREC has no power to order repayment of losses.","id":"com-d3f67a1d","portion":"comprehensive","q":"In a GREC consent settlement, the parties agree on:","sub":"comp/grec-deep|GREC process & powers","subtopic":"GREC process & powers","topic":"comp/grec-deep"},{"answer":2,"choices":["Affiliate with an out-of-state broker only","Not do so -- affiliation is mandatory","Apply for inactive status, paying fees and still meeting postlicense education","Practise independently"],"concept":"Inactive status","difficulty":2,"explain":"A licensee who passes the exam may go inactive rather than affiliate, but must still pay the license and renewal fees and complete the postlicense requirement. Inactive licensees may not perform licensed activity.","id":"com-e1c14f69","portion":"comprehensive","q":"A Georgia licensee wishes to hold their license without affiliating with a broker. They may:","sub":"comp/grec-deep|Education & licensure detail","subtopic":"Education & licensure detail","topic":"comp/grec-deep"},{"answer":3,"choices":["Obtain a waiver from the Commission","Be licensed at home first","Take only the state portion of the exam","Meet the same requirements Georgia imposes on residents and affiliate with a GREC-licensed broker"],"concept":"Nonresident licensure","difficulty":2,"explain":"Such an applicant completes the full Georgia requirements and must affiliate with a broker licensed by GREC -- who may themselves be a resident or nonresident. Georgia's postlicense and CE requirements apply to nonresidents too.","id":"com-bf5d9d58","portion":"comprehensive","q":"A nonresident applying for a Georgia salesperson license who holds no license in their home state must:","sub":"comp/grec-deep|Education & licensure detail","subtopic":"Education & licensure detail","topic":"comp/grec-deep"},{"answer":1,"choices":["Decide the dispute and order payment","Not resolve it -- commission disputes go to arbitration or the courts","Suspend both licenses pending resolution","Split the commission equally"],"concept":"What GREC does not do","difficulty":2,"explain":"GREC administers the license law, makes rules, investigates, and disciplines. It does not adjudicate money disputes between licensees, and it cannot order anyone to pay. Procuring-cause disputes go to association arbitration or civil court.","id":"com-f8011a38","portion":"comprehensive","q":"Two Georgia brokers dispute which of them is entitled to a commission. GREC will:","sub":"comp/grec-deep|GREC process & powers","subtopic":"GREC process & powers","topic":"comp/grec-deep"},{"answer":0,"choices":["Their affiliated broker only","The closing attorney","Another licensee who refers business","Any party to the transaction"],"concept":"The flow of compensation","difficulty":2,"explain":"A salesperson works through the broker and may only be paid by that broker. Accepting money directly from a client, another licensee, or a settlement provider is a license law violation, however the parties label it.","id":"com-90098ac2","portion":"comprehensive","q":"A Georgia salesperson may lawfully accept compensation for licensed activity from:","sub":"comp/grec-deep|Firm operations","subtopic":"Firm operations","topic":"comp/grec-deep"},{"answer":3,"choices":["Become part of the broker's estate for the heirs","Escheat to the state","Are divided among the broker's creditors","Are not part of the estate and remain the clients' property"],"concept":"Why the trust account exists","difficulty":2,"explain":"The InfoBase lists this as a core purpose: properly maintained trust funds stay outside the broker's estate on death, are not subject to garnishment on a judgment against the broker, and do not go to creditors in bankruptcy.","id":"com-aadc0f3b","portion":"comprehensive","q":"A Georgia broker dies with $80,000 of client funds in a properly maintained trust account. Those funds:","sub":"comp/grec-deep|Trust account rules","subtopic":"Trust account rules","topic":"comp/grec-deep"},{"answer":0,"choices":["Permitted only under strict disclosure conditions","Permitted only for commercial property","The default listing form","Illegal in all circumstances"],"concept":"Net listings in Georgia","difficulty":2,"explain":"Georgia permits net listings under strict disclosure, unlike states that ban them outright. They remain disfavored because the broker profits from every dollar above the seller's stated net -- a direct conflict with the client's interest.","id":"com-3d16112c","portion":"comprehensive","q":"A net listing in Georgia is:","sub":"comp/grec-deep|Firm operations","subtopic":"Firm operations","topic":"comp/grec-deep"},{"answer":0,"choices":["Identify the brokerage firm and not be misleading","Be pre-approved by GREC","Appear only in the MLS","Use the licensee's name only"],"concept":"Advertising rules","difficulty":2,"explain":"Advertising must name the firm and must not mislead. A licensee may never advertise so as to imply they operate independently of their broker -- a growing issue with personal branding and social media.","id":"com-87448fe5","portion":"comprehensive","q":"A Georgia broker's advertising must:","sub":"comp/grec-deep|Firm operations","subtopic":"Firm operations","topic":"comp/grec-deep"},{"answer":2,"choices":["Appeals the suspension","Ceases all activity for the suspension period","Immediately designates a new qualifying broker","Transfers the license to a salesperson"],"concept":"Suspension of a qualifying broker","difficulty":2,"explain":"If the corporation or LLC immediately designates a replacement qualifying broker, it may continue and keep its wall certificate and its affiliates' licenses. Otherwise the firm's license and all affiliated licenses are suspended for the same period.","id":"com-2e53f43c","portion":"comprehensive","q":"A suspended Georgia qualifying broker's corporation may keep operating if it:","sub":"comp/grec-deep|Firm operations","subtopic":"Firm operations","topic":"comp/grec-deep"},{"answer":3,"choices":["Debit to the buyer","Credit to the seller","Debit to the seller","Credit to the buyer"],"concept":"Debits and credits, buyer's side","difficulty":2,"explain":"The buyer already paid it, so it reduces what they owe at the table -- a CREDIT to the buyer. It is not a seller credit; the money never belonged to the seller. Debits increase what a party owes; credits reduce it.","id":"com-74e4aaad","portion":"comprehensive","q":"On a settlement statement, the buyer's earnest money deposit already held by the broker appears as a:","sub":"comp/closing-math|Debits vs. credits","subtopic":"Debits vs. credits","topic":"comp/closing-math"},{"answer":1,"choices":["A credit to both","A debit to the buyer and a credit to the seller","A credit to the buyer and a debit to the seller","A debit to both"],"concept":"The single largest line","difficulty":2,"explain":"The buyer owes the price (debit to buyer); the seller is owed it (credit to seller). Every prorated item then adjusts around this anchor. Reversing it inverts the entire statement.","id":"com-2f1e52fe","portion":"comprehensive","q":"The sale price appears on a settlement statement as:","sub":"comp/closing-math|Debits vs. credits","subtopic":"Debits vs. credits","topic":"comp/closing-math"},{"answer":0,"choices":["A debit to the seller","A credit to the seller","A debit to the buyer","A credit to the buyer"],"concept":"Seller's payoff","difficulty":2,"explain":"The payoff comes out of the seller's proceeds -- a DEBIT to the seller. It does not touch the buyer's side at all unless the buyer is assuming the loan, in which case it becomes a buyer credit and seller debit instead.","id":"com-8225ecab","portion":"comprehensive","q":"A seller's existing loan payoff of $184,000 appears as:","sub":"comp/closing-math|Debits vs. credits","subtopic":"Debits vs. credits","topic":"comp/closing-math"},{"answer":1,"choices":["Seller credit / buyer debit of $2,880","Seller debit / buyer credit of $2,880","Seller debit / buyer credit of $1,440","Seller credit / buyer debit of $1,440"],"concept":"Unpaid taxes reverse the direction","difficulty":2,"explain":"Eight months elapsed x $360/month = $2,880 the seller owes. Because the bill is UNPAID and the buyer will pay it all later, the seller is debited and the buyer credited. Prepaid taxes would reverse both signs.","id":"com-1df6fd9f","portion":"comprehensive","q":"Annual taxes of $4,320 are unpaid. Closing is September 1, with the seller responsible through August 31 in a 360-day year. The entry is:","sub":"comp/closing-math|Prorations at closing","subtopic":"Prorations at closing","topic":"comp/closing-math"},{"answer":2,"choices":["A debit to both","Not entered on the statement","A seller debit and buyer credit","A buyer debit and seller credit"],"concept":"Accrued interest on an assumed loan","difficulty":2,"explain":"Mortgage interest is paid in ARREARS, so the seller has used the money but not yet paid the interest. The seller is debited and the buyer credited, because the buyer will make the payment covering that period.","id":"com-b79a77b8","portion":"comprehensive","q":"A buyer assumes the seller's loan with a $312 accrued interest balance owed for the current month. At closing this is:","sub":"comp/closing-math|Prorations at closing","subtopic":"Prorations at closing","topic":"comp/closing-math"},{"answer":2,"choices":["A buyer debit and seller credit","Returned to the tenant","A seller debit and buyer credit","Not shown on the statement"],"concept":"Security deposits transfer with the property","difficulty":2,"explain":"The deposit belongs to the tenant, and the new owner inherits the obligation to return it. So the seller is debited and the buyer credited. The tenant is not paid at closing -- the duty simply moves to the buyer.","id":"com-d6ddd16d","portion":"comprehensive","q":"A tenant's $1,500 security deposit on a property being sold is handled at closing as:","sub":"comp/closing-math|Georgia closing items","subtopic":"Georgia closing items","topic":"comp/closing-math"},{"answer":0,"choices":["Seller credit and buyer debit of $400","Seller credit and buyer debit of $560","Seller debit and buyer credit of $400","No entry -- policies do not transfer"],"concept":"Prepaid items reimburse the seller","difficulty":2,"explain":"$960 / 12 = $80 per month x 5 remaining = $400 of coverage the buyer will enjoy but the seller paid for. The seller is reimbursed: seller CREDIT, buyer DEBIT. Prepaid always runs the opposite direction from unpaid.","id":"com-b08be823","portion":"comprehensive","q":"A seller has prepaid a $960 annual insurance policy the buyer will assume, with 5 months remaining. The entry is:","sub":"comp/closing-math|Prorations at closing","subtopic":"Prorations at closing","topic":"comp/closing-math"},{"answer":1,"choices":["$2,400","$4,250","$24,000","$1,850"],"concept":"Reading loan charges together","difficulty":2,"explain":"Origination = 1% x $240,000 = $2,400. Plus $1,850 in other charges = $4,250 debited to the buyer. The origination fee is a percentage of the LOAN, not the sale price -- the same trap as discount points.","id":"com-039785af","portion":"comprehensive","q":"A buyer's loan is $240,000 with a 1% origination fee and $1,850 in other lender charges. The buyer's total lender debits are:","sub":"comp/closing-math|Debits vs. credits","subtopic":"Debits vs. credits","topic":"comp/closing-math"},{"answer":1,"choices":["Recording the deed","The new loan amount","The broker's commission","The sale price"],"concept":"The new loan is buyer money","difficulty":2,"explain":"The lender's funds are applied toward what the buyer owes, so the new loan is a buyer CREDIT. The sale price is a buyer debit; commission is normally a seller debit; recording fees are typically buyer debits.","id":"com-31bcffa0","portion":"comprehensive","q":"Which item is normally a credit to the BUYER on a settlement statement?","sub":"comp/closing-math|Debits vs. credits","subtopic":"Debits vs. credits","topic":"comp/closing-math"},{"answer":3,"choices":["$4,150","$41.50","$415,000","$415"],"concept":"Georgia transfer tax on the statement","difficulty":2,"explain":"$1.00 per $1,000 of consideration: $415,000 / 1,000 = 415, so $415. It is customarily a SELLER debit and is collected by the clerk of superior court when the deed is recorded.","id":"com-b5620ead","portion":"comprehensive","q":"A Georgia sale closes at $415,000. The transfer tax the seller is debited is:","sub":"comp/closing-math|Georgia closing items","subtopic":"Georgia closing items","topic":"comp/closing-math"},{"answer":0,"choices":["$118,600","$340,000","$221,400","$561,400"],"concept":"Reading the bottom line","difficulty":2,"explain":"Seller credits minus seller debits: $340,000 - $221,400 = $118,600 walking-away money. Every proration and payoff feeds one of those two columns, which is why direction matters more than arithmetic.","id":"com-67fdc60e","portion":"comprehensive","q":"A seller's gross proceeds are $340,000 with total debits of $221,400. The seller's net at closing is:","sub":"comp/closing-math|Debits vs. credits","subtopic":"Debits vs. credits","topic":"comp/closing-math"},{"answer":1,"choices":["Seller credit / buyer debit of $1,400","Seller debit / buyer credit of $1,400","No entry required","Seller debit / buyer credit of $700"],"concept":"Rent runs opposite to taxes","difficulty":2,"explain":"Days 11 through 30 = 20 days x $70/day = $1,400 belonging to the buyer. The seller is holding the cash, so the seller is DEBITED and the buyer credited -- the reverse of an unpaid tax proration.","id":"com-b3d34cdc","portion":"comprehensive","q":"Rent of $2,100 for a 30-day month was collected by the seller on the 1st. Closing is on the 11th, with the buyer owning from closing day. The entry is:","sub":"comp/closing-math|Prorations at closing","subtopic":"Prorations at closing","topic":"comp/closing-math"}]},"math":{"commission":{"label":"Commission & splits","concept":"Commission is always a percentage of the SALE price, then divided between brokerages and again between each brokerage and its agent.","closing":false,"q":[["A home sells for $557,000 with a 7% total commission. The listing brokerage keeps 50% of the commission and pays the rest to the cooperating brokerage. The listing agent's split with their own broker is 60% to the agent. How much does the LISTING AGENT receive?",["$11,697","$38,990","$23,394","$19,495"],0,["Total commission = sale price x rate = $557,000 x 7% = $38,990","Listing brokerage's share = $38,990 x 50% = $19,495","Listing agent's share = $19,495 x 60% = $11 10/chapter-6a/"},{"by":"U.S. Department of Housing and Urban Development","name":"Fair Housing Act and HUD guidance","note":"Protected classes, accommodations, and enforcement.","url":"https://www.hud.gov/program_offices/fair_housing_equal_opp"},{"by":"Consumer Financial Protection Bureau","name":"TRID / Regulation Z and RESPA","note":"Loan Estimate and Closing Disclosure timing, and settlement rules.","url":"https://www.consumerfinance.gov/rules-policy/regulations/"},{"by":"U.S. Environmental Protection Agency","name":"EPA lead-based paint and radon guidance","note":"Pre-1978 disclosure duties and environmental hazards.","url":"https://www.epa.gov/lead"}],"topics":{"comp/closing-math":{"blurb":"Debits, credits, prorations, and who pays what at the table.","counts_on_exam":false,"exam_questions":8,"examples":[{"k":"$2,880 as a SELLER DEBIT and BUYER CREDIT.","s":"Annual taxes $4,320, unpaid. Closing September 1; seller responsible through August 31; 360-day year.","t":"Unpaid taxes","w":["Monthly = $4,320 / 12 = $360","Eight full months elapsed = 8 x $360 = $2,880","The bill is unpaid and the buyer will pay all of it later."]},{"k":"$1,400 SELLER DEBIT / BUYER CREDIT - the reverse of a prepaid tax proration.","s":"$2,100 rent for a 30-day month, collected by the seller on the 1st. Closing on the 11th, buyer owns from closing day.","t":"Rent runs the other way","w":["Daily = $2,100 / 30 = $70","Buyer owns the 11th through the 30th = 20 days","20 x $70 = $1,400 belonging to the buyer","The seller is holding that cash."]},{"k":"$23,850 to the table.","s":"$417,000 price, 95% LTV loan, $8,000 buyer closing costs, $5,000 earnest money already deposited.","t":"Cash to close","w":["Loan = $417,000 x 95% = $396,150","Buyer debits = $417,000 + $8,000 = $425,000","Buyer credits = $396,150 + $5,000 = $401,150","$425,000 - $401,150 = $23,850"]}],"ga":["Georgia transfer tax on the statement: price / 1,000, as a SELLER debit.","Georgia taxes attach as a lien January 1 and are pai
