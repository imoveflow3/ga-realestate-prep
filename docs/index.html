ng customers like clients created implied agency and lawsuits from buyers who believed they were represented. BRRETA fixed this by requiring written engagements and defining each role.","id":"geo-1f5e67d3","portion":"georgia","q":"The main problem BRRETA was enacted to solve was:","sub":"georgia/brreta|Scope of duties under BRRETA","subtopic":"Scope of duties under BRRETA","topic":"georgia/brreta"},{"answer":1,"choices":["The earnest money is deposited","Acceptance is communicated to the offeror","The offer is signed by the buyer","The contract is recorded"],"concept":"Formation of the binding agreement","difficulty":1,"explain":"Georgia measures deadlines from the 'binding agreement date' -- the date acceptance is communicated back to the offeror. Signing alone does not bind; the other party must be notified.","id":"geo-de981917","portion":"georgia","q":"In Georgia, a real estate sales contract becomes binding when:","sub":"georgia/contracts|Binding agreement date","subtopic":"Binding agreement date","topic":"georgia/contracts"},{"answer":1,"choices":["Match the tax assessor's value","Identify the property with reasonable certainty","Impress the lender","Satisfy the MLS"],"concept":"Georgia description requirements","difficulty":1,"explain":"Georgia courts require a description that identifies the land or provides a 'key' leading to identification. A vague description can make the contract unenforceable for lack of definiteness.","id":"geo-6e4eee0f","portion":"georgia","q":"A Georgia real estate sales contract must contain a legal description sufficient to:","sub":"georgia/contracts|Georgia contract terms","subtopic":"Georgia contract terms","topic":"georgia/contracts"},{"answer":2,"choices":["Only an attorney, in every case","Only the closing attorney","A licensee may complete Commission-approved or standard preprinted forms","Any party, without limits"],"concept":"Unauthorized practice of law","difficulty":1,"explain":"Licensees may fill in the blanks on preprinted forms incident to a transaction they are handling. Drafting custom clauses or giving legal advice about them crosses into the unauthorized practice of law.","id":"geo-0ac85fcb","portion":"georgia","q":"Under Georgia law, who may draft a real estate sales contract?","sub":"georgia/contracts|Drafting limits & special stipulations","subtopic":"Drafting limits & special stipulations","topic":"georgia/contracts"},{"answer":0,"choices":["Controls over the preprinted language","Must be initialed by the broker","Is void","Requires GREC approval"],"concept":"Interpreting conflicting contract terms","difficulty":1,"explain":"Handwritten or typed additions reflect the parties' specific intent and prevail over standard preprinted terms. This is a general contract-construction rule the Georgia exam likes to test.","id":"geo-192e1d21","portion":"georgia","q":"A special stipulation in a Georgia contract that conflicts with the preprinted text generally:","sub":"georgia/contracts|Drafting limits & special stipulations","subtopic":"Drafting limits & special stipulations","topic":"georgia/contracts"},{"answer":3,"choices":["Redemption period","Right of first refusal","Option to renew","Due diligence period"],"concept":"Due diligence in Georgia contracts","difficulty":1,"explain":"During the due diligence period the buyer may inspect and, in most standard forms, terminate for any reason and recover the earnest money. After it expires, the buyer's exit rights narrow sharply.","id":"geo-173a374e","portion":"georgia","q":"The Georgia contract term giving a buyer a set number of days to inspect and terminate is commonly the:","sub":"georgia/contracts|Due diligence period","subtopic":"Due diligence period","topic":"georgia/contracts"},{"answer":1,"choices":["May not recover anything","Retains the earnest money as agreed damages","Receives three times the deposit","Must sue for specific performance first"],"concept":"Liquidated damages in Georgia","difficulty":1,"explain":"The earnest money serves as the agreed measure of damages. For the clause to be enforceable rather than a penalty, the amount must be a reasonable pre-estimate of loss, and damages must be hard to determine.","id":"geo-ec8637aa","portion":"georgia","q":"If a Georgia buyer defaults and the contract provides for liquidated damages, the seller typically:","sub":"georgia/contracts|Georgia contract terms","subtopic":"Georgia contract terms","topic":"georgia/contracts"},{"answer":3,"choices":["Be verbal to be enforceable","Be recorded with the clerk","Automatically renew","Be in writing with a definite expiration date"],"concept":"Listing agreement requirements","difficulty":1,"explain":"Georgia requires listings in writing with a definite ending date. Automatic renewal provisions are prohibited -- a licensee cannot roll a listing forward indefinitely.","id":"geo-cd17b130","portion":"georgia","q":"A Georgia listing agreement must:","sub":"georgia/contracts|Listing agreement rules","subtopic":"Listing agreement rules","topic":"georgia/contracts"},{"answer":2,"choices":["Enforceable for one year","Converted to an open listing","A violation of license law","Valid indefinitely"],"concept":"Definite termination dates","difficulty":1,"explain":"GREC requires a definite expiration date in brokerage engagements. Open-ended agreements are a disciplinary matter for the broker.","id":"geo-e6129ce9","portion":"georgia","q":"A Georgia brokerage engagement with no definite expiration date is:","sub":"georgia/contracts|Listing agreement rules","subtopic":"Listing agreement rules","topic":"georgia/contracts"},{"answer":3,"choices":["Only within 24 hours","Only with the seller's consent","Never once signed","Any time before acceptance is communicated"],"concept":"Revocation of an offer","difficulty":1,"explain":"An offer may be revoked any time before the offeror learns of acceptance. Once acceptance is communicated, a binding agreement exists and unilateral withdrawal becomes a breach.","id":"geo-c989 ":"georgia/disclosures|Specific required disclosures","subtopic":"Specific required disclosures","topic":"georgia/disclosures"},{"answer":0,"choices":["A Georgia-licensed attorney","The lender's underwriter","A title company escrow officer","A licensed real estate broker"],"concept":"Georgia is an attorney-closing state","difficulty":1,"explain":"Georgia requires a licensed attorney to supervise the closing, because examining title and preparing conveyance documents is the practice of law. This differs sharply from escrow states like California.","id":"geo-9647f0a2","portion":"georgia","q":"Georgia real estate closings must be conducted under the supervision of:","sub":"georgia/procedures|Attorney closings","subtopic":"Attorney closings","topic":"georgia/procedures"},{"answer":3,"choices":["1% of the sale price","$10 per $1,000","$0.10 per $1,000","$1.00 per $1,000 of consideration"],"concept":"Georgia transfer tax","difficulty":1,"explain":"The rate is $1.00 per $1,000 (0.10%), customarily paid by the SELLER and collected by the clerk of superior court when the deed is recorded.","id":"geo-eec46c41","portion":"georgia","q":"The Georgia real estate transfer tax is:","sub":"georgia/procedures|Transfer tax & recording","subtopic":"Transfer tax & recording","topic":"georgia/procedures"},{"answer":1,"choices":["Mortgage","Security deed","Land contract","Deed of trust"],"concept":"Georgia's security instrument","difficulty":1,"explain":"Georgia uses a SECURITY DEED (deed to secure debt), which passes legal title to the lender until the debt is paid. This is why Georgia foreclosures are nonjudicial and comparatively fast.","id":"geo-6904823f","portion":"georgia","q":"The Georgia instrument that secures a loan by conveying title to the lender is a:","sub":"georgia/procedures|Security deeds & foreclosure","subtopic":"Security deeds & foreclosure","topic":"georgia/procedures"},{"answer":0,"choices":["Nonjudicial, by power of sale with advertisement","Judicial, requiring a la "difficulty":1,"explain":"Deeds, security deeds, and plats are recorded with the clerk of superior court in the county where the property is located, giving constructive notice to the world.","id":"geo-a4ada124","portion":"georgia","q":"Recording a deed in Georgia is done in the:","sub":"georgia/procedures|Transfer tax & recording","subtopic":"Transfer tax & recording","topic":"georgia/procedures"},{"answer":2,"choices":["Both buyer and seller equally","The real estate broker","The lender, unless otherwise agreed","The county"],"concept":"Who the closing attorney represents","difficulty":1,"explain":"The closing attorney customarily represents the LENDER. Buyers who want their own advocate must retain separate counsel -- a point licensees should make clear rather than implying the attorney represents the buyer.","id":"geo-ad2c8a8e","portion":"georgia","q":"In a Georgia transaction the closing attorney generally represents:","sub":"georgia/procedures|Attorney closings","subtopic":"Attorney closings","topic":"georgia/procedures"},{"answer":1,"choices":["Only after a court judgment","On January 1 of the tax year","At closing","When the bill is mailed"],"concept":"Georgia tax liens and prorations","difficulty":1,"explain":"The lien attaches as of January 1, which is why closings prorate taxes for the year and why unpaid taxes follow the property regardless of who owned it when they accrued.","id":"geo-7ae74454","portion":"georgia","q":"Georgia property taxes become a lien on real property:","sub":"georgia/procedures|Taxes & prorations","subtopic":"Taxes & prorations","topic":"georgia/procedures"},{"answer":3,"choices":["HUD-1 in all cases","Loan Estimate","Settlement affidavit","Closing Disclosure"],"concept":"TRID at the Georgia closing table","difficulty":1,"explain":"The Closing Disclosure must be received at least 3 business days before consummation. It replaced the HUD-1 for most consumer mortgage transactions in 2015.","id":"geo-cdaf025e","portion":"georgia","q":"
