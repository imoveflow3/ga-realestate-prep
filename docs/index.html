le for supervising assistants; letting one host an open house unaccompanied and field substantive questions is a classic disciplinary case.","id":"nat-31e2087a","portion":"national","q":"An unlicensed assistant, alone at an open house, answers a visitor's question about whether the seller would take less. The broker's exposure is:","sub":"national/agency|Trust funds & supervision","subtopic":"Trust funds & supervision","topic":"national/agency"},{"answer":3,"choices":["Note it only if the repair is under warranty","Disclose only if the buyer's inspector finds evidence","Say nothing, since the condition is fixed","Disclose the past problem and the repair"],"concept":"Past defects are still material","difficulty":2,"explain":"A history of water intrusion is material to value and desirability even after repair, because it bears on recurrence risk and insurability. Disclosing the problem AND the fix protects the seller; silence is the classic post-closing lawsuit.","id":"nat-72bbf3e4","portion":"national","q":"A seller repaired a chronic basement leak two years ago and it has not recurred. On the disclosure form the seller should:","sub":"national/disclosures|Material facts & latent defects","subtopic":"Material facts & latent defects","topic":"national/disclosures"},{"answer":3,"choices":["Ask the listing agent to repaint it","Assume the seller disclosed everything material","Say nothing, as the agent is not an inspector","Point it out to the buyer and recommend the inspector examine it"],"concept":"No duty to discover, but no license to ignore","difficulty":2,"explain":"Agents are not inspectors and have no duty to hunt for defects -- but a visible red flag they actually observe must be passed on. Seeing it and staying silent converts 'no duty to discover' into concealment of something known.","id":"nat-8c9dbc26","portion":"national","q":"A buyer's agent sees a fresh paint patch on a ceiling and a faint stain edge. The agent should:","sub":"national/disclosures|Material facts & latent defects","subtopic":"Material facts & latent defects","topic":"national/disclosures"},{"answer":2,"choices":["Do nothing, because no hazard is known","Test the property before closing","Disclose the absence of knowledge, give the pamphlet, and allow the 10-day opportunity","Disclose only if the buyer has children"],"concept":"Lead disclosure when nothing is known","difficulty":2,"explain":"The federal rule requires the disclosure form, records, EPA pamphlet, and 10-day testing window on all pre-1978 target housing. Having no knowledge is a permitted answer on the form -- but the process still applies. Sellers are never required to test.","id":"nat-b02be796","portion":"national","q":"A property built in 1975 is sold. The seller has never tested for lead and knows of no hazard. The seller must:","sub":"national/disclosures|Lead-based paint","subtopic":"Lead-based paint","topic":"national/disclosures"},{"answer":1,"choices":["Answer only in writing","Decline, explaining that the question involves a protected class","Answer factually if the licensee knows","Refer the buyer to the seller"],"concept":"Fair housing overrides the impulse to be helpful","difficulty":2,"explain":"Handicap is a protected class, so answering would facilitate discriminatory steering regardless of the licensee's intent. The right move is to decline and direct the buyer to publicly available sources they can research themselves.","id":"nat-3b1812fa","portion":"national","q":"A buyer asks a licensee whether a nearby group home houses people with disabilities. The licensee should:","sub":"national/disclosures|Stigma & fair housing limits","subtopic":"Stigma & fair housing limits","topic":"national/disclosures"},{"answer":0,"choices":["Refuse to pass on information known to be false, and withdraw if the seller persists","Correct the form personally","Disclose the truth only to the buyer's agent","Present the form as the seller wrote it, since it is the seller's statement"],"concept":"A licensee cannot transmit known falsehoods","difficulty":2,"explain":"The form belongs to the seller, but the licensee cannot become the conduit for a misrepresentation they know to be false -- that is participation in fraud. The licensee never alters the seller's form; if the seller will not fix it, the engagement must end.","id":"nat-713f3a24","portion":"national","q":"A licensee discovers the seller's disclosure understates the age of the roof by twelve years. The seller refuses to correct it. The licensee should:","sub":"national/disclosures|Material facts & latent defects","subtopic":"Material facts & latent defects","topic":"national/disclosures"},{"answer":2,"choices":["A binding contract dated Saturday","A counteroffer the buyer may accept","No contract, because acceptance was not communicated within the deadline","A binding contract, because the seller signed in time"],"concept":"Acceptance is effective on communication","difficulty":2,"explain":"Signing is not acceptance -- the offeror must receive it within the stated time. Late delivery means the offer lapsed. The late acceptance may operate as a new offer the buyer can accept, but no contract exists on the original terms.","id":"nat-1c0b5387","portion":"national","q":"A buyer's offer says acceptance must be received by 5 p.m. Friday. The seller signs at 3 p.m. Friday but the acceptance is not delivered until Saturday morning. There is:","sub":"national/contracts|Offer, acceptance & counteroffers","subtopic":"Offer, acceptance & counteroffers","topic":"national/contracts"},{"answer":0,"choices":["Prevail, because the approval did not meet the stated term","Prevail only if the buyer applied to three lenders","Lose, because 0.25% is immaterial","Lose, because the buyer was approved"],"concept":"Contingencies are read as written","difficulty":2,"explain":"The condition specified a rate ceiling, and an approval above it does not satisfy it. Courts enforce the stated terms; materiality is not re-argued after the parties fixed the number. The buyer must still have applied in good faith, which a single genuine application satisfies.","id":"nat-bd6c19ef","portion":"national","q":"A contract is contingent on the buyer obtaining financing at no more than 6.5%. The buyer is approved at 6.75% and terminates. The seller argues bad faith. The buyer will MOST likely:","sub":"national/contracts|Contingencies & conditions","subtopic":"Contingencies & conditions","topic":"national/contracts"},{"answer":1,"choices":["Buyer, who holds equitable title","Seller, because possession and title had not passed","Insurer only","Parties equally"],"concept":"Equitable conversion vs. the Risk Act","difficulty":2,"explain":"Under the older doctrine of equitable conversion the BUYER bore the risk from contract signing. The Uniform Act reverses that: risk stays with the seller until title or possession transfers. Knowing which rule the question invokes is the whole point.","id":"nat-4eeb78f6","portion":"national","q":"A seller and buyer sign a contract. Before closing the house burns down. In a state that has adopted the Uniform Vendor and Purchaser Risk Act, the loss falls on the:","sub":"national/contracts|Contract terms & performance","subtopic":"Contract terms & performance","topic":"national/contracts"},{"answer":2,"choices":["The seller may terminate the contract","The assignment converts the deal to a novation","The assignment is valid, and the original buyer remains secondarily liable","The assignment is void without consent"],"concept":"Assignability of real estate contracts","difficulty":2,"explain":"Real estate purchase contracts are assignable unless they say otherwise. The assignee gains the rights; the assignor stays secondarily liable unless the seller agrees to a novation. Personal-service contracts are the category that resists assignment.","id":"nat-dff6a6a6","portion":"national","q":"A buyer assigns her purchase contract to a third party. The contract is silent on assignment. The seller objects. Generally:","sub":"national/contracts|Assignment & novation","subtopic":"Assignment & novation","topic":"national/contracts"},{"answer":0,"choices":["Specific performance against the owner and the buyer if the buyer had notice","Nothing, since options are revocable","Recovery of the $5,000 only","Damages capped at the option price"],"concept":"Options create an enforceable interest","difficulty":2,"explain":"An option supported by consideration is a binding contract, and land is unique, so specific performance is available. A later buyer with actual or constructive notice (a recorded option) takes subject to it. Options are not revocable once consideration is paid.","id":"nat-8d6cae58","portion":"national","q":"An option agreement gives a tenant the right to buy for $500,000 within one year, for $5,000 consideration. Six months in, the owner sells to someone else. The tenant's BEST remedy is:","sub":"national/contracts|Options & installment contracts","subtopic":"Options & installment contracts","topic":"national/contracts"},{"answer":1,"choices":["Prevail, because the date passed","Not prevail, because performance within a reasonable time is allowed","Prevail only if damages are shown","Not prevail, because closing dates are unenforceable"],"concept":"Effect of omitting time-is-of-the-essence","difficulty":2,"explain":"Without the clause, courts permit performance within a reasonable time and three days is ordinarily reasonable. The clause exists precisely to convert a date into a hard deadline. Closing dates are enforceable -- just not automatically strict.","id":"nat-fac7cd96","portion":"national","q":"A contract states 'closing on or before June 30' with no time-is-of-the-essence clause. The buyer is ready on July 3. The seller declares a breach. The seller will MOST likely:","sub":"national/contracts|Contract terms & performance","subtopic":"Contract terms & performance","topic":"national/contracts"},{"answer":1,"choices":["Rescission","Reformation","Specific performance as written","Novation"],"concept":"Reformation for scrivener's error","difficulty":2,"explain":"Reformation asks a court to rewrite the document to reflect the parties' actual agreement. Rescission would unwind a deal both sides want; enforcing the erroneous description would convey the wrong lot.","id":"nat-a4377df9","portion":"national","q":"Two parties sign a contract that misstates the parcel number due to a typing error, though both intended the same lot. The proper remedy is:","sub":"national/contracts|Breach, remedies & damages","subtopic":"Breach, remedies & damages","topic":"national/contracts"},{"answer":0,"choices":["The Monday recorder, if that buyer had no notice of the earlier sale","The Wednesday recorder, because possession controls","Neither -- the deeds cancel","The earlier buyer, because that purchase came first"],"concept":"Race-notice recording acts","difficulty":2,"explain":"A race-notice statute protects the party who both takes WITHOUT NOTICE and records FIRST. The catch: open possession by the earlier buyer can itself be constructive notice, which would defeat the Monday recorder. The stem's 'no notice' condition is what decides it.","id":"nat-f8510410","portion":"national","q":"A buyer records a deed on Monday. An earlier buyer of the same parcel, who had paid and taken possession, records on Wednesday. In a race-notice state the winner is:","sub":"national/transfer|Recording, notice & priority","subtopic":"Recording, notice & priority","topic":"national/transfer"},{"answer":2,"choices":["When the defect is recorded","When the grantee resells","At the moment of conveyance","Only when the grantee is evicted"],"concept":"Present vs. future covenants","difficulty":2,"explain":"Seisin, right to convey, and against encumbrances are PRESENT covenants -- breached, if at all, at delivery, which starts the limitations clock then. Quiet enjoyment, warranty, and further assurances are FUTURE covenants, breached only on later disturbance.","id":"nat-ef368726","portion":"national","q":"A general warranty deed's covenant of seisin is breached. When does the breach occur?","sub":"national/transfer|Deeds & covenants of title","subtopic":"Deeds & covenants of title","topic":"national/transfer"},{"answer":0,"choices":["Is valid on payment, relating back to the original deposit","Must be re-executed by the estate","Is void, because delivery requires a living grantor","Passes only a life estate"],"concept":"Relation-back doctrine in escrow delivery","difficulty":2,"explain":"Once a grantor deposits a deed in escrow beyond recall, delivery relates back to the deposit date when the condition is met. This defeats the argument that death revoked it. The doctrine exists precisely to prevent death from unwinding completed bargains.","id":"nat-bab807ac","portion":"national","q":"A grantor hands a signed deed to an escrow agent with instructions to deliver on payment. The grantor dies before payment. The deed:","sub":"national/transfer|Closing & prorations","subtopic":"Closing & prorations","topic":"national/transfer"},{"answer":1,"choices":["Buy title insurance covering it","Obtain and record a release or satisfaction","Wait for the statute of limitations","Disclose it and proceed"],"concept":"Marketable title and Schedule B exceptions","difficulty":2,"explain":"An exception is a defect the policy will NOT cover, so insurance does not solve it. Marketable title requires clearing the lien of record with a recorded release. A buyer cannot be forced to accept title subject to an undischarged mortgage.","id":"nat-9eb1c726","portion":"national","q":"A title commitment lists an unreleased mortgage from 1978 as an exception. To convey marketable title the seller must:","sub":"national/transfer|Title evidence & clearing defects","subtopic":"Title evidence & clearing defects","topic":"national/transfer"},{"answer":3,"choices":["Acquires a prescriptive easement instead","Acquires title anyway, since possession is the main element","Acquires title after twice the period","Fails, because every statutory element must be satisfied"],"concept":"Adverse possession is all-elements","difficulty":2,"explain":"Every element of the statute must be met -- possession that is open, notorious, hostile, actual, continuous for the period, plus any state-specific requirement like tax payment or color of title. Missing one defeats the claim entirely.","id":"nat-9cc968a6","portion":"national","q":"An adverse possessor occupies land for the statutory period but pays no taxes, and the state's statute requires tax payment. The possessor:","sub":"national/transfer|Adverse possession & involuntary transfer","subtopic":"Adverse possession & involuntary transfer","topic":"national/transfer"},{"answer":2,"choices":["Violated antitrust by publishing a rate","Committed a group boycott","Set a lawful internal company policy","Committed price fixing with its competitors"],"concept":"Company policy vs. conspiracy","difficulty":2,"explain":"A single firm may set its own rates -- that is competition, not conspiracy. Antitrust requires an AGREEMENT between competitors. Parallel behavior alone is not proof; what would make it illegal is evidence the firms coordinated.","id":"nat-14de8545","portion":"national","q":"A brokerage tells its agents never to quote a commission below 5%, and the firm's competitors independently do the same. The brokerage has:","sub":"national/practice|Antitrust","subtopic":"Antitrust","topic":"national/practice"},{"answer":2,"choices":["Nothing -- occupancy limits are lawful","Handicap","Familial status","National origin"],"concept":"Reading an ad for the actual violation","difficulty":2,"explain":"'No children under 12' is a direct familial status violation. 'Ideal for professionals' is a weaker signal about income or occupation, which is not federally protected. Reasonable OCCUPANCY limits by number of persons are lawful, but limits by age of occupant are not.","id":"nat-8e96b0ad","portion":"national","q":"A landlord's ad says 'quiet building, ideal for professionals, no children under 12.' The clearest violation involves:","sub":"national/practice|Practice standards","subtopic":"Practice standards","topic":"national/practice"},{"answer":0,"choices":["Disparate impact, even without discriminatory intent","Intentional discrimination only","Not actionable, since the rule is neutral","A steering violation"],"concept":"Disparate impact","difficulty":2,"explain":"A facially neutral policy that falls disproportionately on a protected class can violate fair housing law without any intent to discriminate. The landlord's defense is that the rule serves a substantial, legitimate business need that no less discriminatory rule would serve.","id":"nat-ac98caad","portion":"national","q":"A property manager applies a rule requiring all applicants to have income of three times the rent. Statistically it screens out a protected class at a much higher rate. This may be challenged as:","sub":"national/practice|Fair housing & advertising","subtopic":"Fair housing & advertising","topic":"national/practice"},{"answer":0,"choices":["Continue holding it and use interpleader or the state's prescribed dispute procedure","Split it evenly between them","Release it to whoever demands first","Keep it as compensation for the failed sale"],"concept":"Disputed trust funds","difficulty":2,"explain":"A broker holding disputed funds must not choose sides. The safe course is to hold and let a court (interpleader) or the state-prescribed process decide. Releasing, splitting, or keeping the money all expose the broker to a conversion claim.","id":"nat-7daf0dc2","portion":"national","q":"A broker holds a $10,000 earnest money deposit. Buyer and seller both demand it after a failed closing. The broker should:","sub":"national/practice|Trust funds & commingling","subtopic":"Trust funds & commingling","topic":"national/practice"},{"answer":2,"choices":["A permissible market update","Puffing","A misleading advertisement misrepresenting the licensee's involvement","A RESPA violation"],"concept":"Truthful advertising","difficulty":2,"explain":"Implying credit for another firm's transaction misrepresents the licensee's role. Market-update advertising is legitimate only when it clearly attributes the sale and does not suggest the advertiser handled it.","id":"nat-de18bc19","portion":"national","q":"A licensee advertises 'Just sold! Call me to sell yours' with a photo of a property listed and sold by another firm. This is MOST directly:","sub":"national/practice|Fair housing & advertising","subtopic":"Fair housing & advertising","topic":"national/practice"}],"georgia":[{"answer":0,"choices":["18 years old","17 years old","21 years old","19 years old"],"concept":"Georgia age requirements","difficulty":1,"explain":"18 for salesperson or community association manager; 21 for broker or associate broker. An applicant may TAKE the salesperson exam at 17 but cannot activate the license until 18.","id":"geo-72d3ad74","portion":"georgia","q":"To be licensed as a Georgia salesperson an applicant must be at least:","sub":"georgia/license-law|Licensure & experience","subtopic":"Licensure & experience","topic":"georgia/license-law"},{"answer":0,"choices":["75 hours","25 hours","90 hours","60 hours"],"concept":"Georgia prelicense education","difficulty":1,"explain":"Georgia requires a 75-hour GREC-approved salesperson prelicense course. Do not confuse it with the 25-hour POSTlicense course due in the first year.","id":"geo-472088bb","portion":"georgia","q":"The Georgia prelicense course required for a salesperson's license is:","sub":"georgia/license-law|Education requirements","subtopic":"Education requirements","topic":"georgia/license-law"},{"answer":2,"choices":["Before taking the exam","Within two years","Within one year of original licensure","Only if practicing full time"],"concept":"Georgia postlicense requirement","difficulty":1,"explain":"The 25-hour Sales Post-license Course is due within ONE year of original licensure. It applies whether the license is active or inactive and whether the licensee is a Georgia resident or not. Missing it costs the license.","id":"geo-c0627056","portion":"georgia","q":"A newly licensed Georgia salesperson must complete a 25-hour postlicense course:","sub":"georgia/license-law|Education requirements","subtopic":"Education requirements","topic":"georgia/license-law"},{"answer":0,"choices":["24 hours","36 hours","12 hours","45 hours"],"concept":"Georgia continuing education","difficulty":1,"explain":"Georgia requires at least 24 hours of GREC-approved CE during each four-year renewal period. Many national study guides quote 36 hours, which is a different state -- Georgia is 24.","id":"geo-56b4785c","portion":"georgia","q":"Active Georgia licensees must complete how much continuing education each four-year renewal period?","sub":"georgia/license-law|Education requirements","subtopic":"Education requirements","topic":"georgia/license-law"},{"answer":2,"choices":["Two of the past three years","Five continuous years","Three of the five years immediately preceding application","One of the past two years"],"concept":"Georgia broker experience requirement","difficulty":1,"explain":"Three years of active licensure within the five years immediately preceding application. Active licensure in ANOTHER state counts, provided the applicant supplies a certified license history.","id":"geo-bbd32933","portion":"georgia","q":"An applicant for a Georgia broker's license must have held an active license for at least:","sub":"georgia/license-law|Licensure & experience","subtopic":"Licensure & experience","topic":"georgia/license-law"},{"answer":2,"choices":["Qualifying broker","Associate broker","Salesperson","Broker"],"concept":"Which licenses require experience","difficulty":1,"explain":"A salesperson's license has no experience requirement -- only age, education, exam, and background. Broker and associate broker both require the three-of-five-years experience.","id":"geo-f0bfc729","portion":"georgia","q":"There is no experience requirement for which Georgia license?","sub":"georgia/license-law|Licensure & experience","subtopic":"Licensure & experience","topic":"georgia/license-law"},{"answer":2,"choices":["Reprimanding a licensee","Suspending or revoking a license","Ordering a licensee to repay a consumer's financial loss","Imposing a fine and requiring education"],"concept":"Limits on GREC's authority","difficulty":1,"explain":"GREC may reprimand, suspend, revoke, fine, require education, and require accountant reports on trust accounts. It has NO power to force a licensee to compensate someone for a financial loss -- that requires a civil suit. This is a favorite exam distinction.","id":"geo-070796c2","portion":"georgia","q":"The Georgia Real Estate Commission's disciplinary powers include all of the following EXCEPT:","sub":"georgia/license-law|GREC discipline & sanctions","subtopic":"GREC discipline & sanctions","topic":"georgia/license-law"},{"answer":3,"choices":["Immediate revocation","Referral for criminal prosecution","Automatic license suspension","A consent order the licensee may sign"],"concept":"The GREC disciplinary process","difficulty":1,"explain":"The Commission may offer a Consent Order stating the violation and a proposed sanction, usually a reprimand, fine, and/or education. The licensee may sign it, propose an alternative, present evidence, or demand a formal hearing.","id":"geo-965aa59a","portion":"georgia","q":"A GREC investigation that finds a violation causing no significant public harm is most likely resolved by:","sub":"georgia/license-law|GREC discipline & sanctions","subtopic":"GREC discipline & sanctions","topic":"georgia/license-law"},{"answer":2,"choices":["The full Commission","A superior court judge","An Administrative Law Judge from the Office of State Administrative Hearings","The Attorney General"],"concept":"Who hears GREC cases","difficulty":1,"explain":"An ALJ hears the case and issues a decision. A dissatisfied respondent may then ask to appear before the Commission, and ultimately may appeal to the courts.","id":"geo-f2e2d756","portion":"georgia","q":"A formal GREC disciplinary hearing is conducted by:","sub":"georgia/license-law|Investigations & hearings","subtopic":"Investigations & hearings","topic":"georgia/license-law"},{"answer":0,"choices":["Anyone, by sworn written request -- and the Commission on its own motion","Only a party to the transaction","Only the licensee's broker","Only the Attorney General"],"concept":"Initiating an investigation","difficulty":1,"explain":"Anyone may file a sworn, written request for investigation, and the Commission may also act on its own motion. The licensee will be notified that they are the subject of an investigation.","id":"geo-98058cd4","portion":"georgia","q":"Who may initiate a GREC investigation of a licensee?","sub":"georgia/license-law|Investigations & hearings","subtopic":"Investigations & hearings","topic":"georgia/license-law"},{"answer":1,"choices":["Obtain a separate owner's permit","Disclose his licensed status in writing in the contract","Use another broker exclusively","Ignore license law because he is the owner"],"concept":"Licensee acting as a principal","difficulty":1,"explain":"O.C.G.A. 43-40-29(c) says the exceptions to licensure never apply to someone who holds a license. A licensee selling his own property must disclose licensed status in writing and put any trust funds in a broker-approved trust account.","id":"geo-83485c1c","portion":"georgia","q":"A Georgia licensee selling a property he personally owns must:","sub":"georgia/license-law|Licensee as principal","subtopic":"Licensee as principal","topic":"georgia/license-law"},{"answer":1,"choices":["Has no education obligations","Must still meet the postlicense education requirement","May still list property","Loses the license automatically"],"concept":"Inactive status obligations","difficulty":1,"explain":"Postlicense education still applies to an inactive salesperson, and renewal fees still come due. Inactive licensees may not perform licensed activity.","id":"geo-321aa315","portion":"georgia","q":"A licensee whose license is on inactive status:","sub":"georgia/license-law|Licensure & experience","subtopic":"Licensure & experience","topic":"georgia/license-law"},{"answer":1,"choices":["An attorney performing legal services","Negotiating a lease for another for compensation","An owner selling her own home","An executor selling estate property"],"concept":"Activities requiring licensure","difficulty":1,"explain":"Negotiating, listing, selling, leasing, or collecting rents FOR ANOTHER for compensation requires a license. Owners, executors, and attorneys acting in their own roles are excepted -- but never a person who already holds a license.","id":"geo-51fd47de","portion":"georgia","q":"Which activity requires a Georgia real estate license?","sub":"georgia/license-law|Licensure & experience","subtopic":"Licensure & experience","topic":"georgia/license-law"},{"answer":1,"choices":["Verbally to the broker only","By filing a change application with the Commission","Only at renewal","Within one year"],"concept":"Keeping the license record current","difficulty":1,"explain":"Changes in affiliation or status are made by filing a change application. Operating without a current, properly affiliated license is itself a violation.","id":"geo-8f8b3d94","portion":"georgia","q":"A Georgia licensee must notify GREC of a change of address or broker affiliation:","sub":"georgia/license-law|Licence administration","subtopic":"Licence administration","topic":"georgia/license-law"},{"answer":2,"choices":["The MLS","The Commission until renewal","The broker with whom the salesperson is affiliated","The salesperson personally, independent of any firm"],"concept":"Broker supervision","difficulty":1,"explain":"A salesperson may only act through and under the supervision of the affiliated broker. All compensation for licensed activity must come from that broker, not directly from a client or another licensee.","id":"geo-4f67e40c","portion":"georgia","q":"A salesperson's license in Georgia is held by:","sub":"georgia/license-law|Broker supervision & the firm","subtopic":"Broker supervision & the firm","topic":"georgia/license-law"},{"answer":1,"choices":["Only the broker's own transactions","Supervising affiliated licensees and the firm's trust accounts","Paying affiliates' income taxes","Guaranteeing affiliates' commissions"],"concept":"Qualifying broker duties","difficulty":1,"explain":"The qualifying broker answers to GREC for the firm's compliance -- supervision, trust accounts, records, and advertising. Failure to supervise is an independent violation.","id":"geo-4a0902bb","portion":"georgia","q":"The qualifying broker of a real estate firm is responsible for:","sub":"georgia/license-law|Broker supervision & the firm","subtopic":"Broker supervision & the firm","topic":"georgia/license-law"},{"answer":0,"choices":["Clearly identify the licensee's firm","Appear only in the MLS","Use only the licensee's personal name","Omit the firm name for brevity"],"concept":"Advertising and the firm name","difficulty":1,"explain":"Advertising must not be misleading and must identify the brokerage firm. A licensee may never advertise in a way that suggests they operate independently of their broker.","id":"geo-fdba3b6d","portion":"georgia","q":"Georgia advertising rules require that a licensee's advertising:","sub":"georgia/license-law|Broker supervision & the firm","subtopic":"Broker supervision & the firm","topic":"georgia/license-law"},{"answer":2,"choices":["Surrender the license automatically","Do nothing until renewal","Report the conviction to the Commission","Notify only the broker"],"concept":"Reporting convictions","difficulty":1,"explain":"Licensees must report criminal convictions to GREC. Failing to report is often punished more severely than the underlying offense.","id":"geo-3305ff44","portion":"georgia","q":"A licensee convicted of a felony after licensure must:","sub":"georgia/license-law|GREC discipline & sanctions","subtopic":"GREC discipline & sanctions","topic":"georgia/license-law"},{"answer":1,"choices":["Always prohibited","Permitted only under strict disclosure conditions","The standard listing form","Required for commercial property"],"concept":"Net listings in Georgia","difficulty":1,"explain":"Georgia permits net listings only with careful disclosure, because they create a conflict between the broker's profit and the client's interest. Many brokerages ban them outright by policy.","id":"geo-c0b31065","portion":"georgia","q":"Under Georgia law, a net listing is:","sub":"georgia/license-law|Licence administration","subtopic":"Licence administration","topic":"georgia/license-law"},{"answer":3,"choices":["Elected by licensees","Appointed by the Attorney General","Selected by the state association of REALTORS","Appointed by the Governor"],"concept":"GREC structure","difficulty":1,"explain":"Commission members are appointed by the Governor. GREC administers the license law, issues rules, investigates complaints, and disciplines licensees.","id":"geo-339a3d36","portion":"georgia","q":"The Georgia Real Estate Commission's members are:","sub":"georgia/license-law|GREC discipline & sanctions","subtopic":"GREC discipline & sanctions","topic":"georgia/license-law"},{"answer":1,"choices":["Held in the salesperson's name","A federally insured checking account the bank designates as a trust or escrow account","Any personal savings account","An investment brokerage account"],"concept":"Trust account requirements","difficulty":1,"explain":"It must be a separate, federally insured bank checking account that the BANK designates as trust or escrow, registered with the Commission, with the broker holding signatory power.","id":"geo-1162a3ff","portion":"georgia","q":"A Georgia broker's trust account must be:","sub":"georgia/trust-accounts|Opening & registering the account","subtopic":"Opening & registering the account","topic":"georgia/trust-accounts"},{"answer":1,"choices":["The broker's Social Security Number","An Employer Identification Number","The client's tax ID","No tax identification"],"concept":"Protecting the trust account from seizure","difficulty":1,"explain":"Accounts opened under a broker's SSN have been seized by the IRS, awarded in divorce, and attached by banks for the broker's personal debts. An EIN keeps the account identifiable as trust property.","id":"geo-0aa08fbc","portion":"georgia","q":"A Georgia broker should open the trust account under:","sub":"georgia/trust-accounts|Opening & registering the account","subtopic":"Opening & registering the account","topic":"georgia/trust-accounts"},{"answer":2,"choices":["Whenever the broker chooses","Only after closing","Promptly, unless all parties give written authority otherwise","Within 30 days"],"concept":"Timing of trust deposits","difficulty":1,"explain":"Funds must be deposited promptly into a non-interest-bearing checking account. To hold a check until offer acceptance, or to use an interest-bearing account, the broker needs clear WRITTEN authority agreed to by all parties.","id":"geo-f298f548","portion":"georgia","q":"Georgia law requires a broker to deposit trust funds:","sub":"georgia/trust-accounts|Deposit timing","subtopic":"Deposit timing","topic":"georgia/trust-accounts"},{"answer":0,"choices":["Commingling","Subrogation","A permissible practice","Novation"],"concept":"Commingling in Georgia","difficulty":1,"explain":"Trust funds must stay separate from the broker's own money. Commingling is one of the most frequently disciplined license law violations; actually spending the funds is conversion.","id":"geo-84751b3a","portion":"georgia","q":"A broker who deposits earnest money into the firm's operating account has committed:","sub":"georgia/trust-accounts|Deposit timing","subtopic":"Deposit timing","topic":"georgia/trust-accounts"},{"answer":0,"choices":["At least one, and more if each is registered with the Commission","One per affiliated licensee","Exactly one","No more than two"],"concept":"Multiple trust accounts","difficulty":1,"explain":"Brokers must have at least one but may have several -- commonly separate accounts for earnest money, rents, and security deposits. Each must be bank-designated as trust and registered with GREC, with the broker holding signatory power.","id":"geo-0ef45ddf","portion":"georgia","q":"How many trust accounts may a Georgia broker maintain?","sub":"georgia/trust-accounts|Opening & registering the account","subtopic":"Opening & registering the account","topic":"georgia/trust-accounts"},{"answer":2,"choices":["No access without a warrant","Setting the interest rate","Examining the account upon reasonable request","Freezing the account at will"],"concept":"GREC audit authority","difficulty":1,"explain":"GREC may examine trust accounts on reasonable request and does so routinely. The Commission may accept a CPA's certification of compliance in lieu of its own examination, at its discretion.","id":"geo-7b4bf9f8","portion":"georgia","q":"The Georgia Real Estate Commission's authority over a broker's trust account includes:","sub":"georgia/trust-accounts|Audits & reconciliation","subtopic":"Audits & reconciliation","topic":"georgia/trust-accounts"},{"answer":2,"choices":["A buyer's advance for a credit report","Rents collected for an owner","The broker's earned commission after disbursement","A tenant's security deposit"],"concept":"What counts as trust funds","difficulty":1,"explain":"Once a transaction closes and the commission is properly earned and disbursed, it is the broker's money. Everything held ON BEHALF OF another -- deposits, rents, advances -- is trust money.","id":"geo-059d3763","portion":"georgia","q":"Which of these is NOT trust money that must go into the trust account?","sub":"georgia/trust-accounts|What counts as trust money","subtopic":"What counts as trust money","topic":"georgia/trust-accounts"},{"answer":3,"choices":["Interest is earned","The account balance changes","A new client is added","The trust account's bank, name, or number changes or the account closes"],"concept":"Trust account recordkeeping duties","difficulty":1,"explain":"Any change in the bank, account name or number, or closure of the account requires written notice to GREC on Commission forms.","id":"geo-bbcc573a","portion":"georgia","q":"A broker must notify the Commission in writing when:","sub":"georgia/trust-accounts|Opening & registering the account","subtopic":"Opening & registering the account","topic":"georgia/trust-accounts"},{"answer":0,"choices":["Each client depositor is treated as a separate account owner","The broker is insured for $250,000 total","Coverage is unlimited","No coverage applies to trust accounts"],"concept":"FDIC coverage of trust accounts","difficulty":1,"explain":"With proper records, each buyer, seller, or tenant is insured separately up to $250,000. But the FDIC ADDS that person's other deposits in the same bank, so a client near the limit may be underinsured -- brokers should disclose which bank they use.","id":"geo-167a6da3","portion":"georgia","q":"FDIC 'pass-through' coverage on a broker's trust account means:","sub":"georgia/trust-accounts|FDIC coverage","subtopic":"FDIC coverage","topic":"georgia/trust-accounts"},{"answer":2,"choices":["Keep no records","Register the account personally with the IRS only","Provide the broker at least quarterly written reconciliation statements","Avoid telling the broker"],"concept":"Affiliate-held trust accounts","difficulty":1,"explain":"The broker must register the account with GREC and remains responsible for it. The affiliate must provide at least quarterly written reconciliations comparing total trust liability with the reconciled bank balance.","id":"geo-a6ab9dae","portion":"georgia","q":"An affiliated licensee permitted to hold a trust account for personally owned rentals must:","sub":"georgia/trust-accounts|Audits & reconciliation","subtopic":"Audits & reconciliation","topic":"georgia/trust-accounts"},{"answer":3,"choices":["A verbal promise to represent","Showing a buyer three properties","Paying the broker a commission","A written brokerage engagement"],"concept":"How agency is created in Georgia","difficulty":1,"explain":"BRRETA defines agency as representing another as a client 'by the latter's WRITTEN authority.' A brokerage engagement is a written contract. This is why accidental agency is far harder to create in Georgia than in many states.","id":"geo-e8f74763","portion":"georgia","q":"Under BRRETA, an agency relationship in Georgia is created by:","sub":"georgia/brreta|Creating the engagement","subtopic":"Creating the engagement","topic":"georgia/brreta"},{"answer":0,"choices":["No -- there must be an express written agreement","Yes, always","Yes, if the payer is the seller","Only in residential transactions"],"concept":"Compensation does not equal agency","difficulty":1,"explain":"A seller paying the buyer's broker does NOT make that broker the seller's agent. Source of compensation and agency are separate questions -- a frequently tested point.","id":"geo-52c8c0e7","portion":"georgia","q":"Under BRRETA, does paying a broker's commission by itself create an agency relationship?","sub":"georgia/brreta|Creating the engagement","subtopic":"Creating the engagement","topic":"georgia/brreta"},{"answer":2,"choices":["Principal","Client","Customer","Subagent"],"concept":"Client vs. customer under BRRETA","difficulty":1,"explain":"A CLIENT is represented under a written brokerage engagement. A CUSTOMER is unrepresented; the broker may perform ministerial acts for them under a verbal OR written agreement.","id":"geo-baee4117","portion":"georgia","q":"Under BRRETA, a person NOT represented by a broker but for whom the broker performs ministerial acts is a:","sub":"georgia/brreta|Client vs. customer","subtopic":"Client vs. customer","topic":"georgia/brreta"},{"answer":3,"choices":["Owes no duties at all","Owes unlimited fiduciary duties","May not represent buyers","Is not deemed to have a fiduciary relationship, but must exercise reasonable care in the duties specified"],"concept":"BRRETA limits the scope of duties","difficulty":1,"explain":"BRRETA states a broker 'shall not be deemed to have a fiduciary relationship with any party' and is responsible for reasonable care in discharging the duties the statute and the engagement specify. This narrowing of liability is the heart of the Act.","id":"geo-46ec3b54","portion":"georgia","q":"A significant difference between BRRETA and traditional common-law agency is that under BRRETA a broker:","sub":"georgia/brreta|Scope of duties under BRRETA","subtopic":"Scope of duties under BRRETA","topic":"georgia/brreta"},{"answer":2,"choices":["The broker's compensation and whether it is shared","The broker's confidentiality obligations","The names of the broker's other clients buying similar property","The types of agency relationships available"],"concept":"The four BRRETA pre-engagement disclosures","difficulty":1,"explain":"The broker discloses agency types available, conflicting relationships actually known, compensation and sharing, and confidentiality obligations. It expressly EXCLUDES having to reveal that the broker represents other buyers or sellers generally.","id":"geo-79ff4d97","portion":"georgia","q":"BRRETA requires a broker, before or at the time of entering a brokerage engagement, to advise the prospective client of all of the following EXCEPT:","sub":"georgia/brreta|Required disclosures","subtopic":"Required disclosures","topic":"georgia/brreta"},{"answer":1,"choices":["Prohibited in Georgia","Allowed with written consent from both clients","Allowed with verbal consent","Allowed only for commercial property"],"concept":"Dual agency in Georgia","difficulty":1,"explain":"Georgia permits dual agency but requires written consent. Consent is presumed if the writing contains the required elements, including a statement that the client does NOT have to consent.","id":"geo-09ddd332","portion":"georgia","q":"Under BRRETA, dual agency is:","sub":"georgia/brreta|Dual agency","subtopic":"Dual agency","topic":"georgia/brreta"},{"answer":2,"choices":["The commission will be doubled","The broker will favor the seller","The client does not have to consent to the dual agency","The client must consent to proceed"],"concept":"Contents of dual agency consent","difficulty":1,"explain":"The writing must describe the transactions involved, state that the broker represents two clients with potentially adverse interests, explain the disclosure of adverse material facts, and state that consent is voluntary.","id":"geo-aa6e7675","portion":"georgia","q":"A required element of a valid Georgia dual agency consent is a statement that:","sub":"georgia/brreta|Dual agency","subtopic":"Dual agency","topic":"georgia/brreta"},{"answer":2,"choices":["A conflict requiring withdrawal","Automatically illegal dual agency","Designated agency, permitted with written consent","Subagency"],"concept":"Designated agency -- a Georgia distinction","difficulty":1,"explain":"Many states treat this as firm-wide dual agency. BRRETA lets the broker assign different affiliated licensees to represent opposing clients, with the parties' written consent. Each designated agent represents only their own client.","id":"geo-beaf1733","portion":"georgia","q":"Two licensees of the same Georgia firm represent the buyer and the seller in one transaction. This is:","sub":"georgia/brreta|Designated agency","subtopic":"Designated agency","topic":"georgia/brreta"},{"answer":3,"choices":["The other designated agent in the firm","Any licensee in the firm","The other party's attorney","Their broker only"],"concept":"Confidentiality between designated agents","difficulty":1,"explain":"Designated agents may not disclose confidential client information except to their broker, and except for information BRRETA allows or requires to be disclosed. The two designated agents must not share confidences with each other.","id":"geo-574495cc","portion":"georgia","q":"A designated agent under BRRETA may share a client's confidential information with:","sub":"georgia/brreta|Designated agency","subtopic":"Designated agency","topic":"georgia/brreta"},{"answer":3,"choices":["All confidential information from each client","Nothing at all","Only the property's list price","All adverse material facts actually known to the dual agent"],"concept":"What a dual agent must and must not reveal","difficulty":1,"explain":"The dual agent discloses adverse material facts actually known, but NOT information a client has asked be kept confidential. Balancing these two rules is the practical difficulty of dual agency.","id":"geo-20064531","portion":"georgia","q":"A dual agent must disclose to both parties:","sub":"georgia/brreta|Dual agency","subtopic":"Dual agency","topic":"georgia/brreta"},{"answer":2,"choices":["The first showing","Delivery of a CMA","Any expiration date agreed to by the parties","The broker's request only"],"concept":"Duration of the engagement","difficulty":1,"explain":"It begins when the client engages the broker and runs until the agreed expiration date or another statutory ending event. An engagement with no ending date invites disputes.","id":"geo-c12a2b38","portion":"georgia","q":"A brokerage engagement under BRRETA terminates upon:","sub":"georgia/brreta|Engagement duration & termination","subtopic":"Engagement duration & termination","topic":"georgia/brreta"},{"answer":1,"choices":["Never","By the time of the brokerage engagement, though earlier is better practice","At the first contact, by statute","Only after an offer is made"],"concept":"Timing of the agency conversation","difficulty":1,"explain":"BRRETA does not require the discussion until the engagement, but the InfoBase urges doing it as early as possible so a customer never presumes they are represented.","id":"geo-19d6ea04","portion":"georgia","q":"Under BRRETA, when must a licensee discuss agency status with a prospect?","sub":"georgia/brreta|Creating the engagement","subtopic":"Creating the engagement","topic":"georgia/brreta"},{"answer":1,"choices":["The duty to negotiate the lowest price","Honesty, fairness, and disclosure of adverse material facts, plus ministerial acts","No duties whatsoever","Full fiduciary duties"],"concept":"Duties owed to customers","difficulty":1,"explain":"Customers get honesty and disclosure of adverse material facts the broker knows, and may receive ministerial assistance. They do not get advocacy, advice on price, or confidentiality.","id":"geo-30eea4d1","portion":"georgia","q":"A Georgia broker representing the seller shows a home to an unrepresented buyer. The broker owes that buyer:","sub":"georgia/brreta|Scope of duties under BRRETA","subtopic":"Scope of duties under BRRETA","topic":"georgia/brreta"},{"answer":1,"choices":["Unlimited and non-negotiable","Those set out in the chapter and specified in the brokerage engagement","Whatever the common law of agency provides","Determined by the MLS"],"concept":"Contractual scope of duties","difficulty":1,"explain":"BRRETA ties the broker's obligations to the statute plus the engagement, unless the parties expressly agree otherwise in a signed writing. This lets Georgia brokers define the scope of what they promise.","id":"geo-2053fa40","portion":"georgia","q":"Under BRRETA, the duties a broker owes a client are:","sub":"georgia/brreta|Scope of duties under BRRETA","subtopic":"Scope of duties under BRRETA","topic":"georgia/brreta"},{"answer":2,"choices":["Appraisal fraud","Fair housing violations","Accidental or unintended agency relationships with customers","Commission disputes between brokers"],"concept":"Purpose of BRRETA","difficulty":1,"explain":"Licensees treating customers like clients created implied agency and lawsuits from buyers who believed they were represented. BRRETA fixed this by requiring written engagements and defining each role.","id":"geo-1f5e67d3","portion":"georgia","q":"The main problem BRRETA was enacted to solve was:","sub":"georgia/brreta|Scope of duties under BRRETA","subtopic":"Scope of duties under BRRETA","topic":"georgia/brreta"},{"answer":1,"choices":["The earnest money is deposited","Acceptance is communicated to the offeror","The offer is signed by the buyer","The contract is recorded"],"concept":"Formation of the binding agreement","difficulty":1,"explain":"Georgia measures deadlines from the 'binding agreement date' -- the date acceptance is communicated back to the offeror. Signing alone does not bind; the other party must be notified.","id":"geo-de981917","portion":"georgia","q":"In Georgia, a real estate sales contract becomes binding when:","sub":"georgia/contracts|Binding agreement date","subtopic":"Binding agreement date","topic":"georgia/contracts"},{"answer":1,"choices":["Match the tax assessor's value","Identify the property with reasonable certainty","Impress the lender","Satisfy the MLS"],"concept":"Georgia description requirements","difficulty":1,"explain":"Georgia courts require a description that identifies the land or provides a 'key' leading to identification. A vague description can make the contract unenforceable for lack of definiteness.","id":"geo-6e4eee0f","portion":"georgia","q":"A Georgia real estate sales contract must contain a legal description sufficient to:","sub":"georgia/contracts|Georgia contract terms","subtopic":"Georgia contract terms","topic":"georgia/contracts"},{"answer":2,"choices":["Only an attorney, in every case","Only the closing attorney","A licensee may complete Commission-approved or standard preprinted forms","Any party, without limits"],"concept":"Unauthorized practice of law","difficulty":1,"explain":"Licensees may fill in the blanks on preprinted forms incident to a transaction they are handling. Drafting custom clauses or giving legal advice about them crosses into the unauthorized practice of law.","id":"geo-0ac85fcb","portion":"georgia","q":"Under Georgia law, who may draft a real estate sales contract?","sub":"georgia/contracts|Drafting limits & special stipulations","subtopic":"Drafting limits & special stipulations","topic":"georgia/contracts"},{"answer":0,"choices":["Controls over the preprinted language","Must be initialed by the broker","Is void","Requires GREC approval"],"concept":"Interpreting conflicting contract terms","difficulty":1,"explain":"Handwritten or typed additions reflect the parties' specific intent and prevail over standard preprinted terms. This is a general contract-construction rule the Georgia exam likes to test.","id":"geo-192e1d21","portion":"georgia","q":"A special stipulation in a Georgia contract that conflicts with the preprinted text generally:","sub":"georgia/contracts|Drafting limits & special stipulations","subtopic":"Drafting limits & special stipulations","topic":"georgia/contracts"},{"answer":3,"choices":["Redemption period","Right of first refusal","Option to renew","Due diligence period"],"concept":"Due diligence in Georgia contracts","difficulty":1,"explain":"During the due diligence period the buyer may inspect and, in most standard forms, terminate for any reason and recover the earnest money. After it expires, the buyer's exit rights narrow sharply.","id":"geo-173a374e","portion":"georgia","q":"The Georgia contract term giving a buyer a set number of days to inspect and terminate is commonly the:","sub":"georgia/contracts|Due diligence period","subtopic":"Due diligence period","topic":"georgia/contracts"},{"answer":1,"choices":["May not recover anything","Retains the earnest money as agreed damages","Receives three times the deposit","Must sue for specific performance first"],"concept":"Liquidated damages in Georgia","difficulty":1,"explain":"The earnest money serves as the agreed measure of damages. For the clause to be enforceable rather than a penalty, the amount must be a reasonable pre-estimate of loss, and damages must be hard to determine.","id":"geo-ec8637aa","portion":"georgia","q":"If a Georgia buyer defaults and the contract provides for liquidated damages, the seller typically:","sub":"georgia/contracts|Georgia contract terms","subtopic":"Georgia contract terms","topic":"georgia/contracts"},{"answer":3,"choices":["Be verbal to be enforceable","Be recorded with the clerk","Automatically renew","Be in writing with a definite expiration date"],"concept":"Listing agreement requirements","difficulty":1,"explain":"Georgia requires listings in writing with a definite ending date. Automatic renewal provisions are prohibited -- a licensee cannot roll a listing forward indefinitely.","id":"geo-cd17b130","portion":"georgia","q":"A Georgia listing agreement must:","sub":"georgia/contracts|Listing agreement rules","subtopic":"Listing agreement rules","topic":"georgia/contracts"},{"answer":2,"choices":["Enforceable for one year","Converted to an open listing","A violation of license law","Valid indefinitely"],"concept":"Definite termination dates","difficulty":1,"explain":"GREC requires a definite expiration date in brokerage engagements. Open-ended agreements are a disciplinary matter for the broker.","id":"geo-e6129ce9","portion":"georgia","q":"A Georgia brokerage engagement with no definite expiration date is:","sub":"georgia/contracts|Listing agreement rules","subtopic":"Listing agreement rules","topic":"georgia/contracts"},{"answer":3,"choices":["Only within 24 hours","Only with the seller's consent","Never once signed","Any time before acceptance is communicated"],"concept":"Revocation of an offer","difficulty":1,"explain":"An offer may be revoked any time before the offeror learns of acceptance. Once acceptance is communicated, a binding agreement exists and unilateral withdrawal becomes a breach.","id":"geo-c989f45c","portion":"geo ms","topic":"georgia/contracts"},{"answer":0,"choices":["A homicide or suicide","A failing septic system","Active termite infestation","A leaking underground tank"],"concept":"Stigmatized property in Georgia","difficulty":1,"explain":"Georgia expressly protects licensees from liability for not disclosing that a property was the site of a death, homicide, suicide, or felony. Physical CONDITION defects must always be disclosed.","id":"geo-f2f4db98","portion":"georgia","q":"Georgia law generally does NOT require disclosure that a property was the site of:","sub":"georgia/disclosures|Stigmatized property","subtopic":"Stigmatized property","topic":"georgia/disclosures"},{"answer":1,"choices":["Acted within BRRETA","Failed to disclose a known adverse material fact","Committed puffing","Properly protected client confidences"],"concept":"Adverse material facts","difficulty":1,"explain":"Confidentiality never shields a known physical defect. Under BRRETA a broker must disclose adverse material facts actually known, even to customers.","id":"geo-69f3f5e3","portion":"georgia","q":"A Georgia licensee who knows the basement floods but says nothing has:","sub":"georgia/disclosures|Adverse material facts","subtopic":"Adverse material facts","topic":"georgia/disclosures"},{"answer":1,"choices":["Only for new construction","No -- the duty covers adverse material facts actually known","Yes, a full inspection is required","Only if the buyer asks"],"concept":"No duty to discover","difficulty":1,"explain":"BRRETA limits the obligation to facts ACTUALLY KNOWN. Brokers are not inspectors; the buyer should retain one. But a licensee may not ignore what is plainly visible or make false statements.","id":"geo-3837ab1a","portion":"georgia","q":"Under BRRETA, does a Georgia broker have a duty to independently inspect the property for defects?","sub":"georgia/disclosures|Adverse material facts","subtopic":"Adverse material facts","topic":"georgia/disclosures"},{"answer":2,"choices":["1972","196 tatus. Disclosing it would be discriminatory under federal fair housing law, and Georgia does not require disclosure of stigma in any event.","id":"geo-7e79de81","portion":"georgia","q":"Disclosure that a former occupant had HIV/AIDS is:","sub":"georgia/disclosures|Specific required disclosures","subtopic":"Specific required disclosures","topic":"georgia/disclosures"},{"answer":0,"choices":["Defective septic system","Prior owner's bankruptcy","Ghost sighting","Neighbor dispute over politics"],"concept":"Material physical defects","difficulty":1,"explain":"Conditions affecting the property's value, safety, or use must be disclosed. Personal matters and stigma generally need not be.","id":"geo-04baa8d4","portion":"georgia","q":"A Georgia seller must disclose the presence of a known:","sub":"georgia/disclosures|Adverse material facts","subtopic":"Adverse material facts","topic":"georgia/disclosures"},{"answer":2,"choices":["Only to the broker","Verbally at closing","In writing in the contract or lease","Only if asked"],"concept":"Licensee-as-principal disclosure","difficulty":1,"explain":"Written disclosure of licensed status in the sales contract or lease is mandatory whenever a licensee buys, sells, or leases for their own account.","id":"geo-7363d396","portion":"georgia","q":"Georgia requires a licensee acting as a principal in a transaction to disclose their licensed status:","sub":"georgia/disclosures|Who discloses what","subtopic":"Who discloses what","topic":"georgia/disclosures"},{"answer":3,"choices":["Disclosed after closing","Only the lender's concern","Confidential","An adverse material fact requiring disclosure"],"concept":"Flood plain disclosure","difficulty":1,"explain":"Flood exposure affects value, insurability, and use, making it a material fact. It also drives the lender's flood insurance requirement.","id":"geo-e1078a45","portion":"georgia","q":"If a Georgia property is in a flood plain and the seller knows it, the fact is:","sub":"georgia/disclosur ter 30 days","Prohibited on residences"],"concept":"Georgia foreclosure procedure","difficulty":1,"explain":"The security deed's power of sale permits nonjudicial foreclosure: notice to the borrower and advertisement in the county legal organ, typically for four weeks, then a sale on the courthouse steps on the first Tuesday of the month.","id":"geo-006b47ea","portion":"georgia","q":"Foreclosure in Georgia is typically:","sub":"georgia/procedures|Security deeds & foreclosure","subtopic":"Security deeds & foreclosure","topic":"georgia/procedures"},{"answer":0,"choices":["20 years","30 years","7 years","10 years"],"concept":"Georgia adverse possession","difficulty":1,"explain":"20 years without color of title, or 7 years WITH color of title (a defective written instrument the possessor believes is valid). Both require open, notorious, continuous, hostile possession.","id":"geo-b42eb237","portion":"georgia","q":"The period for acquiring Georgia title by adverse possession without color of title is:","sub":"georgia/procedures|Georgia title & ownership rules","subtopic":"Georgia title & ownership rules","topic":"georgia/procedures"},{"answer":1,"choices":["Ownership by a partnership","Tenancy by the entirety","Joint tenancy with right of survivorship","Tenancy in common"],"concept":"Georgia co-ownership forms","difficulty":1,"explain":"Georgia abolished tenancy by the entirety. Married Georgians typically hold as joint tenants with right of survivorship or as tenants in common -- a classic national-vs-Georgia contrast question.","id":"geo-632572db","portion":"georgia","q":"Georgia does NOT recognize which form of co-ownership?","sub":"georgia/procedures|Georgia title & ownership rules","subtopic":"Georgia title & ownership rules","topic":"georgia/procedures"},{"answer":3,"choices":["Secretary of State's office","Department of Revenue","Probate court","Clerk of superior court in the county where the land lies"],"concept":"Where documents are recorded","difficulty":1,"explain":"Deeds, security deeds, and plats are recorded with the clerk of superior court in the county where the property is located, giving constructive notice to the world.","id":"geo-a4ada124","portion":"georgia","q":"Recording a deed in Georgia is done in the:","sub":"georgia/procedures|Transfer tax & recording","subtopic":"Transfer tax & recording","topic":"georgia/procedures"},{"answer":2,"choices":["Both buyer and seller equally","The real estate broker","The lender, unless otherwise agreed","The county"],"concept":"Who the closing attorney represents","difficulty":1,"explain":"The closing attorney customarily represents the LENDER. Buyers who want their own advocate must retain separate counsel -- a point licensees should make clear rather than implying the attorney represents the buyer.","id":"geo-ad2c8a8e","portion":"georgia","q":"In a Georgia transaction the closing attorney generally represents:","sub":"georgia/procedures|Attorney closings","subtopic":"Attorney closings","topic":"georgia/procedures"},{"answer":1,"choices":["Only after a court judgment","On January 1 of the tax year","At closing","When the bill is mailed"],"concept":"Georgia tax liens and prorations","difficulty":1,"explain":"The lien attaches as of January 1, which is why closings prorate taxes for the year and why unpaid taxes follow the property regardless of who owned it when they accrued.","id":"geo-7ae74454","portion":"georgia","q":"Georgia property taxes become a lien on real property:","sub":"georgia/procedures|Taxes & prorations","subtopic":"Taxes & prorations","topic":"georgia/procedures"},{"answer":3,"choices":["HUD-1 in all cases","Loan Estimate","Settlement affidavit","Closing Disclosure"],"concept":"TRID at the Georgia closing table","difficulty":1,"explain":"The Closing Disclosure must be received at least 3 business days before consummation. It replaced the HUD-1 for most consumer mortgage transactions in 2015.","id":"geo-cdaf025e","portion":"georgia","q":"The document a Georgia buyer receives showing final loan terms and closing figures is the:","sub":"georgia/procedures|Transfer tax & recording","subtopic":"Transfer tax & recording","topic":"georgia/procedures"},{"answer":3,"choices":["The lead paint rule","No law -- children may be excluded","Only local ordinance","The Fair Housing Act's familial status protection"],"concept":"Familial status","difficulty":1,"explain":"Familial status covers households with children under 18, pregnant persons, and those securing custody. The narrow exception is qualified housing for older persons (55+ or 62+).","id":"geo-b9eaa39f","portion":"georgia","q":"A Georgia landlord refuses to rent to a family with two young children. This violates:","sub":"georgia/fair-housing|Protected classes","subtopic":"Protected classes","topic":"georgia/fair-housing"},{"answer":0,"choices":["Steering","Good customer service","Blockbusting","Puffing"],"concept":"Steering","difficulty":1,"explain":"Directing buyers toward or away from areas based on a protected class is steering, even when the licensee believes they are being helpful. Provide objective information and let the buyer choose.","id":"geo-16882484","portion":"georgia","q":"A Georgia licensee tells a buyer 'you'd be more comfortable in a neighborhood on the south side.' This is:","sub":"georgia/fair-housing|Steering & blockbusting","subtopic":"Steering & blockbusting","topic":"georgia/fair-housing"},{"answer":2,"choices":["Redlining","A permitted market opinion","Blockbusting","Steering"],"concept":"Blockbusting (panic peddling)","difficulty":1,"explain":"Inducing sales by claiming a protected group's entry will harm the neighborhood is blockbusting. It is illegal whether or not the statements are true.","id":"geo-fa986fcf","portion":"georgia","q":"A licensee tells owners that property values will drop because a protected group is moving in, hoping to get listings. This is:","sub":"georgia/fair-housing|Steering & blockbusting","subtopic":"Steering & blockbusting","topic":"georgia/fair-housing"},{"answer":0,"choices":["Permit the reasonable modification at the tenant's expense","Terminate the lease","Pay for and install it","Refuse if the lease bars changes"],"concept":"Modification vs. accommodation","difficulty":1,"explain":"Physical MODIFICATIONS are permitted at the tenant's expense, with possible restoration on move-out. Policy ACCOMMODATIONS, like waiving a no-pets rule for a service animal, are at the landlord's expense.","id":"geo-42db70a4","portion":"georgia","q":"A tenant with a disability asks to install a grab bar. Under fair housing law the landlord must:","sub":"georgia/fair-housing|Accommodations & modifications","subtopic":"Accommodations & modifications","topic":"georgia/fair-housing"},{"answer":2,"choices":["Religion","National origin","Marital status","Familial status"],"concept":"The seven federal protected classes","difficulty":1,"explain":"Race, color, religion, sex, national origin, familial status, and handicap. Marital status is protected by ECOA in LENDING and by some local ordinances, but is not one of the seven federal housing classes.","id":"geo-0379ccf7","portion":"georgia","q":"Which is NOT a protected class under the federal Fair Housing Act?","sub":"georgia/fair-housing|Protected classes","subtopic":"Protected classes","topic":"georgia/fair-housing"},{"answer":1,"choices":["GREC only","HUD, and GREC may also discipline the licensee","The MLS","The county tax office"],"concept":"Enforcement channels","difficulty":1,"explain":"HUD handles federal fair housing complaints (generally within one year), and a licensee's conduct can independently cost them their license through GREC discipline.","id":"geo-45081387","portion":"georgia","q":"A complaint of housing discrimination in Georgia may be filed with:","sub":"georgia/fair-housing|Unlawful instructions & enforcement","subtopic":"Unlawful instructions & enforcement","topic":"georgia/fair-housing"},{"answer":0,"choices":["Refuse and, if the seller persists, withdraw from the engagement","Refer the seller to another licensee","Comply, since the seller is the client","Comply but document it"],"concept":"Unlawful client instructions","difficulty":1,"explain":"The duty of obedience covers LAWFUL instructions only. Following the instruction makes the licensee personally liable, and referring the seller to a colleague simply spreads the violation.","id":"geo-f039cc11","portion":"georgia","q":"A seller instructs a Georgia licensee to reject offers from a particular ethnic group. The licensee should:","sub":"georgia/fair-housing|Unlawful instructions & enforcement","subtopic":"Unlawful instructions & enforcement","topic":"georgia/fair-housing"},{"answer":1,"choices":["Always a federal fair housing violation","Not a federal violation, though it may violate local law and can show disparate impact","Required by HUD","Permitted only for houses"],"concept":"Source of income and fair housing","difficulty":1,"explain":"Source of income is not one of the seven federal classes, so the phrase is not automatically a federal violation. Some Georgia local ordinances do protect it, and a blanket policy can still create disparate-impact exposure.","id":"geo-89d9e927","portion":"georgia","q":"An advertisement for a Georgia rental reading 'no Section 8' is:","sub":"georgia/fair-housing|Protected classes","subtopic":"Protected classes","topic":"georgia/fair-housing"},{"answer":3,"choices":["Converts automatically to inactive","Is fine if the licensee took CE instead","Renews normally at the four-year mark","Lapses -- the 25-hour course was due within the first year"],"concept":"The postlicense deadline is absolute","difficulty":2,"explain":"The 25-hour Sales Post-license Course is due within ONE year of original licensure and applies whether active or inactive, resident or nonresident. CE does not substitute for it. Missing the deadline costs the license.","id":"geo-d0f34702","portion":"georgia","q":"A Georgia salesperson licensed 14 months ago never took the postlicense course. The licensee's status is that the license:","sub":"georgia/license-law|Education requirements","subtopic":"Education requirements","topic":"georgia/license-law"},{"answer":1,"choices":["Award treble damages","Revoke or suspend the license, fine, and require education or accountant reports","Order the licensee to repay the $18,000","Garnish the licensee's commissions"],"concept":"GREC cannot order restitution","difficulty":2,"explain":"GREC's powers are reprimand, suspension, revocation, fines, required education, and required CPA reports on trust accounts. It has NO authority to compel repayment of a financial loss -- the consumer must sue civilly, and should not wait for the investigation to finish.","id":"geo-bd43e39c","portion":"georgia","q":"A consumer loses $18,000 because of a Georgia licensee's mishandling of funds and files a GREC complaint. The most GREC itself can do is:","sub":"georgia/license-law|GREC discipline & sanctions","subtopic":"GREC discipline & sanctions","topic":"georgia/license-law"},{"answer":2,"choices":["Must have five continuous years","Must first hold a Georgia salesperson license for three years","Satisfies the requirement, with a certified license history from Florida","Cannot qualify, since out-of-state experience does not count"],"concept":"Out-of-state experience counts in Georgia","difficulty":2,"explain":"Georgia requires three of the five years immediately preceding application in ACTIVE status, and active licensure in another state qualifies. The applicant must obtain a certified copy of license history and education from every state where they have held a license.","id":"geo-b5b7dcf6","portion":"georgia","q":"An applicant held an active Florida broker's license for four of the last five years and now applies for a Georgia broker's license. Regarding experience, the applicant:","sub":"georgia/license-law|Licensure & experience","subtopic":"Licensure & experience","topic":"georgia/license-law"},{"answer":2,"choices":["Needs a separate property management license","Must transfer the property to the brokerage","Must disclose licensed status in writing in the lease and use a broker-approved trust account","May act as an ordinary owner, since owners are exempt from licensure"],"concept":"Exceptions to licensure never apply to a licensee","difficulty":2,"explain":"O.C.G.A. 43-40-29(c) provides that none of the exceptions to licensure applies to a person who holds a license. Selling or leasing your own property means written disclosure of licensed status and placing any trust funds in an account approved by your broker.","id":"geo-48593a94","portion":"georgia","q":"A Georgia licensee owns a rental duplex personally and advertises it for lease. The licensee:","sub":"georgia/license-law|Licensee as principal","subtopic":"Licensee as principal","topic":"georgia/license-law"},{"answer":2,"choices":["A new hearing is scheduled","An automatic appeal to superior court","The decision became final after 30 days","The decision is void for lack of a hearing before the Commission"],"concept":"The 30-day window after an ALJ decision","difficulty":2,"explain":"If the respondent does not ask the Commission to review within 30 days of the ALJ's decision, it becomes final. The Commission also has 30 days to request review if IT disagrees. After that, the route is an appeal to the courts.","id":"geo-3996bce3","portion":"georgia","q":"An ALJ rules against a Georgia licensee. The licensee disagrees and does nothing for 35 days. The result is:","sub":"georgia/license-law|Investigations & hearings","subtopic":"Investigations & hearings","topic":"georgia/license-law"},{"answer":2,"choices":["Only if a consumer complains","Limited to a fine against the firm","Potential discipline for failure to supervise, in addition to the salesperson's violation","None, since the salesperson acted alone"],"concept":"Failure to supervise is its own violation","difficulty":2,"explain":"The qualifying broker answers to GREC for the firm's compliance, and inadequate supervision is an independent charge. GREC can act on its own motion, so a consumer complaint is not a prerequisite.","id":"geo-9534fcbc","portion":"georgia","q":"A qualifying broker discovers an affiliated salesperson has been advertising without naming the firm. The broker's exposure is:","sub":"georgia/license-law|Broker supervision & the firm","subtopic":"Broker supervision & the firm","topic":"georgia/license-law"},{"answer":0,"choices":["Violated the reporting requirement, often punished more harshly than the underlying offense","Acted properly, since disclosure occurs at renewal","An obligation only to notify the broker","No obligation, as the crime was unrelated"],"concept":"Reporting convictions to GREC","difficulty":2,"explain":"Convictions must be reported to the Commission, not saved for renewal. GREC treats concealment as a separate and often more serious matter than the conviction itself, because it goes to honesty and trustworthiness.","id":"geo-a3d94b59","portion":"georgia","q":"A licensee is convicted of a felony unrelated to real estate and does not report it, believing renewal is two years away. The licensee has:","sub":"georgia/license-law|GREC discipline & sanctions","subtopic":"GREC discipline & sanctions","topic":"georgia/license-law"},{"answer":0,"choices":["Has satisfied the requirement","Must complete 6 hours per year regardless","Must complete 36 hours total","Must complete 24 more hours"],"concept":"Georgia CE is per renewal period, not per year","difficulty":2,"explain":"The requirement is at least 24 hours of GREC-approved CE during each FOUR-YEAR renewal period. There is no annual minimum. National guides quoting 36 hours are describing a different state.","id":"geo-9ba56f68","portion":"georgia","q":"A Georgia licensee with license number above 100,000 completed 24 hours of CE in the first year of a four-year renewal period and none after. At renewal the licensee:","sub":"georgia/license-law|Education requirements","subtopic":"Education requirements","topic":"georgia/license-law"},{"answer":0,"choices":["Has no agency relationship, since BRRETA requires written authority, but has acted well outside the customer role","Is a dual agent","Is the buyer's agent by implication","Is a subagent of the seller automatically"],"concept":"Written engagement is required -- but conduct still matters","difficulty":2,"explain":"BRRETA defines agency as representation 'by the latter's WRITTEN authority,' so no engagement means no agency. That is exactly why the statute exists. But behaving like an agent invites a claim and confusion, which is why the InfoBase urges clarifying status early.","id":"geo-84542fba","portion":"georgia","q":"A Georgia buyer works with a licensee for weeks, and the licensee gives advice on price and negotiation. No written agreement is ever signed. Under BRRETA the licensee:","sub":"georgia/brreta|Creating the engagement","subtopic":"Creating the engagement","topic":"georgia/brreta"},{"answer":1,"choices":["Withdraw from the transaction","Keep it confidential -- a dual agent discloses adverse material facts, not information a client asked be kept confidential","Disclose it only if the buyer asks directly","Disclose the seller's bottom line, since dual agents disclose everything"],"concept":"The dual agent's two competing rules","difficulty":2,"explain":"A dual agent must disclose adverse MATERIAL FACTS actually known, but expressly not information made confidential by a client's request. A negotiating position is confidential, not a material fact. Balancing these is the practical difficulty of dual agency.","id":"geo-1a3c41df","portion":"georgia","q":"A Georgia seller asks her broker to keep confidential that she will accept $20,000 less. The broker later serves as a DUAL agent for both sides. The broker must:","sub":"georgia/brreta|Dual agency","subtopic":"Dual agency","topic":"georgia/brreta"},{"answer":0,"choices":["Becomes a dual agent and must stay neutral","Must withdraw from the transaction","Represents whichever client signed first","Has no role, since the designated agents replace the broker"],"concept":"Designated agency does not eliminate the broker's position","difficulty":2,"explain":"The two designated agents each represent only their own client and may not share confidences except with the broker. The broker, standing above both, occupies a dual-agent position and must remain neutral -- which is why the broker is the one person who receives both sides' confidences.","id":"geo-fa8caffa","portion":"georgia","q":"A Georgia broker assigns one licensee to the buyer and another to the seller in the same deal, with written consent. The BROKER personally:","sub":"georgia/brreta|Designated agency","subtopic":"Designated agency","topic":"georgia/brreta"},{"answer":0,"choices":["Still represents only the buyer -- compensation does not create agency","Becomes the seller's agent or subagent","Must disclose the payment as a conflict","Becomes a dual agent"],"concept":"Compensation and agency are independent under BRRETA","difficulty":2,"explain":"BRRETA is explicit that paying compensation does not by itself create a brokerage engagement; only an express written agreement does. This is heavily tested because the intuition runs the other way.","id":"geo-898fed27","portion":"georgia","q":"In a Georgia transaction the seller pays the buyer-broker's commission out of closing proceeds. This means the buyer-broker:","sub":"georgia/brreta|Creating the engagement","subtopic":"Creating the engagement","topic":"georgia/brreta"},{"answer":2,"choices":["Disclose the identity of those buyers","Obtain the other buyers' written consent","Advise of agency types available, known conflicting relationships, compensation and sharing, and confidentiality duties -- but need not reveal that other buyers are represented","Decline the new engagement"],"concept":"The four BRRETA pre-engagement disclosures and their limit","difficulty":2,"explain":"BRRETA lists four disclosures and then expressly EXCLUDES having to reveal that the broker represents other buyers or sellers in similar transactions. Competing clients are normal; naming them would breach confidentiality.","id":"geo-eeeacbae","portion":"georgia","q":"Before entering a brokerage engagement, a Georgia broker who already represents three other buyers looking in the same neighborhood must:","sub":"georgia/brreta|Required disclosures","subtopic":"Required disclosures","topic":"georgia/brreta"},{"answer":3,"choices":["Only the Commission can decide the claim","The client waived all duties by signing","Fiduciary duties never apply to brokers anywhere","BRRETA provides a broker is not deemed a fiduciary and owes reasonable care in the duties the statute and engagement specify"],"concept":"BRRETA narrowed broker liability","difficulty":2,"explain":"BRRETA states a broker 'shall not be deemed to have a fiduciary relationship with any party' and is responsible for exercising reasonable care in its specified duties. That statutory narrowing -- unless the parties agree otherwise in a signed writing -- is the heart of the Act.","id":"geo-2fac4f13","portion":"georgia","q":"A Georgia client sues a broker for breach of fiduciary duty, citing common-law agency standards. Under BRRETA the broker's best position is that:","sub":"georgia/brreta|Scope of duties under BRRETA","subtopic":"Scope of duties under BRRETA","topic":"georgia/brreta"},{"answer":3,"choices":["Automatically one year","Valid until either party cancels","Valid for commercial property only","A license law violation -- a definite date is required"],"concept":"Definite termination dates","difficulty":2,"explain":"GREC requires a definite expiration date in brokerage engagements, and automatic renewal clauses are prohibited. An open-ended agreement is a disciplinary matter for the broker, independent of whether the client is happy.","id":"geo-47fed133",
