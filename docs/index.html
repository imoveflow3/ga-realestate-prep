d in arrears, so they normally produce a seller debit."],"label":"Closing & settlement math","portion":"comprehensive","sections":[{"check":[{"answer":0,"choices":["Buyer debit, seller credit","Buyer credit, seller debit","A debit to both"],"q":"The sale price appears as:","why":"Everything else adjusts around this line."},{"answer":0,"choices":["Buyer credit","Buyer debit","Seller credit"],"q":"The new loan is a:","why":"The lender's money reduces what the buyer owes."}],"h":"The anchor entries","l":["SALE PRICE - buyer DEBIT, seller CREDIT. The largest line, and everything else adjusts around it.","NEW LOAN - buyer CREDIT (the lender's money pays part of what the buyer owes).","EARNEST MONEY already on deposit - buyer CREDIT (already paid).","SELLER'S LOAN PAYOFF - seller DEBIT (comes out of the seller's proceeds).","COMMISSION - normally a seller DEBIT.","Georgia TRANSFER TAX - customarily a seller DEBIT, $1.00 per $1,000.","Recording the deed, loan charges, origination - normally buyer DEBITS."]},{"check":[{"answer":0,"choices":["Seller debit and buyer credit","Seller credit and buyer debit","No entry"],"q":"Rent collected in advance by the seller produces a:","why":"The seller is holding cash belonging to the buyer."},{"answer":0,"choices":["Seller credit and buyer debit","Seller debit and buyer credit","No entry"],"q":"Prepaid insurance the buyer will benefit from produces a:","why":"The seller is reimbursed - opposite to rent."}],"h":"The one question that settles every proration","l":["UNPAID taxes (arrears) - the seller owes for their time but the buyer will pay the whole bill later: SELLER DEBIT / BUYER CREDIT.","PREPAID taxes or insurance - the seller paid for time the buyer will enjoy: SELLER CREDIT / BUYER DEBIT.","RENT collected in advance - the seller is holding the buyer's share: SELLER DEBIT / BUYER CREDIT. Rent runs OPPOSITE to prepaid taxes, because the money is cash in the seller's hand rather than a benefit already consumed.","SECURITY DEPOSITS - belong to the tenant; the buyer inherits the obligation: SELLER DEBIT / BUYER CREDIT. The tenant is not paid at closing.","ACCRUED INTEREST on an assumed loan - interest is paid in arrears, so the seller used the money but has not paid: SELLER DEBIT / BUYER CREDIT."],"p":["Ask: who currently HAS the money, and who will get the BENEFIT? Whoever holds money belonging to the other side is DEBITED."]},{"check":[{"answer":0,"choices":["Debits minus credits","Price minus loan","Price plus costs"],"q":"Cash to close equals:","why":"Credits include the loan and earnest money already paid."}],"h":"Cash to close and seller's net","l":["Buyer's cash to close = (price + buyer costs) - (loan + earnest money + buyer credits)","Seller's net = price - payoff - commission - seller costs, adjusted for prorations"]},{"check":[{"answer":0,"choices":["360 days","365 days","366 days"],"q":"The banker's year used for prorations has:","why":"Twelve 30-day months, unless told otherwise."}],"h":"Mechanics","l":["Daily rate = annual amount / 360 (banker's year) unless told otherwise.","Seller owns through the day BEFORE closing; buyer owns closing day forward.","Origination and points are a percentage of the LOAN, not the price."]}],"summary":"A settlement statement is two columns per party. A DEBIT is what you owe; a CREDIT reduces what you owe. Get the DIRECTION right and the arithmetic is easy; get it backwards and every number is wrong.","topic":"comp/closing-math","traps":["Rent and prepaid taxes move in OPPOSITE directions. Ask who holds the cash.","Security deposits transfer to the buyer, not back to the tenant.","Origination and points are on the LOAN; commission and transfer tax are on the PRICE."],"vocab":[["Debit","An amount a party owes at closing."],["Credit","An amount reducing what a party owes."],["Proration","Dividing a shared expense between the parties by time."],["Arrears","Paid after the period it covers, like Georgia property taxes."],["Prepaid","Paid before the period it covers, like an annual insurance premium."],["Cash to close","What the buyer must bring to the closing table."],["Seller's net proceeds","What the seller walks away with after all debits."],["Closing Disclosure","The TRID form due three business days before consummation."]]},"comp/grec-deep":{"blurb":"The license-law detail the state portion leans on hardest.","counts_on_exam":false,"exam_questions":10,"examples":[{"k":"Association arbitration or civil court. GREC will not adjudicate it.","s":"Two brokers each claim they were the procuring cause of a sale and ask GREC to decide.","t":"Who decides a commission dispute?","w":["GREC administers the licence law and disciplines licensees.","It has no power to order anyone to pay money.","Procuring cause is a private money dispute."]}],"ga":[],"label":"GREC law deep-dive","portion":"comprehensive","sections":[{"check":[{"answer":0,"choices":["75 hours, 25 hours, 24 per four years","25, 75, 36","60, 25, 24 per year"],"q":"Put in order: prelicense, postlicense, CE:","why":"The 75 and 25 are frequently transposed."}],"h":"The education ladder in order","l":["75-hour prelicense course (salesperson)","Pass the exam; activate at 18","25-hour Sales Post-license Course within ONE YEAR of original licensure","24 hours of CE per FOUR-YEAR renewal period thereafter","Broker: age 21, 60-hour broker course, and an active licence for 3 of the past 5 years"]},{"check":[{"answer":0,"choices":["Bank-designated and registered with GREC","Interest-bearing","Held at a Georgia bank"],"q":"Every trust account must be:","why":"A nonresident broker may keep one at home if GREC may examine it."}],"h":"Trust account mechanics","l":["Separate, federally insured CHECKING account, designated by the BANK as trust or escrow, REGISTERED with GREC, with the broker holding SIGNATORY POWER.","Opened under an EIN, not the broker's SSN.","At least one account; more are allowed if each is designated and registered.","Written notice to GREC on Commission forms when the bank, account name or number changes, the bank renames, or the account closes.","GREC may examine on reasonable request; it MAY accept a CPA compliance certification instead, at its discretion.","An affiliate permitted to hold an account for their own rentals: registered by the broker, the broker stays responsible, and at least QUARTERLY written reconciliations."]},{"check":[{"answer":0,"choices":["Agreed findings, conclusions and a sanction","Only a fine","Consumer restitution"],"q":"A GREC consent settlement includes:","why":"No hearing is held."}],"h":"What the Commission does","l":["Members appointed by the GOVERNOR","Administers the licence law, promulgates rules, investigates, disciplines","Investigation may start on ANYONE'S sworn written request or on the Commission's OWN MOTION","Consent settlement = agreed findings of fact, conclusions of law, and sanction, with no hearing","Formal hearings are conducted by an ALJ from the Office of State Administrative Hearings; 30 days to seek Commission review","Sanctions: reprimand, suspension, revocation, fine, required education, required accountant reports"]},{"check":[{"answer":0,"choices":["Resolve a commission dispute between brokers","Revoke a licence","Investigate on its own motion"],"q":"GREC will not:","why":"Those go to arbitration or the courts."}],"h":"What the Commission does NOT do","l":["It cannot order RESTITUTION or compel repayment of a consumer's loss","It does not resolve COMMISSION DISPUTES between brokers - arbitration or courts","Its staff cannot interpret the law for you; that is legal advice"]},{"check":[{"answer":0,"choices":["Immediately designates a replacement","Appeals the suspension","Ceases activity for 30 days"],"q":"A suspended qualifying broker's corporation may continue if it:","why":"Otherwise all affiliated licences are suspended too."}],"h":"Firm operations","l":["A salesperson may be paid ONLY by their affiliated broker","Advertising must identify the firm","Net listings permitted only under strict disclosure","A suspended qualifying broker's corporation or LLC may continue if it IMMEDIATELY designates a replacement","Nonresidents meet the same requirements and affiliate with a GREC-licensed broker","Inactive licensees still pay fees and still owe postlicense education"]}],"summary":"The detail-level Georgia licence law that the state portion leans on hardest: the education ladder, trust account mechanics, and exactly what the Commission does and does not have power to do.","topic":"comp/grec-deep","traps":["24 hours CE per four years, not 36 and not annual.","GREC has no restitution power.","The Commission MAY accept a CPA report - discretionary, not a right."],"vocab":[["Qualifying broker","The broker answerable to GREC for the firm."],["Consent settlement","Agreed findings and sanction without a hearing."],["OSAH","Office of State Administrative Hearings, which supplies the ALJ."],["Reconciliation statement","A comparison of trust liability to the bank balance."],["Signatory power","The broker's required authority over the trust account."]]},"comp/situational":{"blurb":"You are the licensee -- what do you actually do?","counts_on_exam":false,"exam_questions":12,"examples":[{"k":"Explain it must be disclosed. If the seller refuses, withdraw from the engagement.","s":"The seller tells you the HVAC failed last winter and was patched, then says 'don't put that on the disclosure.'","t":"The seller wants it off the form","w":["A failed major system is a material fact.","You never complete or alter the seller's form.","You also cannot market the property knowing the disclosure is false."]},{"k":"Do nothing with the money until a court or the agreed process decides.","s":"A closing fails. Buyer and seller each demand the $10,000 earnest money.","t":"Two people want the same deposit","w":["The broker is a stakeholder, not a judge.","Releasing to either side, splitting it, or keeping it all invite a conversion claim.","Hold the funds and use interpleader or the prescribed procedure."]}],"ga":["In Georgia, trust funds must be deposited PROMPTLY unless ALL parties give written authority otherwise - the buyer's request alone is never enough.","Georgia protects nondisclosure of a death on the property, but never an outright denial."],"label":"Situational judgment","portion":"comprehensive","sections":[{"check":[{"answer":0,"choices":["Refuse, and withdraw if they persist","Comply but document it","Pass them to a colleague"],"q":"A client asks you to do something unlawful. You:","why":"Referring relocates the violation."},{"answer":0,"choices":["Disclose it","Keep it confidential for your client","Disclose only if asked"],"q":"You know a material fact about the property. You:","why":"Confidentiality never covers a defect."}],"h":"The decision framework","l":["1. Is anyone asking me to break the law or a fair housing rule? Refuse, and withdraw if they persist. Referring them to a colleague relocates the violation.","2. Do I know a MATERIAL FACT about the property? Disclose it. Confidentiality never covers a defect.","3. Am I about to state something I know is untrue? Decline instead. Declining is not deceit; inventing an answer is.","4. Is this money that belongs to someone else? Into the trust account promptly, and never choose between competing claimants.","5. Is this person a client or a customer? Clients get advice and advocacy; customers get honesty and material-defect disclosure.","6. Do I have a personal interest? Disclose it in writing before the offer is considered."]},{"check":[{"answer":0,"choices":["Loan fraud if concealed from the lender","A normal decorating allowance","Acceptable if both parties agree"],"q":"A buyer wants the price inflated with cash back at closing. This is:","why":"The licensee who writes it participates."},{"answer":0,"choices":["Raise it before anyone signs","Mention it afterward","Defer to the closing attorney"],"q":"You spot an error on the settlement statement. You:","why":"Post-closing corrections are far harder."}],"h":"Situations that recur","l":["A client gives a discriminatory instruction - refuse; withdraw if they persist.","A seller says 'leave it off the disclosure' - explain it must be disclosed; if they refuse, end the engagement. Never complete the form for them.","A buyer asks you to inflate the price with cash back at closing - that is loan fraud if concealed from the lender. Refuse.","You spot an error on the settlement statement - raise it BEFORE anyone signs.","You realise after closing that you miscalculated and your client overpaid - tell them; the duty to account survives closing.","An unrepresented buyer asks 'should I offer less?' - clarify that you represent the seller and suggest they get their own representation.","A colleague's licence has expired and they want cover - refuse and tell your broker; unlicensed activity is charged against the firm too.","A buyer waives inspection - document your recommendation in writing and still disclose what you observe.","You are paid a referral fee by an inspector - disclose it, or better, offer several names and take no fee. In a federally related mortgage transaction a referral fee for settlement services violates RESPA outright."]},{"check":[{"answer":0,"choices":["May share it - it is public record","Must refuse","Need consent"],"q":"A past client asks the neighbour's recorded sale price. You:","why":"Confidentiality covers motivation and position, not public facts."}],"h":"What confidentiality actually covers","p":["It covers your client's motivation, finances, and negotiating position. It does NOT cover material defects, and it does not cover facts already in the public record - a closed sale price is public, and refusing to state it is unhelpfulness, not duty."]}],"summary":"These give you a scene and ask what you actually do. Four principles resolve almost all of them: never lie, never conceal a known defect, never act on an unlawful instruction, and never pick a side with money you are holding in trust.","topic":"comp/situational","traps":["Referring a discriminating client to a colleague is not a solution.","'I didn't say anything untrue' is no defence to concealing a known defect.","Uniform application does not save a policy that is itself unlawful."],"vocab":[["Material fact","Anything affecting value, desirability, or the decision to buy."],["Fraudulent concealment","Actively hiding a known material defect."],["Conflict of interest","A personal stake that could compromise your duty to a client."],["Interpleader","Depositing disputed funds with a court to decide."],["RESPA Section 8","Bans anything of value for referring settlement business."],["Ministerial act","A clerical, non-discretionary service for a customer."]]},"comp/vocabulary":{"blurb":"The terms both portions assume you already know.","counts_on_exam":false,"exam_questions":12,"examples":[{"k":"Encumbrance. If the stem had said 'a fence built two feet over the line', the answer would narrow to encroachment.","s":"'A charge or claim against property that does not prevent transfer but travels with it.'","t":"Reading a definition question backwards","w":["'Travels with it' points to something running with the land.","'Does not prevent transfer' rules out anything blocking conveyance.","That is the general category, not the specific physical case."]}],"ga":["Georgia edition of the loan documents: the NOTE is the promise, the SECURITY DEED is the pledge - not a mortgage and not a deed of trust."],"label":"Vocabulary & terminology","portion":"comprehensive","sections":[{"check":[{"answer":0,"choices":["Encroachment","Encumbrance","Easement in gross"],"q":"Which is a physical intrusion onto another's land?","why":"Every encroachment is an encumbrance; not every encumbrance is physical."},{"answer":0,"choices":["Mortgagor","Mortgagee","Neither"],"q":"In 'mortgagor' and 'mortgagee', the borrower is the:","why":"The '-or' gives, the '-ee' receives."}],"h":"Pairs that get swapped","l":["Encumbrance / encroachment - any claim on the fee / a physical intrusion. Every encroachment is an encumbrance; not every encumbrance is physical.","Mortgagor / mortgagee - borrower / lender. The '-or' gives, the '-ee' receives. Same for lessor/lessee, vendor/vendee, optionor/optionee, grantor/grantee.","Acceleration / alienation - due on DEFAULT / due on TRANSFER.","Subrogation / subordination / substitution / satisfaction - stepping into another's claim / lowering lien priority / an equal alternative / recorded proof of payoff.","Assemblage / plottage - the ACT of combining parcels / the added VALUE that results.","Progression / regression - pulled up by better neighbours / dragged down by worse.","Accretion / erosion / avulsion / reliction - gradual gain / gradual loss / sudden change (boundaries do NOT move) / land exposed by receding water.","Executed / executory - fully performed / signed but not yet performed.","Void / voidable - never a contract / valid until the protected party disaffirms.","Latent / patent - hidden / obvious.","Riparian / littoral - flowing water / still water.","Fixture / trade fixture - conveys with the realty / stays the commercial tenant's.","Security deposit / prepaid rent - held in trust for the tenant / earned by the landlord.","Equitable / statutory right of redemption - before the sale / after the sale."]},{"check":[{"answer":0,"choices":["Market value","Market price","Cost"],"q":"An opinion of the most probable price is:","why":"Price is what it actually sold for."}],"h":"The value words","l":["Market value - an OPINION of most probable price.","Market price - the FACT of what it sold for.","Cost - what it took to build.","Assessed value - the tax base.","Insurable value - improvements only."]},{"check":[{"answer":0,"choices":["Debt service, giving cash flow","Vacancy loss","Operating expenses"],"q":"What comes immediately after net operating income?","why":"Debt service is never an operating expense."}],"h":"The income statement in order","l":["Potential gross income","- vacancy and collection loss = EFFECTIVE GROSS INCOME","- operating expenses = NET OPERATING INCOME","- debt service = CASH FLOW","Debt service is never an operating expense."]},{"check":[{"answer":0,"choices":["General, involuntary, statutory","Specific and voluntary","Specific and equitable"],"q":"A judgment lien is:","why":"A mortgage is specific and voluntary."}],"h":"Lien classifications are three independent axes","l":["General (all property) vs. SPECIFIC (one parcel)","Voluntary (you agreed) vs. INVOLUNTARY (imposed)","Statutory (created by law) vs. EQUITABLE (created by fairness)","A judgment lien is general, involuntary, statutory. A mortgage is specific and voluntary. A question can test any axis."]},{"check":[{"answer":0,"choices":["Periodic estate","Estate for years","Estate at sufferance"],"q":"Which renews automatically until notice?","why":"An estate for years ends on its own with no notice."}],"h":"The four leasehold estates","l":["Estate for years - fixed start and end, no notice needed","Periodic - renews until notice","At will - endable at either party's pleasure","At sufferance - holdover with no right"]},{"check":[{"answer":0,"choices":["Delivery and acceptance","Acknowledgment","Recording"],"q":"Which step actually passes title?","why":"Notarisation is for recording; recording is for notice."}],"h":"Deed vocabulary in sequence","l":["Execution (signing) -> Acknowledgment (notary, needed to RECORD) -> DELIVERY AND ACCEPTANCE (what passes title) -> Recording (constructive notice, priority)"]},{"check":[{"answer":0,"choices":["Police power","Eminent domain","Escheat"],"q":"Which power regulates without paying?","why":"Only eminent domain requires just compensation."}],"h":"The four public powers","l":["Police power - regulate, no payment","Eminent domain - take, with just compensation","Taxation","Escheat - to the state when there is no will and no heir"]}],"summary":"Most missed questions are missed on a word, not a concept. These are the pairs the exam deliberately puts next to each other. Learn them as PAIRS - the distinction is what is being tested, not either term alone.","topic":"comp/vocabulary","traps":["'-or' gives, '-ee' receives. Apply it to every pair.","Executed means fully PERFORMED in exam language, not merely signed.","Avulsion is sudden and does not move boundaries."],"vocab":[["Encumbrance","Any claim, lien, easement, or restriction limiting the fee."],["Encroachment","A physical intrusion onto another's land."],["Subrogation","One party stepping into another's legal claim, typical of insurers."],["Subordination","Voluntarily lowering a lien's priority."],["Satisfaction","The recorded document proving a debt is paid."],["Assemblage","Combining adjacent parcels."],["Plottage","The added value created by assemblage."],["Alluvion","The soil deposited by accretion."],["Reliction","Land exposed by permanently receding water."],["Procuring cause","The unbroken effort that produced a ready, willing and able buyer."],["Equitable right of redemption","The right to cure default BEFORE the foreclosure sale."],["Statutory right of redemption","A post-sale right to reclaim, where a state grants one."],["Emblements","Annual crops; the tenant-farmer's personal property."],["Chattel","Personal property."],["Novation","Substituting a party and releasing the original."],["Reformation","Court correction of a document to match true intent."],["Lis pendens","Recorded notice of pending litigation."],["Escheat","Property passing to the state for want of a will or heirs."]]},"georgia/brreta":{"blurb":"Georgia agency law, engagements, dual and designated agency.","counts_on_exam":true,"exam_questions":10,"examples":[{"k":"Legally no agency - which is exactly why the statute exists. Practically, this is the situation that invites a lawsuit, so clarify status early.","s":"A buyer works with a licensee for weeks. The licensee advises on price and negotiation. Nothing is ever signed.","t":"Weeks of help, no agency","w":["BRRETA defines agency as representation by WRITTEN authority.","With no brokerage engagement there is no agency relationship.","But the licensee has behaved far outside the customer role."]},{"k":"This is a real Georgia difference. In many states the same facts would create firm-wide dual agency.","s":"A broker assigns one licensee to the buyer and another to the seller in the same deal.","t":"Designated agency is not dual agency","w":["Each designated agent owes their own client the full statutory duties.","10-6A-13(b) says neither the broker, the licensees, nor the firm is a dual agent.","10-6A-13(c) removes imputed knowledge between them."]},{"k":"Keep it confidential. Hinting is the same disclosure by another route.","s":"A seller privately tells her broker she will take $20,000 less. The broker is a dual agent and the buyer asks about flexibility.","t":"The dual agent's bind","w":["A dual agent must disclose adverse material FACTS actually known.","A negotiating position is not a material fact; it is confidential.","The client asked that it be kept confidential."]}],"ga":[],"label":"Brokerage relationships (BRRETA)","portion":"georgia","sections":[{"check":[{"answer":0,"choices":["Written authority","A verbal agreement","Payment of a commission"],"q":"Under BRRETA, agency requires:","why":"The brokerage engagement is a written contract."},{"answer":0,"choices":["Customer","Client","Principal"],"q":"A person NOT represented, for whom you may perform ministerial acts, is a:","why":"Ministerial acts require no discretion."}],"h":"The core definitions","l":["AGENCY - every relationship in which a broker acts for or represents another as a CLIENT by that person's WRITTEN authority.","BROKERAGE ENGAGEMENT - the written contract by which a seller, buyer, landlord or tenant becomes the broker's client.","CLIENT - a person represented under a brokerage engagement.","CUSTOMER - a person NOT represented, for whom the broker may perform MINISTERIAL ACTS under either a verbal or written agreement.","MINISTERIAL ACTS - acts that do not require discretion or the exercise of the broker's own judgement."]},{"check":[{"answer":0,"choices":["Not deemed a fiduciary","A fiduciary in all cases","A fiduciary only to sellers"],"q":"Under BRRETA a Georgia broker is:","why":"The broker owes reasonable care in the duties the statute and engagement specify."},{"answer":0,"choices":["An express signed writing","A verbal promise","Custom in the market"],"q":"A broker's duties may be expanded beyond the statute only by:","why":"10-6A-4(a)."}],"h":"The point that changes everything","p":["O.C.G.A. 10-6A-4(a): a broker owes a client or customer ONLY the duties set out in the chapter, unless the parties expressly agree otherwise in a signed writing. A broker SHALL NOT BE DEEMED to have a fiduciary relationship with any party, and is responsible only for exercising REASONABLE CARE in discharging the specified duties. Georgia deliberately narrowed common-law fiduciary exposure."]},{"check":[{"answer":0,"choices":["The buyer only","The seller","Both"],"q":"A seller pays the buyer's broker. That broker represents:","why":"Compensation and agency are independent under BRRETA."},{"answer":0,"choices":["An express written agreement","Showing property","Paying a fee"],"q":"What creates the engagement?","why":"Only the writing."}],"h":"Compensation does not create agency","p":["Paying the commission does not make you the payer's client. A seller paying the buyer's broker out of closing proceeds does not make that broker the seller's agent. Only an express written agreement creates the engagement. This is heavily tested because intuition runs the other way."]},{"check":[{"answer":0,"choices":["That the broker represents other buyers generally","The broker's compensation and sharing","Confidentiality obligations"],"q":"Which need NOT be disclosed before an engagement?","why":"The statute expressly excludes it."},{"answer":0,"choices":["Four","Two","Six"],"q":"How many pre-engagement disclosures does BRRETA list?","why":"Agency types, conflicts known, compensation, confidentiality."}],"h":"Disclosures before or within the engagement","l":["The types of agency relationships available through the broker","Any brokerage relationships the broker holds with other parties that would CONFLICT with the prospective client's interests and are actually known - but EXPRESSLY EXCLUDING the fact that the broker may represent other sellers or landlords, or other buyers or tenants, generally","The broker's compensation and whether it will be shared with other brokers","The broker's obligations to keep information confidential","BRRETA does not require the agency conversation before the engagement, but the InfoBase urges having it as early as possible so a customer never presumes they are represented."],"p":["Before entering into a brokerage engagement, the broker must advise the prospective client of FOUR things:"]},{"check":[{"answer":0,"choices":["A definite expiration date","An automatic renewal","A minimum six-month term"],"q":"A Georgia brokerage engagement must have:","why":"Automatic renewals are prohibited."},{"answer":0,"choices":["A licence-law violation","Valid indefinitely","Limited to one year"],"q":"An engagement with no end date is:","why":"Disciplinary matter for the broker."}],"h":"Duration and termination","p":["The engagement begins when the client engages the broker and runs until the agreed expiration date or another statutory ending event. GREC requires a DEFINITE expiration date, and automatic renewal clauses are prohibited."]},{"check":[{"answer":0,"choices":["Allowed with written consent","Prohibited","Allowed with verbal consent"],"q":"Dual agency in Georgia is:","why":"Consent is presumed if the writing contains the required elements."},{"answer":0,"choices":["Adverse material facts actually known","The client's bottom line","Everything either client says"],"q":"A dual agent must disclose:","why":"Never information a client asked be kept confidential."}],"h":"Dual agency","l":["A description of the transactions or types of transactions involved","A statement that the broker represents two clients whose interests are, or at times could be, different or even adverse","A statement that the dual agent will disclose all ADVERSE MATERIAL FACTS actually known - EXCEPT information made confidential by a client's request or instruction","A statement that the client does NOT have to consent to the dual agency","A statement that the consent has been given voluntarily and the writing has been read and understood","The practical rule: a dual agent discloses adverse material FACTS, never a client's negotiating POSITION."],"p":["A DUAL AGENT is a broker who simultaneously has a client relationship with both sides of the same transaction. Georgia ALLOWS it with WRITTEN consent. Consent is presumed where the writing contains:"]},{"check":[{"answer":0,"choices":["Expressly NOT a dual agent","Automatically a dual agent","Required to withdraw"],"q":"With designated agents appointed, the broker is:","why":"O.C.G.A. 10-6A-13(b) says neither the broker, the licensees, nor the firm."},{"answer":0,"choices":["Their broker only","The other designated agent","Anyone in the firm"],"q":"A designated agent may share confidential client information with:","why":"And the broker may not reveal it either."}],"h":"Designated agency - a genuine Georgia distinction","l":["10-6A-13(b): where designated agents are appointed, NEITHER the broker, NOR the broker's licensees, NOR the firm is deemed a dual agent. Many other states treat this as firm-wide dual agency; Georgia does not.","10-6A-13(c): there is NO IMPUTATION of knowledge between broker, designated agents, and clients - each is treated as having only their own actual knowledge.","A designated agent may not disclose confidential client information except to their BROKER, and the broker in turn may not reveal it.","Confidential information means anything whose disclosure the client has not consented to that could harm the client's negotiating position."],"p":["A broker may assign different affiliated licensees as DESIGNATED AGENTS to represent opposing clients in the same transaction, directly or through company policy. Each designated agent owes their own client the full statutory duties."]}],"summary":"BRRETA (the Brokerage Relationships in Real Estate Transactions Act, O.C.G.A. Title 10 Chapter 6A) is the single biggest difference between Georgia and general agency law. It was passed because licensees kept creating ACCIDENTAL agency by treating customers like clients. Its answer: agency requires WRITING, and duties are limited to what the statute and the engagement specify.","topic":"georgia/brreta","traps":["Compensation never creates agency in Georgia.","A broker is expressly NOT a fiduciary under BRRETA - only reasonable care in specified duties.","Designated agency does NOT make the broker a dual agent.","The four pre-engagement disclosures exclude having to reveal other buyer/seller clients."],"vocab":[["BRRETA","Brokerage Relationships in Real Estate Transactions Act, O.C.G.A. Title 10 Ch. 6A."],["Brokerage engagement","The written contract making someone a broker's client."],["Client","A represented party under a brokerage engagement."],["Customer","An unrepresented party for whom ministerial acts may be performed."],["Ministerial acts","Acts requiring no discretion or judgement by the broker."],["Dual agent","A broker with client relationships on both sides of one transaction."],["Designated agent","A licensee assigned to represent one client exclusively in a transaction."],["Adverse material fact","A known fact that would materially affect the transaction."],["Confidential information","Information a client has not consented to disclose that could harm their position."],["Imputation of knowledge","Attributing one person's knowledge to another; removed for designated agency."]]},"georgia/contracts":{"blurb":"Georgia contract requirements, offers, earnest money terms.","counts_on_exam":true,"exam_questions":8,"examples":[{"k":"Thursday is the binding agreement date, and every deadline in the contract counts from there - not Tuesday.","s":"The seller signs the buyer's offer Tuesday. The agent does not notify the buyer until Thursday.","t":"When the clock actually starts","w":["Signing is not acceptance in the legal sense.","Acceptance is effective when COMMUNICATED to the offeror.","That happened Thursday."]},{"k":"Which is why drafting them casually is risky - and why original clauses belong with an attorney.","s":"A licensee types a special stipulation that conflicts with the preprinted contract language. A dispute follows.","t":"A stipulation beats the form","w":["Preprinted text is generic; typed terms show what these parties actually agreed.","Courts give effect to the specific over the general.","So the stipulation controls."]}],"ga":[],"label":"Georgia contracts & forms","portion":"georgia","sections":[{"check":[{"answer":0,"choices":["Acceptance is communicated to the offeror","The seller signs","The deed is recorded"],"q":"A Georgia contract becomes binding when:","why":"All deadlines run from that date."},{"answer":0,"choices":["Any time before acceptance is communicated","Never once signed","Only within 24 hours"],"q":"An offer may be revoked:","why":"After that, withdrawal is a breach."}],"h":"The binding agreement date","p":["A Georgia contract becomes binding when ACCEPTANCE IS COMMUNICATED to the offeror - not when the seller signs. Every subsequent deadline (due diligence, financing, closing) is measured from that BINDING AGREEMENT DATE, so getting it wrong shifts the whole timeline. An offer may be revoked any time before acceptance is communicated."]},{"check":[{"answer":0,"choices":["For any reason, recovering the earnest money","Only for inspection defects","Only with seller consent"],"q":"During the due diligence period a Georgia buyer may typically terminate:","why":"After it expires, the exits narrow sharply."},{"answer":0,"choices":["Binding agreement date","Offer date","Closing date"],"q":"The due diligence period is measured from the:","why":"Which is why getting that date right matters."}],"h":"Due diligence","p":["Georgia's standard due diligence provision gives the buyer a set number of days to inspect and, under the common forms, to TERMINATE FOR ANY REASON OR NO REASON and recover the earnest money. That latitude is why the length is negotiated hard. Once it expires the buyer's exit rights narrow sharply and the earnest money is genuinely at risk."]},{"check":[{"answer":0,"choices":["Fill in blanks on approved preprinted forms","Draft original clauses","Advise on legal effect"],"q":"A Georgia licensee may:","why":"Drafting is the unauthorised practice of law."},{"answer":0,"choices":["Prevails over the preprinted text","Is void","Requires GREC approval"],"q":"A typed special stipulation conflicting with preprinted text:","why":"Specific terms beat boilerplate - which is why sloppy ones are dangerous."}],"h":"Form filling vs. practising law","l":["A licensee MAY complete the blanks on approved preprinted forms incident to a transaction they are handling.","A licensee MAY NOT draft original clauses or give legal advice about them - that is the unauthorised practice of law.","Handwritten or typed SPECIAL STIPULATIONS PREVAIL over conflicting preprinted text, because they show the parties' specific intent. That is exactly why a badly drafted stipulation is dangerous: it controls the deal.","Complex terms - owner financing, unusual contingencies - belong with an attorney."]},{"check":[{"answer":0,"choices":["Identify the property with reasonable certainty","State the acreage","Match the tax assessor exactly"],"q":"A Georgia contract's property description must:","why":"A vague description can make it unenforceable."}],"h":"Description and definiteness","p":["Georgia courts require a description that identifies the property with reasonable certainty, or provides a 'key' leading to identification. A vague description can make the contract unenforceable for indefiniteness."]},{"check":[{"answer":0,"choices":["Be in writing with a definite expiration date","Renew automatically","Be recorded"],"q":"A Georgia listing agreement must:","why":"Automatic renewals are prohibited."}],"h":"Listing agreements","l":["Must be IN WRITING with a DEFINITE EXPIRATION DATE.","AUTOMATIC RENEWAL clauses are prohibited - a broker cannot roll a listing forward by default.","An engagement with no ending date is a licence-law violation for the broker, separate from whether the client minds."]},{"check":[{"answer":0,"choices":["Be a reasonable pre-estimate of loss","Exceed actual damages","Be at least 10% of the price"],"q":"For a liquidated damages clause to be enforceable it must:","why":"A sum operating as a penalty is void."}],"h":"Earnest money and default","p":["Where the contract provides liquidated damages, the seller normally retains the earnest money as the agreed measure of loss. To be enforceable rather than a penalty it must be a reasonable pre-estimate of damages, damages must be hard to determine, and the parties must have intended it as liquidated damages."]},{"check":[{"answer":0,"choices":["Keep marketing while a buyer's sale contingency is pending","Cancel at any time","Raise the price"],"q":"A kick-out clause lets the seller:","why":"The buyer must then remove the contingency or terminate."}],"h":"Contingencies you will see","l":["Financing - buyer may terminate if the stated loan cannot be obtained.","Appraisal - protects against the property valuing below the price.","Sale of buyer's property - usually paired with a KICK-OUT clause letting the seller keep marketing and requiring the buyer to remove the contingency or terminate within a short window.","Inspection / due diligence.","'Time is of the essence' makes each stated date strict."]}],"summary":"Georgia contract questions turn on three things: WHEN the contract became binding, what the DUE DILIGENCE period lets the buyer do, and where a licensee's authority to fill in a form ends and the practice of law begins.","topic":"georgia/contracts","traps":["Binding agreement date = communication of acceptance, not signature.","During due diligence the buyer generally does NOT need a reason to terminate.","Listings need a definite end date; automatic renewals are prohibited."],"vocab":[["Binding agreement date","The date acceptance is communicated; all deadlines run from it."],["Due diligence period","The buyer's window to inspect and, typically, terminate for any reason."],["Special stipulation","A typed or handwritten term that prevails over preprinted text."],["Unauthorised practice of law","Drafting legal instruments or advising on them without a licence."],["Kick-out clause","Lets a seller continue marketing while a buyer's sale contingency is pending."],["Liquidated damages","An agreed sum, usually the earnest money, as the measure of loss."],["Definiteness","The requirement that a contract identify the property with reasonable certainty."]]},"georgia/disclosures":{"blurb":"What Georgia requires disclosed, and what it protects.","counts_on_exam":true,"exam_questions":6,"examples":[{"k":"Decline to answer and refer the buyer to sources they can research. That keeps you inside the protection.","s":"A buyer asks the listing agent directly whether anyone died in the house. The agent knows someone did.","t":"Silence is protected; lying is not","w":["Georgia protects NONDISCLOSURE of a death on the property.","It does not protect an affirmative false statement.","Denying it would be misrepresentation."]}],"ga":[],"label":"Georgia disclosures","portion":"georgia","sections":[{"check":[{"answer":0,"choices":["Adverse material facts actually known","Everything an inspector would find","Only what the seller wrote down"],"q":"Under BRRETA the disclosure duty covers:","why":"There is no duty to discover - but the duty runs to customers too."},{"answer":0,"choices":["Point it out and suggest an inspection","Say nothing","Repaint it"],"q":"A licensee who sees a fresh paint patch over a stain should:","why":"No duty to discover is not a licence to ignore."}],"h":"The scope of the duty","p":["Under BRRETA a broker must disclose ADVERSE MATERIAL FACTS actually known, and this duty runs to CUSTOMERS as well as clients. There is NO DUTY TO DISCOVER: brokers are not inspectors and need not investigate. But a licensee may not ignore what is plainly visible, and may not pass along information they know to be false."]},{"check":[{"answer":0,"choices":["Does not volunteer that a death occurred","Denies a death occurred","Both"],"q":"Georgia protects a licensee who:","why":"Nondisclosure is protected; an affirmative lie is not."},{"answer":0,"choices":["Decline and refer them to other sources","Deny it","Confirm it in writing"],"q":"Asked directly whether someone died there, the safest answer is to:","why":"Declining keeps you inside the protection."}],"h":"Stigmatized property","p":["Georgia expressly shields licensees from liability for NOT disclosing that a property was the site of a death, homicide, suicide, or felony. The protection covers NONDISCLOSURE. It does not license a denial. If a buyer asks directly and you know, decline to answer and point them to public sources - denying it would be misrepresentation."]},{"check":[{"answer":0,"choices":["Seller","Listing broker","Closing attorney"],"q":"Georgia's property disclosure statement is completed by the:","why":"Filling it in for them transfers their liability to you."},{"answer":0,"choices":["Not pass it along, and withdraw if the seller refuses to correct it","Change the form themselves","Disclose only to the buyer's agent"],"q":"If a licensee knows an answer on the form is false, they must:","why":"You cannot be the conduit for a known falsehood."}],"h":"Who fills in the form","p":["The SELLER completes Georgia's property disclosure statement from personal knowledge. A licensee should never complete it for the seller or guess at answers - doing so transfers the seller's liability onto the licensee. If the licensee knows an answer is false, they cannot market the property on that basis; if the seller will not correct it, withdraw."]},{"check":[{"answer":0,"choices":["A known failing septic system","A prior owner's bankruptcy","A neighbour dispute"],"q":"Which must be disclosed?","why":"Physical conditions affecting value, safety, or use."},{"answer":0,"choices":["An adverse material fact","Only the lender's concern","Confidential"],"q":"Flood plain location is:","why":"It affects value, insurability, and use."}],"h":"What must be disclosed","l":["Known physical defects affecting value, safety, or use - roof, foundation, septic, systems, water intrusion (including repaired history)","Flood plain location, which affects value, insurability, and lender requirements","Federal lead-based paint disclosure for housing built before 1978, with records, the EPA pamphlet, and a 10-day testing opportunity","A licensee's own LICENSED STATUS, in writing, whenever acting as a principal"]},{"check":[{"answer":0,"choices":["Protected - handicap is a protected class","Disclosable on request","Required to be disclosed"],"q":"A former occupant's HIV status is:","why":"Disclosure would be discriminatory."}],"h":"What must not be disclosed","p":["Anything touching a protected class. A former occupant's HIV/AIDS status is protected as handicap; the demographic makeup of a neighbourhood is off limits because answering steers."]}],"summary":"Georgia's disclosure rules are narrower than most states'. The duty is to adverse material facts ACTUALLY KNOWN - there is no duty to investigate - and Georgia expressly protects licensees who stay silent about stigma. What is never protected is an affirmative lie.","topic":"georgia/disclosures","traps":["Physical condition must be disclosed; stigma generally need not.","The duty covers what you ACTUALLY KNOW - but it runs to customers too.","Never complete the seller's disclosure form for them."],"vocab":[["Adverse material fact","A known fact materially affecting the property or transaction."],["No duty to discover","Georgia's rule that brokers need not investigate for defects."],["Property disclosure statement","The seller's written statement of known conditions."],["Stigmatized property","Property affected by events rather than physical condition."],["Licensee-as-principal disclosure","Written disclosure of licensed status when buying or selling for yourself."]]},"georgia/fair-housing":{"blurb":"Federal and Georgia fair housing as GREC enforces it.","counts_on_exam":true,"exam_questions":5,"examples":[{"k":"Steering. Adopt one policy for everyone - typically pointing all buyers to the same public sources.","s":"A licensee provides school ratings and crime statistics only when buyers of a certain background ask for them.","t":"Helpful, and still steering","w":["Nothing negative was said about any area.","But information was delivered selectively by who was asking.","Selective information channels buyers just as effectively as a recommendation."]},{"k":"Unlawful. The tenant is still liable for actual damage the animal causes.","s":"A manager charges a $300 non-refundable fee to every tenant with an assistance animal, applied uniformly.","t":"No pet fee for an assistance animal","w":["Uniform application does not save it.","Waiving the pet policy is a reasonable ACCOMMODATION at the provider's expense.","Charging a fee defeats the accommodation."]}],"ga":[],"label":"Fair housing in Georgia","portion":"georgia","sections":[{"check":[{"answer":0,"choices":["Familial status","Source of income","Marital status"],"q":"Which is federally protected in housing?","why":"Source of income and marital status are not among the seven."}],"h":"The seven federal classes","p":["Race, colour, religion, sex, national origin, familial status, handicap. Source of income and marital status are not among them federally, though some Georgia local ordinances protect source of income and a blanket policy can still create disparate-impact exposure."]},{"check":[{"answer":0,"choices":["Steering","Good service","Blockbusting"],"q":"Giving school ratings only to certain buyers is:","why":"Selective information channels buyers just as effectively."},{"answer":0,"choices":["Familial status protection","Nothing","Age discrimination law"],"q":"An ad saying 'no children under 12' violates:","why":"Describe the property, not the occupant."}],"h":"Steering and blockbusting in practice","l":["STEERING does not require saying anything negative. Providing school ratings and crime statistics only to certain buyers, or 'you'd be more comfortable over here', both steer. Use a consistent policy for every buyer and point everyone to the same public sources.","BLOCKBUSTING is inducing sales by suggesting a protected group's arrival will harm the neighbourhood. Illegal whether or not the statement is true.","Advertising must describe the PROPERTY, not the desired occupant. 'Mature Christian couple' signals age/familial status and religion; 'no children under 12' is a direct familial status violation."]},{"check":[{"answer":0,"choices":["Modification, at the tenant's expense","Accommodation, at the landlord's expense","Prohibited alteration"],"q":"A tenant wants to install a grab bar. This is a:","why":"Physical change = modification."},{"answer":0,"choices":["Unlawful","Lawful if uniform","Lawful if disclosed"],"q":"Charging a pet fee for an assistance animal is:","why":"An assistance animal is not a pet."}],"h":"Disability: two different duties","l":["REASONABLE MODIFICATION - a PHYSICAL change (grab bar, ramp, doorbell light). Permitted at the TENANT'S expense, with possible restoration on move-out.","REASONABLE ACCOMMODATION - a change to RULES or policies (waiving a no-pets rule for an assistance animal). At the HOUSING PROVIDER'S expense.","An assistance animal is not a pet: no pet fee or pet deposit may be charged, though the tenant remains liable for actual damage."]},{"check":[{"answer":0,"choices":["Refuse and withdraw if they persist","Comply and document it","Refer them to a colleague"],"q":"A seller insists you exclude a protected class. You should:","why":"Referring simply relocates the violation."}],"h":"Unlawful client instructions","p":["The duty of obedience covers LAWFUL instructions only. A seller who directs you to exclude a protected class must be refused, and if they persist you WITHDRAW. Quietly ignoring the instruction leaves you working for someone who will discriminate; handing the seller to a colleague simply relocates the violation."]},{"check":[{"answer":0,"choices":["A HUD case, a lawsuit, and GREC discipline","Only a HUD case","Only licence discipline"],"q":"One discriminatory act can result in:","why":"The tracks are independent."}],"h":"Enforcement","p":["HUD handles federal complaints, generally within one year. Private suits are available. Separately, GREC can discipline the licence - so one act of discrimination can produce a HUD case, a lawsuit, and a licence sanction."]}],"summary":"Georgia enforces the federal Fair Housing Act, and GREC can independently discipline a licensee for discriminatory conduct. The exam focuses on recognising steering and blockbusting in realistic wording, and on the accommodation/modification split.","topic":"georgia/fair-housing","traps":["Steering can happen through selective helpfulness, with no negative statement at all.","Modification = physical = tenant pays. Accommodation = rules = provider absorbs.","Refusing an unlawful instruction is not enough if you keep the listing - withdraw."],"vocab":[["Fair Housing Act","The federal law barring housing discrimination on seven grounds."],["Familial status","Households with children under 18, pregnant people, those securing custody."],["Handicap","Disability, including HIV/AIDS; a protected class."],["Steering","Channelling people toward or away from areas by protected class."],["Blockbusting","Inducing sales with claims about a protected group moving in."],["Redlining","Refusing or pricing loans by area demographics."],["Reasonable modification","A physical change at the tenant's expense."],["Reasonable accommodation","A rules change at the provider's expense."],["Assistance animal","Not a pet; no pet fee may be charged."],["Disparate impact","A neutral policy with discriminatory effect."],["Housing for older persons","The narrow exemption from familial status protection."]]},"georgia/license-law":{"blurb":"Licensing, renewal, education, GREC authority, sanctions.","counts_on_exam":true,"exam_questions":14,"examples":[{"k":"The licence lapses. This is a hard deadline with no CE workaround.","s":"A salesperson licensed 14 months ago never took the 25-hour postlicense course, but did complete some CE.","t":"Missing the postlicense deadline","w":["The postlicense course is due within ONE year of original licensure.","It applies regardless of active or inactive status.","CE hours do not substitute for it."]},{"k":"Discipline and compensation are separate tracks. Do not wait for the investigation before consulting an attorney.","s":"A consumer loses $18,000 through a licensee's mishandling of funds and files a complaint with GREC.","t":"The limit of GREC's power","w":["GREC may reprimand, suspend, revoke, fine, and require education or CPA reports.","It has no authority to order repayment of a financial loss.","The consumer must pursue a civil action for the money."]}],"ga":[],"label":"GREC license law & rules","portion":"georgia","sections":[{"check":[{"answer":0,"choices":["75 hours","25 hours","60 hours"],"q":"The Georgia salesperson prelicense course is:","why":"60 hours is the broker course; 25 is postlicense."},{"answer":0,"choices":["None","One year","Three of the past five years"],"q":"Experience required for a salesperson licence:","why":"The three-of-five rule is for broker and associate broker."}],"h":"Getting licensed","l":["AGE - 18 for salesperson or community association manager; 21 for broker or associate broker. You may TAKE the salesperson exam at 17 but cannot activate until 18 (and the broker exam at 20, activating at 21).","EDUCATION - a 75-HOUR GREC-approved salesperson prelicense course. Brokers take a 60-hour broker prelicense course.","EXAMINATION - pass the Georgia licensing exam (national + state portions).","EXPERIENCE - NONE for a salesperson. For broker or associate broker, an ACTIVE licence for THREE of the FIVE years immediately preceding application. Active licensure in ANOTHER state counts, with a certified licence history from every state where you have held one.","Background check and application fee."]},{"check":[{"answer":0,"choices":["One year of original licensure","Four years","Two years"],"q":"The 25-hour postlicense course is due within:","why":"Miss it and the licence lapses. CE does not substitute."},{"answer":0,"choices":["24 hours per four-year renewal period","36 hours per four years","24 hours per year"],"q":"Georgia continuing education is:","why":"Many national guides quote 36 - that is a different state."}],"h":"Keeping it: the education ladder","l":["POSTLICENSE - a 25-hour Sales Post-license Course within ONE YEAR of original licensure. Applies whether you are active or inactive, resident or nonresident. Miss it and the licence lapses. CE does not substitute for it.","CONTINUING EDUCATION - at least 24 HOURS of GREC-approved CE during each FOUR-YEAR renewal period. Not annual. Many national guides say 36 hours; that is a different state.","The sequence to remember: 75 in, 25 in year one, then 24 every four years."]},{"check":[{"answer":0,"choices":["Still owes the postlicense requirement","Has no education obligations","May still list property"],"q":"An inactive Georgia licensee:","why":"Fees and postlicense still apply; licensed activity does not."},{"answer":0,"choices":["Their affiliated broker only","Any party to the transaction","The closing attorney"],"q":"A Georgia salesperson may be paid by:","why":"Direct payment from a client is a violation."}],"h":"Status and administration","l":["INACTIVE status - you may hold a licence without affiliating, but you still pay fees and still owe the postlicense requirement. You may not perform licensed acts.","Change of address, broker affiliation, or status is made by filing a CHANGE APPLICATION with the Commission.","A salesperson acts only through and under the supervision of their affiliated broker, and may be COMPENSATED ONLY BY THAT BROKER.","NONRESIDENTS who hold no licence at home must meet the same requirements as Georgia residents and affiliate with a GREC-licensed broker, who may themselves be resident or nonresident.","Criminal CONVICTIONS must be reported to GREC. Concealment is usually punished more severely than the underlying offence."]},{"check":[{"answer":0,"choices":["An independent violation by the broker","Only the affiliate's problem","Excused if no consumer complains"],"q":"Failure to supervise an affiliate is:","why":"GREC can act on its own motion."},{"answer":0,"choices":["Identify the brokerage firm","Use only the licensee's name","Be pre-approved by GREC"],"q":"Georgia advertising must:","why":"A licensee may never appear to operate independently."}],"h":"The qualifying broker and the firm","l":["The qualifying broker answers to GREC for the firm's compliance: supervision, trust accounts, records, and advertising.","FAILURE TO SUPERVISE is an independent violation - the broker can be disciplined for an affiliate's conduct.","If a qualifying broker is suspended, a corporation or LLC may keep operating if it IMMEDIATELY designates a replacement; otherwise the firm's licence and all affiliated licences are suspended for the same period.","Advertising must identify the FIRM and must never suggest a licensee operates independently of their broker."]},{"check":[{"answer":0,"choices":["Order a licensee to repay a consumer's loss","Revoke a licence","Impose a fine"],"q":"GREC can do all of these EXCEPT:","why":"There is no restitution power - the consumer must sue."},{"answer":0,"choices":["Appointed by the Governor","Elected by licensees","Chosen by the REALTOR association"],"q":"GREC members are:","why":"Gubernatorial appointment."}],"h":"What GREC can do - and what it cannot","l":["Members are appointed by the GOVERNOR. GREC administers the licence law, makes rules, investigates, and disciplines.","SANCTIONS: reprimand, suspension, revocation, fines, required education, and required reports from an independent accountant on the trust account.","GREC CANNOT order a licensee to repay a consumer's financial loss. There is no restitution power. A wronged consumer must sue civilly and should not wait for the investigation to conclude.","GREC also does NOT resolve commission disputes between brokers - those go to arbitration or the courts."]},{"check":[{"answer":0,"choices":["Anyone by sworn written request, or the Commission itself","Only a party to the transaction","Only the Attorney General"],"q":"A GREC investigation may be started by:","why":"It can also act on its own motion."},{"answer":0,"choices":["30 days","10 days","90 days"],"q":"After an ALJ decision, the respondent has how long to seek Commission review?","why":"Otherwise the decision becomes final."}],"h":"The disciplinary process","l":["ANYONE may file a sworn written request for investigation, and the Commission may act ON ITS OWN MOTION. The licensee is notified they are under investigation.","Where a violation caused no significant public harm, GREC may offer a CONSENT ORDER stating the violation and a proposed sanction. The licensee may sign, propose an alternative, present evidence, or demand a hearing.","A CONSENT SETTLEMENT fixes agreed findings of fact, conclusions of law, and a sanction, with no hearing held.","A formal hearing is conducted by an ADMINISTRATIVE LAW JUDGE from the Office of State Administrative Hearings.","The respondent has THIRTY DAYS to ask the Commission to review the ALJ's decision; otherwise it becomes final. The Commission has the same 30 days to request review. From the Commission's final decision, appeal goes to the courts.","Commission staff may not interpret the law for you - that is legal advice."]},{"check":[{"answer":0,"choices":["Disclose licensed status in writing","Do nothing special","Use another broker"],"q":"A licensee selling their own home must:","why":"O.C.G.A. 43-40-29(c) removes the ordinary-owner exemptions."},{"answer":0,"choices":["Permitted only under strict disclosure","Always illegal","The standard form"],"q":"Net listings in Georgia are:","why":"They create a direct conflict with the client's interest."}],"h":"A licensee is never an ordinary owner","p":["O.C.G.A. 43-40-29(c) provides that NONE of the exceptions to licensure applies to a person who holds a licence. Selling or leasing your own property means disclosing your licensed status IN WRITING in the contract or lease, and placing any trust funds in an account approved by your broker. Georgia also permits NET LISTINGS only under strict disclosure conditions."]}],"summary":"The biggest single block on the state portion (14 questions). Three clusters carry most of it: what you must do to GET and KEEP a licence, what GREC can and cannot do to you, and the fact that being a licensee never lets you act as an ordinary owner.","topic":"georgia/license-law","traps":["75 prelicense / 25 postlicense - candidates transpose these constantly.","CE is 24 hours per FOUR YEARS, not per year and not 36.","GREC cannot order restitution, and does not settle commission disputes.","Being a licensee removes, not grants, the ordinary-owner exemptions."],"vocab":[["GREC","The Georgia Real Estate Commission; members appointed by the Governor."],["Qualifying broker","The broker responsible to GREC for a firm's compliance."],["Associate broker","A broker-licensed individual working under a qualifying broker."],["Prelicense course","75 hours for salesperson; 60 for broker."],["Postlicense course","25 hours due within one year of original licensure."],["Continuing education","24 hours per four-year renewal period."],["Inactive status","Holding a licence without affiliating; no licensed activity permitted."],["Change application","The GREC form used to report affiliation or status changes."],["Consent order","A negotiated resolution stating the violation and sanction, no hearing."],["Consent settlement","Agreed findings, conclusions and sanction without a hearing."],["Administrative Law Judge","The OSAH officer who conducts formal GREC hearings."],["Reprimand","The mildest GREC sanction."],["Revocation","Permanent loss of licence."],["Net listing","Broker keeps everything above the seller's stated net; strictly limited in Georgia."],["O.C.G.A.","Official Code of Georgia Annotated."]]},"georgia/procedures":{"blurb":"Attorney-conducted closings, title, transfer tax, recording.","counts_on_exam":true,"exam_questions":5,"examples":[{"k":"Say plainly that the attorney represents the lender and the buyer may retain their own counsel. Letting the buyer assume otherwise is a costly misunderstanding.","s":"At closing the buyer asks the attorney whether the repair clause protects them.","t":"Who does the closing attorney work for?","w":["Georgia requires attorney supervision of the closing.","That attorney customarily represents the LENDER, not the buyer.","The licensee must not supply a legal opinion either."]},{"k":"The claim is complete. Without colour of title they would have needed 20 years.","s":"A neighbour has openly occupied a strip of land for 12 years under a deed they believed valid but which was defective.","t":"Seven years, not twenty","w":["A defective instrument that appears to convey title is COLOUR OF TITLE.","With colour of title Georgia's period is 7 years, not 20.","Twelve years exceeds it."]}],"ga":[],"label":"Closings, escrow & procedure","portion":"georgia","sections":[{"check":[{"answer":0,"choices":["A licensed attorney","A title company officer","The listing broker"],"q":"A Georgia closing must be supervised by:","why":"Examining title and preparing documents is the practice of law."},{"answer":0,"choices":["The lender","The buyer","Both parties equally"],"q":"The closing attorney customarily represents:","why":"A buyer wanting an advocate must retain their own counsel."}],"h":"Attorney closings","p":["Georgia requires a licensed ATTORNEY to supervise the closing, because examining title and preparing conveyance documents is the practice of law. That attorney customarily represents the LENDER. A buyer who wants their own advocate must retain separate counsel - and a licensee should say so plainly rather than letting the buyer assume otherwise."]},{"check":[{"answer":0,"choices":["Passes legal title to the lender until payoff","Creates only a lien","Requires a trustee"],"q":"A Georgia security deed:","why":"That makes Georgia a title-theory state."}],"h":"The security deed","p":["Georgia's security instrument is a SECURITY DEED (deed to secure debt). Unlike a mortgage, which creates only a lien, it conveys LEGAL TITLE to the lender until the debt is paid. This is what makes Georgia a title-theory state and enables fast nonjudicial foreclosure."]},{"check":[{"answer":0,"choices":["The first Tuesday of the month","Any business day","The last Friday of the month"],"q":"Georgia foreclosure sales occur on:","why":"On the courthouse steps, after advertisement in the legal organ."},{"answer":0,"choices":["Nonjudicial under a power of sale","Judicial, requiring a lawsuit","Automatic after 90 days"],"q":"Georgia foreclosure is:","why":"Which is why it moves comparatively fast."}],"h":"Foreclosure","l":["Georgia foreclosure is NONJUDICIAL, under the power of sale in the security deed.","Notice to the borrower, plus ADVERTISEMENT in the county LEGAL ORGAN, customarily for four weeks.","Public sale on the courthouse steps on the FIRST TUESDAY of the month.","A deficiency requires court confirmation of the sale."]},{"check":[{"answer":0,"choices":["$1.00 per $1,000 of consideration","1% of the price","$0.10 per $1,000"],"q":"Georgia's transfer tax is:","why":"Customarily paid by the seller."},{"answer":0,"choices":["Clerk of superior court","Secretary of State","Probate court"],"q":"Georgia deeds are recorded with the:","why":"In the county where the land lies."}],"h":"Transfer tax and recording","l":["Georgia real estate TRANSFER TAX is $1.00 per $1,000 of consideration (0.10%). Customarily paid by the SELLER.","Collected by the CLERK OF SUPERIOR COURT when the deed is recorded.","Deeds, security deeds, and plats are recorded with the clerk of superior court in the county where the land lies, giving constructive notice.","There is also an intangible recording tax on long-term notes."]},{"check":[{"answer":0,"choices":["January 1","The closing date","When the bill is mailed"],"q":"Georgia property taxes become a lien on:","why":"Which is why closings prorate them."}],"h":"Taxes and prorations","p":["Georgia property taxes become a LIEN ON JANUARY 1 of the tax year and follow the property regardless of who owned it when they accrued. That is why closings prorate them. Unpaid taxes produce a SELLER DEBIT and BUYER CREDIT."]},{"check":[{"answer":0,"choices":["Tenancy by the entirety","Joint tenancy","Tenancy in common"],"q":"Georgia does NOT recognise:","why":"Spouses use joint tenancy with right of survivorship instead."},{"answer":0,"choices":["20 years","7 years","10 years"],"q":"Adverse possession without colour of title in Georgia takes:","why":"7 years applies WITH colour of title."}],"h":"Ownership rules that differ","l":["Georgia does NOT recognise tenancy by the entirety. Spouses wanting survivorship hold as JOINT TENANTS WITH RIGHT OF SURVIVORSHIP, stated expressly.","Adverse possession: 20 YEARS, or 7 YEARS under COLOUR OF TITLE.","Georgia subdivisions are usually described by LOT AND BLOCK from a recorded plat; Georgia does not use the rectangular survey system."]},{"check":[{"answer":0,"choices":["3 business days before consummation","At closing","3 days after"],"q":"The Closing Disclosure must be received:","why":"TRID applies in Georgia like everywhere else."}],"h":"At the table","p":["TRID applies: the Closing Disclosure must be received at least three business days before consummation. The closing attorney disburses, records, and issues title insurance."]}],"summary":"Closing and conveyancing in Georgia differ from the national norm in several specific ways, and the exam tests exactly those differences: attorney closings, security deeds, nonjudicial foreclosure, transfer tax, January 1 tax liens, and no tenancy by the entirety.","topic":"georgia/procedures","traps":["Georgia is an attorney-closing state, not an escrow state.","Security deed, not mortgage; nonjudicial foreclosure, first Tuesday.","$1.00 per $1,000 - divide the price by 1,000. Not 1% and not $0.10.","Tax lien attaches January 1, regardless of when the bill arrives."],"vocab":[["Security deed","Georgia's instrument conveying title to the lender as security."],["Title theory","The doctrine that the lender holds legal title until the debt is paid."],["Power of sale","The clause permitting nonjudicial foreclosure."],["Legal organ","The county newspaper designated for official legal advertisements."],["Confirmation of sale","Court approval required before pursuing a deficiency in Georgia."],["Transfer tax","$1.00 per $1,000 of consideration, customarily paid by the seller."],["Intangible recording tax","A Georgia tax on long-term notes secured by real estate."],["Clerk of superior court","The county officer with whom Georgia land records are filed."],["Colour of title","A defective written instrument that appears to convey title."]]},"georgia/trust-accounts":{"blurb":"Designated trust accounts, deadlines, disbursement, records.","counts_on_exam":true,"exam_questions":4,"examples":[{"k":"The buyer's verbal request is not enough. Get it in writing from everyone, normally as a stipulation in the offer.","s":"A buyer asks the broker to hold the earnest money check uncashed until the seller accepts.","t":"Holding a check needs everyone's signature","w":["The default rule is prompt deposit into a non-interest-bearing account.","Any deviation requires clear WRITTEN authority.","It must be agreed by ALL parties - the seller has an interest in the deposit too."]},{"k":"Tell clients which bank holds trust funds and mention the $250,000 limit.","s":"A client already has $250,000 at XYZ Bank and gives the broker a $10,000 deposit. The broker's trust account is also at XYZ. The bank fails.","t":"The FDIC gap","w":["Pass-through treats the client as a separate owner - but the FDIC AGGREGATES their deposits at that bank.","The client is at $260,000 total, so $10,000 is uninsured.","The InfoBase warns the broker may be liable for it if the bank was not disclosed."]}],"ga":[],"label":"Trust accounts & earnest money","portion":"georgia","sections":[{"check":[{"answer":0,"choices":["Do not become part of the estate","Pass to the heirs","Go to the broker's creditors"],"q":"Funds in a properly maintained trust account, on the broker's death:","why":"They are also protected from garnishment and bankruptcy."},{"answer":0,"choices":["Keep the public's money separate from the broker's","Earn interest for the broker","Simplify tax filing"],"q":"The account's purpose is to:","why":"Separation is the whole point."}],"h":"Why the account exists","l":["Do NOT become part of the broker's estate on death","Are NOT subject to attachment or garnishment from a judgment against the broker","Do NOT go to creditors in the broker's bankruptcy","Are not available to accidentally cover shortfalls in the firm's operating account"],"p":["A properly maintained trust account protects client money regardless of the broker's own finances. Per the InfoBase, funds in it:"]},{"check":[{"answer":0,"choices":["An EIN","The broker's Social Security Number","A client's tax ID"],"q":"A Georgia trust account should be opened under:","why":"SSN-based accounts have been seized for the broker's personal debts."},{"answer":0,"choices":["The bank","The broker","GREC"],"q":"The account must be designated as trust or escrow by:","why":"And registered with the Commission."}],"h":"Setting it up","l":["A SEPARATE, FEDERALLY INSURED bank CHECKING account that the BANK designates as a trust or escrow account.","Registered with the Commission at the time of broker application, and the broker must have SIGNATORY POWER.","It may be interest-bearing or non-interest-bearing, but funds are deposited into a NON-interest-bearing account unless all parties authorise otherwise in writing.","Open it under an EMPLOYER IDENTIFICATION NUMBER, not the broker's Social Security Number. The InfoBase records accounts seized by the IRS for a broker's personal tax debt, awarded in a divorce, and attached by a bank - the common thread was an account opened under the broker's SSN.","A broker must have AT LEAST ONE and may have several - commonly separate accounts for earnest money, rents, and security deposits. Each must be bank-designated and registered."]},{"check":[{"answer":0,"choices":["Written authority from all parties","The buyer's verbal request","Nothing - it is standard"],"q":"To hold an earnest money check until acceptance, the broker needs:","why":"The seller has an interest in the deposit too."},{"answer":0,"choices":["A non-interest-bearing account","An interest-bearing account","The operating account"],"q":"Trust funds are deposited by default into:","why":"Interest-bearing requires written authorisation."}],"h":"Prompt deposit","p":["The law requires trust funds to be deposited PROMPTLY. To do anything else - hold a check until the offer is accepted, take a postdated check, accept personal property instead of money, or use an interest-bearing account - the broker needs CLEAR WRITTEN AUTHORITY agreed to by ALL parties, not just the one who asked. Once deposited, funds stay there until the transaction is consummated or terminated."]},{"check":[{"answer":0,"choices":["Commission properly earned and disbursed after closing","A tenant's security deposit","Rent collected for an owner"],"q":"Which is NOT trust money?","why":"Once earned and disbursed it is the broker's."},{"answer":0,"choices":["Trust money","The broker's fee","Not reportable"],"q":"A buyer's advance for a credit report is:","why":"Funds advanced for expenses are held in trust."}],"h":"What counts as trust money","l":["Earnest money and other deposits","RENTS collected for an owner","SECURITY, damage, cleaning, key deposits, and last month's rent","Payments collected on land contracts or wraparound mortgages on licensee-owned property","Any funds advanced by a party for expenses - appraisals, credit reports, repairs","Closing funds the broker collects and disburses","NOT trust money: commission properly earned and disbursed after closing."]},{"check":[{"answer":0,"choices":["A separate account owner","Part of one broker account","Uninsured"],"q":"FDIC pass-through coverage treats each client as:","why":"Provided the broker meets the recordkeeping rules."},{"answer":0,"choices":["Has no coverage for their new deposit","Gets a second $250,000","Is covered automatically"],"q":"A client with $250,000 already at the same bank:","why":"The FDIC aggregates their deposits at that bank."}],"h":"FDIC coverage","p":["The FDIC insures $250,000 per account owner per bank. Trust accounts get PASS-THROUGH coverage - each buyer, seller, or tenant is treated as a separate owner - but only if the broker meets the recordkeeping requirements. The catch: the FDIC ADDS that person's other deposits at the SAME bank. A client already at $250,000 in that bank has no coverage for their deposit, and the InfoBase warns the broker may be liable for the uninsured excess if the client was not told which bank holds the funds."]},{"check":[{"answer":0,"choices":["On reasonable request","Only with a warrant","Only at renewal"],"q":"GREC may examine a trust account:","why":"It may accept a CPA certification instead, at its discretion."},{"answer":0,"choices":["At least quarterly written reconciliations","Annual summaries","Nothing to the broker"],"q":"An affiliate holding an account for their own rentals must provide:","why":"And the broker registers it and stays responsible."}],"h":"Records, audits, and affiliates","l":["Written notice to GREC, on Commission forms, whenever the bank, account name, or account number changes, the bank changes names, or the account closes.","GREC may EXAMINE trust accounts on reasonable request and does so routinely. It MAY, at its discretion, accept a CPA's certification of compliance instead.","A nonresident broker may keep the account in their home state if they authorise GREC to examine it.","If a broker lets an affiliate maintain an account for the affiliate's own rentals, the broker must REGISTER it with GREC, remains RESPONSIBLE for it, and the affiliate must supply at least QUARTERLY written reconciliation statements comparing total trust liability with the reconciled bank balance."]},{"check":[{"answer":0,"choices":["Hold it and use interpleader","Release to the first to ask","Split it"],"q":"Both parties demand the earnest money. The broker should:","why":"Choosing a side invites a conversion claim."}],"h":"Disputes","p":["When buyer and seller both demand the deposit, the broker must not choose a side. Hold the funds and use interpleader or the prescribed procedure. Releasing, splitting, or keeping it all invite a conversion claim."]}],"summary":"Trust account rules exist to keep the public's money separate from the broker's, and they survive the broker's death, bankruptcy, divorce, and judgments. Nearly every question here is about separation, prompt deposit, or paperwork.","topic":"georgia/trust-accounts","traps":["'Promptly' is the standard; written authority from ALL parties is the only way around it.","EIN, not SSN. This is the difference between a protected account and a seizable one.","Commission is only the broker's money AFTER it is properly earned and disbursed.","GREC MAY accept a CPA report - the broker can request it, not demand it."],"vocab":[["Trust account","A separate, federally insured, bank-designated account for client funds."],["Escrow","Money or documents held by a neutral party pending closing."],["Commingling","Mixing trust funds with the broker's own money."],["Conversion","Using or spending trust funds."],["Signatory power","The broker's authority to sign on the account; required."],["EIN","Employer Identification Number; trust accounts should be opened under one."],["Pass-through coverage","FDIC treatment of each client as a separate insured owner."],["Reconciliation","Comparing total trust liability against the bank balance."],["Interpleader","A court action to resolve competing claims to held funds."]]},"national/agency":{"blurb":"Fiduciary duties, agency creation and termination, dual agency.","counts_on_exam":true,"exam_questions":8,"examples":[{"k":"Declining to answer is not deceit. Saying 'no particular reason' is.","s":"A seller privately tells the listing agent they must move in 30 days. A buyer's agent asks why the seller is selling.","t":"Confidential, but you still cannot lie","w":["Motivation is confidential, not a material defect, so it stays private.","But honesty is owed to customers too, so an invented answer is misrepresentation.","The correct move is to DECLINE to answer, not to make something up."]},{"k":"Refuse. If the seller persists, withdraw from the engagement. Passing the seller to a colleague just relocates the violation.","s":"A seller instructs the listing agent not to show the home to families with children.","t":"An unlawful instruction","w":["Obedience covers LAWFUL instructions only.","Familial status is a protected class under the Fair Housing Act.","Complying would make the agent personally liable alongside the seller."]}],"ga":["In Georgia, agency requires WRITTEN authority - a brokerage engagement. BRRETA also provides that a broker is NOT deemed a fiduciary; the broker owes reasonable care in the duties the statute and the engagement specify.","Paying a broker's commission does not by itself create agency in Georgia."],"label":"Principles of agency","portion":"national","sections":[{"check":[{"answer":0,"choices":["Confidentiality and accounting","Loyalty and obedience","Disclosure and care"],"q":"Which duties SURVIVE the end of the agency?","why":"The other four end with the relationship."},{"answer":0,"choices":["Lawful instructions only","All client instructions","Instructions in writing only"],"q":"The duty of obedience covers:","why":"An unlawful instruction must be refused."}],"h":"The six duties (OLD CAR)","l":["Obedience - follow LAWFUL instructions. You must refuse unlawful ones.","Loyalty - put the client's interests ahead of your own.","Disclosure - tell the client everything material you know.","Confidentiality - protect the client's private information. SURVIVES the end of the relationship, indefinitely.","Accounting - account for all money and documents. Also survives closing.","Reasonable care and diligence - competence and skill.","Which survive termination? CONFIDENTIALITY and ACCOUNTING. The rest end."]},{"check":[{"answer":0,"choices":["Implied agency","Express agency","Ratification"],"q":"Agency created by conduct rather than agreement is:","why":"This is the accidental-agency trap."},{"answer":0,"choices":["The client refusing an offer","Death of the principal","Destruction of the property"],"q":"Which does NOT terminate an agency?","why":"Refusing an offer is just the client exercising judgement."}
