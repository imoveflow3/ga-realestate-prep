<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Practice quizzes, a comprehensive subtest, real estate math with worked solutions, and a study plan for the Georgia salesperson licensing exam.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A1%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A1%3C/text%3E%3C/svg%3E">
<title>Georgia Real Estate Prep</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>/* Georgia Real Estate Prep -- condensed display type, mono figures, flat
   stat tables. Tokens first: light is the base, both dark paths redefine only
   these. */
:root{
  --bg:#eef1f5;         --panel:#ffffff;      --panel-2:#f6f8fa;
  --ink:#141b24;        --ink-2:#4a5a6d;      --ink-3:#7b8a9c;
  --line:#d5dde6;       --line-2:#c2ccd8;
  --accent:#1a6459;     --accent-ink:#ffffff; --accent-soft:#dcefea;
  --brass:#95651a;      --brass-soft:#f7edd8;
  --ok:#1d7a4c;         --ok-soft:#e0f2e8;
  --no:#a8283c;         --no-soft:#fbe6ea;
  --caution:#8a6100;    --caution-soft:#fbf0d9;
  --shadow:0 1px 1px rgba(20,27,36,.04), 0 6px 20px rgba(20,27,36,.07);
  --r:4px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1319;       --panel:#161d26;      --panel-2:#1d252f;
    --ink:#e2e8f0;      --ink-2:#a3b1c2;      --ink-3:#75838f;
    --line:#293341;     --line-2:#37434f;
    --accent:#5fc0ad;   --accent-ink:#0b1512; --accent-soft:#13282a;
    --brass:#d6a445;    --brass-soft:#2b2416;
    --ok:#5fcf95;       --ok-soft:#12281d;
    --no:#ff8c9e;       --no-soft:#2e161c;
    --caution:#e0ae5a;  --caution-soft:#2a2214;
    --shadow:0 1px 1px rgba(0,0,0,.5), 0 8px 26px rgba(0,0,0,.36);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1319;         --panel:#161d26;      --panel-2:#1d252f;
  --ink:#e2e8f0;        --ink-2:#a3b1c2;      --ink-3:#75838f;
  --line:#293341;       --line-2:#37434f;
  --accent:#5fc0ad;     --accent-ink:#0b1512; --accent-soft:#13282a;
  --brass:#d6a445;      --brass-soft:#2b2416;
  --ok:#5fcf95;         --ok-soft:#12281d;
  --no:#ff8c9e;         --no-soft:#2e161c;
  --caution:#e0ae5a;    --caution-soft:#2a2214;
  --shadow:0 1px 1px rgba(0,0,0,.5), 0 8px 26px rgba(0,0,0,.36);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%;
}
h1,h2,h3{font-family:"Barlow Condensed","Barlow",sans-serif; font-weight:600;
  line-height:1.14; margin:0; text-wrap:balance; letter-spacing:.005em}
h1{font-size:1.95rem} h2{font-size:1.4rem} h3{font-size:1.08rem}
p{margin:0}
.num,td.num,th.num,.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}

/* ---- status strip ---- */
header.hud{position:sticky; top:0; z-index:20; background:var(--panel);
  border-bottom:1px solid var(--line); box-shadow:var(--shadow)}
.hud-in{max-width:1040px; margin:0 auto; padding:.55rem 1.1rem;
  display:flex; align-items:center; gap:1.4rem; flex-wrap:wrap}
.wordmark{font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:1.18rem;
  letter-spacing:.13em; text-transform:uppercase; white-space:nowrap; display:flex;
  align-items:baseline; gap:.5rem}
.wordmark small{font-family:"Barlow",sans-serif; font-weight:500; font-size:.7rem;
  letter-spacing:.06em; color:var(--ink-3); text-transform:none}
.readouts{display:flex; gap:1.35rem; margin-left:auto; flex-wrap:wrap}
.ro{display:flex; flex-direction:column; line-height:1.1}
.ro .k{font-family:"Barlow Condensed",sans-serif; font-size:.68rem; font-weight:600;
  letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3)}
.ro .v{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
  font-size:1.12rem; font-weight:600}
.ro.hero .v{font-size:1.34rem}
.ro.hero .v.good{color:var(--ok)}
.ro.hero .v.bad{color:var(--no)}
.ro .v small{font-family:"Barlow",sans-serif; font-size:.7rem; font-weight:400;
  color:var(--ink-3); margin-left:.34rem; letter-spacing:0}

/* ---- tabs ---- */
nav.rail{background:var(--panel); border-bottom:1px solid var(--line); position:sticky;
  top:0; z-index:19}
.rail-in{max-width:1040px; margin:0 auto; padding:0 .8rem; display:flex; gap:0;
  overflow-x:auto; scrollbar-width:none}
.rail-in::-webkit-scrollbar{display:none}
.rail button{font-family:"Barlow Condensed",sans-serif; font-size:.92rem; font-weight:600;
  letter-spacing:.09em; text-transform:uppercase; background:none; border:0;
  border-bottom:2px solid transparent; color:var(--ink-3); padding:.62rem .85rem;
  cursor:pointer; white-space:nowrap}
.rail button:hover{color:var(--ink)}
.rail button.on,.rail button[aria-current="page"]{color:var(--accent);
  border-bottom-color:var(--accent)}

main{max-width:1040px; margin:0 auto; padding:1.2rem 1.1rem 2rem;
  display:flex; flex-direction:column; gap:1rem}
footer{max-width:1040px; margin:0 auto; padding:.4rem 1.1rem 3rem; display:flex;
  gap:1rem; justify-content:space-between; flex-wrap:wrap; color:var(--ink-3);
  font-size:.78rem}

/* ---- surfaces ---- */
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:1rem 1.15rem; box-shadow:var(--shadow); display:flex; flex-direction:column;
  gap:.7rem; margin:0}
.cardhead{display:flex; justify-content:space-between; align-items:baseline;
  gap:1rem; flex-wrap:wrap}
.cardhead h2{margin:0}
.eyebrow,.hint{font-family:"Barlow Condensed",sans-serif; font-size:.7rem; font-weight:600;
  letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
.sub,.lede{color:var(--ink-2); font-size:.94rem; max-width:66ch; margin:0}
.muted{color:var(--ink-3); font-size:.82rem}
.grid{display:grid; gap:.7rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.row{display:flex; gap:.6rem; flex-wrap:wrap; align-items:flex-end}
.row>div{flex:1; min-width:145px}
.empty{text-align:center; color:var(--ink-3); padding:1.6rem .6rem; font-size:.92rem}

.metric,.readout{background:var(--panel-2); border:1px solid var(--line);
  border-radius:var(--r); padding:.65rem .8rem; display:flex; flex-direction:column;
  gap:.12rem}
.readout .eyebrow{margin:0}
.stat{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
  font-size:1.62rem; font-weight:600; line-height:1.1}
.stat.small{font-size:1.25rem}
.stat.good{color:var(--ok)} .stat.bad{color:var(--no)}

/* ---- controls ---- */
button.btn{font-family:"Barlow Condensed",sans-serif; font-size:.95rem; font-weight:600;
  letter-spacing:.07em; text-transform:uppercase; padding:.5rem 1rem; cursor:pointer;
  border-radius:var(--r); border:1px solid var(--accent); background:var(--accent);
  color:var(--accent-ink)}
button.btn:hover{filter:brightness(1.08)}
button.btn.ghost{background:transparent; color:var(--accent)}
button.btn.danger{background:transparent; color:var(--no); border-color:var(--no)}
button.btn.mini{padding:.24rem .58rem; font-size:.8rem; letter-spacing:.05em;
  background:transparent; color:var(--accent)}
button.btn.mini.ghost{color:var(--ink-2); border-color:var(--line-2)}
button.btn:disabled{opacity:.45; cursor:not-allowed; filter:none}

label{display:block; font-family:"Barlow Condensed",sans-serif; font-size:.7rem;
  font-weight:600; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3);
  margin-bottom:.25rem}
input,select,textarea{font:inherit; font-size:.92rem; padding:.42rem .55rem;
  border:1px solid var(--line-2); border-radius:var(--r); background:var(--panel);
  color:var(--ink); width:100%}
input[type=date],input[type=number]{font-family:"IBM Plex Mono",monospace}
textarea{font-family:"IBM Plex Mono",monospace; font-size:.72rem; line-height:1.5}
.pick{display:flex; align-items:flex-start; gap:.5rem; background:var(--panel);
  border:1px solid var(--line); border-left:3px solid var(--line-2);
  border-radius:0 var(--r) var(--r) 0; padding:.5rem .65rem; cursor:pointer;
  font-size:.88rem; color:inherit}
.pick:hover{border-color:var(--line-2)}
.pick input{width:auto; margin:.2rem 0 0}

.tag{font-family:"Barlow Condensed",sans-serif; font-size:.64rem; font-weight:700;
  letter-spacing:.11em; text-transform:uppercase; padding:.1rem .36rem; border-radius:2px;
  background:var(--accent-soft); color:var(--accent); white-space:nowrap;
  display:inline-block; vertical-align:1px}
.tag.ga{background:var(--brass-soft); color:var(--brass)}
.tag.comp{background:var(--caution-soft); color:var(--caution)}
.tag.hard{background:var(--no-soft); color:var(--no)}

.bar-track{height:5px; border-radius:2px; background:var(--line); overflow:hidden;
  min-width:96px}
.bar-fill{display:block; height:100%; background:var(--accent)}
.bar-fill.high{background:var(--ok)} .bar-fill.mid{background:var(--caution)}
.bar-fill.low{background:var(--no)}

/* ---- tables ---- */
.scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{border-collapse:collapse; width:100%; font-size:.9rem; min-width:min(100%,460px)}
th{font-family:"Barlow Condensed",sans-serif; font-size:.7rem; font-weight:600;
  letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); text-align:left;
  padding:.4rem .5rem; border-bottom:1px solid var(--line-2); white-space:nowrap}
td{padding:.44rem .5rem; border-bottom:1px solid var(--line); vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right; white-space:nowrap}
td.up{color:var(--ok)} td.down{color:var(--no)}
table.stats td:first-child,table.stats th:first-child{min-width:170px; white-space:normal}
table.stats tr.grouprow td{font-family:"Barlow Condensed",sans-serif; font-size:.7rem;
  font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3);
  padding:.85rem .5rem .3rem; border-bottom:1px solid var(--line-2)}

/* ---- quiz ---- */
.progressbar{height:3px; background:var(--line); border-radius:2px; overflow:hidden}
.progressbar>div{display:block; height:100%; background:var(--accent); transition:width .18s}
.qhead{display:flex; justify-content:space-between; align-items:center; gap:1rem;
  flex-wrap:wrap; background:var(--panel); border:1px solid var(--line);
  border-radius:var(--r); padding:.55rem .9rem; box-shadow:var(--shadow)}
.timer{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
  font-size:1.3rem; font-weight:600}
.timer.warn{color:var(--no)}
.qtext{font-size:1.08rem; white-space:pre-wrap; max-width:68ch; margin:.35rem 0 .2rem}
.choices{display:flex; flex-direction:column; gap:.45rem}
.choice{display:flex; gap:.7rem; align-items:flex-start; text-align:left; font:inherit;
  color:inherit; background:var(--panel); border:1px solid var(--line);
  border-left:3px solid var(--line); border-radius:0 var(--r) var(--r) 0;
  padding:.58rem .8rem; cursor:pointer; width:100%}
.choice:hover:not(:disabled){border-color:var(--accent); border-left-color:var(--accent);
  background:var(--accent-soft)}
.choice:disabled{cursor:default}
.choice .k{font-family:"IBM Plex Mono",monospace; font-weight:600; color:var(--ink-3);
  min-width:1.05rem; flex:0 0 auto}
.choice.correct{border-color:var(--ok); border-left-color:var(--ok); background:var(--ok-soft)}
.choice.wrong{border-color:var(--no); border-left-color:var(--no); background:var(--no-soft)}
.choice.correct .k{color:var(--ok)} .choice.wrong .k{color:var(--no)}
.feedback{border:1px solid var(--line); border-left:3px solid var(--line);
  border-radius:0 var(--r) var(--r) 0; padding:.7rem .9rem; display:flex;
  flex-direction:column; gap:.3rem; margin-top:.8rem}
.feedback.ok{border-color:var(--ok); border-left-color:var(--ok); background:var(--ok-soft)}
.feedback.no{border-color:var(--no); border-left-color:var(--no); background:var(--no-soft)}
.feedback .verdict{font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:1rem;
  letter-spacing:.04em; text-transform:uppercase}
.feedback.ok .verdict{color:var(--ok)} .feedback.no .verdict{color:var(--no)}
.concept{font-size:.82rem; color:var(--ink-3); margin-top:.35rem; padding-top:.35rem;
  border-top:1px solid var(--line)}
.steps{margin:.4rem 0 0; padding-left:1.15rem; font-family:"IBM Plex Mono",monospace;
  font-size:.82rem; line-height:1.7}

/* ---- plan ---- */
.week{border-left:3px solid var(--accent); padding-left:.9rem; display:flex;
  flex-direction:column; gap:.3rem}
.week .when{font-family:"IBM Plex Mono",monospace; font-size:.76rem; color:var(--ink-3)}
.week ul{margin:.3rem 0 0; padding-left:1.1rem}
.week li{margin:.15rem 0; font-size:.92rem}
.focuslist{display:grid; gap:.4rem; margin-top:.5rem}
.focus{background:var(--panel-2); border:1px solid var(--line); border-radius:var(--r);
  padding:.5rem .65rem; font-size:.85rem}
.focus b{font-family:"Barlow Condensed",sans-serif; font-size:1rem; font-weight:600}

/* ---- trends ---- */
.trendrow{display:flex; gap:1rem; align-items:center; padding:.55rem 0;
  border-bottom:1px solid var(--line); flex-wrap:wrap}
.trendrow:last-child{border-bottom:0}
.trendrow .who{flex:1; min-width:190px}
.spark{color:var(--accent)}
.spark .gl{stroke:var(--line-2)}
.spark text{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:9px}

/* ------------------------------------------------------------- reading --
   The Study view is read, not scanned, so it gets its own typography: a text
   serif, a real measure, and space between things. Scoped so the dashboard
   tables keep their compact UI treatment. */
/* the reading column is sized to the text, so cards do not trail off into
   empty space on wide screens */
.reading{--measure:66ch; max-width:47rem; margin:0 auto; width:100%}
.reading .card{padding:1.5rem 1.7rem; gap:.55rem}
.reading h1{font-size:2.3rem; line-height:1.1; margin-bottom:.15rem}
.reading h2{font-size:1.5rem; line-height:1.2; margin-bottom:.5rem}
.reading h3{font-size:1.16rem; margin-bottom:.25rem}

.reading p, .reading li, .reading .vdef{
  font-family:"Source Serif 4", Georgia, "Times New Roman", serif;
  font-size:1.09rem;
  line-height:1.78;
  max-width:var(--measure);
  color:var(--ink);
}
.reading p{margin:0 0 .55rem}
.reading p:last-child{margin-bottom:0}
.reading .sub{
  font-family:"Source Serif 4", Georgia, serif;
  font-size:1.14rem; line-height:1.7; color:var(--ink-2);
  max-width:var(--measure); margin:.15rem 0 .9rem;
}
.reading .muted{font-family:"Barlow",sans-serif; font-size:.84rem; line-height:1.55}

/* lists become breathing definition lists rather than a wall */
.reading ul{
  list-style:none; margin:.35rem 0 0; padding:0;
  display:flex; flex-direction:column; gap:.85rem;
}
.reading ul li{
  position:relative; padding-left:1.1rem; margin:0;
}
.reading ul li::before{
  content:""; position:absolute; left:0; top:.72em;
  width:5px; height:5px; border-radius:50%; background:var(--accent); opacity:.55;
}
.reading li .term{
  font-family:"Barlow", sans-serif; font-weight:600; font-size:1.02rem;
  color:var(--ink); letter-spacing:.005em;
}
.reading li .term::after{content:" — "; color:var(--ink-3); font-weight:400}

/* vocabulary as a definition list with room to breathe */
.vocablist{display:flex; flex-direction:column; gap:1rem; margin-top:.3rem}
.vocabitem{
  display:grid; grid-template-columns:minmax(150px,15rem) 1fr; gap:.2rem 1.5rem;
  padding-bottom:.95rem; border-bottom:1px solid var(--line);
}
.vocabitem:last-child{border-bottom:0; padding-bottom:0}
.vterm{
  font-family:"Barlow", sans-serif; font-weight:600; font-size:1.02rem;
  color:var(--accent); line-height:1.5;
}
.vocabitem .vdef{margin:0}
@media (max-width:640px){
  .vocabitem{grid-template-columns:1fr; gap:.1rem}
}

/* worked examples: setup, steps, takeaway - each visually distinct */
.example{
  border-left:3px solid var(--accent); padding:.15rem 0 .15rem 1.1rem;
  display:flex; flex-direction:column; gap:.5rem;
}
.example + .example{margin-top:1.5rem; padding-top:1.4rem; border-top:1px solid var(--line)}
.example .setup{
  font-family:"Source Serif 4", Georgia, serif; font-style:italic;
  font-size:1.06rem; line-height:1.7; color:var(--ink-2); max-width:var(--measure);
}
.reading .steps{
  list-style:decimal; margin:.1rem 0 0; padding-left:1.5rem;
  display:flex; flex-direction:column; gap:.5rem;
  font-family:"IBM Plex Mono", monospace; font-size:.9rem; line-height:1.65;
  max-width:var(--measure);
}
.reading .steps li{padding-left:.2rem; font-family:inherit; font-size:inherit; line-height:inherit}
.reading .steps li::before{display:none}
.takeaway{
  background:var(--panel-2); border:1px solid var(--line); border-radius:var(--r);
  padding:.7rem .9rem; font-family:"Source Serif 4", Georgia, serif;
  font-size:1.04rem; line-height:1.65; max-width:var(--measure);
}
.takeaway b{font-family:"Barlow",sans-serif; font-weight:600; font-size:.78rem;
  letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); display:block;
  margin-bottom:.15rem}

/* callout blocks (Georgia differences, common traps) */
.callouts{display:flex; flex-direction:column; gap:.8rem; margin-top:.2rem}
.callout{
  border-left:3px solid var(--line-2); padding:.1rem 0 .1rem 1rem;
  font-family:"Source Serif 4", Georgia, serif; font-size:1.06rem; line-height:1.72;
  max-width:var(--measure);
}
.callout.ga{border-left-color:var(--brass)}
.callout.trap{border-left-color:var(--no)}

/* the topic index reads as a list of things to open, not a data table */
.topiclist{display:flex; flex-direction:column; gap:.15rem}
.topicrow{
  display:flex; gap:1rem; align-items:center; justify-content:space-between;
  padding:.85rem .2rem; border-bottom:1px solid var(--line); flex-wrap:wrap;
}
.topicrow:last-child{border-bottom:0}
.topicrow .who{flex:1; min-width:230px}
.topicrow .nm{font-family:"Barlow Condensed",sans-serif; font-weight:600; font-size:1.2rem}
.topicrow .bl{font-size:.88rem; color:var(--ink-3); line-height:1.5; margin-top:.05rem}
.topicrow .acts{display:flex; gap:.4rem; align-items:center}
.topicrow .cnt{font-family:"IBM Plex Mono",monospace; font-size:.78rem; color:var(--ink-3);
  white-space:nowrap; margin-right:.4rem}

/* Runs of capitals - acronyms and the emphasis used throughout the notes -
   are set slightly smaller with tracking, the normal treatment for caps in
   running text. Without this they shout at reading size. */
.reading .caps{
  font-size:.9em; letter-spacing:.045em; font-weight:600;
  font-family:"Barlow", sans-serif;
}
.reading .steps .caps, .reading .vterm .caps{font-family:inherit; font-weight:inherit}

/* ---- section checks: a short self-test after each block of reading ---- */
.check{
  margin-top:1.1rem; padding:.9rem 1rem; border-radius:var(--r);
  background:var(--panel-2); border:1px solid var(--line);
  border-left:3px solid var(--accent);
  display:flex; flex-direction:column; gap:.85rem;
}
.checkhead{
  display:flex; justify-content:space-between; align-items:baseline; gap:.8rem;
  font-family:"Barlow Condensed",sans-serif; font-size:.72rem; font-weight:600;
  letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3);
}
.checkscore{font-family:"IBM Plex Mono",monospace; font-size:.72rem; letter-spacing:0}
.checkq{display:flex; flex-direction:column; gap:.45rem}
.reading .cq{
  font-family:"Barlow",sans-serif; font-size:.98rem; line-height:1.5;
  font-weight:500; margin:0; max-width:var(--measure); color:var(--ink);
}
.copts{display:flex; flex-direction:column; gap:.3rem; max-width:var(--measure)}
.copt{
  text-align:left; font:inherit; font-family:"Barlow",sans-serif; font-size:.92rem;
  line-height:1.45; color:var(--ink); background:var(--panel);

}
.copt:hover:not(:disabled){border-color:var(--accent); background:var(--accent-soft)}
.copt:disabled{cursor:default}
.copt.right{border-color:var(--ok); background:var(--ok-soft); color:var(--ink)}
.copt.wrong{border-color:var(--no); background:var(--no-soft); color:var(--ink)}
.cwhy{
  font-family:"Barlow",sans-serif; font-size:.87rem; line-height:1.55;
  color:var(--ink-2); max-width:var(--measure); padding-left:.1rem;
}
.cwhy b{font-family:"Barlow Condensed",sans-serif; letter-spacing:.06em;
  text-transform:uppercase; font-size:.72rem; margin-right:.35rem}
.cwhy.ok b{color:var(--ok)} .cwhy.no b{color:var(--no)}
</style>

y":"comp/vocabulary","portion":"comprehensive","label":"Vocabulary & terminology","exam_questions":12,"blurb":"The terms both portions assume you already know.","counts_on_exam":false},{"key":"comp/situational","portion":"comprehensive","label":"Situational judgment","exam_questions":12,"blurb":"You are the licensee -- what do you actually do?","counts_on_exam":false},{"key":"comp/grec-deep","portion":"comprehensive","label":"GREC law deep-dive","exam_questions":10,"blurb":"The license-law detail the state portion leans on hardest.","counts_on_exam":false},{"key":"comp/closing-math","portion":"comprehensive","label":"Closing & settlement math","exam_questions":8,"blurb":"Debits, credits, prorations, and who pays what at the table.","counts_on_exam":false}],"banks":{"national":[{"answer":1,"choices":["Estate at sufferance","Leased fee estate","Leasehold estate","Life estate"],"concept":"Freehold vs. leasehold interests","difficulty":1,"explain":"The LANDLORD holds the leased fee estate (ownership subject to the lease); the TENANT holds the leasehold. A tenant who stays past expiration without permission creates an estate at sufferance, but that describes the tenant, not the landlord.","id":"nat-140b8304","portion":"national","q":"A tenant's lease expires and the landlord takes back possession. The landlord's interest during the lease term was a:","sub":"national/ownership|Estates & the bundle of rights","subtopic":"Estates & the bundle of rights","topic":"national/ownership"},{"answer":2,"choices":["Joint tenant with the other two","Trustee for the other two","Tenant in common with the other two","Tenant by the entirety"],"concept":"Severance of joint tenancy","difficulty":1,"explain":"Selling a joint tenancy interest severs the four unities as to that share. The buyer takes as a tenant in common; the two remaining original owners stay joint tenants with each other and keep survivorship between themselves.","id":"nat-706069e5","portion":"national","q":"Three people own property as joint tenants. One sells her interest to a stranger. The new owner holds title as a:","sub":"national/ownership|Co-ownership & survivorship","subtopic":"Co-ownership & survivorship","topic":"national/ownership"},{"answer":2,"choices":["Fee simple defeasible","Life estate pur autre vie","Fee simple absolute","Leasehold for 99 years"],"concept":"The bundle of rights and degrees of ownership","difficulty":1,"explain":"Fee simple absolute is ownership without condition or time limit -- the entire bundle of rights. A defeasible fee can be lost if a condition occurs, and a life estate ends at a death.","id":"nat-fd3b7053","portion":"national","q":"Which of these is the MOST complete form of ownership recognized in law?","sub":"national/ownership|Estates & the bundle of rights","subtopic":"Estates & the bundle of rights","topic":"national/ownership"},{"answer":1,"choices":["An emblement","A fixture that conveys with the real estate","Personal property the seller may remove","A trade fixture"],"concept":"Fixtures: personal property becoming real property","difficulty":1,"explain":"Courts look at method of annexation, adaptation to the property, and intent. A built-in appliance is annexed and adapted, so it conveys unless the contract excludes it. Trade fixtures belong to a commercial TENANT and are removable.","id":"nat-dd11c32c","portion":"national","q":"A built-in dishwasher installed by the seller is BEST classified at closing as:","sub":"national/ownership|Fixtures & trade fixtures","subtopic":"Fixtures & trade fixtures","topic":"national/ownership"},{"answer":0,"choices":["As a tenant in common with the other unit owners","Under a proprietary lease","Not at all -- the association owns them","As a joint tenant with the association"],"concept":"Condominium vs. cooperative ownership","difficulty":1,"explain":"Condo owners own their unit in fee plus an undivided tenancy-in-common interest in common elements. A COOPERATIVE is the one where a corporation owns the building and the resident holds stock plus a proprietary lease.","id":"nat-0f115e44","portion":"national","q":"In a condominium, the individual owner holds fee simple title to the unit and owns the common elements:","sub":"national/ownership|Condos, co-ops & timeshares","subtopic":"Condos, co-ops & timeshares","topic":"national/ownership"},{"answer":0,"choices":["Riparian rights","Littoral rights","Prior appropriation","Percolating rights"],"concept":"Water rights","difficulty":1,"explain":"Riparian rights attach to flowing water -- rivers and streams. LITTORAL rights attach to static bodies: lakes, seas, oceans. Prior appropriation is the western doctrine where use is granted by permit regardless of adjacency.","id":"nat-1131797b","portion":"national","q":"A property abuts a navigable river. The owner's rights to use the water are called:","sub":"national/ownership|Water & private controls","subtopic":"Water & private controls","topic":"national/ownership"},{"answer":2,"choices":["Joint tenancy","Tenancy in common","Tenancy by the entirety","Community property"],"concept":"Forms of co-ownership between spouses","difficulty":1,"explain":"Tenancy by the entirety is the marital form where neither spouse can convey separately and survivorship is automatic. Note that Georgia does NOT recognize tenancy by the entirety -- a fact the state portion may test.","id":"nat-1d9b363e","portion":"national","q":"A husband and wife hold title with right of survivorship that neither can defeat by a separate conveyance. This is:","sub":"national/ownership|Co-ownership & survivorship","subtopic":"Co-ownership & survivorship","topic":"national/ownership"},{"answer":1,"choices":["Encroaching parcel","Dominant tenement","Servient tenement","Licensed parcel"],"concept":"Easement appurtenant terminology","difficulty":1,"explain":"The parcel that BENEFITS is the dominant tenement; the parcel burdened by the crossing is the servient tenement. An easement appurtenant runs with the land and passes to later owners.","id":"nat-1ca4fbeb","portion":"national","q":"An owner grants a neighbor the right to cross her land to reach a road. The neighbor's parcel is the:","sub":"national/ownership|Easements & encroachments","subtopic":"Easements & encroachments","topic":"national/ownership"},{"answer":2,"choices":["Collect rents from the property","Lease the property","Devise the property by will","Mortgage the life estate"],"concept":"Rights and limits of a life estate","difficulty":1,"explain":"A life estate ends at the measuring life's death, so there is nothing left to pass by will -- it cannot be devised. The life tenant may otherwise use, lease, and encumber the interest, subject to not committing waste.","id":"nat-972eb5b6","portion":"national","q":"A life tenant may do all of the following EXCEPT:","sub":"national/ownership|Estates & the bundle of rights","subtopic":"Estates & the bundle of rights","topic":"national/ownership"},{"answer":2,"choices":["A license","An easement by prescription","An encroachment","A deed restriction"],"concept":"Encroachments and how they are discovered","difficulty":1,"explain":"An unauthorized physical intrusion onto another's land is an encroachment, typically revealed by a survey. If it continues openly for the statutory period it may ripen into a prescriptive easement, but the intrusion itself is the encroachment.","id":"nat-6f524289","portion":"national","q":"A fence built two feet onto the neighbor's lot is an example of:","sub":"national/ownership|Easements & encroachments","subtopic":"Easements & encroachments","topic":"national/ownership"},{"answer":3,"choices":["Leasehold interest","Right-to-use interest","License","Timeshare estate"],"concept":"Timeshare estates vs. right-to-use","difficulty":1,"explain":"A timeshare ESTATE conveys a real property interest by deed. A right-to-use timeshare is only a contract right to occupy for a term, with no ownership interest -- it expires when the contract ends.","id":"nat-663453e6","portion":"national","q":"Ownership of a timeshare that gives the buyer a deeded fractional interest is a:","sub":"national/ownership|Condos, co-ops & timeshares","subtopic":"Condos, co-ops & timeshares","topic":"national/ownership"},{"answer":0,"choices":["Recorded covenants, conditions and restrictions","The doctrine of eminent domain","State police power","Zoning ordinance"],"concept":"Private land use control vs. public","difficulty":1,"explain":"CC&Rs are PRIVATE restrictions recorded against the subdivision and enforced by the HOA or owners through injunction. Zoning and police power are PUBLIC controls enforced by government.","id":"nat-ddda222c","portion":"national","q":"A homeowner's association enforces a rule barring commercial signs. The authority for that rule comes from:","sub":"national/ownership|Water & private controls","subtopic":"Water & private controls","topic":"national/ownership"},{"answer":1,"choices":["Variance","Nonconforming use","Spot zoning","Special use"],"concept":"Nonconforming use ('grandfathering')","difficulty":1,"explain":"A lawful use that predates the new zoning may continue as a legal nonconforming use. A VARIANCE is permission to deviate granted on hardship; a SPECIAL USE permit allows a listed conditional use like a church or school.","id":"nat-9c1c1268","portion":"national","q":"A city rezones an area from commercial to residential. An existing store may continue operating as a:","sub":"national/landuse|Zoning, variances & nonconforming use","subtopic":"Zoning, variances & nonconforming use","topic":"national/landuse"},{"answer":0,"choices":["Eminent domain","Police power","Escheat","Condemnation"],"concept":"The four government powers over land (PETE)","difficulty":1,"explain":"EMINENT DOMAIN is the power itself; CONDEMNATION is the legal proceeding that exercises it. Police power regulates without paying (zoning, codes); escheat passes property to the state when an owner dies with no heirs or will.","id":"nat-3ef4ffb9","portion":"national","q":"Government's power to take private property for public use upon payment of just compensation is:","sub":"national/landuse|Government powers over land","subtopic":"Government powers over land","topic":"national/landuse"},{"answer":3,"choices":["Rezoning","Conditional use permit","Nonconforming use permit","Variance"],"concept":"Variance as relief from a dimensional requirement","difficulty":1,"explain":"A variance permits a deviation from a dimensional rule when strict compliance creates a unique hardship not caused by the owner. Rezoning changes the classification for everyone; a conditional use permits a different TYPE of use.","id":"nat-a4e3d303","portion":"national","q":"A lot is too narrow to meet the setback requirement. The owner should seek a:","sub":"national/landuse|Zoning, variances & nonconforming use","subtopic":"Zoning, variances & nonconforming use","topic":"national/landuse"},{"answer":1,"choices":["Inverse condemnation","Spot zoning","A buffer zone","Downzoning"],"concept":"Illegal zoning practices","difficulty":1,"explain":"Spot zoning singles out one parcel for treatment inconsistent with the comprehensive plan and is generally invalid. Downzoning reduces intensity across an area; inverse condemnation is an owner's suit claiming a regulation effectively took the property.","id":"nat-2abb62ce","portion":"national","q":"Rezoning a single parcel for the benefit of one owner, inconsistent with the surrounding area, is:","sub":"national/landuse|Zoning, variances & nonconforming use","subtopic":"Zoning, variances & nonconforming use","topic":"national/landuse"},{"answer":0,"choices":["Ensure compliance with building codes for public safety","Confirm marketable title","Raise revenue for the municipality","Establish the property's assessed value"],"concept":"Building codes as an exercise of police power","difficulty":1,"explain":"Codes and permits exist to protect public health and safety. The certificate of OCCUPANCY issued at the end confirms the structure may lawfully be occupied.","id":"nat-6163c84a","portion":"national","q":"The primary purpose of a building permit and subsequent inspections is to:","sub":"national/landuse|Codes, permits & environmental review","subtopic":"Codes, permits & environmental review","topic":"national/landuse"},{"answer":0,"choices":["Any lot owner in the subdivision","Only the original developer","The state real estate commission","The zoning board only"],"concept":"Enforcement of private deed restrictions","difficulty":1,"explain":"Restrictive covenants run with the land and any benefited lot owner may sue to enforce them, usually by injunction. Government bodies do not enforce private covenants.","id":"nat-29dbb24d","portion":"national","q":"A subdivision developer records a plat with restrictions limiting lots to single-family homes. These restrictions are enforceable by:","sub":"national/landuse|Private restrictions & access","subtopic":"Private restrictions & access","topic":"national/landuse"},{"answer":2,"choices":["Has the force of law immediately","Applies only to commercial districts","Is a long-range policy guide for future development","Replaces the need for building codes"],"concept":"Planning vs. zoning","difficulty":1,"explain":"The comprehensive plan states long-term goals; ZONING ordinances are the legal tool that implements the plan parcel by parcel.","id":"nat-0e6b7ee8","portion":"national","q":"A comprehensive (master) plan differs from zoning in that the plan:","sub":"national/landuse|Zoning, variances & nonconforming use","subtopic":"Zoning, variances & nonconforming use","topic":"national/landuse"},{"answer":3,"choices":["Dedication","Eminent domain","Adverse possession","Escheat"],"concept":"Escheat","difficulty":1,"explain":"Escheat prevents land from being ownerless. It applies only when there is neither a will nor any locatable heir.","id":"nat-d5092a9f","portion":"national","q":"Land that reverts to the state when an owner dies leaving no heirs and no will passes by:","sub":"national/landuse|Government powers over land","subtopic":"Government powers over land","topic":"national/landuse"},{"answer":1,"choices":["A property is refinanced","A federal action may significantly affect the environment","A lease exceeds one year","Any home is resold"],"concept":"Environmental review under NEPA","difficulty":1,"explain":"NEPA requires an EIS for major FEDERAL actions significantly affecting the human environment -- typically large developments involving federal funding, permits, or land.","id":"nat-7ca13b8c","portion":"national","q":"An environmental impact statement is MOST likely required when:","sub":"national/landuse|Codes, permits & environmental review","subtopic":"Codes, permits & environmental review","topic":"national/landuse"},{"answer":3,"choices":["Easement in gross","Right-of-way","Setback","Buffer zone"],"concept":"Zoning transition devices","difficulty":1,"explain":"A buffer zone cushions between, say, industrial and residential districts. A SETBACK is the required distance from a lot line to a structure.","id":"nat-5be8bbc3","portion":"national","q":"The strip of land separating incompatible zoning districts, often landscaped, is a:","sub":"national/landuse|Zoning, variances & nonconforming use","subtopic":"Zoning, variances & nonconforming use","topic":"national/landuse"},{"answer":2,"choices":["Sales comparison approach","Income approach","Cost approach","Gross rent multiplier"],"concept":"Choosing the appropriate approach to value","difficulty":1,"explain":"Special-purpose properties rarely sell and produce no rent, so the COST approach (reproduction cost less depreciation plus land) is most reliable. Sales comparison needs comparables; income needs rental income.","id":"nat-ffdfc09d","portion":"national","q":"An appraiser valuing a 40-year-old church would rely MOST heavily on the:","sub":"national/valuation|Appraisal process & approaches","subtopic":"Appraisal process & approaches","topic":"national/valuation"},{"answer":0,"choices":["Substitution","Anticipation","Conformity","Progression"],"concept":"Appraisal principles","difficulty":1,"explain":"SUBSTITUTION underlies the whole sales comparison approach. Progression is a modest home gaining value near larger ones; anticipation is value based on expected future benefits.","id":"nat-036f4666","portion":"national","q":"The principle stating that a property's maximum value tends to be set by the cost of an equally desirable substitute is:","sub":"national/valuation|Value principles","subtopic":"Value principles","topic":"national/valuation"},{"answer":3,"choices":["$328,000","$310,000","$301,000","$319,000"],"concept":"Direction of adjustments in the sales comparison approach","difficulty":1,"explain":"Always adjust the COMPARABLE, never the subject. The comp is inferior, so ADD the value of the missing feature: $310,000 + $9,000 = $319,000. Memory hook: CIA -- Comp Inferior, Add.","id":"nat-beb7a3b8","portion":"national","q":"A comparable sold for $310,000 but has one fewer bathroom than the subject, worth $9,000. The adjusted sale price is:","sub":"national/valuation|Sales comparison & adjustments","subtopic":"Sales comparison & adjustments","topic":"national/valuation"},{"answer":2,"choices":["Regression","Plottage","Progression","Contribution"],"concept":"Progression and regression","difficulty":1,"explain":"PROGRESSION: the lesser property is pulled up by superior neighbors. REGRESSION is the reverse -- a superior property dragged down by lesser surroundings.","id":"nat-559092c3","portion":"national","q":"A modest home located among much larger, expensive homes tends to gain value. This illustrates:","sub":"national/valuation|Value principles","subtopic":"Value principles","topic":"national/valuation"},{"answer":2,"choices":["Economic appreciation","Physical deterioration","Functional obsolescence","External obsolescence"],"concept":"The three types of depreciation","difficulty":1,"explain":"FUNCTIONAL obsolescence is a defect within the structure's design or utility. Physical deterioration is wear and tear; EXTERNAL obsolescence comes from outside the property line and is always incurable.","id":"nat-1048e826","portion":"national","q":"Loss in value because a home has only one bathroom and buyers expect two is:","sub":"national/valuation|Depreciation & obsolescence","subtopic":"Depreciation & obsolescence","topic":"national/valuation"},{"answer":0,"choices":["External obsolescence","Deferred maintenance","Curable physical deterioration","Functional obsolescence"],"concept":"External (economic) obsolescence","difficulty":1,"explain":"The cause is outside the property boundaries and beyond the owner's control, so it is external obsolescence -- by definition incurable, because the owner cannot remove the highway.","id":"nat-c8b8af53","portion":"national","q":"A highway is built next to a residence, reducing its value. This is:","sub":"national/valuation|Depreciation & obsolescence","subtopic":"Depreciation & obsolescence","topic":"national/valuation"},{"answer":0,"choices":["$750,000","$480,000","$4,800,000","$600,000"],"concept":"IRV formula in the income approach","difficulty":1,"explain":"Value = NOI / Rate = $60,000 / 0.08 = $750,000. Remember IRV: Income = Rate x Value. Note that cap rate and value move INVERSELY -- a higher cap rate means lower value.","id":"nat-14230394","portion":"national","q":"In the income approach, a property with $60,000 net operating income and a 8% capitalization rate is valued at:","sub":"national/valuation|Income approach & cap rates","subtopic":"Income approach & cap rates","topic":"national/valuation"},{"answer":3,"choices":["Chosen by the owner","Most profitable regardless of legality","The current use in all cases","Legally permitted, physically possible, financially feasible, and maximally productive"],"concept":"Highest and best use","difficulty":1,"explain":"All four tests must be met, and legality comes first -- an illegal use can never be highest and best no matter how profitable.","id":"nat-8ec7ff53","portion":"national","q":"The highest and best use of a property is the use that is:","sub":"national/valuation|Value principles","subtopic":"Value principles","topic":"national/valuation"},{"answer":2,"choices":["Performing an appraisal requiring a license","Determining assessed value for taxation","Estimating market value using recent comparable sales","Required to use the cost approach"],"concept":"CMA vs. appraisal","difficulty":1,"explain":"A CMA is a broker's pricing opinion built from comparables to help set a list price. It is NOT an appraisal, may not be represented as one, and does not require an appraiser's license.","id":"nat-45ea517d","portion":"national","q":"A broker preparing a CMA for a seller is:","sub":"national/valuation|Appraisal process & approaches","subtopic":"Appraisal process & approaches","topic":"national/valuation"},{"answer":1,"choices":["The seller's asking price","The most probable price under normal, arm's-length conditions","Always equal to assessed value","What the property actually sold for"],"concept":"Value vs. price vs. cost","difficulty":1,"explain":"MARKET VALUE is an opinion of the most probable price assuming an informed buyer and seller, adequate exposure, and no duress. MARKET PRICE is the historical fact of what a property actually sold for -- which may reflect a distress sale.","id":"nat-dfd5d480","portion":"national","q":"Market value differs from market price in that market value is:","sub":"national/valuation|Value principles","subtopic":"Value principles","topic":"national/valuation"},{"answer":2,"choices":["Contribution","Assemblage cost","Plottage increment","Progression"],"concept":"Assemblage and plottage","difficulty":1,"explain":"ASSEMBLAGE is the act of joining parcels; PLOTTAGE (or plottage increment) is the added value that results. The exam frequently pairs these two terms as distractors.","id":"nat-e0e35d20","portion":"national","q":"Combining two adjacent lots so the whole is worth more than the sum of the parts creates:","sub":"national/valuation|Value principles","subtopic":"Value principles","topic":"national/valuation"},{"answer":1,"choices":["Correlation of assessments","Reconciliation","Averaging","Adjustment"],"concept":"The appraisal process","difficulty":1,"explain":"Reconciliation weighs each approach by its reliability for that property type. An appraiser never simply averages the three values.","id":"nat-42662f96","portion":"national","q":"The appraisal step in which the three approaches are weighted into a single conclusion is:","sub":"national/valuation|Appraisal process & approaches","subtopic":"Appraisal process & approaches","topic":"national/valuation"},{"answer":1,"choices":["Subordination clause","Acceleration clause","Alienation clause","Defeasance clause"],"concept":"Standard mortgage clauses","difficulty":1,"explain":"ACCELERATION makes the whole balance due on default -- a prerequisite to foreclosure. The ALIENATION (due-on-sale) clause triggers on TRANSFER, not default; DEFEASANCE requires the lender to release the lien when the debt is paid.","id":"nat-215dd2bd","portion":"national","q":"The clause allowing a lender to declare the entire balance due immediately upon default is the:","sub":"national/financing|Mortgage clauses & instruments","subtopic":"Mortgage clauses & instruments","topic":"national/financing"},{"answer":1,"choices":["The legal owner of the property","Secondarily liable for the debt","Entitled to the tax deduction","Free of all liability"],"concept":"Assumption vs. 'subject to' vs. novation","difficulty":1,"explain":"On assumption the buyer becomes primarily liable, but the original borrower stays SECONDARILY liable until the lender grants a release -- a NOVATION. Taking title 'subject to' the loan means the buyer accepts no personal liability at all.","id":"nat-103788d5","portion":"national","q":"A buyer assumes the sell rket","subtopic":"Lending law & the secondary market","topic":"national/financing"},{"answer":2,"choices":["Escrow agent","Mortgagee","Trustee","Grantor"],"concept":"Mortgage vs. deed of trust","difficulty":1,"explain":"The TRUSTEE holds bare legal title for the lender (beneficiary) and can conduct a nonjudicial foreclosure sale. Georgia uses a similar instrument called a security deed.","id":"nat-f1b49f53","portion":"national","q":"In a deed of trust there are three parties: the borrower, the lender, and the:","sub":"national/financing|Mortgage clauses & instruments","subtopic":"Mortgage clauses & instruments","topic":"national/financing"},{"answer":3,"choices":["Fixed-rate mortgage","Purchase-money mortgage","Wraparound mortgage","Adjustable-rate mortgage"],"concept":"ARM structure","difficulty":1,"explain":"An ARM's rate equals INDEX + MARGIN, adjusted at intervals subject to periodic and lifetime caps. The margin is the lender's constant markup; the index moves with the market.","id":"nat-eeedfd3c","portion":"national","q":"A loan where the interest rate adjusts periodically based on a published index is a:","sub":"national/financing|Loan types & structures","subtopic":"Loan types & structures","topic":"national/financing"},{"answer":0,"choices":["The maximum interest rate a lender may charge","Prepayment penalties","Loan-to-value ratios","The number of points charged"],"concept":"Usury","difficulty":1,"explain":"Usury statutes cap the maximum lawful interest rate. Exceeding the cap can cost the lender interest or subject it to penalties.","id":"nat-08b7e7c6","portion":"national","q":"Usury laws limit:","sub":"national/financing|Mortgage clauses & instruments","subtopic":"Mortgage clauses & instruments","topic":"national/financing"},{"answer":0,"choices":["Purchase-money mortgage","Package mortgage","Open-end mortgage","Blanket mortgage"],"concept":"Specialty loan types","difficulty":1,"explain":"A purchase-money mortgage is seller financing taken back at the sale. A BLANKET mortgage covers multiple parcels with a release clause; a PACKAGE mortgage includes personal property; an OPEN-END loan lets the borrower re-borrow.","id":"nat-fb6f1082","portion":"national","q":"A seller finances part of the buyer's purchase and takes back a note secured by the property. This is a:","sub":"national/financing|Loan types & structures","subtopic":"Loan types & structures","topic":"national/financing"},{"answer":2,"choices":["Marital status","Receipt of public assistance","Amount of verifiable income","Age (if the applicant can contract)"],"concept":"ECOA protected bases","difficulty":1,"explain":"ECOA bars race, color, religion, national origin, sex, marital status, age, and receipt of public assistance. A lender MAY absolutely evaluate the amount and stability of income -- that is legitimate underwriting.","id":"nat-0ae2a8e2","portion":"national","q":"The Equal Credit Opportunity Act prohibits discrimination in lending based on all of the following EXCEPT:","sub":"national/financing|Lending law & the secondary market","subtopic":"Lending law & the secondary market","topic":"national/financing"},{"answer":1,"choices":["1 business day before consummation","3 business days before consummation","10 business days before consummation","7 business days before consummation"],"concept":"TRID timing rules","difficulty":1,"explain":"The Closing Disclosure must be in the borrower's hands 3 business days before closing. The Loan Estimate is due within 3 business days of APPLICATION, and there is a separate 7-business-day wait between the LE and consummation.","id":"nat-edafaad0","portion":"national","q":"Under TRID, the Closing Disclosure must be received by the borrower at least:","sub":"national/financing|Points, yield & TRID disclosure","subtopic":"Points, yield & TRID disclosure","topic":"national/financing"},{"answer":3,"choices":["Tell any buyer who asks","Tell only buyers who are also clients","Disclose it in the MLS","Keep it confidential un tions & installment contracts","topic":"national/contracts"},{"answer":0,"choices":["Rights only, with the assignor remaining secondarily liable","All liability, releasing the assignor completely","Ownership of the real property","Nothing without a new contract"],"concept":"Assignment vs. novation","difficulty":1,"explain":"An assignment passes rights but leaves the original party secondarily liable. Only a NOVATION -- substituting a new party with everyone's consent -- releases the original party.","id":"nat-fb500977","portion":"national","q":"Assignment of a contract transfers:","sub":"national/contracts|Assignment & novation","subtopic":"Assignment & novation","topic":"national/contracts"},{"answer":3,"choices":["Executory","Void","Unilateral","Executed"],"concept":"Executory vs. executed","difficulty":1,"explain":"EXECUTED means fully performed. A contract signed but not yet closed is EXECUTORY -- a distinction the exam likes, since 'executed' also loosely means 'signed' in everyday speech.","id":"nat-bb8886e4","portion":"national","q":"A contract that has been fully performed by both parties is:","sub":"national/contracts|Contract terms & performance","subtopic":"Contract terms & performance","topic":"national/contracts"},{"answer":3,"choices":["Lender, by fixing the rate","Seller, by guaranteeing the sale","Broker, by securing commission","Buyer, by allowing withdrawal if the loan is denied"],"concept":"Contingencies as conditions precedent","difficulty":1,"explain":"If the buyer applies in good faith and the loan is denied within the contingency period, the buyer may terminate and recover the earnest money.","id":"nat-8b534de3","portion":"national","q":"A financing contingency in a purchase agreement protects the:","sub":"national/contracts|Contingencies & conditions","subtopic":"Contingencies & conditions","topic":"national/contracts"},{"answer":2,"choices":["Absence of earnest money","A low sale price","Fraud, duress, menace, undue influence, or mistake","Failure to record"],"concept":"Genuine assent","difficulty":1,"explain":"The four essentials are competent parties, mutual assent (offer and acceptance), consideration, and lawful object. Fraud or duress makes the contract VOIDABLE by the injured party.","id":"nat-b4cf064c","portion":"national","q":"Mutual assent in a contract is destroyed by:","sub":"national/contracts|Validity, capacity & the Statute of Frauds","subtopic":"Validity, capacity & the Statute of Frauds","topic":"national/contracts"},{"answer":1,"choices":["Death of the offeror","The offeree telling a friend she will probably accept","Revocation before acceptance","Lapse of the stated time"],"concept":"Termination of an offer","difficulty":1,"explain":"Acceptance must be communicated TO THE OFFEROR. Private intent changes nothing. Offers end by revocation, rejection, counteroffer, lapse, death or incapacity, or destruction of the property.","id":"nat-c505648a","portion":"national","q":"An offer terminates in all of the following ways EXCEPT:","sub":"national/contracts|Offer, acceptance & counteroffers","subtopic":"Offer, acceptance & counteroffers","topic":"national/contracts"},{"answer":2,"choices":["Recording a satisfaction","Delivering the deed at signing","Retaining legal title until the price is paid","Providing title insurance"],"concept":"Installment land contracts","difficulty":1,"explain":"The buyer takes possession and equitable title while the seller keeps legal title as security. The buyer's risk is losing everything on default if the contract lacks protection.","id":"nat-0b17e06c","portion":"national","q":"A land contract (contract for deed) is characterized by the seller:","sub":"national/contracts|Options & installment contracts","subtopic":"Options & installment contracts","topic":"national/contracts"},{"answer":0,"choices":["Agreed to in advance in the contract","Determined by a jury after trial","Unenforceable in real estate","Always three times the deposit"],"concept":"Liquidated damages clauses","difficulty":1,"explain":"Parties fix the amount in advance -- typically the earnest money -- to avoid litigating actual loss. Courts will void the clause if the sum is so large it functions as a penalty.","id":"nat-ee5f6eda","portion":"national","q":"Liquidated damages differ from actual damages in that liquidated damages are:","sub":"national/contracts|Breach, remedies & damages","subtopic":"Breach, remedies & damages","topic":"national/contracts"},{"answer":2,"choices":["Reformation","Novation","Rescission","Assignment"],"concept":"Discharge of contracts","difficulty":1,"explain":"RESCISSION unwinds the contract and returns the parties to the status quo. REFORMATION is a court rewriting the document to reflect the parties' true intent -- usually to fix a scrivener's error.","id":"nat-53e024b5","portion":"national","q":"If a buyer and seller sign an agreement to cancel their contract and restore each party to their prior position, this is:","sub":"national/contracts|Breach, remedies & damages","subtopic":"Breach, remedies & damages","topic":"national/contracts"},{"answer":1,"choices":["Quitclaim deed","General warranty deed","Bargain and sale deed","Special warranty deed"],"concept":"Deed types and covenants","difficulty":1,"explain":"A general warranty deed warrants title against ALL defects, back through the entire chain, including before the grantor owned it. A SPECIAL warranty covers only the grantor's own period; a QUITCLAIM warrants nothing.","id":"nat-526404cf","portion":"national","q":"The deed offering the greatest protection to the grantee is the:","sub":"national/transfer|Deeds & covenants of title","subtopic":"Deeds & covenants of title","topic":"national/transfer"},{"answer":0,"choices":["Covenant of quiet enjoyment","Covenant against encumbrances","Covenant of further assurance","Covenant of seisin"],"concept":"The covenants of title","difficulty":1,"explain":"Quiet enjoyment promises undisturbed possession and defense against lawful claims. SEISIN promises the grantor owns and can convey; FURTHER ASSURANCE promises to sign whatever documents are later needed.","id":"nat-8f9c509b","portion":"national","q":"The covenant in a general warranty deed promising the grantor will defend against lawful claims is:","sub":"national/transfer|Deeds & covenants of title","subtopic":"Deeds & covenants of title","topic":"national/transfer"},{"answer":0,"choices":["Delivered to and accepted by the grantee","Notarized","Recorded","Signed by the grantee"],"concept":"Requirements for a valid deed","difficulty":1,"explain":"Title passes on DELIVERY AND ACCEPTANCE. Recording is not required for validity -- it gives CONSTRUCTIVE NOTICE to the world and establishes priority against later claimants.","id":"nat-324b502e","portion":"national","q":"For a deed to be valid between grantor and grantee, it must be:","sub":"national/transfer|Deeds & covenants of title","subtopic":"Deeds & covenants of title","topic":"national/transfer"},{"answer":1,"choices":["Proof of the purchase price","Constructive notice to the world","A guarantee of clear title","Actual notice to the grantee"],"concept":"Notice: actual vs. constructive","difficulty":1,"explain":"Recording gives constructive (legal) notice -- everyone is charged with knowledge whether or not they looked. ACTUAL notice is what a person genuinely knows.","id":"nat-16d15dfa","portion":"national","q":"Recording a deed provides:","sub":"national/transfer|Recording, notice & priority","subtopic":"Recording, notice & priority","topic":"national/transfer"},{"answer":2,"choices":["Tenant damage","Future losses from fire","Defects that already existed when the policy was issued","Declines in market value"],"concept":"Title insurance","difficulty":1,"explain":"Title insurance is retrospective: it covers hidden past defects such as forgeries, undisclosed heirs, and recording errors. It is paid once at closing rather than by ongoing premiums.","id":"nat-c4b58b19","portion":"national","q": itle","Title commitment","Abstract of title"],"concept":"Chain of title and abstracts","difficulty":1,"explain":"The CHAIN OF TITLE is the sequence of ownership. An ABSTRACT is the condensed written history of all recorded documents; the attorney's OPINION OF TITLE interprets it.","id":"nat-0b40a0e6","portion":"national","q":"A title search that traces ownership back through successive owners produces the:","sub":"national/transfer|Title evidence & clearing defects","subtopic":"Title evidence & clearing defects","topic":"national/transfer"},{"answer":0,"choices":["Recording a quitclaim deed from the claimant or a suit to quiet title","Filing a lis pendens","Purchasing title insurance","Obtaining a survey"],"concept":"Clearing title defects","difficulty":1,"explain":"A quitclaim from whoever might hold the interest releases it; if the claimant will not sign, a quiet title action asks a court to settle ownership. A LIS PENDENS actually CREATES a cloud by giving notice of pending litigation.","id":"nat-7893809b","portion":"national","q":"A cloud on title is BEST removed by:","sub":"national/transfer|Title evidence & clearing defects","subtopic":"Title evidence & clearing defects","topic":"national/transfer"},{"answer":1,"choices":["Debit to the seller","Credit to the seller and debit to the buyer","Debit to the lender","Credit to both parties"],"concept":"Closing prorations and their direction","difficulty":1,"explain":"The seller prepaid a benefit the buyer will enjoy, so the seller is reimbursed: seller CREDIT, buyer DEBIT. Unpaid taxes reverse it -- seller debit, buyer credit.","id":"nat-69d5f58f","portion":"national","q":"In most closings, real property taxes already paid by the seller beyond the closing date result in a:","sub":"national/transfer|Closing & prorations","subtopic":"Closing & prorations","topic":"national/transfer"},{"answer":1,"choices":["Lot and block","Metes and bounds","Rectangular survey","Monument reference"],"concept":"Legal description systems","difficulty":1,"explain":"Metes (distances) and bounds (directions/boundaries) must return to the point of beginning to close. LOT AND BLOCK references a recorded plat and is the most common system in Georgia subdivisions.","id":"nat-96df336c","portion":"national","q":"A legal description that uses distances and compass bearings from a point of beginning is:","sub":"national/transfer|Legal descriptions","subtopic":"Legal descriptions","topic":"national/transfer"},{"answer":2,"choices":["A permissible trade practice","Legal if disclosed","Illegal price fixing under antitrust law","Allowed if the MLS approves"],"concept":"Antitrust: price fixing","difficulty":1,"explain":"Competitors setting prices together is a per se violation of the Sherman Act -- no defense, no disclosure cure. Commission rates must always be negotiated independently between a broker and a client.","id":"nat-b203442e","portion":"national","q":"Two competing brokerages agree to charge the same commission rate. This is:","sub":"national/practice|Antitrust","subtopic":"Antitrust","topic":"national/practice"},{"answer":2,"choices":["Steering","Market allocation","A group boycott","Tie-in arrangement"],"concept":"Antitrust violations","difficulty":1,"explain":"A GROUP BOYCOTT is competitors conspiring to refuse dealing with someone. MARKET ALLOCATION is dividing territories or customer types; a TIE-IN conditions one sale on buying another product.","id":"nat-1f23d887","portion":"national","q":"Brokers agreeing not to show each other's listings to certain buyers is:","sub":"national/practice|Antitrust","subtopic":"Antitrust","topic":"national/practice"},{"answer":3,"choices":["Blockbusting","Puffing","Redlining","Steering"],"concept":"Fair housing violations","difficulty":1,"explain":"STEERING channels people by protected class. BLOCKBUSTING induces panic selling by claiming a protected group is moving in; REDLINING is a lender refusing loans in an area based on its demographics.","id":"nat-9e2ae535"
