landlord must permit a tenant with a disability to:","sub":"national/practice|Practice standards","subtopic":"Practice standards","topic":"national/practice"},{"answer":1,"choices":["Held in the agent's name","Separate from the broker's own funds","Combined with operating funds for efficiency","Interest-bearing in all cases"],"concept":"Trust fund handling","difficulty":1,"explain":"Client money must be segregated in a designated trust or escrow account. Mixing it with business funds is commingling, one of the most common license-law violations.","id":"nat-c96270cc","portion":"national","q":"A broker's trust account must be:","sub":"national/practice|Trust funds & commingling","subtopic":"Trust funds & commingling","topic":"national/practice"},{"answer":3,"choices":["Give preference to disabled tenants","Rebuild all facilities","Provide free parking","Remove barriers to public accommodations when readily achievable"],"concept":"ADA Title III","difficulty":1,"explain":"Existing public accommodations must remove barriers where readily achievable -- cheap and easy relative to resources. New construction and alterations face stricter accessibility standards.","id":"nat-b27b6814","portion":"national","q":"The Americans with Disabilities Act requires commercial property owners to:","sub":"national/practice|Fair housing & advertising","subtopic":"Fair housing & advertising","topic":"national/practice"},{"answer":2,"choices":["Must provide health insurance","Controls the hours and methods of work","Controls the results but not the details of how work is done","Must withhold income taxes"],"concept":"Independent contractor vs. employee","difficulty":1,"explain":"The broker sets goals and must supervise for license-law compliance, but does not dictate schedules or methods. The IRS safe harbor requires a license, pay based on output rather than hours, and a written IC agreement.","id":"nat-8fe96f76","portion":"national","q":"An independent contractor relationship between a broker and a salesperson means the broker:","sub":"national/practice|Licensing & supervision","subtopic":"Licensing & supervision","topic":"national/practice"},{"answer":2,"choices":["Receives a flat fee","Splits commission with the buyer's broker","Keeps everything above a price the seller sets","Charges by the hour"],"concept":"Net listings and why they are disfavored","difficulty":1,"explain":"Net listings invite the broker to profit at the client's expense and are illegal in many states. Georgia permits them only under strict disclosure conditions.","id":"nat-617cc4c3","portion":"national","q":"A net listing is one in which the broker:","sub":"national/practice|Listings & agreements","subtopic":"Listings & agreements","topic":"national/practice"},{"answer":2,"choices":["Only one broker may market the property","The listing must be in the MLS","The seller owes no commission if the seller finds the buyer","The term is unlimited"],"concept":"Listing agreement types","difficulty":1,"explain":"OPEN: many brokers, and the seller pays nothing if the seller sells it. EXCLUSIVE AGENCY: one broker, but the seller may still sell it themselves commission-free. EXCLUSIVE RIGHT TO SELL: the broker is paid no matter who sells.","id":"nat-fa7e416c","portion":"national","q":"An open listing differs from an exclusive right to sell in that with an open listing:","sub":"national/practice|Listings & agreements","subtopic":"Listings & agreements","topic":"national/practice"},{"answer":0,"choices":["Commingling","Conversion only","Novation","A permissible practice with disclosure"],"concept":"Commingling","difficulty":1,"explain":"Placing trust funds in a business account is commingling as soon as it happens. If the broker then spends the money, it becomes conversion.","id":"nat-55d54a6b","portion":"national","q":"A broker who deposits a buyer's earnest money into the brokerage operating account has committed:","sub":"national/practice|Trust funds & commingling","subtopic":"Trust funds & commingling","topic":"national/practice"},{"answer":2,"choices":["The number was found in the MLS","The call is made before 9 p.m.","The consumer has an established business relationship or gave written consent","The licensee identifies themselves"],"concept":"Telephone Consumer Protection Act","difficulty":1,"explain":"An existing business relationship or express written consent permits the call. FSBO and expired-listing calls to registered numbers are a frequent source of violations.","id":"nat-cd09d6e2","portion":"national","q":"The 'do not call' rules generally allow a licensee to call a consumer on the registry if:","sub":"national/practice|Licensing & supervision","subtopic":"Licensing & supervision","topic":"national/practice"},{"answer":1,"choices":["Negotiate a price reduction with a buyer","Schedule appointments and prepare marketing materials for broker approval","Explain contract contingencies","Hold an open house alone and answer questions about terms"],"concept":"Unlicensed assistants","difficulty":1,"explain":"Ministerial and clerical tasks are fine. Anything involving negotiating, soliciting, showing, or giving advice about terms requires a license -- and letting an assistant do it exposes the broker to discipline.","id":"nat-8b288ba2","portion":"national","q":"Which activity may an unlicensed personal assistant legally perform?","sub":"national/practice|Licensing & supervision","subtopic":"Licensing & supervision","topic":"national/practice"},{"answer":0,"choices":["$7,500","$15,000","$30,000","$3,750"],"concept":"Commission is a percentage of the SALE price","difficulty":1,"explain":"$250,000 x 6% = $15,000 total; split 50/50 gives each brokerage $7,500. The most common error is stopping at the total commission.","id":"nat-4d440cd4","portion":"national","q":"A property sells for $250,000 with a 6% commission split 50/50 between two brokerages. Each brokerage receives:","sub":"national/math|Math fundamentals","subtopic":"Math fundamentals","topic":"national/math"},{"answer":1,"choices":["5,280","43,560","36,000","640"],"concept":"Core memorized conversions","difficulty":1,"explain":"1 acre = 43,560 sq ft. Also memorize: 1 mile = 5,280 feet; 1 section = 640 acres = 1 square mile; 36 sections = 1 township.","id":"nat-62e18f6d","portion":"national","q":"One acre contains how many square feet?","sub":"national/math|Math fundamentals","subtopic":"Math fundamentals","topic":"national/math"},{"answer":2,"choices":["$400","$40,000","$4,000","$2,000"],"concept":"Points are a percentage of the LOAN","difficulty":1,"explain":"One point = 1% of the loan = $2,000, so 2 points = $4,000. The classic trap is applying points to the sale price instead of the loan amount.","id":"nat-c620b6f3","portion":"national","q":"A buyer pays 2 discount points on a $200,000 loan. The cost is:","sub":"national/math|Math fundamentals","subtopic":"Math fundamentals","topic":"national/math"},{"answer":3,"choices":["$62,000","$50,000","$60,000","$70,000"],"concept":"Lenders lend on the LESSER of price or appraised value","difficulty":1,"explain":"Loan = 80% x $300,000 (the lower figure) = $240,000. Down payment = $310,000 - $240,000 = $70,000. The buyer must cover the $10,000 appraisal gap in cash.","id":"nat-d955ca07","portion":"national","q":"A home appraises at $300,000 and the buyer obtains an 80% LTV loan. The down payment on a $310,000 purchase price is:","sub":"national/math|Math fundamentals","subtopic":"Math fundamentals","topic":"national/math"},{"answer":3,"choices":["$2,100","$300","$1,500","$1,800"],"concept":"Proration on the closing calendar","difficulty":1,"explain":"Six months elapsed x $300/month = $1,800 owed by the seller and credited to the buyer, who will pay the full bill later. Unpaid taxes always produce a seller debit.","id":"nat-c7f1b97c","portion":"national","q":"Annual taxes are $3,600, paid in arrears. Closing is on July 1 in a 360-day year. The seller's share is approximately:","sub":"national/math|Math fundamentals","subtopic":"Math fundamentals","topic":"national/math"},{"answer":2,"choices":["$199,500","$209,000","$200,000","$180,500"],"concept":"Net-to-seller problems require division","difficulty":1,"explain":"$190,000 / 0.95 = $200,000. Adding 5% to $190,000 gives $199,500 -- the wrong answer the exam always offers, because 5% of the higher price is more than 5% of the net.","id":"nat-e2201432","portion":"national","q":"A seller wants to net $190,000 after a 5% commission and no other costs. The sale price must be:","sub":"national/math|Math fundamentals","subtopic":"Math fundamentals","topic":"national/math"},{"answer":2,"choices":["The restriction is void as an unreasonable restraint on alienation","B holds a fee simple absolute because A already conveyed away the whole estate","Title reverts to A or A's heirs automatically, without any court action","A must sue to re-enter and recover title"],"concept":"Determinable fee vs. fee on condition subsequent","difficulty":2,"explain":"A DETERMINABLE fee ends automatically -- the possibility of reverter takes effect the instant the condition occurs. A fee subject to a CONDITION SUBSEQUENT requires the grantor to exercise a right of re-entry, which is where a lawsuit would be needed. A cannot convey a larger estate than A held.","id":"nat-8e82b0b5","portion":"national","q":"A owns property in fee simple determinable, to revert automatically if liquor is ever sold there. A conveys to B, who opens a bar. At that moment:","sub":"national/ownership|Estates & the bundle of rights","subtopic":"Estates & the bundle of rights","topic":"national/ownership"},{"answer":3,"choices":["A life estate in one-half","A one-half interest as a joint tenant","A one-half interest as a tenant in common","Nothing in this property"],"concept":"Survivorship defeats a will","difficulty":2,"explain":"The right of survivorship operates at the instant of death, before the will takes effect -- the deceased joint tenant has no interest left to devise. The surviving sister owns the whole property. A will can only pass what the decedent still owned.","id":"nat-7d6399cf","portion":"national","q":"Two sisters own a lake house as joint tenants. One dies leaving a will devising 'all my real property to my son.' The son receives:","sub":"national/ownership|Co-ownership & survivorship","subtopic":"Co-ownership & survivorship","topic":"national/ownership"},{"answer":3,"choices":["Remove them only if they can be taken out without any damage","Not remove them, because bolting made them fixtures","Remove them only with the landlord's written consent","Remove them, repairing any damage, because they are trade fixtures"],"concept":"Trade fixtures are the exception to the fixture rule","difficulty":2,"explain":"Items a commercial tenant installs to conduct business remain the tenant's personal property and may be removed before the lease ends, provided the tenant repairs damage. The annexation test that would make them fixtures does not apply to trade fixtures. Leaving them past lease end can forfeit them.","id":"nat-686487b2","portion":"national","q":"A commercial tenant bolts specialized refrigeration units to the floor of a leased space. The lease is silent. At lease end the tenant may:","sub":"national/ownership|Fixtures & trade fixtures","subtopic":"Fixtures & trade fixtures","topic":"national/ownership"},{"answer":1,"choices":["Converts to an easement appurtenant on transfer","Continues, because an easement in gross benefiting a commercial entity is assignable and survives transfer","Continues only if the buyer expressly assumes it","Terminates at the sale because it was personal to the grantor"],"concept":"Easement in gross vs. appurtenant","difficulty":2,"explain":"A utility easement is an easement in gross -- it benefits a person or entity, not a parcel, so there is no dominant tenement. Commercial easements in gross are assignable and bind later owners of the servient land once recorded. Only a personal (non-commercial) easement in gross would arguably end.","id":"nat-ba3773b7","portion":"national","q":"An owner grants a utility company the right to run a line across her land. She later sells. The easement:","sub":"national/ownership|Easements & encroachments","subtopic":"Easements & encroachments","topic":"national/ownership"},{"answer":0,"choices":["Waste, for which the remainderman may sue now","Grounds to terminate the life estate automatically","Permissible, since the life tenant owns the present interest","A breach the remainderman must wait until the life estate ends to raise"],"concept":"Waste and the life tenant's duties","difficulty":2,"explain":"A life tenant must pay taxes and ordinary carrying costs and avoid permissive waste. The remainderman has a present interest to protect and may sue for waste immediately -- waiting could mean the property is lost to a tax sale. The estate does not terminate automatically.","id":"nat-e67b2148","portion":"national","q":"A life tenant fails to pay property taxes for three years and lets the roof fail. The remainderman's BEST characterization of this is:","sub":"national/ownership|Estates & the bundle of rights","subtopic":"Estates & the bundle of rights","topic":"national/ownership"},{"answer":0,"choices":["Voting power and share of assessments","Square footage of the unit","Right to lease the unit","Property tax rate"],"concept":"How the common-element percentage functions","difficulty":2,"explain":"The undivided percentage drives assessments and usually voting weight. It is set in the declaration, not by unit size alone, and it cannot be separated from the unit -- you cannot sell your common-element share by itself.","id":"nat-0bfe6f48","portion":"national","q":"A condominium declaration allots each unit an undivided percentage of the common elements. That percentage MOST directly determines each owner's:","sub":"national/ownership|Condos, co-ops & timeshares","subtopic":"Condos, co-ops & timeshares","topic":"national/ownership"},{"answer":2,"choices":["Win, because the value loss exceeds one third","Lose, because zoning can never be challenged","Lose, because the regulation left economically viable use of the land","Win, because downzoning is per se a taking"],"concept":"Regulatory taking vs. valid police power","difficulty":2,"explain":"A regulation becomes a taking when it denies ALL economically viable use, not merely when it reduces value. Diminution in value alone -- even substantial -- is generally a cost of regulation. Zoning can certainly be challenged, but on grounds like arbitrariness, not mere value loss.","id":"nat-4c7bd8ba","portion":"national","q":"A city downzones an area, leaving an owner's lot usable but worth 40% less. The owner sues claiming a taking. The owner will MOST likely:","sub":"national/landuse|Government powers over land","subtopic":"Government powers over land","topic":"national/landuse"},{"answer":0,"choices":["Likely be barred, because destruction usually extinguishes nonconforming status","Be permitted, because nonconforming status runs with the land","Need only a building permit","Be permitted only if rebuilt larger"],"concept":"How nonconforming use is lost","difficulty":2,"explain":"Nonconforming rights are meant to phase out, not persist forever. Most ordinances end the status on destruction beyond a stated percentage, on abandonment for a set period, or on a change to a different nonconforming use. Rebuilding then requires conforming to current zoning or obtaining a variance.","id":"nat-28e3a8ba","portion":"national","q":"A legal nonconforming gas station burns down. The owner wants to rebuild it as it was. Under a typical ordinance the owner will:","sub":"national/landuse|Zoning, variances & nonconforming use","subtopic":"Zoning, variances & nonconforming use","topic":"national/landuse"},{"answer":3,"choices":["Only the developer may enforce covenants","Covenants are unenforceable against later buyers","The covenant expired automatically after ten years","Laches and abandonment of the covenant through a pattern of non-enforcement"],"concept":"Defenses to enforcement of covenants","difficulty":2,"explain":"Long, widespread non-enforcement can waive a covenant through abandonment, and delay that prejudices the defendant supports laches. Covenants do not expire on their own unless they say so, they do bind later buyers, and any benefited owner may enforce them.","id":"nat-cd967c82","portion":"national","q":"A subdivision's recorded covenants bar fences over four feet. For fifteen years owners have built six-foot fences with no objection. A neighbor now sues to enforce. The BEST defense is:","sub":"national/landuse|Private restrictions & access","subtopic":"Private restrictions & access","topic":"national/landuse"},{"answer":1,"choices":["A license from the neighbor","An easement by necessity","An easement by prescription","Eminent domain against the neighbor"],"concept":"Easement by necessity","difficulty":2,"explain":"When a single parcel is severed and one part is left without access, the law implies an easement by necessity over the retained land. Prescription requires long adverse use, which has not occurred here; a license is revocable; private owners cannot condemn.","id":"nat-802f42b1","portion":"national","q":"A property owner's land is landlocked after the seller conveys away the parcel fronting the road. The owner's strongest claim to access is:","sub":"national/landuse|Private restrictions & access","subtopic":"Private restrictions & access","topic":"national/landuse"},{"answer":0,"choices":["Serve as a check, with sales comparison given the most weight","Be the only reliable approach","Replace the need for reconciliation","Be meaningless for new construction"],"concept":"Weighting the approaches in reconciliation","difficulty":2,"explain":"Abundant near-identical sales make sales comparison the strongest indicator. Cost is genuinely useful on nearly new homes (little depreciation to estimate) but serves as support here. An appraiser reconciles by weighting reliability, never by averaging.","id":"nat-9040ba6b","portion":"national","q":"An appraiser must value a two-year-old home in a subdivision where twelve nearly identical homes sold in the last six months. The cost approach would MOST likely:","sub":"national/valuation|Appraisal process & approaches","subtopic":"Appraisal process & approaches","topic":"national/valuation"},{"answer":2,"choices":["$424,000","$400,000","$416,000","$440,000"],"concept":"Netting adjustments on the comparable","difficulty":2,"explain":"Adjust the COMP toward the subject. Superior feature: subtract $12,000. Inferior feature: add $8,000. $420,000 - $12,000 + $8,000 = $416,000. Adjusting the subject instead, or moving both in the same direction, produces the distractors.","id":"nat-1be22d17","portion":"national","q":"A comparable superior to the subject sold for $420,000; its extra half-bath is worth $12,000 and its inferior lot costs $8,000. The adjusted value indication is:","sub":"national/valuation|Sales comparison & adjustments","subtopic":"Sales comparison & adjustments","topic":"national/valuation"},{"answer":3,"choices":["$625,000","$840,000","$690,000","$560,000"],"concept":"Building NOI before applying the cap rate","difficulty":2,"explain":"Gross annual = 4 x $1,400 x 12 = $67,200. Less 5% vacancy ($3,360) = $63,840 effective gross. Less $19,000 expenses = $44,840 NOI. $44,840 / 0.08 = $560,500, closest to $560,000. Skipping vacancy or expenses produces the higher distractors -- debt service is never an operating expense.","id":"nat-beaf41b6","portion":"national","q":"A four-unit building rents for $1,400 per unit monthly with 5% vacancy and $19,000 annual operating expenses. At an 8% cap rate its value is closest to:","sub":"national/valuation|Income approach & cap rates","subtopic":"Income approach & cap rates","topic":"national/valuation"},{"answer":2,"choices":["Functional obsolescence","External obsolescence","Curable physical deterioration","Incurable physical deterioration"],"concept":"Curable vs. incurable depreciation","difficulty":2,"explain":"Curability is an economic test, not a physical one: an item is curable when the cost to fix it is recovered in added value. Spending $9,000 to gain $9,000 sits right at the line and is treated as curable. If the fix cost more than it returned, it would be incurable.","id":"nat-d877e4df","portion":"national","q":"An appraiser notes the subject's roof needs $9,000 of work that would add $9,000 of value. This is BEST classified as:","sub":"national/valuation|Depreciation & obsolescence","subtopic":"Depreciation & obsolescence","topic":"national/valuation"},{"answer":3,"choices":["The improvements, as physical deterioration","Neither -- it is a financing concession","The improvements, as functional obsolescence","The land, as external obsolescence"],"concept":"Where external obsolescence is charged","difficulty":2,"explain":"External obsolescence comes from outside the property. Because a location penalty attaches to the site rather than the building, appraisers charge it against the LAND. Functional problems attach to the improvements; physical deterioration is wear.","id":"nat-f66bb10e","portion":"national","q":"A house on a busy corner sells for less than identical houses mid-block. When the appraiser accounts for this, the deduction is properly assigned to:","sub":"national/valuation|Depreciation & obsolescence","subtopic":"Depreciation & obsolescence","topic":"national/valuation"},{"answer":2,"choices":["Neither party","Both buyer and seller jointly","The original seller-borrower only","The buyer only"],"concept":"'Subject to' vs. assumption","difficulty":2,"explain":"Taking 'subject to' means the buyer accepts NO personal liability on the note -- the buyer just risks losing the property. The original borrower remains fully liable. Had the buyer ASSUMED, both would be liable (buyer primarily, seller secondarily) absent a novation.","id":"nat-6338191f","portion":"national","q":"A buyer takes title 'subject to' the seller's existing loan and later defaults. The lender forecloses and the sale leaves a $40,000 shortfall. The lender may pursue a deficiency judgment against:","sub":"national/financing|Assumption, novation & 'subject to'","subtopic":"Assumption, novation & 'subject to'","topic":"national/financing"},{"answer":2,"choices":["About 8 years","About 1 year","About 4 years","The points never pay off"],"concept":"Break-even analysis on discount points","difficulty":2,"explain":"Points cost 2% x $300,000 = $6,000. The rate saving is 0.5% x $300,000 = $1,500 in the first year. $6,000 / $1,500 = 4 years to break even. A buyer planning to sell or refinance sooner should decline the points.","id":"nat-52419ef3","portion":"national","q":"A borrower is offered 6.5% with no points, or 6.0% with 2 points on a $300,000 loan. Roughly how long must the borrower keep the loan for the points to pay off, using simple first-year interest?","sub":"national/financing|Points, yield & TRID disclosure","subtopic":"Points, yield & TRID disclosure","topic":"national/financing"},{"answer":2,"choices":["The loan amount decreases by $200","The seller agrees to pay an extra $500 toward closing costs","The APR increases beyond tolerance","A typo in the borrower's name is corrected"],"concept":"The three CD re-disclosure triggers","difficulty":2,"explain":"Only three changes restart the clock: the APR becomes inaccurate beyond tolerance, the loan PRODUCT changes, or a prepayment penalty is added. Other changes require a corrected CD at or before consummation but no new waiting period.","id":"nat-ec8c3a9f","portion":"national","q":"Under TRID, which change after the Closing Disclosure is delivered REQUIRES a new three-business-day waiting period?","sub":"national/financing|Points, yield & TRID disclosure","subtopic":"Points, yield & TRID disclosure","topic":"national/financing"},{"answer":2,"choices":["Terminate with the earnest money returned","Require the seller to lower the price","Renegotiate or bring the $15,000 difference in cash, on top of the down payment","Accept a loan of 95% of the contract price"],"concept":"The appraisal gap","difficulty":2,"explain":"The lender lends on the LOWER of price or appraised value, so the loan shrinks and the shortfall becomes the buyer's cash problem. Without an appraisal contingency the buyer has no automatic right to terminate and no power to force a price reduction -- only to ask.","id":"nat-6891f80a","portion":"national","q":"A lender's appraisal comes in $15,000 below the contract price on a 95% LTV loan. Absent an appraisal contingency, the buyer must:","sub":"national/financing|Lending law & the secondary market","subtopic":"Lending law & the secondary market","topic":"national/financing"},{"answer":0,"choices":["Remains tied up until the loan is paid or a substitution of entitlement occurs","Is fully restored at closing","Was never at risk","Is lost permanently"],"concept":"VA entitlement and assumption","difficulty":2,"explain":"Entitlement stays committed to the loan until it is paid off or another eligible veteran substitutes their entitlement. Without a release of liability the veteran also remains liable for a deficiency, and cannot use that entitlement for a new home.","id":"nat-ed9aae6a","portion":"national","q":"A veteran's VA loan is assumed by a non-veteran buyer with VA approval, but the veteran does not obtain a release of liability. The veteran's entitlement:","sub":"national/financing|Assumption, novation & 'subject to'","subtopic":"Assumption, novation & 'subject to'","topic":"national/financing"},{"answer":0,"choices":["Violated the Act by failing to give specific reasons or notice of the right to them","Complied, provided the denial was in writing","Complied, because reasons are optional","Violated the Act only if the applicant is in a protected class"],"concept":"ECOA adverse action notice","difficulty":2,"explain":"ECOA entitles a rejected applicant to a statement of SPECIFIC reasons, or notice of the right to request them within 60 days. The obligation applies to every applicant regardless of protected class -- the notice requirement is not itself a discrimination question.","id":"nat-c4baa683","portion":"national","q":"A lender denies a loan and tells the applicant only 'you did not meet our standards.' Under ECOA the lender has:","sub":"national/financing|Lending law & the secondary market","subtopic":"Lending law & the secondary market","topic":"national/financing"},{"answer":0,"choices":["Sell individual lots free of the lien as portions of the debt are paid","Avoid personal liability on the note","Substitute other collateral at will","Prepay without penalty"],"concept":"Blanket mortgages and partial releases","difficulty":2,"explain":"The release (or partial release) clause lets the developer clear the lien lot by lot as agreed payments come in, so buyers get clear title. Without it, the whole debt would have to be retired before any lot could convey free of the blanket lien.","id":"nat-13d9b8dc","portion":"national","q":"A blanket mortgage covering twelve subdivision lots contains a release clause. Its practical effect is that the developer can:","sub":"national/financing|Loan types & structures","subtopic":"Loan types & structures","topic":"national/financing"},{"answer":1,"choices":["Answer truthfully, since honesty is owed to customers","Decline to answer, saying the seller has not authorized disclosure of motivation","Say the seller has no particular reason","Answer only if the buyer submits an offer first"],"concept":"Confidentiality vs. honesty","difficulty":2,"explain":"Motivation is confidential, not a material defect, so it stays private. But honesty forbids the affirmative lie in option C -- the agent must decline rather than misstate. Declining to answer is not deceit; inventing an answer is.","id":"nat-b91dd82c","portion":"national","q":"A listing agent learns from the seller, in confidence, that the seller must move for a job in 30 days. A buyer's agent asks why the seller is selling. The listing agent should:","sub":"national/agency|Confidentiality & disclosure","subtopic":"Confidentiality & disclosure","topic":"national/agency"},{"answer":3,"choices":["Permissible if the property has since sold","Permissible, since the agency ended","A breach only if it causes provable damage","A breach -- confidentiality survives termination of the agency"],"concept":"Which duties survive termination","difficulty":2,"explain":"Accounting and CONFIDENTIALITY survive the end of the relationship indefinitely. Loyalty, obedience, disclosure, and reasonable care end with the agency. Damage is not required for the breach to exist.","id":"nat-5ace4b52","portion":"national","q":"An agent's listing expires unsold. Six months later the agent mentions to a friend that the former seller had been desperate. This is:","sub":"national/agency|Fiduciary duties","subtopic":"Fiduciary duties","topic":"national/agency"},{"answer":0,"choices":["Disclose the relationship to the seller in writing before presenting the offer","Present the offer without comment, as with any other","Refuse to present the son's offer","Resign the listing immediately"],"concept":"Disclosure of a personal interest","difficulty":2,"explain":"A family or financial interest in a buyer is a material conflict the principal must know about, disclosed before the offer is considered. The broker must still present all offers -- refusing to present one breaches the duty. Resigning may follow, but disclosure comes first.","id":"nat-65b71c16","portion":"national","q":"A broker represents the seller. The broker's own son wants to buy the property. The broker's FIRST obligation is to:","sub":"national/agency|Confidentiality & disclosure","subtopic":"Confidentiality & disclosure","topic":"national/agency"},{"answer":1,"choices":["Decline to advise on price to avoid liability","Give an informed opinion supported by comparable sales","Repeat the listing agent's opinion","Say only that the seller set the price"],"concept":"Advocacy is the point of representation","difficulty":2,"explain":"A client is owed advice, not just information. Withholding a price opinion from a CLIENT under-serves the fiduciary-style duty of reasonable care and skill. The agent who declines is behaving as though the buyer were a customer.","id":"nat-25f2b60f","portion":"national","q":"A buyer's agent shows a property and the buyer asks, 'Is this a good price?' The agent has a written buyer agency agreement. The agent should:","sub":"national/agency|Client vs. customer","subtopic":"Client vs. customer","topic":"national/agency"},{"answer":2,"choices":["Present only the higher offer, since it serves the seller best","Let the seller's attorney decide","Present both offers and disclose the compensation difference to the seller","Present both without mentioning compensation"],"concept":"Presenting all offers plus conflict disclosure","difficulty":2,"explain":"All offers go to the seller. Additionally, the prospect of a larger commission on one offer is a conflict of interest the principal is entitled to know about, so the agent discloses it and lets the seller weigh it. Silence here is the trap answer.","id":"nat-27053515","portion":"national","q":"A seller's agent receives two offers. The higher offer is from an unrepresented buyer, meaning the agent would keep the whole commission. The agent must:","sub":"national/agency|Dual agency & conflicts","subtopic":"Dual agency & conflicts","topic":"national/agency"},{"answer":2,"choices":["Limited to a warning letter","None, since the assistant is not licensed","Liability for unlicensed activity and breach of confidentiality by the firm","Only the assistant's problem"],"concept":"Supervision and unlicensed activity","difficulty":2,"explain":"Discussing terms is licensed activity, and the answer also leaked the seller's negotiating position. The broker is responsible for supervising assistants; letting one host an open house unaccompanied and field substantive questions is a classic disciplinary case.","id":"nat-31e2087a","portion":"national","q":"An unlicensed assistant, alone at an open house, answers a visitor's question about whether the seller would take less. The broker's exposure is:","sub":"national/agency|Trust funds & supervision","subtopic":"Trust funds & supervision","topic":"national/agency"},{"answer":3,"choices":["Note it only if the repair is under warranty","Disclose only if the buyer's inspector finds evidence","Say nothing, since the condition is fixed","Disclose the past problem and the repair"],"concept":"Past defects are still material","difficulty":2,"explain":"A history of water intrusion is material to value and desirability even after repair, because it bears on recurrence risk and insurability. Disclosing the problem AND the fix protects the seller; silence is the classic post-closing lawsuit.","id":"nat-72bbf3e4","portion":"national","q":"A seller repaired a chronic basement leak two years ago and it has not recurred. On the disclosure form the seller should:","sub":"national/disclosures|Material facts & latent defects","subtopic":"Material facts & latent defects","topic":"national/disclosures"},{"answer":3,"choices":["Ask the listing agent to repaint it","Assume the seller disclosed everything material","Say nothing, as the agent is not an inspector","Point it out to the buyer and recommend the inspector examine it"],"concept":"No duty to discover, but no license to ignore","difficulty":2,"explain":"Agents are not inspectors and have no duty to hunt for defects -- but a visible red flag they actually observe must be passed on. Seeing it and staying silent converts 'no duty to discover' into concealment of something known.","id":"nat-8c9dbc26","portion":"national","q":"A buyer's agent sees a fresh paint patch on a ceiling and a faint stain edge. The agent should:","sub":"national/disclosures|Material facts & latent defects","subtopic":"Material facts & latent defects","topic":"national/disclosures"},{"answer":2,"choices":["Do nothing, because no hazard is known","Test the property before closing","Disclose the absence of knowledge, give the pamphlet, and allow the 10-day opportunity","Disclose only if the buyer has children"],"concept":"Lead disclosure when nothing is known","difficulty":2,"explain":"The federal rule requires the disclosure form, records, EPA pamphlet, and 10-day testing window on all pre-1978 target housing. Having no knowledge is a permitted answer on the form -- but the process still applies. Sellers are never required to test.","id":"nat-b02be796","portion":"national","q":"A property built in 1975 is sold. The seller has never tested for lead and knows of no hazard. The seller must:","sub":"national/disclosures|Lead-based paint","subtopic":"Lead-based paint","topic":"national/disclosures"},{"answer":1,"choices":["Answer only in writing","Decline, explaining that the question involves a protected class","Answer factually if the licensee knows","Refer the buyer to the seller"],"concept":"Fair housing overrides the impulse to be helpful","difficulty":2,"explain":"Handicap is a protected class, so answering would facilitate discriminatory steering regardless of the licensee's intent. The right move is to decline and direct the buyer to publicly available sources they can research themselves.","id":"nat-3b1812fa","portion":"national","q":"A buyer asks a licensee whether a nearby group home houses people with disabilities. The licensee should:","sub":"national/disclosures|Stigma & fair housing limits","subtopic":"Stigma & fair housing limits","topic":"national/disclosures"},{"answer":0,"choices":["Refuse to pass on information known to be false, and withdraw if the seller persists","Correct the form personally","Disclose the truth only to the buyer's agent","Present the form as the seller wrote it, since it is the seller's statement"],"concept":"A licensee cannot transmit known falsehoods","difficulty":2,"explain":"The form belongs to the seller, but the licensee cannot become the conduit for a misrepresentation they know to be false -- that is participation in fraud. The licensee never alters the seller's form; if the seller will not fix it, the engagement must end.","id":"nat-713f3a24","portion":"national","q":"A licensee discovers the seller's disclosure understates the age of the roof by twelve years. The seller refuses to correct it. The licensee should:","sub":"national/disclosures|Material facts & latent defects","subtopic":"Material facts & latent defects","topic":"national/disclosures"},{"answer":2,"choices":["A binding contract dated Saturday","A counteroffer the buyer may accept","No contract, because acceptance was not communicated within the deadline","A binding contract, because the seller signed in time"],"concept":"Acceptance is effective on communication","difficulty":2,"explain":"Signing is not acceptance -- the offeror must receive it within the stated time. Late delivery means the offer lapsed. The late acceptance may operate as a new offer the buyer can accept, but no contract exists on the original terms.","id":"nat-1c0b5387","portion":"national","q":"A buyer's offer says acceptance must be received by 5 p.m. Friday. The seller signs at 3 p.m. Friday but the acceptance is not delivered until Saturday morning. There is:","sub":"national/contracts|Offer, acceptance & counteroffers","subtopic":"Offer, acceptance & counteroffers","topic":"national/contracts"},{"answer":0,"choices":["Prevail, because the approval did not meet the stated term","Prevail only if the buyer applied to three lenders","Lose, because 0.25% is immaterial","Lose, because the buyer was approved"],"concept":"Contingencies are read as written","difficulty":2,"explain":"The condition specified a rate ceiling, and an approval above it does not satisfy it. Courts enforce the stated terms; materiality is not re-argued after the parties fixed the number. The buyer must still have applied in good faith, which a single genuine application satisfies.","id":"nat-bd6c19ef","portion":"national","q":"A contract is contingent on the buyer obtaining financing at no more than 6.5%. The buyer is approved at 6.75% and terminates. The seller argues bad faith. The buyer will MOST likely:","sub":"national/contracts|Contingencies & conditions","subtopic":"Contingencies & conditions","topic":"national/contracts"},{"answer":1,"choices":["Buyer, who holds equitable title","Seller, because possession and title had not passed","Insurer only","Parties equally"],"concept":"Equitable conversion vs. the Risk Act","difficulty":2,"explain":"Under the older doctrine of equitable conversion the BUYER bore the risk from contract signing. The Uniform Act reverses that: risk stays with the seller until title or possession transfers. Knowing which rule the question invokes is the whole point.","id":"nat-4eeb78f6","portion":"national","q":"A seller and buyer sign a contract. Before closing the house burns down. In a state that has adopted the Uniform Vendor and Purchaser Risk Act, the loss falls on the:","sub":"national/contracts|Contract terms & performance","subtopic":"Contract terms & performance","topic":"national/contracts"},{"answer":2,"choices":["The seller may terminate the contract","The assignment converts the deal to a novation","The assignment is valid, and the original buyer remains secondarily liable","The assignment is void without consent"],"concept":"Assignability of real estate contracts","difficulty":2,"explain":"Real estate purchase contracts are assignable unless they say otherwise. The assignee gains the rights; the assignor stays secondarily liable unless the seller agrees to a novation. Personal-service contracts are the category that resists assignment.","id":"nat-dff6a6a6","portion":"national","q":"A buyer assigns her purchase contract to a third party. The contract is silent on assignment. The seller objects. Generally:","sub":"national/contracts|Assignment & novation","subtopic":"Assignment & novation","topic":"national/contracts"},{"answer":0,"choices":["Specific performance against the owner and the buyer if the buyer had notice","Nothing, since options are revocable","Recovery of the $5,000 only","Damages capped at the option price"],"concept":"Options create an enforceable interest","difficulty":2,"explain":"An option supported by consideration is a binding contract, and land is unique, so specific performance is available. A later buyer with actual or constructive notice (a recorded option) takes subject to it. Options are not revocable once consideration is paid.","id":"nat-8d6cae58","portion":"national","q":"An option agreement gives a tenant the right to buy for $500,000 within one year, for $5,000 consideration. Six months in, the owner sells to someone else. The tenant's BEST remedy is:","sub":"national/contracts|Options & installment contracts","subtopic":"Options & installment contracts","topic":"national/contracts"},{"answer":1,"choices":["Prevail, because the date passed","Not prevail, because performance within a reasonable time is allowed","Prevail only if damages are shown","Not prevail, because closing dates are unenforceable"],"concept":"Effect of omitting time-is-of-the-essence","difficulty":2,"explain":"Without the clause, courts permit performance within a reasonable time and three days is ordinarily reasonable. The clause exists precisely to convert a date into a hard deadline. Closing dates are enforceable -- just not automatically strict.","id":"nat-fac7cd96","portion":"national","q":"A contract states 'closing on or before June 30' with no time-is-of-the-essence clause. The buyer is ready on July 3. The seller declares a breach. The seller will MOST likely:","sub":"national/contracts|Contract terms & performance","subtopic":"Contract terms & performance","topic":"national/contracts"},{"answer":1,"choices":["Rescission","Reformation","Specific performance as written","Novation"],"concept":"Reformation for scrivener's error","difficulty":2,"explain":"Reformation asks a court to rewrite the document to reflect the parties' actual agreement. Rescission would unwind a deal both sides want; enforcing the erroneous description would convey the wrong lot.","id":"nat-a4377df9","portion":"national","q":"Two parties sign a contract that misstates the parcel number due to a typing error, though both intended the same lot. The proper remedy is:","sub":"national/contracts|Breach, remedies & damages","subtopic":"Breach, remedies & damages","topic":"national/contracts"},{"answer":0,"choices":["The Monday recorder, if that buyer had no notice of the earlier sale","The Wednesday recorder, because possession controls","Neither -- the deeds cancel","The earlier buyer, because that purchase came first"],"concept":"Race-notice recording acts","difficulty":2,"explain":"A race-notice statute protects the party who both takes WITHOUT NOTICE and records FIRST. The catch: open possession by the earlier buyer can itself be constructive notice, which would defeat the Monday recorder. The stem's 'no notice' condition is what decides it.","id":"nat-f8510410","portion":"national","q":"A buyer records a deed on Monday. An earlier buyer of the same parcel, who had paid and taken possession, records on Wednesday. In a race-notice state the winner is:","sub":"national/transfer|Recording, notice & priority","subtopic":"Recording, notice & priority","topic":"national/transfer"},{"answer":2,"choices":["When the defect is recorded","When the grantee resells","At the moment of conveyance","Only when the grantee is evicted"],"concept":"Present vs. future covenants","difficulty":2,"explain":"Seisin, right to convey, and against encumbrances are PRESENT covenants -- breached, if at all, at delivery, which starts the limitations clock then. Quiet enjoyment, warranty, and further assurances are FUTURE covenants, breached only on later disturbance.","id":"nat-ef368726","portion":"national","q":"A general warranty deed's covenant of seisin is breached. When does the breach occur?","sub":"national/transfer|Deeds & covenants of title","subtopic":"Deeds & covenants of title","topic":"national/transfer"},{"answer":0,"choices":["Is valid on payment, relating back to the original deposit","Must be re-executed by the estate","Is void, because delivery requires a living grantor","Passes only a life estate"],"concept":"Relation-back doctrine in escrow delivery","difficulty":2,"explain":"Once a grantor deposits a deed in escrow beyond recall, delivery relates back to the deposit date when the condition is met. This defeats the argument that death revoked it. The doctrine exists precisely to prevent death from unwinding completed bargains.","id":"nat-bab807ac","portion":"national","q":"A grantor hands a signed deed to an escrow agent with instructions to deliver on payment. The grantor dies before payment. The deed:","sub":"national/transfer|Closing & prorations","subtopic":"Closing & prorations","topic":"national/transfer"},{"answer":1,"choices":["Buy title insurance covering it","Obtain and record a release or satisfaction","Wait for the statute of limitations","Disclose it and proceed"],"concept":"Marketable title and Schedule B exceptions","difficulty":2,"explain":"An exception is a defect the policy will NOT cover, so insurance does not solve it. Marketable title requires clearing the lien of record with a recorded release. A buyer cannot be forced to accept title subject to an undischarged mortgage.","id":"nat-9eb1c726","portion":"national","q":"A title commitment lists an unreleased mortgage from 1978 as an exception. To convey marketable title the seller must:","sub":"national/transfer|Title evidence & clearing defects","subtopic":"Title evidence & clearing defects","topic":"national/transfer"},{"answer":3,"choices":["Acquires a prescriptive easement instead","Acquires title anyway, since possession is the main element","Acquires title after twice the period","Fails, because every statutory element must be satisfied"],"concept":"Adverse possession is all-elements","difficulty":2,"explain":"Every element of the statute must be met -- possession that is open, notorious, hostile, actual, continuous for the period, plus any state-specific requirement like tax payment or color of title. Missing one defeats the claim entirely.","id":"nat-9cc968a6","portion":"national","q":"An adverse possessor occupies land for the statutory period but pays no taxes, and the state's statute requires tax payment. The possessor:","sub":"national/transfer|Adverse possession & involuntary transfer","subtopic":"Adverse possession & involuntary transfer","topic":"national/transfer"},{"answer":2,"choices":["Violated antitrust by publishing a rate","Committed a group boycott","Set a lawful internal company policy","Committed price fixing with its competitors"],"concept":"Company policy vs. conspiracy","difficulty":2,"explain":"A single firm may set its own rates -- that is competition, not conspiracy. Antitrust requires an AGREEMENT between competitors. Parallel behavior alone is not proof; what would make it illegal is evidence the firms coordinated.","id":"nat-14de8545","portion":"national","q":"A brokerage tells its agents never to quote a commission below 5%, and the firm's competitors independently do the same. The brokerage has:","sub":"national/practice|Antitrust","subtopic":"Antitrust","topic":"national/practice"},{"answer":2,"choices":["Nothing -- occupancy limits are lawful","Handicap","Familial status","National origin"],"concept":"Reading an ad for the actual violation","difficulty":2,"explain":"'No children under 12' is a direct familial status violation. 'Ideal for professionals' is a weaker signal about income or occupation, which is not federally protected. Reasonable OCCUPANCY limits by number of persons are lawful, but limits by age of occupant are not.","id":"nat-8e96b0ad","portion":"national","q":"A landlord's ad says 'quiet building, ideal for professionals, no children under 12.' The clearest violation involves:","sub":"national/practice|Practice standards","subtopic":"Practice standards","topic":"national/practice"},{"answer":0,"choices":["Disparate impact, even without discriminatory intent","Intentional discrimination only","Not actionable, since the rule is neutral","A steering violation"],"concept":"Disparate impact","difficulty":2,"explain":"A facially neutral policy that falls disproportionately on a protected class can violate fair housing law without any intent to discriminate. The landlord's defense is that the rule serves a substantial, legitimate business need that no less discriminatory rule would serve.","id":"nat-ac98caad","portion":"national","q":"A property manager applies a rule requiring all applicants to have income of three times the rent. Statistically it screens out a protected class at a much higher rate. This may be challenged as:","sub":"national/practice|Fair housing & advertising","subtopic":"Fair housing & advertising","topic":"national/practice"},{"answer":0,"choices":["Continue holding it and use interpleader or the state's prescribed dispute procedure","Split it evenly between them","Release it to whoever demands first","Keep it as compensation for the failed sale"],"concept":"Disputed trust funds","difficulty":2,"explain":"A broker holding disputed funds must not choose sides. The safe course is to hold and let a court (interpleader) or the state-prescribed process decide. Releasing, splitting, or keeping the money all expose the broker to a conversion claim.","id":"nat-7daf0dc2","portion":"national","q":"A broker holds a $10,000 earnest money deposit. Buyer and seller both demand it after a failed closing. The broker should:","sub":"national/practice|Trust funds & commingling","subtopic":"Trust funds & commingling","topic":"national/practice"},{"answer":2,"choices":["A permissible market update","Puffing","A misleading advertisement misrepresenting the licensee's involvement","A RESPA violation"],"concept":"Truthful advertising","difficulty":2,"explain":"Implying credit for another firm's transaction misrepresents the licensee's role. Market-update advertising is legitimate only when it clearly attributes the sale and does not suggest the advertiser handled it.","id":"nat-de18bc19","portion":"national","q":"A licensee advertises 'Just sold! Call me to sell yours' with a photo of a property listed and sold by another firm. This is MOST directly:","sub":"national/practice|Fair housing & advertising","subtopic":"Fair housing & advertising","topic":"national/practice"}],"georgia":[{"answer":0,"choices":["18 years old","17 years old","21 years old","19 years old"],"concept":"Georgia age requirements","difficulty":1,"explain":"18 for salesperson or community association manager; 21 for broker or associate broker. An applicant may TAKE the salesperson exam at 17 but cannot activate the license until 18.","id":"geo-72d3ad74","portion":"georgia","q":"To be licensed as a Georgia salesperson an applicant must be at least:","sub":"georgia/license-law|Licensure & experience","subtopic":"Licensure & experience","topic":"georgia/license-law"},{"answer":0,"choices":["75 hours","25 hours","90 hours","60 hours"],"concept":"Georgia prelicense education","difficulty":1,"explain":"Georgia requires a 75-hour GREC-approved salesperson prelicense course. Do not confuse it with the 25-hour POSTlicense course due in the first year.","id":"geo-472088bb","portion":"georgia","q":"The Georgia prelicense course required for a salesperson's license is:","sub":"georgia/license-law|Education requirements","subtopic":"Education requirements","topic":"georgia/license-law"},{"answer":2,"choices":["Before taking the exam","Within two years","Within one year of original licensure","Only if practicing full time"],"concept":"Georgia postlicense requirement","difficulty":1,"explain":"The 25-hour Sales Post-license Course is due within ONE year of original licensure. It applies whether the license is active or inactive and whether the licensee is a Georgia resident or not. Missing it costs the license.","id":"geo-c0627056","portion":"georgia","q":"A newly licensed Georgia salesperson must complete a 25-hour postlicense course:","sub":"georgia/license-law|Education requirements","subtopic":"Education requirements","topic":"georgia/license-law"},{"answer":0,"choices":["24 hours","36 hours","12 hours","45 hours"],"concept":"Georgia continuing education","difficulty":1,"explain":"Georgia requires at least 24 hours of GREC-approved CE during each four-year renewal period. Many national study guides quote 36 hours, which is a different state -- Georgia is 24.","id":"geo-56b4785c","portion":"georgia","q":"Active Georgia licensees must complete how much continuing education each four-year renewal period?","sub":"georgia/license-law|Education requirements","subtopic":"Education requirements","topic":"georgia/license-law"},{"answer":2,"choices":["Two of the past three years","Five continuous years","Three of the five years immediately preceding application","One of the past two years"],"concept":"Georgia broker experience requirement","difficulty":1,"explain":"Three years of active licensure within the five years immediately preceding application. Active licensure in ANOTHER state counts, provided the applicant supplies a certified license history.","id":"geo-bbd32933","portion":"georgia","q":"An applicant for a Georgia broker's license must have held an active license for at least:","sub":"georgia/license-law|Licensure & experience","subtopic":"Licensure & experience","topic":"georgia/license-law"},{"answer":2,"choices":["Qualifying broker","Associate broker","Salesperson","Broker"],"concept":"Which licenses require experience","difficulty":1,"explain":"A salesperson's license has no experience requirement -- only age, education, exam, and background. Broker and associate broker both require the three-of-five-years experience.","id":"geo-f0bfc729","portion":"georgia","q":"There is no experience requirement for which Georgia license?","sub":"georgia/license-law|Licensure & experience","subtopic":"Licensure & experience","topic":"georgia/license-law"},{"answer":2,"choices":["Reprimanding a licensee","Suspending or revoking a license","Ordering a licensee to repay a consumer's financial loss","Imposing a fine and requiring education"],"concept":"Limits on GREC's authority","difficulty":1,"explain":"GREC may reprimand, suspend, revoke, fine, require education, and require accountant reports on trust accounts. It has NO power to force a licensee to compensate someone for a financial loss -- that requires a civil suit. This is a favorite exam distinction.","id":"geo-070796c2","portion":"georgia","q":"The Georgia Real Estate Commission's disciplinary powers include all of the following EXCEPT:","sub":"georgia/license-law|GREC discipline & sanctions","subtopic":"GREC discipline & sanctions","topic":"georgia/license-law"},{"answer":3,"choices":["Immediate revocation","Referral for criminal prosecution","Automatic license suspension","A consent order the licensee may sign"],"concept":"The GREC disciplinary process","difficulty":1,"explain":"The Commission may offer a Consent Order stating the violation and a proposed sanction, usually a reprimand, fine, and/or education. The licensee may sign it, propose an alternative, present evidence, or demand a formal hearing.","id":"geo-965aa59a","portion":"georgia","q":"A GREC investigation that finds a violation causing no significant public harm is most likely resolved by:","sub":"georgia/license-law|GREC discipline & sanctions","subtopic":"GREC discipline & sanctions","topic":"georgia/license-law"},{"answer":2,"choices":["The full Commission","A superior court judge","An Administrative Law Judge from the Office of State Administrative Hearings","The Attorney General"],"concept":"Who hears GREC cases","difficulty":1,"explain":"An ALJ hears the case and issues a decision. A dissatisfied respondent may then ask to appear before the Commission, and ultimately may appeal to the courts.","id":"geo-f2e2d756","portion":"georgia","q":"A formal GREC disciplinary hearing is conducted by:","sub":"georgia/license-law|Investigations & hearings","subtopic":"Investigations & hearings","topic":"georgia/license-law"},{"answer":0,"choices":["Anyone, by sworn written request -- and the Commission on its own motion","Only a party to the transaction","Only the licensee's broker","Only the Attorney General"],"concept":"Initiating an investigation","difficulty":1,"explain":"Anyone may file a sworn, written request for investigation, and the Commission may also act on its own motion. The licensee will be notified that they are the subject of an investigation.","id":"geo-98058cd4","portion":"georgia","q":"Who may initiate a GREC investigation of a licensee?","sub":"georgia/license-law|Investigations & hearings","subtopic":"Investigations & hearings","topic":"georgia/license-law"},{"answer":1,"choices":["Obtain a separate owner's permit","Disclose his licensed status in writing in the contract","Use another broker exclusively","Ignore license law because he is the owner"],"concept":"Licensee acting as a principal","difficulty":1,"explain":"O.C.G.A. 43-40-29(c) says the exceptions to licensure never apply to someone who holds a license. A licensee selling his own property must disclose licensed status in writing and put any trust funds in a broker-approved trust account.","id":"geo-83485c1c","portion":"georgia","q":"A Georgia licensee selling a property he personally owns must:","sub":"georgia/license-law|Licensee as principal","subtopic":"Licensee as principal","topic":"georgia/license-law"},{"answer":1,"choices":["Has no education obligations","Must still meet the postlicense education requirement","May still list property","Loses the license automatically"],"concept":"Inactive status obligations","difficulty":1,"explain":"Postlicense education still applies to an inactive salesperson, and renewal fees still come due. Inactive licensees may not perform licensed activity.","id":"geo-321aa315","portion":"georgia","q":"A licensee whose license is on inactive status:","sub":"georgia/license-law|Licensure & experience","subtopic":"Licensure & experience","topic":"georgia/license-law"},{"answer":1,"choices":["An attorney performing legal services","Negotiating a lease for another for compensation","An owner selling her own home","An executor selling estate property"],"concept":"Activities requiring licensure","difficulty":1,"explain":"Negotiating, listing, selling, leasing, or collecting rents FOR ANOTHER for compensation requires a license. Owners, executors, and attorneys acting in their own roles are excepted -- but never a person who already holds a license.","id":"geo-51fd47de","portion":"georgia","q":"Which activity requires a Georgia real estate license?","sub":"georgia/license-law|Licensure & experience","subtopic":"Licensure & experience","topic":"georgia/license-law"},{"answer":1,"choices":["Verbally to the broker only","By filing a change application with the Commission","Only at renewal","Within one year"],"concept":"Keeping the license record current","difficulty":1,"explain":"Changes in affiliation or status are made by filing a change application. Operating without a current, properly affiliated license is itself a violation.","id":"geo-8f8b3d94","portion":"georgia","q":"A Georgia licensee must notify GREC of a change of address or broker affiliation:","sub":"georgia/license-law|Licence administration","subtopic":"Licence administration","topic":"georgia/license-law"},{"answer":2,"choices":["The MLS","The Commission until renewal","The broker with whom the salesperson is affiliated","The salesperson personally, independent of any firm"],"concept":"Broker supervision","difficulty":1,"explain":"A salesperson may only act through and under the supervision of the affiliated broker. All compensation for licensed activity must come from that broker, not directly from a client or another licensee.","id":"geo-4f67e40c","portion":"georgia","q":"A salesperson's license in Georgia is held by:","sub":"georgia/license-law|Broker supervision & the firm","subtopic":"Broker supervision & the firm","topic":"georgia/license-law"},{"answer":1,"choices":["Only the broker's own transactions","Supervising affiliated licensees and the firm's trust accounts","Paying affiliates' income taxes","Guaranteeing affiliates' commissions"],"concept":"Qualifying broker duties","difficulty":1,"explain":"The qualifying broker answers to GREC for the firm's compliance -- supervision, trust accounts, records, and advertising. Failure to supervise is an independent violation.","id":"geo-4a0902bb","portion":"georgia","q":"The qualifying broker of a real estate firm is responsible for:","sub":"georgia/license-law|Broker supervision & the firm","subtopic":"Broker supervision & the firm","topic":"georgia/license-law"},{"answer":0,"choices":["Clearly identify the licensee's firm","Appear only in the MLS","Use only the licensee's personal name","Omit the firm name for brevity"],"concept":"Advertising and the firm name","difficulty":1,"explain":"Advertising must not be misleading and must identify the brokerage firm. A licensee may never advertise in a way that suggests they operate independently of their broker.","id":"geo-fdba3b6d","portion":"georgia","q":"Georgia advertising rules require that a licensee's advertising:","sub":"georgia/license-law|Broker supervision & the firm","subtopic":"Broker supervision & the firm","topic":"georgia/license-law"},{"answer":2,"choices":["Surrender the license automatically","Do nothing until renewal","Report the conviction to the Commission","Notify only the broker"],"concept":"Reporting convictions","difficulty":1,"explain":"Licensees must report criminal convictions to GREC. Failing to report is often punished more severely than the underlying offense.","id":"geo-3305ff44","portion":"georgia","q":"A licensee convicted of a felony after licensure must:","sub":"georgia/license-law|GREC discipline & sanctions","subtopic":"GREC discipline & sanctions","topic":"georgia/license-law"},{"answer":1,"choices":["Always prohibited","Permitted only under strict disclosure conditions","The standard listing form","Required for commercial property"],"concept":"Net listings in Georgia","difficulty":1,"explain":"Georgia permits net listings only with careful disclosure, because they create a conflict between the broker's profit and the client's interest. Many brokerages ban them outright by policy.","id":"geo-c0b31065","portion":"georgia","q":"Under Georgia law, a net listing is:","sub":"georgia/license-law|Licence administration","subtopic":"Licence administration","topic":"georgia/license-law"},{"answer":3,"choices":["Elected by licensees","Appointed by the Attorney General","Selected by the state association of REALTORS","Appointed by the Governor"],"concept":"GREC structure","difficulty":1,"explain":"Commission members are appointed by the Governor. GREC administers the license law, issues rules, investigates complaints, and disciplines licensees.","id":"geo-339a3d36","portion":"georgia","q":"The Georgia Real Estate Commission's members are:","sub":"georgia/license-law|GREC discipline & sanctions","subtopic":"GREC discipline & sanctions","topic":"georgia/license-law"},{"answer":1,"choices":["Held in the salesperson's name","A federally insured checking account the bank designates as a trust or escrow account","Any personal savings account","An investment brokerage account"],"concept":"Trust account requirements","difficulty":1,"explain":"It must be a separate, federally insured bank checking account that the BANK designates as trust or escrow, registered with the Commission, with the broker holding signatory power.","id":"geo-1162a3ff","portion":"georgia","q":"A Georgia broker's trust account must be:","sub":"georgia/trust-accounts|Opening & registering the account","subtopic":"Opening & registering the account","topic":"georgia/trust-accounts"},{"answer":1,"choices":["The broker's Social Security Number","An Employer Identification Number","The client's tax ID","No tax identification"],"concept":"Protecting the trust account from seizure","difficulty":1,"explain":"Accounts opened under a broker's SSN have been seized by the IRS, awarded in divorce, and attached by banks for the broker's personal debts. An EIN keeps the account identifiable as trust property.","id":"geo-0aa08fbc","portion":"georgia","q":"A Georgia broker should open the trust account under:","sub":"georgia/trust-accounts|Opening & registering the account","subtopic":"Opening & registering the account","topic":"georgia/trust-accounts"},{"answer":2,"choices":["Whenever the broker chooses","Only after closing","Promptly, unless all parties give written authority otherwise","Within 30 days"],"concept":"Timing of trust deposits","difficulty":1,"explain":"Funds must be deposited promptly into a non-interest-bearing checking account. To hold a check until offer acceptance, or to use an interest-bearing account, the broker needs clear WRITTEN authority agreed to by all parties.","id":"geo-f298f548","portion":"georgia","q":"Georgia law requires a broker to deposit trust funds:","sub":"georgia/trust-accounts|Deposit timing","subtopic":"Deposit timing","topic":"georgia/trust-accounts"},{"answer":0,"choices":["Commingling","Subrogation","A permissible practice","Novation"],"concept":"Commingling in Georgia","difficulty":1,"explain":"Trust funds must stay separate from the broker's own money. Commingling is one of the most frequently disciplined license law violations; actually spending the funds is conversion.","id":"geo-84751b3a","portion":"georgia","q":"A broker who deposits earnest money into the firm's operating account has committed:","sub":"georgia/trust-accounts|Deposit timing","subtopic":"Deposit timing","topic":"georgia/trust-accounts"},{"answer":0,"choices":["At least one, and more if each is registered with the Commission","One per affiliated licensee","Exactly one","No more than two"],"concept":"Multiple trust accounts","difficulty":1,"explain":"Brokers must have at least one but may have several -- commonly separate accounts for earnest money, rents, and security deposits. Each must be bank-designated as trust and registered with GREC, with the broker holding signatory power.","id":"geo-0ef45ddf","portion":"georgia","q":"How many trust accounts may a Georgia broker maintain?","sub":"georgia/trust-accounts|Opening & registering the account","subtopic":"Opening & registering the account","topic":"georgia/trust-accounts"},{"answer":2,"choices":["No access without a warrant","Setting the interest rate","Examining the account upon reasonable request","Freezing the account at will"],"concept":"GREC audit authority","difficulty":1,"explain":"GREC may examine trust accounts on reasonable request and does so routinely. The Commission may accept a CPA's certification of compliance in lieu of its own examination, at its discretion.","id":"geo-7b4bf9f8","portion":"georgia","q":"The Georgia Real Estate Commission's authority over a broker's trust account includes:","sub":"georgia/trust-accounts|Audits & reconciliation","subtopic":"Audits & reconciliation","topic":"georgia/trust-accounts"},{"answer":2,"choices":["A buyer's advance for a credit report","Rents collected for an owner","The broker's earned commission after disbursement","A tenant's security deposit"],"concept":"What counts as trust funds","difficulty":1,"explain":"Once a transaction closes and the commission is properly earned and disbursed, it is the broker's money. Everything held ON BEHALF OF another -- deposits, rents, advances -- is trust money.","id":"geo-059d3763","portion":"georgia","q":"Which of these is NOT trust money that must go into the trust account?","sub":"georgia/trust-accounts|What counts as trust money","subtopic":"What counts as trust money","topic":"georgia/trust-accounts"},{"answer":3,"choices":["Interest is earned","The account balance changes","A new client is added","The trust account's bank, name, or number changes or the account closes"],"concept":"Trust account recordkeeping duties","difficulty":1,"explain":"Any change in the bank, account name or number, or closure of the account requires written notice to GREC on Commission forms.","id":"geo-bbcc573a","portion":"georgia","q":"A broker must notify the Commission in writing when:","sub":"georgia/trust-accounts|Opening & registering the account","subtopic":"Opening & registering the account","topic":"georgia/trust-accounts"},{"answer":0,"choices":["Each client depositor is treated as a separate account owner","The broker is insured for $250,000 total","Coverage is unlimited","No coverage applies to trust accounts"],"concept":"FDIC coverage of trust accounts","difficulty":1,"explain":"With proper records, each buyer, seller, or tenant is insured separately up to $250,000. But the FDIC ADDS that person's other deposits in the same bank, so a client near the limit may be underinsured -- brokers should disclose which bank they use.","id":"geo-167a6da3","portion":"georgia","q":"FDIC 'pass-through' coverage on a broker's trust account means:","sub":"georgia/trust-accounts|FDIC coverage","subtopic":"FDIC coverage","topic":"georgia/trust-accounts"},{"answer":2,"choices":["Keep no records","Register the account personally with the IRS only","Provide the broker at least quarterly written reconciliation statements","Avoid telling the broker"],"concept":"Affiliate-held trust accounts","difficulty":1,"explain":"The broker must register the account with GREC and remains responsible for it. The affiliate must provide at least quarterly written reconciliations comparing total trust liability with the reconciled bank balance.","id":"geo-a6ab9dae","portion":"georgia","q":"An affiliated licensee permitted to hold a trust account for personally owned rentals must:","sub":"georgia/trust-accounts|Audits & reconciliation","subtopic":"Audits & reconciliation","topic":"georgia/trust-accounts"},{"answer":3,"choices":["A verbal promise to represent","Showing a buyer three properties","Paying the broker a commission","A written brokerage engagement"],"concept":"How agency is created in Georgia","difficulty":1,"explain":"BRRETA defines agency as representing another as a client 'by the latter's WRITTEN authority.' A brokerage engagement is a written contract. This is why accidental agency is far harder to create in Georgia than in many states.","id":"geo-e8f74763","portion":"georgia","q":"Under BRRETA, an agency relationship in Georgia is created by:","sub":"georgia/brreta|Creating the engagement","subtopic":"Creating the engagement","topic":"georgia/brreta"},{"answer":0,"choices":["No -- there must be an express written agreement","Yes, always","Yes, if the payer is the seller","Only in residential transactions"],"concept":"Compensation does not equal agency","difficulty":1,"explain":"A seller paying the buyer's broker does NOT make that broker the seller's agent. Source of compensation and agency are separate questions -- a frequently tested point.","id":"geo-52c8c0e7","portion":"georgia","q":"Under BRRETA, does paying a broker's commission by itself create an agency relationship?","sub":"georgia/brreta|Creating the engagement","subtopic":"Creating the engagement","topic":"georgia/brreta"},{"answer":2,"choices":["Principal","Client","Customer","Subagent"],"concept":"Client vs. customer under BRRETA","difficulty":1,"explain":"A CLIENT is represented under a written brokerage engagement. A CUSTOMER is unrepresented; the broker may perform ministerial acts for them under a verbal OR written agreement.","id":"geo-baee4117","portion":"georgia","q":"Under BRRETA, a person NOT represented by a broker but for whom the broker performs ministerial acts is a:","sub":"georgia/brreta|Client vs. customer","subtopic":"Client vs. customer","topic":"georgia/brreta"},{"answer":3,"choices":["Owes no duties at all","Owes unlimited fiduciary duties","May not represent buyers","Is not deemed to have a fiduciary relationship, but must exercise reasonable care in the duties specified"],"concept":"BRRETA limits the scope of duties","difficulty":1,"explain":"BRRETA states a broker 'shall not be deemed to have a fiduciary relationship with any party' and is responsible for reasonable care in discharging the duties the statute and the engagement specify. This narrowing of liability is the heart of the Act.","id":"geo-46ec3b54","portion":"georgia","q":"A significant difference between BRRETA and traditional common-law agency is that under BRRETA a broker:","sub":"georgia/brreta|Scope of duties under BRRETA","subtopic":"Scope of duties under BRRETA","topic":"georgia/brreta"},{"answer":2,"choices":["The broker's compensation and whether it is shared","The broker's confidentiality obligations","The names of the broker's other clients buying similar property","The types of agency relationships available"],"concept":"The four BRRETA pre-engagement disclosures","difficulty":1,"explain":"The broker discloses agency types available, conflicting relationships actually known, compensation and sharing, and confidentiality obligations. It expressly EXCLUDES having to reveal that the broker represents other buyers or sellers generally.","id":"geo-79ff4d97","portion":"georgia","q":"BRRETA requires a broker, before or at the time of entering a brokerage engagement, to advise the prospective client of all of the following EXCEPT:","sub":"georgia/brreta|Required disclosures","subtopic":"Required disclosures","topic":"georgia/brreta"},{"answer":1,"choices":["Prohibited in Georgia","Allowed with written consent from both clients","Allowed with verbal consent","Allowed only for commercial property"],"concept":"Dual agency in Georgia","difficulty":1,"explain":"Georgia permits dual agency but requires written consent. Consent is presumed if the writing contains the required elements, including a statement that the client does NOT have to consent.","id":"geo-09ddd332","portion":"georgia","q":"Under BRRETA, dual agency is:","sub":"georgia/brreta|Dual agency","subtopic":"Dual agency","topic":"georgia/brreta"},{"answer":2,"choices":["The commission will be doubled","The broker will favor the seller","The client does not have to consent to the dual agency","The client must consent to proceed"],"concept":"Contents of dual agency consent","difficulty":1,"explain":"The writing must describe the transactions involved, state that the broker represents two clients with potentially adverse interests, explain the disclosure of adverse material facts, and state that consent is voluntary.","id":"geo-aa6e7675","portion":"georgia","q":"A required element of a valid Georgia dual agency consent is a statement that:","sub":"georgia/brreta|Dual agency","subtopic":"Dual agency","topic":"georgia/brreta"},{"answer":2,"choices":["A conflict requiring withdrawal","Automatically illegal dual agency","Designated agency, permitted with written consent","Subagency"],"concept":"Designated agency -- a Georgia distinction","difficulty":1,"explain":"Many states treat this as firm-wide dual agency. BRRETA lets the broker assign different affiliated licensees to represent opposing clients, with the parties' written consent. Each designated agent represents only their own client.","id":"geo-beaf1733","portion":"georgia","q":"Two licensees of the same Georgia firm represent the buyer and the seller in one transaction. This is:","sub":"georgia/brreta|Designated agency","subtopic":"Designated agency","topic":"georgia/brreta"},{"answer":3,"choices":["The other designated agent in the firm","Any licensee in the firm","The other party's attorney","Their broker only"],"concept":"Confidentiality between designated agents","difficulty":1,"expla
