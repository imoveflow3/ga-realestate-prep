<title>Georgia Real Estate Prep</title>

<style>/* Georgia Real Estate Prep -- tokens first, then components.
   Three theme states: bare :root is light, prefers-color-scheme handles the
   unstamped default, and [data-theme] stamps let an explicit choice win. */
:root{
  --bg:#f4f6f8;
  --panel:#ffffff;
  --sunk:#eef1f5;
  --ink:#151d27;
  --ink-soft:#3d4a5c;
  --muted:#63718a;
  --line:#dfe5ec;
  --line-strong:#c6d0dc;
  --accent:#1c5a9e;          /* deed-blue: the one bold colour */
  --accent-ink:#ffffff;
  --accent-soft:#e6eef8;
  --ga:#8a6529;              /* Georgia gold, used only for state-portion marks */
  --ga-soft:#f5edde;
  --comp:#4a5a86;            /* comprehensive subtest: a drill, not an exam section */
  --comp-soft:#e9ecf6;
  --good:#16704a;  --good-soft:#e3f2ea;
  --bad:#a92318;   --bad-soft:#fbeae8;
  --warn:#8a6529;
  --radius:11px;
  --shadow:0 1px 2px rgba(21,29,39,.05), 0 6px 18px rgba(21,29,39,.05);
  --display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --body:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10151b;
    --panel:#182029;
    --sunk:#131a22;
    --ink:#e8edf3;
    --ink-soft:#c2cbd6;
    --muted:#8d9bad;
    --line:#28323e;
    --line-strong:#3a4653;
    --accent:#6fa8e6;
    --accent-ink:#0d1319;
    --accent-soft:#1b2735;
    --ga:#d6ae68;
    --ga-soft:#2c2416;
    --comp:#9aa8d4;
    --comp-soft:#1e2233;
    --good:#5cc794;  --good-soft:#142c20;
    --bad:#f0918a;   --bad-soft:#301917;
    --warn:#d6ae68;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --bg:#10151b;
  --panel:#182029;
  --sunk:#131a22;
  --ink:#e8edf3;
  --ink-soft:#c2cbd6;
  --muted:#8d9bad;
  --line:#28323e;
  --line-strong:#3a4653;
  --accent:#6fa8e6;
  --accent-ink:#0d1319;
  --accent-soft:#1b2735;
  --ga:#d6ae68;
  --ga-soft:#2c2416;
  --comp:#9aa8d4;
  --comp-soft:#1e2233;
  --good:#5cc794;  --good-soft:#142c20;
  --bad:#f0918a;   --bad-soft:#301917;
  --warn:#d6ae68;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.28);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:400 15.5px/1.6 var(--body);
  font-variant-numeric:tabular-nums;
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------------------------------------------------------------- chrome */
header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.bar{max-width:1020px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{font:700 17px/1.2 var(--display);letter-spacing:-.01em}
.brand small{display:block;font:400 12px/1.5 var(--body);color:var(--muted);letter-spacing:.01em;margin-top:2px}
nav{display:flex;gap:3px;flex-wrap:wrap;margin-left:auto}
nav button{
  background:none;border:1px solid transparent;color:var(--muted);
  padding:6px 13px;border-radius:999px;cursor:pointer;font:500 14px var(--body);
}
nav button:hover{color:var(--ink);background:var(--sunk)}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
main{max-width:1020px;margin:0 auto;padding:24px 20px 40px}
footer{
  max-width:1020px;margin:0 auto;padding:18px 20px 44px;
  display:flex;gap:14px;justify-content:space-between;flex-wrap:wrap;
  color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);
}

/* ------------------------------------------------------------ typography */
h1{font:700 25px/1.25 var(--display);margin:0 0 5px;letter-spacing:-.015em;text-wrap:balance}
h2{font:600 16.5px/1.3 var(--display);margin:0 0 10px;text-wrap:balance}
h3{font:600 15.5px/1.3 var(--display);margin:0 0 2px}
.sub{color:var(--muted);margin:0 0 18px;max-width:66ch}
.muted{color:var(--muted);font-size:13.5px}
.eyebrow{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}

/* ---------------------------------------------------------------- blocks */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row>div{flex:1;min-width:145px}
.stack{display:flex;flex-direction:column;gap:12px}

button.btn{
  background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);
  padding:9px 17px;border-radius:8px;cursor:pointer;font:600 14px var(--body);
}
button.btn:hover{filter:brightness(1.08)}
button.btn.ghost{background:var(--panel);color:var(--accent);border-color:var(--line-strong)}
button.btn.ghost:hover{background:var(--accent-soft);filter:none}
button.btn.danger{background:var(--panel);color:var(--bad);border-color:var(--line-strong)}
button.btn:disabled{opacity:.42;cursor:not-allowed;filter:none}

label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
input,select,textarea{
  font:400 14.5px var(--body);padding:9px 11px;border:1px solid var(--line-strong);
  border-radius:8px;background:var(--panel);color:var(--ink);width:100%;
}
textarea{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.5}

.stat{font:700 27px/1.15 var(--display);letter-spacing:-.02em}
.stat.small{font-size:20px}
.tag{display:inline-block;font:600 10.5px var(--body);letter-spacing:.05em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);vertical-align:2px}
.tag.ga{background:var(--ga-soft);color:var(--ga)}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
th{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.num,th.num{text-align:right}
.scroll{overflow-x:auto}
.bar-track{height:7px;background:var(--sunk);border-radius:999px;overflow:hidden;min-width:70px}
.bar-fill{height:100%;border-radius:999px;background:var(--accent)}
.bar-fill.low{background:var(--bad)} .bar-fill.mid{background:var(--warn)} .bar-fill.high{background:var(--good)}
.empty{text-align:center;color:var(--muted);padding:30px 12px}

/* ----------------------------------------------------------------- quiz */
.progressbar{height:4px;background:var(--line);border-radius:999px;margin-bottom:16px;overflow:hidden}
.progressbar>div{height:100%;background:var(--accent);transition:width .2s ease}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.timer{font:700 19px var(--body);font-variant-numeric:tabular-nums}
.timer.warn{color:var(--bad)}
.qtext{font:400 17px/1.5 var(--body);margin:7px 0 17px}
.choices{display:grid;gap:9px}
.choice{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  background:var(--panel);border:1px solid var(--line-strong);border-radius:9px;
  padding:12px 14px;cursor:pointer;font:400 15px/1.45 var(--body);color:inherit}
.choice:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.choice:disabled{cursor:default}
.choice .k{font-weight:700;color:var(--muted);min-width:17px}
.choice.correct{border-color:var(--good);background:var(--good-soft)}
.choice.correct .k{color:var(--good)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.wrong .k{color:var(--bad)}
.feedback{margin-top:15px;border-radius:9px;padding:15px;border:1px solid var(--line);background:var(--sunk)}
.feedback .verdict{font:600 15px var(--display);margin-bottom:6px}
.feedback.ok .verdict{color:var(--good)}
.feedback.no .verdict{color:var(--bad)}
.concept{font-size:13px;color:var(--muted);margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.steps{margin:11px 0 0;padding-left:19px}
.steps li{margin:5px 0}

/* ----------------------------------------------------------------- plan */
.week{border-left:3px solid var(--accent);padding-left:15px}
.week .when{font-size:12.5px;color:var(--muted)}
.week ul{margin:9px 0 0;padding-left:19px}
.week li{margin:4px 0;font-size:14.5px}
.focuslist{display:grid;gap:7px;margin-top:10px}
.focus{background:var(--sunk);border-radius:8px;padding:9px 11px;font-size:13.5px}
.focus b{font-size:14.5px}
.pick{display:flex;align-items:flex-start;gap:8px;background:var(--sunk);border-radius:8px;
  padding:9px 11px;font-size:13.5px;cursor:pointer;color:var(--ink)}
.pick input{width:auto;margin:2px 0 0}

/* --------------------------------------------------------------- charts */
.trendrow{display:flex;gap:16px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.trendrow:last-child{border-bottom:0}
.trendrow .who{flex:1;min-width:190px}
.spark{color:var(--accent)}
.spark .gl{stroke:var(--line-strong)}
.spark text{fill:var(--muted);font:400 9.5px var(--body)}

/* comprehensive subtest + difficulty marks */
.tag.comp{background:var(--comp-soft);color:var(--comp)}
.tag.hard{background:var(--bad-soft);color:var(--bad)}

/* -------------------------------------------------- dashboard readouts */
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  flex-wrap:wrap;margin-bottom:10px}
.cardhead h2{margin:0}
.hint{font:600 10.5px var(--body);text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted)}
.readouts{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.readout .eyebrow{margin-bottom:3px}
.readout .stat{line-height:1.05;margin-bottom:2px}
.stat.good{color:var(--good)}
.stat.bad{color:var(--bad)}

/* stat tables: tighter, with drill buttons in the last column */
table.stats td,table.stats th{padding:7px 9px;white-space:nowrap}
table.stats td:first-child,table.stats th:first-child{white-space:normal;min-width:170px}
table.stats .bar-track{min-width:96px}
table.stats tr.grouprow td{
  padding:14px 9px 5px;border-bottom:1px solid var(--line-strong);
  font:600 10.5px var(--body);text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted);
}
table.stats tr.grouprow:first-child td{padding-top:2px}
td.up{color:var(--good)} td.down{color:var(--bad)}
button.btn.mini{padding:4px 11px;font-size:11.5px;letter-spacing:.06em;border-radius:6px}
</style>

</head>

<header>
  <div class="bar">
    <div class="brand">Georgia Real Estate Prep
      <small id="countdown">salesperson licensing exam</small></div>
    <nav id="rail" aria-label="Sections">

      <button data-view="plan" aria-current="false">Study plan</button>
      <button data-view="setup" aria-current="false">Setup</button>
    </nav>
  </div>
</header>

<main>
  <section id="view-home"></section>
  <section id="view-math" hidden></section>

  <section id="view-dash" hidden></section>
  <section id="view-plan" hidden></section>
  <section id="view-setup" hidden></section>
</main>

<footer>
  <span id="bankcount"></span>
  <span>Practice questions, not an official statement of Georgia law. Verify current
    rules at grec.state.ga.us.</span>
</footer>

ignment.","counts_on_exam":true},{"key":"national/transfer","portion":"national","label":"Transfer of title","exam_questions":8,"blurb":"Deeds, title insurance, recording, closing, adverse possession.","counts_on_exam":true},{"key":"national/practice","portion":"national","label":"Practice of real estate","exam_questions":10,"blurb":"Advertising, fair housing, antitrust, licensing, trust funds.","counts_on_exam":true},{"key":"national/math","portion":"national","label":"Real estate math","exam_questions":5,"blurb":"Commissions, prorations, LTV, points, area, appreciation.","counts_on_exam":true},{"key":"georgia/license-law","portion":"georgia","label":"GREC license law & rules","exam_questions":14,"blurb":"Licensing, renewal, education, GREC authority, sanctions.","counts_on_exam":true},{"key":"georgia/brreta","portion":"georgia","label":"Brokerage relationships (BRRETA)","exam_questions":10,"blurb":"Georgia agency law, engagements, dual and designated agency.","counts_on_exam":true},{"key":"georgia/contracts","portion":"georgia","label":"Georgia contracts & forms","exam_questions":8,"blurb":"Georgia contract requirements, offers, earnest money terms.","counts_on_exam":true},{"key":"georgia/disclosures","portion":"georgia","label":"Georgia disclosures","exam_questions":6,"blurb":"What Georgia requires disclosed, and what it protects.","counts_on_exam":true},{"key":"georgia/trust-accounts","portion":"georgia","label":"Trust accounts & earnest money","exam_questions":4,"blurb":"Designated trust accounts, deadlines, disbursement, records.","counts_on_exam":true},{"key":"georgia/procedures","portion":"georgia","label":"Closings, escrow & procedure","exam_questions":5,"blurb":"Attorney-conducted closings, title, transfer tax, recording.","counts_on_exam":true},{"key":"georgia/fair-housing","portion":"georgia","label":"Fair housing in Georgia","exam_questions":5,"blurb":"Federal and Georgia fair housing as GREC enforces it.","counts_on_exam":true},{"key":"comp/vocabulary","portion":"comprehensive","label":"Vocabulary & terminology","exam_questions":12,"blurb":"The terms both portions assume you already know.","counts_on_exam":false},{"key":"comp/situational","portion":"comprehensive","label":"Situational judgment","exam_questions":12,"blurb":"You are the licensee -- what do you actually do?","counts_on_exam":false},{"key":"comp/grec-deep","portion":"comprehensive","label":"GREC law deep-dive","exam_questions":10,"blurb":"The license-law detail the state portion leans on hardest.","counts_on_exam":false},{"key":"comp/closing-math","portion":"comprehensive","label":"Closing & settlement math","exam_questions":8,"blurb":"Debits, credits, prorations, and who pays what at the table.","counts_on_exam":false}],"banks":{"national":[{"answer":1,"choices":["Estate at sufferance","Leased fee estate","Leasehold estate","Life estate"],"concept":"Freehold vs. leasehold interests","difficulty":1,"explain":"The LANDLORD holds the leased fee estate (ownership subject to the lease); the TENANT holds the leasehold. A tenant who stays past expiration without permission creates an estate at sufferance, but that describes the tenant, not the landlord.","id":"nat-140b8304","portion":"national","q":"A tenant's lease expires and the landlord takes back possession. The landlord's interest during the lease term was a:","sub":"national/ownership|Estates & the bundle of rights","subtopic":"Estates & the bundle of rights","topic":"national/ownership"},{"answer":2,"choices":["Joint tenant with the other two","Trustee for the other two","Tenant in common with the other two","Tenant by the entirety"],"concept":"Severance of joint tenancy","difficulty":1,"explain":"Selling a joint tenancy interest severs the four unities as to that share. The buyer takes as a tenant in common; the two remaining original owners stay joint tenants with each other and keep survivorship between themselves.","id":"nat-706069e5","portion":"national","q":"Three people own property as joint tenants. One sells her interest to a stranger. The new owner holds title as a:","sub":"national/ownership|Co-ownership & survivorship","subtopic":"Co-ownership & survivorship","topic":"national/ownership"},{"answer":2,"choices":["Fee simple defeasible","Life estate pur autre vie","Fee simple absolute","Leasehold for 99 years"],"concept":"The bundle of rights and degrees of ownership","difficulty":1,"explain":"Fee simple absolute is ownership without condition or time limit -- the entire bundle of rights. A defeasible fee can be lost if a condition occurs, and a life estate ends at a death.","id":"nat-fd3b7053","portion":"national","q":"Which of these is the MOST complete form of ownership recognized in law?","sub":"national/ownership|Estates & the bundle of rights","subtopic":"Estates & the bundle of rights","topic":"national/ownership"},{"answer":1,"choices":["An emblement","A fixture that conveys with the real estate","Personal property the seller may remove","A trade fixture"],"concept":"Fixtures: personal property becoming real property","difficulty":1,"explain":"Courts look at method of annexation, adaptation to the property, and intent. A built-in appliance is annexed and adapted, so it conveys unless the contract excludes it. Trade fixtures belong to a commercial TENANT and are removable.","id":"nat-dd11c32c","portion":"national","q":"A built-in dishwasher installed by the seller is BEST classified at closing as:","sub":"national/ownership|Fixtures & trade fixtures","subtopic":"Fixtures & trade fixtures","topic":"national/ownership"},{"answer":0,"choices":["As a tenant in common with the other unit owners","Under a proprietary lease","Not at all -- the association owns them","As a joint tenant with the association"],"concept":"Condominium vs. cooperative ownership","difficulty":1,"explain":"Condo owners own their unit in fee plus an undivided tenancy-in-common interest in common elements. A COOPERATIVE is the one where a corporation owns the building and the s flammable","It crumbles and releases fibers into the air","It attracts moisture"],"concept":"Asbestos hazards","difficulty":1,"explain":"Friable material can be crumbled by hand and releases airborne fibers. Intact asbestos is often best ENCAPSULATED rather than removed, since improper removal raises exposure.","id":"nat-4ada5806","portion":"national","q":"Friable asbestos is dangerous chiefly because:","sub":"national/disclosures|Environmental hazards","subtopic":"Environmental hazards","topic":"national/disclosures"},{"answer":0,"choices":["Potential soil and groundwater contamination","Loss of riparian rights","Property tax assessment","Zoning nonconformity"],"concept":"USTs as an environmental hazard","difficulty":1,"explain":"Leaking tanks contaminate soil and groundwater, and the cleanup obligation can fall on the current owner under CERCLA-style liability.","id":"nat-afc7e1a0","portion":"national","q":"An underground storage tank triggers a disclosure concern mainly because of:","sub":"national/disclosures|Environmental hazards","subtopic":"Environmental hazards","topic":"national/disclosures"},{"answer":1,"choices":["Novation","Fraudulent concealment of a material fact","Puffing","A permissible withholding of client confidences"],"concept":"Material fact vs. client confidence","difficulty":1,"explain":"Confidentiality never covers material defects. A known physical condition affecting value or desirability must be disclosed to buyers -- silence about it is fraudulent concealment, not loyalty.","id":"nat-564a1d27","portion":"national","q":"A seller's agent who knows the basement floods after heavy rain and stays silent has committed:","sub":"national/disclosures|Material facts & latent defects","subtopic":"Material facts & latent defects","topic":"national/disclosures"},{"answer":0,"choices":["Identify potential contamination through records and inspection","Certify the septic system","Remediate contamination","Establish market value"],"concept":"Environmental due diligence","difficulty":1,"explain":"A Phase I is a non-invasive review of records, interviews, and a site visit. Only if it finds a concern does a Phase II involve sampling and testing.","id":"nat-2e29719d","portion":"national","q":"The purpose of a Phase I Environmental Site Assessment is to:","sub":"national/disclosures|Environmental hazards","subtopic":"Environmental hazards","topic":"national/disclosures"},{"answer":0,"choices":["Before or at the time the buyer makes an offer","After closing","Only if the buyer requests it","Only for new construction"],"concept":"Timing of seller disclosure","difficulty":1,"explain":"Disclosure must come early enough for the buyer to weigh it before committing. Delivery after a binding contract typically gives the buyer a right to rescind.","id":"nat-8391b49f","portion":"national","q":"Most states require a residential seller's property disclosure to be delivered:","sub":"national/disclosures|Disclosure timing & duties","subtopic":"Disclosure timing & duties","topic":"national/disclosures"},{"answer":0,"choices":["Counteroffer that rejects the original offer","Conditional acceptance binding both","Voidable acceptance","Valid acceptance"],"concept":"Mirror-image rule of acceptance","difficulty":1,"explain":"Any change to terms is a COUNTEROFFER, which terminates the original offer and makes the former seller the new offeror. The original buyer is then free to accept, reject, or counter again.","id":"nat-80112577","portion":"national","q":"A buyer makes an offer; the seller changes the closing date and signs. This is legally a:","sub":"national/contracts|Offer, acceptance & counteroffers","subtopic":"Offer, acceptance & counteroffers","topic":"national/contracts"},{"answer":3,"choices":["Void","Voidable by the adult party","Unenforceable by anyone","Voidable by the minor"],"concept":"Capacity and the void/voidable distinction","difficulty":1,"explain":"The minor may disaffirm, so the contract is VOIDABLE at the minor's op contracts","topic":"national/contracts"},{"answer":0,"choices":["Rights only, with the assignor remaining secondarily liable","All liability, releasing the assignor completely","Ownership of the real property","Nothing without a new contract"],"concept":"Assignment vs. novation","difficulty":1,"explain":"An assignment passes rights but leaves the original party secondarily liable. Only a NOVATION -- substituting a new party with everyone's consent -- releases the original party.","id":"nat-fb500977","portion":"national","q":"Assignment of a contract transfers:","sub":"national/contracts|Assignment & novation","subtopic":"Assignment & novation","topic":"national/contracts"},{"answer":3,"choices":["Executory","Void","Unilateral","Executed"],"concept":"Executory vs. executed","difficulty":1,"explain":"EXECUTED means fully performed. A contract signed but not yet closed is EXECUTORY -- a distinction the exam likes, since 'executed' also loosely means 'signed' in everyday speech.","id":"nat-bb8886e4","portion":"national","q":"A contract that has been fully performed by both parties is:","sub":"national/contracts|Contract terms & performance","subtopic":"Contract terms & performance","topic":"national/contracts"},{"answer":3,"choices":["Lender, by fixing the rate","Seller, by guaranteeing the sale","Broker, by securing commission","Buyer, by allowing withdrawal if the loan is denied"],"concept":"Contingencies as conditions precedent","difficulty":1,"explain":"If the buyer applies in good faith and the loan is denied within the contingency period, the buyer may terminate and recover the earnest money.","id":"nat-8b534de3","portion":"national","q":"A financing contingency in a purchase agreement protects the:","sub":"national/contracts|Contingencies & conditions","subtopic":"Contingencies & conditions","topic":"national/contracts"},{"answer":2,"choices":["Absence of earnest money","A low sale price","Fraud, duress, menace, undue influence, or mistake","Failure to record"],"concept":"Genuine assent","difficulty":1,"explain":"The four essentials are competent parties, mutual assent (offer and acceptance), consideration, and lawful object. Fraud or duress makes the contract VOIDABLE by the injured party.","id":"nat-b4cf064c","portion":"national","q":"Mutual assent in a contract is destroyed by:","sub":"national/contracts|Validity, capacity & the Statute of Frauds","subtopic":"Validity, capacity & the Statute of Frauds","topic":"national/contracts"},{"answer":1,"choices":["Death of the offeror","The offeree telling a friend she will probably accept","Revocation before acceptance","Lapse of the stated time"],"concept":"Termination of an offer","difficulty":1,"explain":"Acceptance must be communicated TO THE OFFEROR. Private intent changes nothing. Offers end by revocation, rejection, counteroffer, lapse, death or incapacity, or destruction of the property.","id":"nat-c505648a","portion":"national","q":"An offer terminates in all of the following ways EXCEPT:","sub":"national/contracts|Offer, acceptance & counteroffers","subtopic":"Offer, acceptance & counteroffers","topic":"national/contracts"},{"answer":2,"choices":["Recording a satisfaction","Delivering the deed at signing","Retaining legal title until the price is paid","Providing title insurance"],"concept":"Installment land contracts","difficulty":1,"explain":"The buyer takes possession and equitable title while the seller keeps legal title as security. The buyer's risk is losing everything on default if the contract lacks protection.","id":"nat-0b17e06c","portion":"national","q":"A land contract (contract for deed) is characterized by the seller:","sub":"national/contracts|Options & installment contracts","subtopic":"Options & installment contracts","topic":"national/contracts"},{"answer":0,"choices":["Agreed to in advance in the contract","Determined by a jury after trial","Unenforceable in real estate","Always three times the deposit"],"concept":"Liquidated damages clauses","difficulty":1,"explain":"Parties fix the amount in advance -- typically the earnest money -- to avoid litigating actual loss. Courts will void the clause if the sum is so large it functions as a penalty.","id":"nat-ee5f6eda","portion":"national","q":"Liquidated damages differ from actual damages in that liquidated damages are:","sub":"national/contracts|Breach, remedies & damages","subtopic":"Breach, remedies & damages","topic":"national/contracts"},{"answer":2,"choices":["Reformation","Novation","Rescission","Assignment"],"concept":"Discharge of contracts","difficulty":1,"explain":"RESCISSION unwinds the contract and returns the parties to the status quo. REFORMATION is a court rewriting the document to reflect the parties' true intent -- usually to fix a scrivener's error.","id":"nat-53e024b5","portion":"national","q":"If a buyer and seller sign an agreement to cancel their contract and restore each party to their prior position, this is:","sub":"national/contracts|Breach, remedies & damages","subtopic":"Breach, remedies & damages","topic":"national/contracts"},{"answer":1,"choices":["Quitclaim deed","General warranty deed","Bargain and sale deed","Special warranty deed"],"concept":"Deed types and covenants","difficulty":1,"explain":"A general warranty deed warrants title against ALL defects, back through the entire chain, including before the grantor owned it. A SPECIAL warranty covers only the grantor's own period; a QUITCLAIM warrants nothing.","id":"nat-526404cf","portion":"national","q":"The deed offering the greatest protection to the grantee is the:","sub":"national/transfer|Deeds & covenants of title","subtopic":"Deeds & covenants of title","topic":"national/transfer"},{"answer":0,"choices":["Covenant of quiet enjoyment","Covenant against encumbrances","Covenant of further assurance","Covenant of seisin"],"concept":"The covenants of title","difficulty":1,"explain":"Quiet enjoyment promises undisturbed possession and defense against lawful claims. SEISIN promises fers from other insurance in that it protects against:","sub":"national/transfer|Title evidence & clearing defects","subtopic":"Title evidence & clearing defects","topic":"national/transfer"},{"answer":0,"choices":["Adverse possession","Accretion","Dedication","Alienation"],"concept":"Involuntary alienation","difficulty":1,"explain":"Adverse possession requires possession that is open, notorious, hostile, actual, and continuous for the statutory term. Georgia's period is 20 years, or 7 years under color of title.","id":"nat-fe3dbb3b","portion":"national","q":"Acquiring title by open, notorious, hostile, and continuous possession for the statutory period is:","sub":"national/transfer|Adverse possession & involuntary transfer","subtopic":"Adverse possession & involuntary transfer","topic":"national/transfer"},{"answer":3,"choices":["By devise","Intestate","In escheat","Testate"],"concept":"Transfer at death","difficulty":1,"explain":"TESTATE means with a will; INTESTATE means without, in which case state succession laws control. Real property passed by will is a DEVISE; personal property is a bequest or legacy.","id":"nat-0b0f2e27","portion":"national","q":"A person who dies leaving a valid will dies:","sub":"national/transfer|Adverse possession & involuntary transfer","subtopic":"Adverse possession & involuntary transfer","topic":"national/transfer"},{"answer":2,"choices":["Reliction","Erosion","Accretion","Avulsion"],"concept":"Natural changes to land","difficulty":1,"explain":"ACCRETION is gradual buildup (the new land is alluvion). AVULSION is sudden loss or addition; RELICTION is land exposed when water permanently recedes.","id":"nat-cc78d617","portion":"national","q":"The gradual addition of land by waterborne deposits of soil is:","sub":"national/transfer|Adverse possession & involuntary transfer","subtopic":"Adverse possession & involuntary transfer","topic":"national/transfer"},{"answer":1,"choices":["Certificate of occupancy","Chain of title","Title commitment","Abstract of title"],"concept":"Chain of title and abstracts","difficulty":1,"explain":"The CHAIN OF TITLE is the sequence of ownership. An ABSTRACT is the condensed written history of all recorded documents; the attorney's OPINION OF TITLE interprets it.","id":"nat-0b40a0e6","portion":"national","q":"A title search that traces ownership back through successive owners produces the:","sub":"national/transfer|Title evidence & clearing defects","subtopic":"Title evidence & clearing defects","topic":"national/transfer"},{"answer":0,"choices":["Recording a quitclaim deed from the claimant or a suit to quiet title","Filing a lis pendens","Purchasing title insurance","Obtaining a survey"],"concept":"Clearing title defects","difficulty":1,"explain":"A quitclaim from whoever might hold the interest releases it; if the claimant will not sign, a quiet title action asks a court to settle ownership. A LIS PENDENS actually CREATES a cloud by giving notice of pending litigation.","id":"nat-7893809b","portion":"national","q":"A cloud on title is BEST removed by:","sub":"national/transfer|Title evidence & clearing defects","subtopic":"Title evidence & clearing defects","topic":"national/transfer"},{"answer":1,"choices":["Debit to the seller","Credit to the seller and debit to the buyer","Debit to the lender","Credit to both parties"],"concept":"Closing prorations and their direction","difficulty":1,"explain":"The seller prepaid a benefit the buyer will enjoy, so the seller is reimbursed: seller CREDIT, buyer DEBIT. Unpaid taxes reverse it -- seller debit, buyer credit.","id":"nat-69d5f58f","portion":"national","q":"In most closings, real property taxes already paid by the seller beyond the closing date result in a:","sub":"national/transfer|Closing & prorations","subtopic":"Closing & prorations","topic":"national/transfer"},{"answer":1,"choices":["Lot and block","Metes and bounds","Rectangular survey","Monument reference"],"concept":"Legal description systems","difficulty":1,"explain":"Metes (distances) and bounds (directions/boundaries) must return to the point of beginning to close. LOT AND BLOCK references a recorded plat and is the most common system in Georgia subdivisions.","id":"nat-96df336c","portion":"national","q":"A legal description that uses distances and compass bearings from a point of beginning is:","sub":"national/transfer|Legal descriptions","subtopic":"Legal descriptions","topic":"national/transfer"},{"answer":2,"choices":["A permissible trade practice","Legal if disclosed","Illegal price fixing under antitrust law","Allowed if the MLS approves"],"concept":"Antitrust: price fixing","difficulty":1,"explain":"Competitors setting prices together is a per se violation of the Sherman Act -- no defense, no disclosure cure. Commission rates must always be negotiated independently between a broker and a client.","id":"nat-b203442e","portion":"national","q":"Two competing brokerages agree to charge the same commission rate. This is:","sub":"national/practice|Antitrust","subtopic":"Antitrust","topic":"national/practice"},{"answer":2,"choices":["Steering","Market allocation","A group boycott","Tie-in arrangement"],"concept":"Antitrust violations","difficulty":1,"explain":"A GROUP BOYCOTT is competitors conspiring to refuse dealing with someone. MARKET ALLOCATION is dividing territories or customer types; a TIE-IN conditions one sale on buying another product.","id":"nat-1f23d887","portion":"national","q":"Brokers agreeing not to show each other's listings to certain buyers is:","sub":"national/practice|Antitrust","subtopic":"Antitrust","topic":"national/practice"},{"answer":3,"choices":["Blockbusting","Puffing","Redlining","Steering"],"concept":"Fair housing violations","difficulty":1,"explain":"STEERING channels people by protected class. BLOCKBUSTING induces panic selling by claiming a protected group is moving in; REDLINING is a lender refusing loans in an area based on its demographics.","id":"nat-9e2ae535","portion":"national","q":"Directing buyers toward or away from neighborhoods based on race is:","sub":"national/practice|Fair housing & advertising","subtopic":"Fair housing & advertising","topic":"national/practice"},{"answer":2,"choices":["Familial status","Handicap","Source of income","National origin"],"concept":"The seven federal protected classes","difficulty":1,"explain":"Race, color, religion, sex, national origin, familial status, and handicap. Source of income is protected in some states and cities but is NOT one of the seven federal classes.","id":"nat-c9ce85d1","portion":"national","q":"The federal Fair Housing Act protects all of the following classes EXCEPT:","sub":"national/practice|Fair housing & advertising","subtopic":"Fair housing & advertising","topic":"national/practice"},{"answer":2,"choices":["Income","Marital status only","Familial status and religion","Occupation"],"concept":"Discriminatory advertising","difficulty":1,"explain":"'Mature' signals age/familial status and 'Christian' signals religion. Advertising must describe the PROPERTY, not the desired occupant.","id":"nat-916dc5ca","portion":"national","q":"An advertisement stating 'perfect for a mature Christian couple' violates fair housing because it indicates a preference based on:","sub":"national/practice|Fair housing & advertising","subtopic":"Fair housing & advertising","topic":"national/practice"},{"answer":1,"choices":["Sublet without approval","Make reasonable modifications at the tenant's expense","Break the lease without notice","Remodel the entire unit at the landlord's expense"],"concept":"Reasonable accommodation vs. modification","difficulty":1,"explain":"MODIFICATIONS are physical changes, generally at the tenant's expense (and the tenant may be required to restore). ACCOMMODATIONS are changes to rules or policies -- like waiving a no-pets rule for a service animal -- at the landlord's expense.","id":"nat-180dbaa5","portion":"national","q":"Under the Fair Housing Act, a landlord must permit a tenant with a disability to:","sub":"national/practice|Practice standards","subtopic":"Practice standards","topic":"national/practice"},{"answer":1,"choices":["Held in the agent's name","Separate from the broker's own funds","Combined with operating funds for efficiency","Interest-bearing in all cases"],"concept":"Trust fund handling","difficulty":1,"explain":"Client money must be segregated in a designated trust or escrow account. Mixing it with business funds is commingling, one of the most common license-law violations.","id":"nat-c96270cc","portion":"national","q":"A broker's trust account must be:","sub":"national/practice|Trust funds & commingling","subtopic":"Trust funds & commingling","topic":"national/practice"},{"answer":3,"choices":["Give preference to disabled tenants","Rebuild all facilities","Provide free parking","Remove barriers to public accommodations when readily achievable"],"concept":"ADA Title III","difficulty":1,"explain":"Existing public accommodations must remove barriers where readily achievable -- cheap and easy relative to resources. New construction and alterations face stricter accessibility standards.","id":"nat-b27b6814","portion":"national","q":"The Americans with Disabilities Act requires commercial property owners to:","sub":"national/practice|Fair housing & advertising","subtopic":"Fair housing & advertising","topic":"national/practice"},{"answer":2,"choices":["Must provide health insurance","Controls the hours and methods of work","Controls the results but not the details of how work is done","Must withhold income taxes"],"concept":"Independent contractor vs. employee","difficulty":1,"explain":"The broker sets goals and must supervise for license-law compliance, but does not dictate schedules or methods. The IRS safe harbor requires a license, pay based on output rather than hours, and a written IC agreement.","id":"nat-8fe96f76","portion":"national","q":"An independent contractor relationship between a broker and a salesperson means the broker:","sub":"national/practice|Licensing & supervision","subtopic":"Licensing & supervision","topic":"national/practice"},{"answer":2,"choices":["Receives a flat fee","Splits commission with the buyer's broker","Keeps everything above a price the seller sets","Charges by the hour"],"concept":"Net listings and why they are disfavored","difficulty":1,"explain":"Net listings invite the broker to profit at the client's expense and are illegal in many states. Georgia permits them only under strict disclosure conditions.","id":"nat-617cc4c3","portion":"national","q":"A net listing is one in which the broker:","sub":"national/practice|Listings & agreements","subtopic":"Listings & agreements","topic":"national/practice"},{"answer":2,"choices":["Only one broker may market the property","The listing must be in the MLS","The seller owes no commission if the seller finds the buyer","The term is unlimited"],"concept":"Listing agreement types","difficulty":1,"explain":"OPEN: many brokers, and the seller pays nothing if the seller sells it. EXCLUSIVE AGENCY: one broker, but the seller may still sell it themselves commission-free. EXCLUSIVE RIGHT TO SELL: the broker is paid no matter who sells.","id":"nat-fa7e416c","portion":"national","q":"An open listing differs from an exclusive right to sell in that with an open listing:","sub":"national/practice|Listings & agreements","subtopic":"Listings & agreements","topic":"national/practice"},{"answer":0,"choices":["Commingling","Conversion only","Novation","A permissible practice with disclosure"],"concept":"Commingling","difficulty":1,"explain":"Placing trust funds in a business account is commingling as soon as it happens. If the broker then spends the money, it becomes conversion.","id":"nat-55d54a6b","portion":"national","q":"A broker who deposits a buyer's earnest money into the brokerage operating account has committed:","sub":"national/practice|Trust funds & commingling","subtopic":"Trust funds & commingling","topic":"national/practice"},{"answer":2,"choices":["The number was found in the MLS","The call is made before 9 p.m.","The consumer has an established business relationship or gave written consent","The licensee identifies themselves"],"concept":"Telephone Consumer Protection Act","difficulty":1,"explain":"An existing business relationship or express written consent permits the call. FSBO and expired-listing calls to registered numbers are a frequent source of violations.","id":"nat-cd09d6e2","portion":"national","q":"The 'do not call' rules generally allow a licensee to call a consumer on the registry if:","sub":"national/practice|Licensing & supervision","subtopic":"Licensing & supervision","topic":"national/practice"},{"answer":1,"choices":["Negotiate a price reduction with a buyer","Schedule appointments and prepare marketing materials for broker approval","Explain contract contingencies","Hold an open house alone and answer questions about terms"],"concept":"Unlicensed assistants","difficulty":1,"explain":"Ministerial and clerical tasks are fine. Anything involving negotiating, soliciting, showing, or giving advice about terms requires a license -- and letting an assistant do it exposes the broker to discipline.","id":"nat-8b288ba2","portion":"national","q":"Which activity may an unlicensed personal assistant legally perform?","sub":"national/practice|Licensing & supervision","subtopic":"Licensing & supervision","topic":"national/practice"},{"answer":0,"choices":["$7,500","$15,000","$30,000","$3,750"],"concept":"Commission is a percentage of the SALE price","difficulty":1,"explain":"$250,000 x 6% = $15,000 total; split 50/50 gives each brokerage $7,500. The most common error is stopping at the total commission.","id":"nat-4d440cd4","portion":"national","q":"A property sells for $250,000 with a 6% commission split 50/50 between two brokerages. Each brokerage receives:","sub":"national/math|Math fundamentals","subtopic":"Math fundamentals","topic":"national/math"},{"answer":1,"choices":["5,280","43,560","36,000","640"],"concept":"Core memorized conversions","difficulty":1,"explain":"1 acre = 43,560 sq ft. Also memorize: 1 mile = 5,280 feet; 1 section = 640 acres = 1 square mile; 36 sections = 1 township.","id":"nat-62e18f6d","portion":"national","q":"One acre contains how many square feet?","sub":"national/math|Math fundamentals","subtopic":"Math fundamentals","topic":"national/math"},{"answer":2,"choices":["$400","$40,000","$4,000","$2,000"],"concept":"Points are a percentage of the LOAN","difficulty":1,"explain":"One point = 1% of the loan = $2,000, so 2 points = $4,000. The classic trap is applying points to the sale price instead of the loan amount.","id":"nat-c620b6f3","portion":"national","q":"A buyer pays 2 discount points on a $200,000 loan. The cost is:","sub":"national/math|Math fundamentals","subtopic":"Math fundamentals","topic":"national/math"},{"answer":3,"choices":["$62,000","$50,000","$60,000","$70,000"],"concept":"Lenders lend on the LESSER of price or appraised value","difficulty":1,"explain":"Loan = 80% x $300,000 (the lower figure) = $240,000. Down payment = $310,000 - $240,000 = $70,000. The buyer must cover the $10,000 appraisal gap in cash.","id":"nat-d955ca07","portion":"national","q":"A home appraises at $300,000 and the buyer obtains an 80% LTV loan. The down payment on a $310,000 purchase price is:","sub":"national/math|Math fundamentals","subtopic":"Math fundamentals","topic":"national/math"},{"answer":3,"choices":["$2,100","$300","$1,500","$1,800"],"concept":"Proration on the closing calendar","difficulty":1,"explain":"Six months elapsed x $300/month = $1,800 owed by the seller and credited to the buyer, who will pay the full bill later. Unpaid taxes always produce a seller debit.","id":"nat-c7f1b97c","portion":"national","q":"Annual taxes are $3,600, paid in arrears. Closing is on July 1 in a 360-day year. The seller's share is approximately:","sub":"national/math|Math fundamentals","subtopic":"Math fundamentals","topic":"national/math"},{"answer":2,"choices":["$199,500","$209,000","$200,000","$180,500"],"concept":"Net-to-seller problems require division","difficulty":1,"explain":"$190,000 / 0.95 = $200,000. Adding 5% to $190,000 gives $199,500 -- the wrong answer the exam always offers, because 5% of the higher price is more than 5% of the net.","id":"nat-e2201432","portion":"national","q":"A seller wants to net $190,000 after a 5% commission and no other costs. The sale price must be:","sub":"national/math|Math fundamentals","subtopic":"Math fundamentals","topic":"national/math"},{"answer":2,"choices":["The restriction is void as an unreasonable restraint on alienation","B holds a fee simple absolute because A already conveyed away the whole estate","Title reverts to A or A's heirs automatically, without any court action","A must sue to re-enter and recover title"],"concept":"Determinable fee vs. fee on condition subsequent","difficulty":2,"explain":"A DETERMINABLE fee ends automatically -- the possibility of reverter takes effect the instant the condition occurs. A fee subject to a CONDITION SUBSEQUENT requires the grantor to exercise a right of re-entry, which is where a lawsuit would be needed. A cannot convey a larger estate than A held.","id":"nat-8e82b0b5","portion":"national","q":"A owns property in fee simple determinable, to revert automatically if liquor is ever sold there. A conveys to B, who opens a bar. At that moment:","sub":"national/ownership|Estates & the bundle of rights","subtopic":"Estates & the bundle of rights","topic":"national/ownership"},{"answer":3,"choices":["A life estate in one-half","A one-half interest as a joint tenant","A one-half interest as a tenant in common","Nothing in this property"],"concept":"Survivorship defeats a will","difficulty":2,"explain":"The right of survivorship operates at the instant of death, before the will takes effect -- the deceased joint tenant has no interest left to devise. The surviving sister owns the whole property. A will can only pass what the decedent still owned.","id":"nat-7d6399cf","portion":"national","q":"Two sisters own a lake house as joint tenants. One dies leaving a will devising 'all my real property to my son.' The son receives:","sub":"national/ownership|Co-ownership & survivorship","subtopic":"Co-ownership & survivorship","topic":"national/ownership"},{"answer":3,"choices":["Remove them only if they can be taken out without any damage","Not remove them, because bolting made them fixtures","Remove them only with the landlord's written consent","Remove them, repairing any damage, because they are trade fixtures"],"concept":"Trade fixtures are the exception to the fixture rule","difficulty":2,"explain":"Items a commercial tenant installs to conduct business remain the tenant's personal property and may be removed before the lease ends, provided the tenant repairs damage. The annexation test that would make them fixtures does not apply to trade fixtures. Leaving them past lease end can forfeit them.","id":"nat-686487b2","portion":"national","q":"A commercial tenant bolts specialized refrigeration units to the floor of a leased space. The lease is silent. At lease end the tenant may:","sub":"national/ownership|Fixtures & trade fixtures","subtopic":"Fixtures & trade fixtures","topic":"national/ownership"},{"answer":1,"choices":["Converts to an easement appurtenant on transfer","Continues, because an easement in gross benefiting a commercial entity is assignable and survives transfer","Continues only if the buyer expressly assumes it","Terminates at the sale because it was personal to the grantor"],"concept":"Easement in gross vs. appurtenant","difficulty":2,"explain":"A utility easement is an easement in gross -- it benefits a person or entity, not a parcel, so there is no dominant tenement. Commercial easements in gross are assignable and bind later owners of the servient land once recorded. Only a personal (non-commercial) easement in gross would arguably end.","id":"nat-ba3773b7","portion":"national","q":"An owner grants a utility company the right to run a line across her land. She later sells. The easement:","sub":"national/ownership|Easements & encroachments","subtopic":"Easements & encroachments","topic":"national/ownership"},{"answer":0,"choices":["Waste, for which the remainderman may sue now","Grounds to terminate the life estate automatically","Permissible, since the life tenant owns the present interest","A breach the remainderman must wait until the life estate ends to raise"],"concept":"Waste and the life tenant's duties","difficulty":2,"explain":"A life tenant must pay taxes and ordinary carrying costs and avoid permissive waste. The remainderman has a present interest to protect and may sue for waste immediately -- waiting could mean the property is lost to a tax sale. The estate does not terminate automatically.","id":"nat-e67b2148","portion":"national","q":"A life tenant fails to pay property taxes for three years and lets the roof fail. The remainderman's BEST characterization of this is:","sub":"national/ownership|Estates & the bundle of rights","subtopic":"Estates & the bundle of rights","topic":"national/ownership"},{"answer":0,"choices":["Voting power and share of assessments","Square footage of the unit","Right to lease the unit","Property tax rate"],"concept":"How the common-element percentage functions","difficulty":2,"explain":"The undivided percentage drives assessments and usually voting weight. It is set in the declaration, not by unit size alone, and it cannot be separated from the unit -- you cannot sell your common-element share by itself.","id":"nat-0bfe6f48","portion":"national","q":"A condominium declaration allots each unit an undivided percentage of the common elements. That percentage MOST directly determines each owner's:","sub":"national/ownership|Condos, co-ops & timeshares","subtopic":"Condos, co-ops & timeshares","topic":"national/ownership"},{"answer":2,"choices":["Win, because the value loss exceeds one third","Lose, because zoning can never be challenged","Lose, because the regulation left economically viable use of the land","Win, because downzoning is per se a taking"],"concept":"Regulatory taking vs. valid police power","difficulty":2,"explain":"A regulation becomes a taking when it denies ALL economically viable use, not merely when it reduces value. Diminution in value alone -- even substantial -- is generally a cost of regulation. Zoning can certainly be challenged, but on grounds like arbitrariness, not mere value loss.","id":"nat-4c7bd8ba","portion":"national","q":"A city downzones an area, leaving an owner's lot usable but worth 40% less. The owner sues claiming a taking. The owner will MOST likely:","sub":"national/landuse|Government powers over land","subtopic":"Government powers over land","topic":"national/landuse"},{"answer":0,"choices":["Likely be barred, because destruction usually extinguishes nonconforming status","Be permitted, because nonconforming status runs with the land","Need only a building permit","Be permitted only if rebuilt larger"],"concept":"How nonconforming use is lost","difficulty":2,"explain":"Nonconforming rights are meant to phase out, not persist forever. Most ordinances end the status on destruction beyond a stated percentage, on abandonment for a set period, or on a change to a different nonconforming use. Rebuilding then requires conforming to current zoning or obtaining a variance.","id":"nat-28e3a8ba","portion":"national","q":"A legal nonconforming gas station burns down. The owner wants to rebuild it as it was. Under a typical ordinance the owner will:","sub":"national/landuse|Zoning, variances & nonconforming use","subtopic":"Zoning, variances & nonconforming use","topic":"national/landuse"},{"answer":3,"choices":["Only the developer may enforce covenants","Covenants are unenforceable against later buyers","The covenant expired automatically after ten years","Laches and abandonment of the covenant through a pattern of non-enforcement"],"concept":"Defenses to enforcement of covenants","difficulty":2,"explain":"Long, widespread non-enforcement can waive a covenant through abandonment, and delay that prejudices the defendant supports laches. Covenants do not expire on their own unless they say so, they do bind later buyers, and any benefited owner may enforce them.","id":"nat-cd967c82","portion":"national","q":"A subdivision's recorded covenants bar fences over four feet. For fifteen years owners have built six-foot fences with no objection. A neighbor now sues to enforce. The BEST defense is:","sub":"national/landuse|Private restrictions & access","subtopic":"Private restrictions & access","topic":"national/landuse"},{"answer":1,"choices":["A license from the neighbor","An easement by necessity","An easement by prescription","Eminent domain against the neighbor"],"concept":"Easement by necessity","difficulty":2,"explain":"When a single parcel is severed and one part is left without access, the law implies an easement by necessity over the retained land. Prescription requires long adverse use, which has not occurred here; a license is revocable; private owners cannot condemn.","id":"nat-802f42b1","portion":"national","q":"A property owner's land is landlocked after the seller conveys away the parcel fronting the road. The owner's strongest claim to access is:","sub":"national/landuse|Private restrictions & access","subtopic":"Private restrictions & access","topic":"national/landuse"},{"answer":0,"choices":["Serve as a check, with sales comparison given the most weight","Be the only reliable approach","Replace the need for reconciliation","Be meaningless for new construction"],"concept":"Weighting the approaches in reconciliation","difficulty":2,"explain":"Abundant near-identical sales make sales comparison the strongest indicator. Cost is genuinely useful on nearly new homes (little depreciation to estimate) but serves as support here. An appraiser reconciles by weighting reliability, never by averaging.","id":"nat-9040ba6b","portion":"national","q":"An appraiser must value a two-year-old home in a subdivision where twelve nearly identical homes sold in the last six months. The cost approach would MOST likely:","sub":"national/valuation|Appraisal process & approaches","subtopic":"Appraisal process & approaches","topic":"national/valuation"},{"answer":2,"choices":["$424,000","$400,000","$416,000","$440,000"],"concept":"Netting adjustments on the comparable","difficulty":2,"explain":"Adjust the COMP toward the subject. Superior feature: subtract $12,000. Inferior feature: add $8,000. $420,000 - $12,000 + $8,000 = $416,000. Adjusting the subject instead, or moving both in the same direction, produces the distractors.","id":"nat-1be22d17","portion":"national","q":"A comparable superior to the subject sold for $420,000; its extra half-bath is worth $12,000 and its inferior lot costs $8,000. The adjusted value indication is:","sub":"national/valuation|Sales comparison & adjustments","subtopic":"Sales comparison & adjustments","topic":"national/valuation"},{"answer":3,"choices":["$625,000","$840,000","$690,000","$560,000"],"concept":"Building NOI before applying the cap rate","difficulty":2,"explain":"Gross annual = 4 x $1,400 x 12 = $67,200. Less 5% vacancy ($3,360) = $63,840 effective gross. Less $19,000 expenses = $44,840 NOI. $44,840 / 0.08 = $560,500, closest to $560,000. Skipping vacancy or expenses produces the higher distractors -- debt service is never an operating expense.","id":"nat-beaf41b6","portion":"national","q":"A four-unit building rents for $1,400 per unit monthly with 5% vacancy and $19,000 annual operating expenses. At an 8% cap rate its value is closest to:","sub":"national/valuation|Income approach & cap rates","subtopic":"Income approach & cap rates","topic":"national/valuation"},{"answer":2,"choices":["Functional obsolescence","External obsolescence","Curable physical deterioration","Incurable physical deterioration"],"concept":"Curable vs. incurable depreciation","difficulty":2,"explain":"Curability is an economic test, not a physical one: an item is curable when the cost to fix it is recovered in added value. Spending $9,000 to gain $9,000 sits right at the line and is treated as curable. If the fix cost more than it returned, it would be incurable.","id":"nat-d877e4df","portion":"national","q":"An appraiser notes the subject's roof needs $9,000 of work that would add $9,000 of value. This is BEST classified as:","sub":"national/valuation|Depreciation & obsolescence","subtopic":"Depreciation & obsolescence","topic":"national/valuation"},{"answer":3,"choices":["The improvements, as physical deterioration","Neither -- it is a financing concession","The improvements, as functional obsolescence","The land, as external obsolescence"],"concept":"Where external obsolescence is charged","difficulty":2,"explain":"External obsolescence comes from outside the property. Because a location penalty attaches to the site rather than the building, appraisers charge it against the LAND. Functional problems attach to the improvements; physical deterioration is wear.","id":"nat-f66bb10e","portion":"national","q":"A house on a busy corner sells for less than identical houses mid-block. When the appraiser accounts for this, the deduction is properly assigned to:","sub":"national/valuation|Depreciation & obsolescence","subtopic":"Depreciation & obsolescence","topic":"national/valuation"},{"answer":2,"choices":["Neither party","Both buyer and seller jointly","The original seller-borrower only","The buyer only"],"concept":"'Subject to' vs. assumption","difficulty":2,"explain":"Taking 'subject to' means the buyer accepts NO personal liability on the note -- the buyer just risks losing the property. The original borrower remains fully liable. Had the buyer ASSUMED, both would be liable (buyer primarily, seller secondarily) absent a novation.","id":"nat-6338191f","portion":"national","q":"A buyer takes title 'subject to' the seller's existing loan and later defaults. The lender forecloses and the sale leaves a $40,000 shortfall. The lender may pursue a deficiency judgment against:","sub":"national/financing|Assumption, novation & 'subject to'","subtopic":"Assumption, novation & 'subject to'","topic":"national/financing"},{"answer":2,"choices":["About 8 years","About 1 year","About 4 years","The points never pay off"],"concept":"Break-even analysis on discount points","difficulty":2,"explain":"Points cost 2% x $300,000 = $6,000. The rate saving is 0.5% x $300,000 = $1,500 in the first year. $6,000 / $1,500 = 4 years to break even. A buyer planning to sell or refinance sooner should decline the points.","id":"nat-52419ef3","portion":"national","q":"A borrower is offered 6.5% with no points, or 6.0% with 2 points on a $300,000 loan. Roughly how long must the borrower keep the loan for the points to pay off, using simple first-year interest?","sub":"national/financing|Points, yield & TRID disclosure","subtopic":"Points, yield & TRID disclosure","topic":"national/financing"},{"answer":2,"choices":["The loan amount decreases by $200","The seller agrees to pay an extra $500 toward closing costs","The APR increases beyond tolerance","A typo in the borrower's name is corrected"],"concept":"The three CD re-disclosure triggers","difficulty":2,"explain":"Only three changes restart the clock: the APR becomes inaccurate beyond tolerance, the loan PRODUCT changes, or a prepayment penalty is added. Other changes require a corrected CD at or before consummation but no new waiting period.","id":"nat-ec8c3a9f","portion":"national","q":"Under TRID, which change after the Closing Disclosure is delivered REQUIRES a new three-business-day waiting period?","sub":"national/financing|Points, yield & TRID disclosure","subtopic":"Points, yield & TRID disclosure","topic":"national/financing"},{"answer":2,"choices":["Terminate with the earnest money returned","Require the seller to lower the price","Renegotiate or bring the $15,000 difference in cash, on top of the down payment","Accept a loan of 95% of the contract price"],"concept":"The appraisal gap","difficulty":2,"explain":"The lender lends on the LOWER of price or appraised value, so the loan shrinks and the shortfall becomes the buyer's cash problem. Without an appraisal contingency the buyer has no automatic right to terminate and no power to force a price reduction -- only to ask.","id":"nat-6891f80a","portion":"national","q":"A lender's appraisal comes in $15,000 below the contract price on a 95% LTV loan. Absent an appraisal contingency, the buyer must:","sub":"national/financing|Lending law & the secondary market","subtopic":"Lending law & the secondary market","topic":"national/financing"},{"answer":0,"choices":["Remains tied up until the loan is paid or a substitution of entitlement occurs","Is fully restored at closing","Was never at risk","Is lost permanently"],"concept":"VA entitlement and assumption","difficulty":2,"explain":"Entitlement stays committed to the loan until it is paid off or another eligible veteran substitutes their entitlement. Without a release of liability the veteran also remains liable for a deficiency, and cannot use that entitlement for a new home.","id":"nat-ed9aae6a","portion":"national","q":"A veteran's VA loan is assumed by a non-veteran buyer with VA approval, but the veteran does not obtain a release of liability. The veteran's entitlement:","sub":"national/financing|Assumption, novation & 'subject to'","subtopic":"Assumption, novation & 'subject to'","topic":"national/financing"},{"answer":0,"choices":["Violated the Act by failing to give specific reasons or notice of the right to them","Complied, provided the denial was in writing","Complied, because reasons are optional","Violated the Act only if the applicant is in a protected class"],"concept":"ECOA adverse action notice","difficulty":2,"explain":"ECOA entitles a rejected applicant to a statement of SPECIFIC reasons, or notice of the right to request them within 60 days. The obligation applies to every applicant regardless of protected class -- the notice requirement is not itself a discrimination question.","id":"nat-c4baa683","portion":"national","q":"A lender denies a loan and tells the applicant only 'you did not meet our standards.' Under ECOA the lender has:","sub":"national/financing|Lending law & the secondary market","subtopic":"Lending law & the secondary market","topic":"national/financing"},{"answer":0,"choices":["Sell individual lots free of the lien as portions of the debt are paid","Avoid personal liability on the note","Substitute other collateral at will","Prepay without penalty"],"concept":"Blanket mortgages and partial releases","difficulty":2,"explain":"The release (or partial release) clause lets the developer clear the lien lot by lot as agreed payments come in, so buyers get clear title. Without it, the whole debt would have to be retired before any lot could convey free of the blanket lien.","id":"nat-13d9b8dc","portion":"national","q":"A blanket mortgage covering twelve subdivision lots contains a release clause. Its practical effect is that the developer can:","sub":"national/financing|Loan types & structures","subtopic":"Loan types & structures","topic":"national/financing"},{"answer":1,"choices":["Answer truthfully, since honesty is owed to customers","Decline to answer, saying the seller has not authorized disclosure of motivation","Say the seller has no particular reason","Answer only if the buyer submits an offer first"],"concept":"Confidentiality vs. honesty","difficulty":2,"explain":"Motivation is confidential, not a material defect, so it stays private. But honesty forbids the affirmative lie in option C -- the agent must decline rather than misstate. Declining to answer is not deceit; inventing an answer is.","id":"nat-b91dd82c","portion":"national","q":"A listing agent learns from the seller, in confidence, that the seller must move for a job in 30 days. A buyer's agent asks why the seller is selling. The listing agent should:","sub":"national/agency|Confidentiality & disclosure","subtopic":"Confidentiality & disclosure","topic":"national/agency"},{"answer":3,"choices":["Permissible if the property has since sold","Permissible, since the agency ended","A breach only if it causes provable damage","A breach -- confidentiality survives termination of the agency"],"concept":"Which duties survive termination","difficulty":2,"explain":"Accounting and CONFIDENTIALITY survive the end of the relationship indefinitely. Loyalty, obedience, disclosure, and reasonable care end with the agency. Damage is not required for the breach to exist.","id":"nat-5ace4b52","portion":"national","q":"An agent's listing expires unsold. Six months later the agent mentions to a friend that the former seller had been desperate. This is:","sub":"national/agency|Fiduciary duties","subtopic":"Fiduciary duties","topic":"national/agency"},{"answer":0,"choices":["Disclose the relationship to the seller in writing before presenting the offer","Present the offer without comment, as with any other","Refuse to present the son's offer","Resign the listing immediately"],"concept":"Disclosure of a personal interest","difficulty":2,"explain":"A family or financial interest in a buyer is a material conflict the principal must know about, disclosed before the offer is considered. The broker must still present all offers -- refusing to present one breaches the duty. Resigning may follow, but disclosure comes first.","id":"nat-65b71c16","portion":"national","q":"A broker represents the seller. The broker's own son wants to buy the property. The broker's FIRST obligation is to:","sub":"national/agency|Confidentiality & disclosure","subtopic":"Confidentiality & disclosure","topic":"national/agency"},{"answer":1,"choices":["Decline to advise on price to avoid liability","Give an informed opinion supported by
